<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CAOS LIVE · Teste Boss Ogro</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}.arena{position:absolute;inset:0;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:48px 48px}.hud{position:fixed;z-index:10;top:12px;left:12px;padding:10px 13px;border:1px solid #303861;border-radius:14px;background:#0b1020ee}.hud b{color:#ef4444}.hud small{display:block;color:#94a3b8;margin:4px 0}.ver{font-size:10px;color:#fca5a5}.player{position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%);border-radius:50%;background:#24344f;border:2px solid #60a5fa;display:grid;place-items:center}.boss{position:absolute;width:144px;height:144px;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 12px 13px #0009)}.sprite{position:absolute;inset:0;background-image:url('assets/ogre-boss-test.png');background-repeat:no-repeat;background-size:576px 576px;image-rendering:auto;transform-origin:center}.boss.flip .sprite{transform:scaleX(-1)}.name{position:absolute;left:50%;top:-27px;transform:translateX(-50%);font-size:11px;font-weight:900;white-space:nowrap;text-shadow:0 2px 3px #000}.hp{position:absolute;left:14px;right:14px;top:-10px;height:7px;border-radius:9px;background:#2b0b10;border:1px solid #ffffff40;overflow:hidden}.hp i{display:block;width:100%;height:100%;background:#ef4444}.target{position:absolute;width:30px;height:30px;border:2px solid #ef4444;border-radius:50%;transform:translate(-50%,-50%);opacity:0}.target.show{opacity:1}.panel{position:fixed;left:12px;right:12px;bottom:16px;padding:10px;border:1px solid #303861;border-radius:14px;background:#0b1020ee;text-align:center;font-size:11px;color:#94a3b8}.panel b{color:#fca5a5}</style></head><body><div class="arena" id="arena"><div class="hud">CAOS <b>LIVE</b><small>BOSS TEST · OGRO</small><span class="ver">v0.9.0 · 100 HP</span></div><div class="player">●</div><div class="target" id="target"></div><div class="boss" id="boss"><div class="name">OGRO BOSS · 100/100</div><div class="hp"><i></i></div><div class="sprite" id="sprite"></div></div><div class="panel"><b id="status">BOSS CARREGADO · TOQUE PARA MOVER</b><br>Frente · costas · lados · animação em 4 direções</div></div><script>(()=>{const arena=document.getElementById('arena'),boss=document.getElementById('boss'),sprite=document.getElementById('sprite'),status=document.getElementById('status'),marker=document.getElementById('target');let x=innerWidth*.25,y=innerHeight*.52,tx=x,ty=y,moving=false,dir='down',fi=0,last=performance.now(),lastFrame=0;const speed=82,frameMs=145,cell=144;boss.style.left=x+'px';boss.style.top=y+'px';function draw(){let row=fi%4,col=1;if(dir==='up')col=0;else if(dir==='down')col=1;else if(dir==='right'||dir==='left')col=2+(fi%2);sprite.style.backgroundPosition=`-${col*cell}px -${row*cell}px`;boss.classList.toggle('flip',dir==='left')}function getDir(dx,dy){if(Math.abs(dx)>Math.abs(dy))return dx>0?'right':'left';return dy>0?'down':'up'}function target(px,py){tx=Math.max(75,Math.min(innerWidth-75,px));ty=Math.max(115,Math.min(innerHeight-95,py));const dx=tx-x,dy=ty-y;if(Math.hypot(dx,dy)<3)return;dir=getDir(dx,dy);fi=0;draw();moving=true;marker.style.left=tx+'px';marker.style.top=ty+'px';marker.classList.add('show');status.textContent='OGRO BOSS · '+({down:'BAIXO',up:'CIMA',right:'DIREITA',left:'ESQUERDA'})[dir]+' · ANDANDO'}arena.addEventListener('pointerdown',e=>target(e.clientX,e.clientY));function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;const dx=tx-x,dy=ty-y,dist=Math.hypot(dx,dy);if(moving&&dist>2){const st=Math.min(dist,speed*dt);x+=dx/dist*st;y+=dy/dist*st;if(now-lastFrame>frameMs){fi=(fi+1)%4;draw();lastFrame=now}}else if(moving){moving=false;fi=0;draw();marker.classList.remove('show');status.textContent='OGRO BOSS · PARADO'}boss.style.left=x+'px';boss.style.top=y+'px';requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></body></html>
