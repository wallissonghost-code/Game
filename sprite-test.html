<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CAOS LIVE · Ogro 4 Direções</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}.arena{position:absolute;inset:0;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:48px 48px}.hud{position:fixed;z-index:10;top:12px;left:12px;padding:10px 13px;border:1px solid #303861;border-radius:14px;background:#0b1020ee}.hud b{color:#84cc16}.hud small{display:block;color:#94a3b8;margin:4px 0}.ver{font-size:10px;color:#bef264}.load{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:#050710ee}.card{width:min(390px,calc(100% - 30px));padding:20px;border:1px solid #303861;border-radius:18px;background:#0b1020}.card h2{margin:0 0 8px}.card p{color:#94a3b8;font-size:12px}.card label{display:block;padding:14px;border-radius:13px;background:#65a30d;text-align:center;font-weight:900}.card input{display:none}.player{position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%);border-radius:50%;background:#24344f;border:2px solid #60a5fa;display:grid;place-items:center}.mob{position:absolute;width:88px;height:88px;transform:translate(-50%,-50%);pointer-events:none}.mob img{position:absolute;width:100%;height:100%;object-fit:contain;object-position:center bottom}.mob.flip img{transform:scaleX(-1)}.target{position:absolute;width:28px;height:28px;border:2px solid #84cc16;border-radius:50%;transform:translate(-50%,-50%);opacity:0}.target.show{opacity:1}.panel{position:fixed;left:12px;right:12px;bottom:16px;padding:10px;border:1px solid #303861;border-radius:14px;background:#0b1020ee;text-align:center;font-size:11px;color:#94a3b8}.panel b{color:#bef264}</style><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script></head><body><div class="arena" id="arena"><div class="hud">CAOS <b>LIVE</b><small>TESTE OGRO · 4 DIREÇÕES</small><span class="ver">v0.8.1 · DIREÇÕES CORRIGIDAS</span></div><div class="player">●</div><div class="target" id="target"></div><div class="mob" id="mob"><img id="sprite"></div><div class="panel"><b id="status">AGUARDANDO ZIP</b><br>Frente/costas reais · lados com espelhamento</div></div><div class="load" id="load"><div class="card"><h2>Teste do Ogro</h2><p>Selecione o arquivo <b>recorte-split (1).zip</b>. Agora os frames são lidos por coluna, não por linha.</p><label>ABRIR ZIP DO OGRO<input id="file" type="file" accept=".zip"></label></div></div><script>(()=>{const $=id=>document.getElementById(id),arena=$('arena'),mob=$('mob'),sprite=$('sprite'),status=$('status'),marker=$('target');let dirs={down:[],up:[],right:[],left:[]},x=innerWidth*.25,y=innerHeight*.52,tx=x,ty=y,moving=false,dir='down',fi=0,last=performance.now(),lastFrame=0;const speed=115,frameMs=135;mob.style.left=x+'px';mob.style.top=y+'px';function show(){const arr=dirs[dir]||[];sprite.src=arr[fi%Math.max(1,arr.length)]||dirs.down[0]||'';mob.classList.toggle('flip',dir==='left')}function getDir(dx,dy){if(Math.abs(dx)>Math.abs(dy))return dx>0?'right':'left';return dy>0?'down':'up'}function target(px,py){if(!dirs.down.length)return;tx=Math.max(40,Math.min(innerWidth-40,px));ty=Math.max(100,Math.min(innerHeight-100,py));const dx=tx-x,dy=ty-y;if(Math.hypot(dx,dy)<3)return;dir=getDir(dx,dy);fi=0;show();moving=true;marker.style.left=tx+'px';marker.style.top=ty+'px';marker.classList.add('show');status.textContent=({down:'BAIXO',up:'CIMA',right:'DIREITA',left:'ESQUERDA'})[dir]+' · ANDANDO'}arena.addEventListener('pointerdown',e=>target(e.clientX,e.clientY));$('file').onchange=async e=>{try{const z=await JSZip.loadAsync(e.target.files[0]);const names=Object.keys(z.files).filter(n=>/\.png$/i.test(n)&&!z.files[n].dir).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));if(names.length<16)throw Error('ZIP precisa ter 16 PNGs');const url={};for(const n of names)url[n]=URL.createObjectURL(await z.files[n].async('blob'));const by=(r,c)=>names.find(n=>n.includes(`recorte-${r}-${c}.png`));dirs.up=[1,2,3,4].map(r=>url[by(r,1)]).filter(Boolean);dirs.down=[1,2,3,4].map(r=>url[by(r,2)]).filter(Boolean);const side=[];for(let r=1;r<=4;r++){for(const c of [3,4]){const n=by(r,c);if(n)side.push(url[n])}}dirs.right=side;dirs.left=side;if(!dirs.up.length||!dirs.down.length||!dirs.right.length)throw Error('Não consegui mapear os grupos do ZIP');show();$('load').style.display='none';status.textContent='OGRO CARREGADO · DIREÇÕES CORRIGIDAS'}catch(err){status.textContent='ERRO: '+err.message;console.error(err)}};function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;const dx=tx-x,dy=ty-y,dist=Math.hypot(dx,dy);if(moving&&dist>2){const st=Math.min(dist,speed*dt);x+=dx/dist*st;y+=dy/dist*st;if(now-lastFrame>frameMs){const arr=dirs[dir]||[];fi=(fi+1)%Math.max(1,arr.length);show();lastFrame=now}}else if(moving){moving=false;fi=0;show();marker.classList.remove('show');status.textContent=({down:'BAIXO',up:'CIMA',right:'DIREITA',left:'ESQUERDA'})[dir]+' · PARADO'}mob.style.left=x+'px';mob.style.top=y+'px';requestAnimationFrame(loop)}requestAnimationFrame(loop)})();</script></body></html>
