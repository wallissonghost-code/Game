<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CAOS LIVE · Humanoide v0.4.0</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.arena{position:absolute;inset:0;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:64px 64px}.hud{position:fixed;z-index:5;top:12px;left:12px;padding:10px 13px;border:1px solid #303861;border-radius:14px;background:#0b1020ee}.hud b{color:#a855f7}.hud small{display:block;color:#94a3b8;margin-top:3px}.ver{display:inline-block;margin-top:7px;padding:3px 7px;border:1px solid #4c1d95;border-radius:999px;background:#2e1065;color:#d8b4fe;font-size:10px;font-weight:900}.actor{position:absolute;width:120px;height:120px;overflow:hidden;will-change:left,top}.sheet{position:absolute;max-width:none;will-change:transform}.panel{position:fixed;left:12px;right:12px;bottom:20px;z-index:6;padding:10px;border:1px solid #303861;border-radius:14px;background:#0b1020ee;text-align:center}.panel strong{display:block;color:#a78bfa;font-size:11px}.panel small{color:#94a3b8;font-size:9px}</style></head><body><div class="arena"><div class="hud">CAOS <b>LIVE</b><small>HUMANOIDE · TESTE SINCRONIZADO</small><span class="ver">TESTE v0.4.0</span></div><div class="actor" id="actor"><img id="sheet" class="sheet" src="./assets/enemies/7939AEDC-4E90-4C75-AB97-6CF48EDB0977.png?v=040"></div><div class="panel"><strong id="state">MOVIMENTO AUTOMÁTICO</strong><small>Usando exatamente a imagem nova enviada · sequência automática para avaliar enquadramento/sincronia</small></div></div><script>const actor=document.getElementById('actor'),img=document.getElementById('sheet'),state=document.getElementById('state');const COLS=8,ROWS=8;let iw=0,ih=0,cw=0,ch=0,frame=0,row=0,x=innerWidth*.18,y=innerHeight*.36,vx=52,vy=28,last=performance.now(),tick=0;function setup(){iw=img.naturalWidth;ih=img.naturalHeight;cw=iw/COLS;ch=ih/ROWS;const scale=Math.min(110/cw,110/ch);img.style.width=iw*scale+'px';img.style.height=ih*scale+'px';actor.dataset.scale=scale;draw()}function draw(){if(!iw)return;const s=+actor.dataset.scale,col=frame%COLS;img.style.left=(-col*cw*s+5)+'px';img.style.top=(-row*ch*s+5)+'px';state.textContent='LINHA '+(row+1)+' · FRAME '+(col+1)+'/'+COLS}function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;x+=vx*dt;y+=vy*dt;if(x<20){x=20;vx=Math.abs(vx)}if(x>innerWidth-140){x=innerWidth-140;vx=-Math.abs(vx)}if(y<145){y=145;vy=Math.abs(vy)}if(y>innerHeight-185){y=innerHeight-185;vy=-Math.abs(vy)}actor.style.left=x+'px';actor.style.top=y+'px';if(now-tick>150){frame++;if(frame%COLS===0)row=(row+1)%ROWS;tick=now;draw()}requestAnimationFrame(loop)}img.onload=setup;if(img.complete)setup();requestAnimationFrame(loop);</script></body></html>
