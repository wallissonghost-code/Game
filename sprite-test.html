<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<title>CAOS LIVE · Teste Personagem + Arma</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
.arena{position:absolute;inset:0;background-color:#07101d;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:48px 48px}
.hud{position:fixed;z-index:12;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));padding:10px 13px;border:1px solid #303861;border-radius:14px;background:#0b1020ee;box-shadow:0 12px 28px #0005}
.hud b{color:#60a5fa}.hud small{display:block;color:#94a3b8;margin:4px 0}.ver{display:inline-block;padding:3px 7px;border-radius:999px;background:#0c1e35;color:#93c5fd;font-size:10px;font-weight:900}
.player{position:absolute;width:120px;height:120px;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 10px 10px #0008);z-index:5}
.char{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;image-rendering:auto;z-index:5}
.weapon{position:absolute;display:none;object-fit:contain;object-position:center;image-rendering:auto;pointer-events:none;transform:translate(-50%,-50%);transform-origin:50% 50%;z-index:7}
.shadow{position:absolute;left:50%;bottom:7px;width:50px;height:12px;transform:translateX(-50%);border-radius:50%;background:#0006;filter:blur(2px);z-index:-1}
.panel{position:fixed;z-index:12;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));padding:9px 12px;border:1px solid #303861;border-radius:14px;background:#0b1020e8;text-align:center;font-size:10px;color:#94a3b8;pointer-events:none}.panel b{color:#93c5fd}
.joy{position:fixed;z-index:15;left:max(22px,env(safe-area-inset-left));bottom:max(72px,calc(env(safe-area-inset-bottom) + 64px));width:116px;height:116px;border:1px solid #64748b66;border-radius:50%;background:#0b102099;box-shadow:inset 0 0 30px #0007;touch-action:none}
.stick{position:absolute;left:50%;top:50%;width:50px;height:50px;transform:translate(-50%,-50%);border:1px solid #93c5fd99;border-radius:50%;background:#1e3a5fcc;box-shadow:0 5px 18px #0007}
.hint{position:fixed;right:16px;bottom:max(86px,calc(env(safe-area-inset-bottom) + 78px));z-index:11;width:132px;padding:9px 10px;border:1px solid #243657;border-radius:12px;background:#09111ecc;color:#7180a4;font-size:9px;line-height:1.4;text-align:center}
.load{position:fixed;z-index:30;inset:0;display:grid;place-items:center;background:#050710f3}.card{width:min(380px,calc(100% - 30px));padding:20px;border:1px solid #303861;border-radius:18px;background:#0b1020;text-align:center}.card h2{margin:0 0 8px}.card p{margin:0;color:#94a3b8;font-size:12px;line-height:1.45}
@media(min-width:800px){.joy{left:32px;bottom:84px}.hint{right:28px}.player{width:132px;height:132px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<div class="arena" id="arena">
  <div class="hud">CAOS <b>LIVE</b><small>TESTE · PERSONAGEM + ARMA</small><span class="ver">v1.0.6 · WEAPON SCALE FIX</span></div>
  <div class="player" id="player"><div class="shadow"></div><img id="sprite" class="char" alt="Personagem"><img id="weapon" class="weapon" alt="Arma"></div>
  <div class="joy" id="joy"><div class="stick" id="stick"></div></div>
  <div class="hint">Use o analógico para andar.<br>No PC: WASD / setas.</div>
  <div class="panel"><b id="status">CARREGANDO PERSONAGEM + ARMA...</b><br><span id="detail">Escala e âncora calibradas por direção</span></div>
</div>
<div class="load" id="load"><div class="card"><h2>Carregando personagem + arma</h2><p>Lendo <b>Personagem.zip</b> e <b>weapons/recorte-split.zip</b>.</p></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),player=$('player'),sprite=$('sprite'),weapon=$('weapon'),joy=$('joy'),stick=$('stick'),status=$('status'),detail=$('detail'),load=$('load');
let dirs={up:[],down:[],right:[],left:[]},weaponDirs={up:[],down:[],right:[],left:[]},x=innerWidth*.5,y=innerHeight*.48,inputX=0,inputY=0,velX=0,velY=0,dir='down',animStep=0,last=performance.now(),lastFrame=0,ready=false,weaponReady=false,joyId=null,keys={};
const speed=155,maxJoy=42,accel=18,decel=16,stopThreshold=3,animSeq=[0,1,2,3,2,1],dirBias=1.22;
player.style.left=x+'px';player.style.top=y+'px';
function frameOf(arr){if(!arr||!arr.length)return'';return arr[animSeq[animStep%animSeq.length]%arr.length]||arr[0]}
function rigWeapon(){
  const bob=animStep%2?0.7:0;
  const rigs={
    down:{left:56,top:60,width:46,height:32,z:7},
    up:{left:45,top:50,width:40,height:30,z:4},
    right:{left:61,top:55,width:48,height:32,z:7},
    left:{left:39,top:55,width:48,height:32,z:7}
  };
  const r=rigs[dir]||rigs.down;
  weapon.style.left=r.left+'%';
  weapon.style.top=(r.top+bob)+'%';
  weapon.style.width=r.width+'px';
  weapon.style.height=r.height+'px';
  weapon.style.zIndex=String(r.z);
  weapon.style.transform='translate(-50%,-50%)';
}
function show(){const arr=dirs[dir]||[];if(arr.length)sprite.src=frameOf(arr);const wa=weaponDirs[dir]||[];if(weaponReady&&wa.length){weapon.src=frameOf(wa);rigWeapon();weapon.style.display='block'}else weapon.style.display='none'}
function chooseDir(dx,dy){const ax=Math.abs(dx),ay=Math.abs(dy);if(dir==='left'||dir==='right'){if(ay>ax*dirBias)return dy>0?'down':'up';return dx>0?'right':'left'}if(ax>ay*dirBias)return dx>0?'right':'left';return dy>0?'down':'up'}
function clampPlayer(){x=Math.max(60,Math.min(innerWidth-60,x));y=Math.max(100,Math.min(innerHeight-78,y))}
function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy)||1,m=Math.min(maxJoy,d),nx=dx/d,ny=dy/d;stick.style.transform=`translate(calc(-50% + ${nx*m}px),calc(-50% + ${ny*m}px))`;const power=Math.min(1,d/maxJoy);inputX=nx*power;inputY=ny*power}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e);e.preventDefault()});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId){joyMove(e);e.preventDefault()}});
function joyEnd(e){if(e.pointerId!==joyId)return;joyId=null;inputX=inputY=0;stick.style.transform='translate(-50%,-50%)'}
joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
async function zipPngs(path,crop=false){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error(path+' não carregou');const z=await JSZip.loadAsync(await r.arrayBuffer());const names=Object.keys(z.files).filter(n=>/\.png$/i.test(n)&&!z.files[n].dir).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));const urls=[];for(const n of names){const raw=URL.createObjectURL(await z.files[n].async('blob'));urls.push(crop?await cropTransparent(raw):raw);if(crop)URL.revokeObjectURL(raw)}return{names,urls}}
function cropTransparent(src){return new Promise(resolve=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});c.width=im.naturalWidth;c.height=im.naturalHeight;ctx.drawImage(im,0,0);const d=ctx.getImageData(0,0,c.width,c.height).data;let minX=c.width,minY=c.height,maxX=-1,maxY=-1;for(let yy=0;yy<c.height;yy++)for(let xx=0;xx<c.width;xx++){if(d[(yy*c.width+xx)*4+3]>12){if(xx<minX)minX=xx;if(xx>maxX)maxX=xx;if(yy<minY)minY=yy;if(yy>maxY)maxY=yy}}if(maxX<0){resolve(src);return}const pad=2,x0=Math.max(0,minX-pad),y0=Math.max(0,minY-pad),x1=Math.min(c.width-1,maxX+pad),y1=Math.min(c.height-1,maxY+pad),w=x1-x0+1,h=y1-y0+1,o=document.createElement('canvas');o.width=w;o.height=h;o.getContext('2d').drawImage(c,x0,y0,w,h,0,0,w,h);o.toBlob(b=>resolve(b?URL.createObjectURL(b):src),'image/png')};im.onerror=()=>resolve(src);im.src=src})}
function mapPack(pack,target){const u=pack.urls,n=pack.names;if(u.length>=16){const indexed=n.map((name,i)=>{const m=name.match(/recorte-(\d+)-(\d+)\.png$/i);return m?{r:+m[1],c:+m[2],u:u[i]}:null}).filter(Boolean);if(indexed.length>=16){target.up=indexed.filter(v=>v.r===1).sort((a,b)=>a.c-b.c).map(v=>v.u);target.down=indexed.filter(v=>v.r===2).sort((a,b)=>a.c-b.c).map(v=>v.u);target.right=indexed.filter(v=>v.r===3).sort((a,b)=>a.c-b.c).map(v=>v.u);target.left=indexed.filter(v=>v.r===4).sort((a,b)=>a.c-b.c).map(v=>v.u)}else{target.up=u.slice(0,4);target.down=u.slice(4,8);target.right=u.slice(8,12);target.left=u.slice(12,16)}}else if(u.length>=4){target.down=[u[0]];target.left=[u[1]||u[0]];target.right=[u[2]||u[0]];target.up=[u[3]||u[0]]}else if(u.length){target.up=target.down=target.right=target.left=[u[0]]}}
async function loadAssets(){try{const charPack=await zipPngs('assets/Personagem.zip?v=skin106');if(charPack.urls.length<16)throw Error('Personagem.zip precisa dos 16 frames');mapPack(charPack,dirs);const gunPack=await zipPngs('assets/weapons/recorte-split.zip?v=weapon106',true);if(!gunPack.urls.length)throw Error('recorte-split.zip não tem PNGs');mapPack(gunPack,weaponDirs);weaponReady=true;ready=true;animStep=0;show();load.style.display='none';status.textContent='ARMA REDIMENSIONADA E PRESA';detail.textContent='Weapon rig v1.0.6 · escala individual · '+gunPack.urls.length+' frame(s)'}catch(e){status.textContent='ERRO: '+e.message;load.querySelector('p').textContent='Erro ao carregar: '+e.message;console.error(e)}}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;const kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ky=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);let tx=inputX,ty=inputY;if(kx||ky){const km=Math.hypot(kx,ky)||1;tx=kx/km;ty=ky/km}const targetVX=tx*speed,targetVY=ty*speed,active=Math.abs(tx)+Math.abs(ty)>.01,rate=active?accel:decel;velX+=(targetVX-velX)*Math.min(1,rate*dt);velY+=(targetVY-velY)*Math.min(1,rate*dt);if(Math.abs(targetVX)<.1&&Math.abs(velX)<.35)velX=0;if(Math.abs(targetVY)<.1&&Math.abs(velY)<.35)velY=0;const mag=Math.hypot(velX,velY);if(ready&&mag>stopThreshold){const next=chooseDir(velX,velY);if(next!==dir){dir=next;animStep=0}x+=velX*dt;y+=velY*dt;clampPlayer();const speedRatio=Math.min(1,mag/speed),animDelay=150-speedRatio*70;if(now-lastFrame>animDelay){animStep=(animStep+1)%animSeq.length;lastFrame=now}show();status.textContent=({up:'CIMA',down:'BAIXO',right:'DIREITA',left:'ESQUERDA'})[dir]+' · ARMA PROPORCIONAL'}else if(ready){if(animStep!==0){animStep=0;show()}status.textContent=({up:'CIMA',down:'BAIXO',right:'DIREITA',left:'ESQUERDA'})[dir]+' · PARADO · ARMA PROPORCIONAL'}player.style.left=x+'px';player.style.top=y+'px';requestAnimationFrame(loop)}
loadAssets();requestAnimationFrame(loop)})();
</script>
</body>
</html>
