<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<title>CAOS LIVE · Grip Socket Test</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
.arena{position:absolute;inset:0;background-color:#07101d;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:48px 48px}
.hud{position:fixed;z-index:20;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));padding:10px 13px;border:1px solid #303861;border-radius:14px;background:#0b1020ee;box-shadow:0 12px 28px #0005}.hud b{color:#60a5fa}.hud small{display:block;color:#94a3b8;margin:4px 0}.ver{display:inline-block;padding:3px 7px;border-radius:999px;background:#0c1e35;color:#93c5fd;font-size:10px;font-weight:900}
.target{position:absolute;z-index:8;left:50%;top:20%;width:78px;height:78px;transform:translate(-50%,-50%);border-radius:50%;border:4px solid #e2e8f0;background:radial-gradient(circle,#ef4444 0 13%,#f8fafc 14% 29%,#ef4444 30% 46%,#f8fafc 47% 64%,#ef4444 65% 100%);box-shadow:0 0 0 8px #0f172acc,0 15px 35px #0008;transition:transform .08s}.target.hit{transform:translate(-50%,-50%) scale(.91)}
.target-label{position:absolute;z-index:9;left:50%;top:calc(20% + 58px);transform:translateX(-50%);padding:5px 9px;border-radius:999px;background:#0b1020e8;border:1px solid #334155;color:#cbd5e1;font-size:10px;font-weight:800;letter-spacing:.06em}
.player{position:absolute;z-index:10;width:132px;height:132px;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 10px 10px #0008)}
.shadow{position:absolute;left:50%;bottom:7px;width:50px;height:12px;transform:translateX(-50%);border-radius:50%;background:#0006;filter:blur(2px);z-index:1}
.char{position:absolute;left:50%;bottom:3px;width:78px;height:108px;transform:translateX(-50%);object-fit:contain;object-position:center bottom;z-index:6}
.weapon{position:absolute;display:none;object-fit:contain;object-position:center;pointer-events:none;transform:translate(-50%,calc(-50% + var(--recoil,0px))) rotate(var(--gun-rot,0deg));transform-origin:50% 78%;image-rendering:auto}
.weapon-back{z-index:4}.weapon-front{z-index:8;clip-path:inset(0 0 54% 0)}.weapon.recoil{--recoil:3px}
.muzzle{position:absolute;display:none;z-index:12;width:14px;height:24px;transform:translate(-50%,-50%);clip-path:polygon(50% 0,66% 32%,100% 45%,68% 58%,50% 100%,34% 60%,0 45%,34% 32%);background:#fde68a;filter:drop-shadow(0 0 7px #f59e0b)}.muzzle.on{display:block}
.bullet{position:absolute;z-index:7;width:4px;height:18px;border-radius:999px;background:#fde68a;box-shadow:0 0 8px #f59e0b;transform:translate(-50%,-50%)}
.joy{position:fixed;z-index:18;left:max(22px,env(safe-area-inset-left));bottom:max(72px,calc(env(safe-area-inset-bottom) + 64px));width:116px;height:116px;border:1px solid #64748b66;border-radius:50%;background:#0b102099;box-shadow:inset 0 0 30px #0007;touch-action:none}.stick{position:absolute;left:50%;top:50%;width:50px;height:50px;transform:translate(-50%,-50%);border:1px solid #93c5fd99;border-radius:50%;background:#1e3a5fcc;box-shadow:0 5px 18px #0007}
.note{position:fixed;z-index:18;right:16px;bottom:max(86px,calc(env(safe-area-inset-bottom) + 78px));width:155px;padding:9px 10px;border:1px solid #243657;border-radius:12px;background:#09111ecc;color:#7180a4;font-size:9px;line-height:1.4;text-align:center}
.panel{position:fixed;z-index:20;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));padding:9px 12px;border:1px solid #303861;border-radius:14px;background:#0b1020e8;text-align:center;font-size:10px;color:#94a3b8;pointer-events:none}.panel b{color:#93c5fd}
.load{position:fixed;z-index:30;inset:0;display:grid;place-items:center;background:#050710f3}.card{width:min(380px,calc(100% - 30px));padding:20px;border:1px solid #303861;border-radius:18px;background:#0b1020;text-align:center}.card h2{margin:0 0 8px}.card p{margin:0;color:#94a3b8;font-size:12px;line-height:1.45}
@media(max-height:700px){.target{top:18%;width:64px;height:64px}.target-label{top:calc(18% + 48px)}.player{width:118px;height:118px}.char{width:70px;height:96px}.joy{width:104px;height:104px}.stick{width:46px;height:46px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<div class="arena" id="arena">
  <div class="hud">CAOS <b>LIVE</b><small>TESTE · GRIP NA MÃO + TIRO</small><span class="ver">v1.1.2 · GRIP SOCKET</span></div>
  <div class="target" id="target"></div><div class="target-label">ALVO FIXO</div>
  <div class="player" id="player">
    <div class="shadow"></div>
    <img id="weaponBack" class="weapon weapon-back" alt="Arma traseira">
    <img id="sprite" class="char" alt="Personagem">
    <img id="weaponFront" class="weapon weapon-front" alt="Cano da arma">
    <div id="muzzle" class="muzzle"></div>
  </div>
  <div class="joy" id="joy"><div class="stick" id="stick"></div></div>
  <div class="note">Grip deslocado para a mão direita.<br>A mão passa por cima da empunhadura e o cano continua visível.</div>
  <div class="panel"><b id="status">CARREGANDO...</b><br><span id="detail">Calibrando empunhadura na mão</span></div>
</div>
<div class="load" id="load"><div class="card"><h2>Preparando grip</h2><p>Carregando personagem e alinhando a empunhadura com a mão.</p></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),arena=$('arena'),player=$('player'),sprite=$('sprite'),weaponBack=$('weaponBack'),weaponFront=$('weaponFront'),muzzle=$('muzzle'),target=$('target'),joy=$('joy'),stick=$('stick'),status=$('status'),detail=$('detail'),load=$('load');
let dirs={up:[],down:[],right:[],left:[]},weaponDirs={up:[],down:[],right:[],left:[]},shots=0,ready=false,x=innerWidth*.5,y=innerHeight*.68,inputX=0,inputY=0,velX=0,velY=0,joyId=null,keys={},animStep=0,last=performance.now(),lastFrame=0,currentBodyFrame=0,currentRig=null;
const speed=150,maxJoy=42,accel=17,decel=15,animSeq=[0,1,2,3,2,1];
const handRig=[
  {x:78.0,y:60.5,w:21,h:55,rot:-2,mx:77.8,my:36.0},
  {x:79.0,y:61.2,w:21,h:55,rot:-1,mx:78.8,my:36.7},
  {x:77.5,y:60.0,w:21,h:55,rot:-3,mx:77.3,my:35.5},
  {x:78.5,y:60.8,w:21,h:55,rot:-2,mx:78.3,my:36.3}
];
player.style.left=x+'px';player.style.top=y+'px';
function cropTransparent(src){return new Promise(resolve=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});c.width=im.naturalWidth;c.height=im.naturalHeight;ctx.drawImage(im,0,0);const d=ctx.getImageData(0,0,c.width,c.height).data;let minX=c.width,minY=c.height,maxX=-1,maxY=-1;for(let yy=0;yy<c.height;yy++)for(let xx=0;xx<c.width;xx++){if(d[(yy*c.width+xx)*4+3]>12){if(xx<minX)minX=xx;if(xx>maxX)maxX=xx;if(yy<minY)minY=yy;if(yy>maxY)maxY=yy}}if(maxX<0){resolve(src);return}const pad=2,x0=Math.max(0,minX-pad),y0=Math.max(0,minY-pad),x1=Math.min(c.width-1,maxX+pad),y1=Math.min(c.height-1,maxY+pad),w=x1-x0+1,h=y1-y0+1,o=document.createElement('canvas');o.width=w;o.height=h;o.getContext('2d').drawImage(c,x0,y0,w,h,0,0,w,h);o.toBlob(b=>resolve(b?URL.createObjectURL(b):src),'image/png')};im.onerror=()=>resolve(src);im.src=src})}
async function zipPngs(path,crop=false){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error(path+' não carregou');const z=await JSZip.loadAsync(await r.arrayBuffer());const names=Object.keys(z.files).filter(n=>/\.png$/i.test(n)&&!z.files[n].dir).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));const urls=[];for(const n of names){const raw=URL.createObjectURL(await z.files[n].async('blob'));urls.push(crop?await cropTransparent(raw):raw);if(crop)URL.revokeObjectURL(raw)}return{names,urls}}
function mapPack(pack,targetMap){const u=pack.urls,n=pack.names;if(u.length>=16){const indexed=n.map((name,i)=>{const m=name.match(/recorte-(\d+)-(\d+)\.png$/i);return m?{r:+m[1],c:+m[2],u:u[i]}:null}).filter(Boolean);if(indexed.length>=16){targetMap.up=indexed.filter(v=>v.r===1).sort((a,b)=>a.c-b.c).map(v=>v.u);targetMap.down=indexed.filter(v=>v.r===2).sort((a,b)=>a.c-b.c).map(v=>v.u);targetMap.right=indexed.filter(v=>v.r===3).sort((a,b)=>a.c-b.c).map(v=>v.u);targetMap.left=indexed.filter(v=>v.r===4).sort((a,b)=>a.c-b.c).map(v=>v.u)}else{targetMap.up=u.slice(0,4);targetMap.down=u.slice(4,8);targetMap.right=u.slice(8,12);targetMap.left=u.slice(12,16)}}else if(u.length>=4){targetMap.down=[u[0]];targetMap.left=[u[1]||u[0]];targetMap.right=[u[2]||u[0]];targetMap.up=[u[3]||u[0]]}else if(u.length){targetMap.up=targetMap.down=targetMap.right=targetMap.left=[u[0]]}}
function applyHandRig(frame){const r=handRig[frame%handRig.length];currentRig=r;for(const el of [weaponBack,weaponFront]){el.style.left=r.x+'%';el.style.top=r.y+'%';el.style.width=r.w+'px';el.style.height=r.h+'px';el.style.setProperty('--gun-rot',r.rot+'deg')}muzzle.style.left=r.mx+'%';muzzle.style.top=r.my+'%'}
function showFrame(){if(!ready)return;const ca=dirs.up||[],wa=weaponDirs.up||[];currentBodyFrame=animSeq[animStep%animSeq.length]%Math.max(1,ca.length);const wi=animSeq[animStep%animSeq.length]%Math.max(1,wa.length);if(ca.length)sprite.src=ca[currentBodyFrame];if(wa.length){const src=wa[wi];weaponBack.src=src;weaponFront.src=src;weaponBack.style.display='block';weaponFront.style.display='block'}applyHandRig(currentBodyFrame)}
function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy)||1,m=Math.min(maxJoy,d),nx=dx/d,ny=dy/d,power=Math.min(1,d/maxJoy);stick.style.transform=`translate(calc(-50% + ${nx*m}px),calc(-50% + ${ny*m}px))`;inputX=nx*power;inputY=ny*power}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e);e.preventDefault()});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId){joyMove(e);e.preventDefault()}});function joyEnd(e){if(e.pointerId!==joyId)return;joyId=null;inputX=inputY=0;stick.style.transform='translate(-50%,-50%)'}joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
function clampPlayer(){const w=player.offsetWidth/2,h=player.offsetHeight/2;x=Math.max(w,Math.min(innerWidth-w,x));y=Math.max(innerHeight*.34,Math.min(innerHeight-h-58,y))}
function shoot(){if(!ready||!currentRig)return;shots++;muzzle.classList.add('on');weaponBack.classList.add('recoil');weaponFront.classList.add('recoil');setTimeout(()=>{muzzle.classList.remove('on');weaponBack.classList.remove('recoil');weaponFront.classList.remove('recoil')},70);const ar=arena.getBoundingClientRect(),pr=player.getBoundingClientRect(),tr=target.getBoundingClientRect(),startX=pr.left+pr.width*(currentRig.mx/100)-ar.left,startY=pr.top+pr.height*(currentRig.my/100)-ar.top,endX=tr.left+tr.width*.5-ar.left,endY=tr.top+tr.height*.5-ar.top,b=document.createElement('div');b.className='bullet';b.style.left=startX+'px';b.style.top=startY+'px';arena.appendChild(b);const dx=endX-startX,dy=endY-startY,d=Math.hypot(dx,dy),dur=Math.max(120,d/2.7);b.animate([{transform:'translate(-50%,-50%)'},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`}],{duration:dur,easing:'linear'}).onfinish=()=>{b.remove();target.classList.add('hit');setTimeout(()=>target.classList.remove('hit'),70)};status.textContent='GRIP NA MÃO · DISPARO '+shots}
async function loadAssets(){try{const charPack=await zipPngs('assets/Personagem.zip?v=skin112',true);if(charPack.urls.length<16)throw Error('Personagem.zip precisa dos 16 frames');mapPack(charPack,dirs);const gunPack=await zipPngs('assets/weapons/recorte-split.zip?v=weapon112',true);if(!gunPack.urls.length)throw Error('recorte-split.zip não tem PNGs');mapPack(gunPack,weaponDirs);ready=true;showFrame();load.style.display='none';status.textContent='EMPUNHADURA NA MÃO · MOVIMENTO LIBERADO';detail.textContent='Grip por frame + mão por cima da empunhadura';setTimeout(shoot,450);setInterval(shoot,580)}catch(e){status.textContent='ERRO: '+e.message;load.querySelector('p').textContent='Erro ao carregar: '+e.message;console.error(e)}}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;const kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ky=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);let tx=inputX,ty=inputY;if(kx||ky){const km=Math.hypot(kx,ky)||1;tx=kx/km;ty=ky/km}const active=Math.abs(tx)+Math.abs(ty)>.01,targetVX=tx*speed,targetVY=ty*speed,rate=active?accel:decel;velX+=(targetVX-velX)*Math.min(1,rate*dt);velY+=(targetVY-velY)*Math.min(1,rate*dt);if(!active&&Math.abs(velX)<.35)velX=0;if(!active&&Math.abs(velY)<.35)velY=0;const mag=Math.hypot(velX,velY);if(mag>2){x+=velX*dt;y+=velY*dt;clampPlayer();const delay=145-Math.min(1,mag/speed)*65;if(now-lastFrame>delay){animStep=(animStep+1)%animSeq.length;lastFrame=now;showFrame()}}else if(animStep!==0){animStep=0;showFrame()}player.style.left=x+'px';player.style.top=y+'px';requestAnimationFrame(loop)}
loadAssets();requestAnimationFrame(loop)
})();
</script>
</body>
</html>
