<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CAOS LIVE · Teste S Frente</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}.arena{position:absolute;inset:0;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:64px 64px}.hud{position:fixed;z-index:5;top:12px;left:12px;padding:10px 13px;border:1px solid #303861;border-radius:14px;background:#0b1020ee}.hud b{color:#a855f7}.hud small{display:block;color:#94a3b8;margin-top:3px}.ver{display:inline-block;margin-top:7px;padding:3px 7px;border:1px solid #4c1d95;border-radius:999px;background:#2e1065;color:#d8b4fe;font-size:10px;font-weight:900}.actor{position:absolute;width:128px;height:256px;display:flex;align-items:flex-end;justify-content:center;will-change:left,top;transform:translateZ(0)}.actor img{display:block;width:128px;height:256px;object-fit:contain;object-position:center bottom;image-rendering:auto;pointer-events:none}.panel{position:fixed;left:12px;right:12px;bottom:20px;z-index:6;padding:10px;border:1px solid #303861;border-radius:14px;background:#0b1020ee;text-align:center}.panel strong{display:block;color:#a78bfa;font-size:11px}.panel small{color:#94a3b8;font-size:9px}.err{color:#f87171!important}.sbtn{position:fixed;z-index:8;right:24px;bottom:105px;width:76px;height:76px;border-radius:20px;border:1px solid #6d28d9;background:#4c1d95dd;color:#fff;font-size:28px;font-weight:900;box-shadow:0 10px 30px #0008;user-select:none;-webkit-user-select:none}.sbtn.on{background:#7c3aed;transform:scale(.96)}</style><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script></head><body><div class="arena"><div class="hud">CAOS <b>LIVE</b><small>TESTE DIREÇÃO FRONTAL · S</small><span class="ver">TESTE v0.6.0</span></div><div class="actor" id="actor"><img id="sprite" alt="sprite"></div><button class="sbtn" id="sbtn" aria-label="Andar para baixo">S</button><div class="panel"><strong id="state">CARREGANDO FRAMES...</strong><small id="info">Segure S no teclado ou o botão S no celular</small></div></div><script>const actor=document.getElementById('actor'),sprite=document.getElementById('sprite'),state=document.getElementById('state'),info=document.getElementById('info'),sbtn=document.getElementById('sbtn');const ZIP_URL='./assets/recortes_sem_fundo_CORRIGIDO.zip?v=060';let frames=[],frame=0,x=Math.max(20,innerWidth/2-64),y=Math.max(110,innerHeight*.28),last=performance.now(),animTick=0,down=false;const SPEED=125,FRAME_MS=120;async function loadFrames(){try{const res=await fetch(ZIP_URL,{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const zip=await JSZip.loadAsync(await res.arrayBuffer());const entries=Object.values(zip.files).filter(f=>!f.dir&&/\.png$/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));for(const f of entries){const blob=await f.async('blob');frames.push({name:f.name,url:URL.createObjectURL(blob)});}if(!frames.length)throw new Error('Nenhum PNG encontrado');showFrame(0);state.textContent='PRONTO · SEGURE S';info.textContent=frames.length+' frames · direção frontal/baixo';}catch(e){state.textContent='ERRO AO CARREGAR ZIP';state.classList.add('err');info.textContent=e.message;console.error(e);}}function showFrame(i){if(!frames.length)return;frame=(i+frames.length)%frames.length;sprite.src=frames[frame].url;}function setDown(v){down=v;sbtn.classList.toggle('on',v);if(!v){frame=0;showFrame(0);state.textContent='PARADO · FRENTE';}else state.textContent='ANDANDO PARA BAIXO · S';}addEventListener('keydown',e=>{if(e.code==='KeyS'||e.code==='ArrowDown'){e.preventDefault();setDown(true)}});addEventListener('keyup',e=>{if(e.code==='KeyS'||e.code==='ArrowDown'){e.preventDefault();setDown(false)}});for(const ev of ['pointerdown','touchstart'])sbtn.addEventListener(ev,e=>{e.preventDefault();setDown(true)},{passive:false});for(const ev of ['pointerup','pointercancel','touchend','touchcancel','mouseleave'])sbtn.addEventListener(ev,e=>{e.preventDefault();setDown(false)},{passive:false});function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;if(down){y+=SPEED*dt;const maxY=Math.max(110,innerHeight-256-88);if(y>maxY)y=maxY;if(frames.length&&now-animTick>FRAME_MS){showFrame(frame+1);animTick=now}}actor.style.left=x+'px';actor.style.top=y+'px';requestAnimationFrame(loop)}addEventListener('resize',()=>{x=Math.min(x,innerWidth-148);y=Math.min(y,innerHeight-344)});loadFrames();requestAnimationFrame(loop);</script></body></html>
