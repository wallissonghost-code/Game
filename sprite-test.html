<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07101d"><title>CAOS LIVE · Teste Skin Personagem</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}.arena{position:absolute;inset:0;background-color:#07101d;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:48px 48px}.hud{position:fixed;z-index:12;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));padding:10px 13px;border:1px solid #303861;border-radius:14px;background:#0b1020ee;box-shadow:0 12px 28px #0005}.hud b{color:#60a5fa}.hud small{display:block;color:#94a3b8;margin:4px 0}.ver{display:inline-block;padding:3px 7px;border-radius:999px;background:#0c1e35;color:#93c5fd;font-size:10px;font-weight:900}.player{position:absolute;width:112px;height:112px;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 9px 9px #0009);z-index:5}.player img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom}.shadow{position:absolute;left:50%;bottom:7px;width:50px;height:12px;transform:translateX(-50%);border-radius:50%;background:#0007;filter:blur(2px);z-index:-1}.panel{position:fixed;z-index:12;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));padding:9px 12px;border:1px solid #303861;border-radius:14px;background:#0b1020e8;text-align:center;font-size:10px;color:#94a3b8;pointer-events:none}.panel b{color:#93c5fd}.joy{position:fixed;z-index:15;left:max(22px,env(safe-area-inset-left));bottom:max(72px,calc(env(safe-area-inset-bottom) + 64px));width:116px;height:116px;border:1px solid #64748b66;border-radius:50%;background:#0b102099;box-shadow:inset 0 0 30px #0007;touch-action:none}.stick{position:absolute;left:50%;top:50%;width:50px;height:50px;transform:translate(-50%,-50%);border:1px solid #93c5fd99;border-radius:50%;background:#1e3a5fcc;box-shadow:0 5px 18px #0007}.hint{position:fixed;right:16px;bottom:max(86px,calc(env(safe-area-inset-bottom) + 78px));z-index:11;width:132px;padding:9px 10px;border:1px solid #243657;border-radius:12px;background:#09111ecc;color:#7180a4;font-size:9px;line-height:1.4;text-align:center}.load{position:fixed;z-index:30;inset:0;display:grid;place-items:center;background:#050710f3}.card{width:min(380px,calc(100% - 30px));padding:20px;border:1px solid #303861;border-radius:18px;background:#0b1020;text-align:center}.card h2{margin:0 0 8px}.card p{margin:0;color:#94a3b8;font-size:12px;line-height:1.45}@media(min-width:800px){.joy{left:32px;bottom:84px}.hint{right:28px}.player{width:126px;height:126px}}</style><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script></head><body><div class="arena" id="arena"><div class="hud">CAOS <b>LIVE</b><small>TESTE SKIN · SOLDADO</small><span class="ver">v1.0 · 4 DIREÇÕES</span></div><div class="player" id="player"><div class="shadow"></div><img id="sprite" alt="Soldado"></div><div class="joy" id="joy"><div class="stick" id="stick"></div></div><div class="hint">Use o analógico para andar.<br>No PC: WASD / setas.</div><div class="panel"><b id="status">CARREGANDO SKIN...</b><br><span id="detail">16 frames · frente · costas · direita · esquerda</span></div></div><div class="load" id="load"><div class="card"><h2>Carregando personagem</h2><p>Lendo <b>Skin_personagem_sem_fundo.zip</b> do GitHub.</p></div></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),player=$('player'),sprite=$('sprite'),joy=$('joy'),stick=$('stick'),status=$('status'),detail=$('detail'),load=$('load');let dirs={up:[],down:[],right:[],left:[]},x=innerWidth*.5,y=innerHeight*.48,vx=0,vy=0,dir='down',fi=0,last=performance.now(),lastFrame=0,ready=false,joyId=null,keys={};const speed=132,frameMs=130,maxJoy=42;player.style.left=x+'px';player.style.top=y+'px';function show(){const arr=dirs[dir]||[];if(arr.length)sprite.src=arr[fi%arr.length]}function setDir(dx,dy){if(Math.abs(dx)>Math.abs(dy))dir=dx>0?'right':'left';else dir=dy>0?'down':'up'}function clampPlayer(){x=Math.max(55,Math.min(innerWidth-55,x));y=Math.max(95,Math.min(innerHeight-72,y))}function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy)||1,m=Math.min(maxJoy,d),nx=dx/d,ny=dy/d;stick.style.transform=`translate(calc(-50% + ${nx*m}px),calc(-50% + ${ny*m}px))`;const power=Math.min(1,d/maxJoy);vx=nx*power;vy=ny*power}joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e);e.preventDefault()});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId){joyMove(e);e.preventDefault()}});function joyEnd(e){if(e.pointerId!==joyId)return;joyId=null;vx=vy=0;stick.style.transform='translate(-50%,-50%)'}joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});async function loadSkin(){try{const r=await fetch('assets/Skin_personagem_sem_fundo.zip?v=skin100',{cache:'no-store'});if(!r.ok)throw Error('ZIP não carregou');const z=await JSZip.loadAsync(await r.arrayBuffer());const names=Object.keys(z.files).filter(n=>/\.png$/i.test(n)&&!z.files[n].dir).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));if(names.length<16)throw Error('Preciso dos 16 frames');const urls=[];for(const n of names)urls.push(URL.createObjectURL(await z.files[n].async('blob')));dirs.up=urls.slice(0,4);dirs.down=urls.slice(4,8);dirs.right=urls.slice(8,12);dirs.left=urls.slice(12,16);ready=true;fi=0;show();load.style.display='none';status.textContent='SKIN CARREGADA · VOCÊ CONTROLA O BONECO';detail.textContent='Frente · costas · direita · esquerda · 4 frames por direção'}catch(e){status.textContent='ERRO: '+e.message;load.querySelector('p').textContent='Erro ao carregar a skin: '+e.message;console.error(e)}}function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;let kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ky=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);let mx=kx,my=ky;if(!mx&&!my){mx=vx;my=vy}const mag=Math.hypot(mx,my);if(ready&&mag>.08){mx/=mag;my/=mag;setDir(mx,my);x+=mx*speed*dt;y+=my*speed*dt;clampPlayer();if(now-lastFrame>frameMs){fi=(fi+1)%4;lastFrame=now}show();status.textContent=({up:'CIMA',down:'BAIXO',right:'DIREITA',left:'ESQUERDA'})[dir]+' · ANDANDO · FRAME '+(fi+1)+'/4'}else if(ready){if(fi!==0){fi=0;show()}status.textContent=({up:'CIMA',down:'BAIXO',right:'DIREITA',left:'ESQUERDA'})[dir]+' · PARADO'}player.style.left=x+'px';player.style.top=y+'px';requestAnimationFrame(loop)}loadSkin();requestAnimationFrame(loop)})();</script></body></html>
