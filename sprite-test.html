<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CAOS LIVE · Teste Sprite ZIP</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.arena{position:absolute;inset:0;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:64px 64px}.hud{position:fixed;z-index:5;top:12px;left:12px;padding:10px 13px;border:1px solid #303861;border-radius:14px;background:#0b1020ee}.hud b{color:#a855f7}.hud small{display:block;color:#94a3b8;margin-top:3px}.ver{display:inline-block;margin-top:7px;padding:3px 7px;border:1px solid #4c1d95;border-radius:999px;background:#2e1065;color:#d8b4fe;font-size:10px;font-weight:900}.actor{position:absolute;width:128px;height:256px;display:flex;align-items:center;justify-content:center;will-change:left,top}.actor img{display:block;max-width:128px;max-height:256px;object-fit:contain;image-rendering:auto}.panel{position:fixed;left:12px;right:12px;bottom:20px;z-index:6;padding:10px;border:1px solid #303861;border-radius:14px;background:#0b1020ee;text-align:center}.panel strong{display:block;color:#a78bfa;font-size:11px}.panel small{color:#94a3b8;font-size:9px}.err{color:#f87171!important}</style><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script></head><body><div class="arena"><div class="hud">CAOS <b>LIVE</b><small>NOVO PERSONAGEM · PNGs DO ZIP</small><span class="ver">TESTE v0.5.0</span></div><div class="actor" id="actor"><img id="sprite" alt="sprite"></div><div class="panel"><strong id="state">CARREGANDO FRAMES...</strong><small id="info">assets/recortes_sem_fundo_CORRIGIDO.zip</small></div></div><script>const actor=document.getElementById('actor'),sprite=document.getElementById('sprite'),state=document.getElementById('state'),info=document.getElementById('info');const ZIP_URL='./assets/recortes_sem_fundo_CORRIGIDO.zip?v=050';let frames=[],frame=0,x=innerWidth*.18,y=innerHeight*.34,vx=52,vy=28,last=performance.now(),tick=0;async function loadFrames(){try{const res=await fetch(ZIP_URL,{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const zip=await JSZip.loadAsync(await res.arrayBuffer());const entries=Object.values(zip.files).filter(f=>!f.dir&&/\.png$/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));for(const f of entries){const blob=await f.async('blob');frames.push({name:f.name,url:URL.createObjectURL(blob)});}if(!frames.length)throw new Error('Nenhum PNG encontrado no ZIP');showFrame(0);state.textContent='NOVO PERSONAGEM · '+frames.length+' FRAMES';info.textContent='ZIP carregado · animação automática';}catch(e){state.textContent='ERRO AO CARREGAR ZIP';state.classList.add('err');info.textContent=e.message;console.error(e);}}function showFrame(i){if(!frames.length)return;frame=(i+frames.length)%frames.length;sprite.src=frames[frame].url;state.textContent='FRAME '+String(frame+1).padStart(2,'0')+' / '+frames.length+' · '+frames[frame].name.split('/').pop();}function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;x+=vx*dt;y+=vy*dt;const aw=128,ah=256;if(x<20){x=20;vx=Math.abs(vx)}if(x>innerWidth-aw-20){x=innerWidth-aw-20;vx=-Math.abs(vx)}if(y<100){y=100;vy=Math.abs(vy)}if(y>innerHeight-ah-80){y=innerHeight-ah-80;vy=-Math.abs(vy)}actor.style.left=x+'px';actor.style.top=y+'px';if(frames.length&&now-tick>180){showFrame(frame+1);tick=now}requestAnimationFrame(loop)}loadFrames();requestAnimationFrame(loop);</script></body></html>
