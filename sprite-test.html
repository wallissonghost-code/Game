<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CAOS LIVE · Boss Ogro</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}.arena{position:absolute;inset:0;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:48px 48px}.hud{position:fixed;z-index:10;top:12px;left:12px;padding:10px 13px;border:1px solid #303861;border-radius:14px;background:#0b1020ee}.hud b{color:#ef4444}.hud small{display:block;color:#94a3b8;margin:4px 0}.ver{font-size:10px;color:#fca5a5}.load{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:#050710ee}.card{width:min(390px,calc(100% - 30px));padding:20px;border:1px solid #303861;border-radius:18px;background:#0b1020}.card p{color:#94a3b8;font-size:12px;line-height:1.45}.player{position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%);border-radius:50%;background:#24344f;border:2px solid #60a5fa;display:grid;place-items:center}.boss{position:absolute;width:158px;height:158px;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 12px 13px #0009)}.boss img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom}.name{position:absolute;left:50%;top:-27px;transform:translateX(-50%);font-size:11px;font-weight:900;white-space:nowrap;text-shadow:0 2px 3px #000}.hp{position:absolute;left:14px;right:14px;top:-10px;height:7px;border-radius:9px;background:#2b0b10;border:1px solid #ffffff40;overflow:hidden}.hp i{display:block;width:100%;height:100%;background:#ef4444}.target{position:absolute;width:30px;height:30px;border:2px solid #ef4444;border-radius:50%;transform:translate(-50%,-50%);opacity:0}.target.show{opacity:1}.panel{position:fixed;left:12px;right:12px;bottom:16px;padding:10px;border:1px solid #303861;border-radius:14px;background:#0b1020ee;text-align:center;font-size:11px;color:#94a3b8}.panel b{color:#fca5a5}</style><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script></head><body><div class="arena" id="arena"><div class="hud">CAOS <b>LIVE</b><small>BOSS TEST · OGRO GUERREIRO</small><span class="ver">v0.9.2 · BOSS CORRETO</span></div><div class="player">●</div><div class="target" id="target"></div><div class="boss" id="boss"><div class="name">OGRO BOSS · 100/100</div><div class="hp"><i></i></div><img id="sprite" alt="Ogro Boss"></div><div class="panel"><b id="status">CARREGANDO BOSS...</b><br>4 direções reais · 4 frames por direção</div></div><div class="load" id="load"><div class="card"><h2>Ogro Boss</h2><p>Carregando os frames transparentes do boss correto.</p></div></div><script>(()=>{const arena=document.getElementById('arena'),boss=document.getElementById('boss'),sprite=document.getElementById('sprite'),status=document.getElementById('status'),marker=document.getElementById('target'),load=document.getElementById('load');let dirs={up:[],down:[],right:[],left:[]},x=innerWidth*.25,y=innerHeight*.52,tx=x,ty=y,moving=false,dir='down',fi=0,last=performance.now(),lastFrame=0;const speed=80,frameMs=150;boss.style.left=x+'px';boss.style.top=y+'px';function show(){const a=dirs[dir]||[];sprite.src=a[fi%Math.max(1,a.length)]||dirs.down[0]||''}function getDir(dx,dy){if(Math.abs(dx)>Math.abs(dy))return dx>0?'right':'left';return dy>0?'down':'up'}function target(px,py){if(!dirs.down.length)return;tx=Math.max(80,Math.min(innerWidth-80,px));ty=Math.max(120,Math.min(innerHeight-100,py));const dx=tx-x,dy=ty-y;if(Math.hypot(dx,dy)<3)return;dir=getDir(dx,dy);fi=0;show();moving=true;marker.style.left=tx+'px';marker.style.top=ty+'px';marker.classList.add('show');status.textContent='BOSS · '+({down:'BAIXO',up:'CIMA',right:'DIREITA',left:'ESQUERDA'})[dir]+' · ANDANDO'}arena.addEventListener('pointerdown',e=>target(e.clientX,e.clientY));async function loadBoss(){try{const r=await fetch('assets/recorte-split-2-sem-fundo-corrigido.zip?v=092');if(!r.ok)throw Error('ZIP não carregou');const z=await JSZip.loadAsync(await r.arrayBuffer());const names=Object.keys(z.files).filter(n=>/\.png$/i.test(n)&&!z.files[n].dir).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));if(names.length<16)throw Error('ZIP precisa de 16 PNGs');const urls={};for(const n of names)urls[n]=URL.createObjectURL(await z.files[n].async('blob'));const by=(row,col)=>names.find(n=>n.includes(`recorte-${row}-${col}.png`));dirs.up=[1,2,3,4].map(c=>urls[by(1,c)]).filter(Boolean);dirs.down=[1,2,3,4].map(c=>urls[by(2,c)]).filter(Boolean);dirs.right=[1,2,3,4].map(c=>urls[by(3,c)]).filter(Boolean);dirs.left=[1,2,3,4].map(c=>urls[by(4,c)]).filter(Boolean);if(Object.values(dirs).some(a=>a.length<4))throw Error('Mapeamento dos frames incompleto');show();load.style.display='none';status.textContent='BOSS CORRETO CARREGADO · TOQUE PARA MOVER'}catch(e){status.textContent='ERRO: '+e.message;load.querySelector('p').textContent='Erro: '+e.message;console.error(e)}}function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;const dx=tx-x,dy=ty-y,dist=Math.hypot(dx,dy);if(moving&&dist>2){const st=Math.min(dist,speed*dt);x+=dx/dist*st;y+=dy/dist*st;if(now-lastFrame>frameMs){fi=(fi+1)%4;show();lastFrame=now}}else if(moving){moving=false;fi=0;show();marker.classList.remove('show');status.textContent='BOSS · '+({down:'BAIXO',up:'CIMA',right:'DIREITA',left:'ESQUERDA'})[dir]+' · PARADO'}boss.style.left=x+'px';boss.style.top=y+'px';requestAnimationFrame(loop)}loadBoss();requestAnimationFrame(loop)})();</script></body></html>
