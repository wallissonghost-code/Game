<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<title>CAOS LIVE · Teste de Tiro</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
.arena{position:absolute;inset:0;background-color:#07101d;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:48px 48px}
.hud{position:fixed;z-index:20;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));padding:10px 13px;border:1px solid #303861;border-radius:14px;background:#0b1020ee;box-shadow:0 12px 28px #0005}.hud b{color:#60a5fa}.hud small{display:block;color:#94a3b8;margin:4px 0}.ver{display:inline-block;padding:3px 7px;border-radius:999px;background:#0c1e35;color:#93c5fd;font-size:10px;font-weight:900}
.target{position:absolute;z-index:8;left:50%;top:20%;width:78px;height:78px;transform:translate(-50%,-50%);border-radius:50%;border:4px solid #e2e8f0;background:radial-gradient(circle,#ef4444 0 13%,#f8fafc 14% 29%,#ef4444 30% 46%,#f8fafc 47% 64%,#ef4444 65% 100%);box-shadow:0 0 0 8px #0f172acc,0 15px 35px #0008;transition:transform .08s}.target.hit{transform:translate(-50%,-50%) scale(.91)}
.target-label{position:absolute;z-index:9;left:50%;top:calc(20% + 58px);transform:translateX(-50%);padding:5px 9px;border-radius:999px;background:#0b1020e8;border:1px solid #334155;color:#cbd5e1;font-size:10px;font-weight:800;letter-spacing:.06em}
.player{position:absolute;z-index:10;left:50%;top:68%;width:132px;height:132px;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 10px 10px #0008)}
.char{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;image-rendering:auto;z-index:5}
.weapon{position:absolute;display:none;left:43.5%;top:47%;width:27px;height:48px;object-fit:contain;object-position:center;image-rendering:auto;pointer-events:none;transform:translate(-50%,-50%);transform-origin:50% 62%;z-index:4}
.weapon.recoil{transform:translate(-50%,-46%)}
.shadow{position:absolute;left:50%;bottom:7px;width:50px;height:12px;transform:translateX(-50%);border-radius:50%;background:#0006;filter:blur(2px);z-index:-1}
.muzzle{position:absolute;display:none;z-index:12;left:43.5%;top:29%;width:15px;height:25px;transform:translate(-50%,-50%);clip-path:polygon(50% 0,66% 32%,100% 45%,68% 58%,50% 100%,34% 60%,0 45%,34% 32%);background:#fde68a;filter:drop-shadow(0 0 7px #f59e0b)}
.muzzle.on{display:block}
.bullet{position:absolute;z-index:7;width:4px;height:18px;border-radius:999px;background:#fde68a;box-shadow:0 0 8px #f59e0b;transform:translate(-50%,-50%)}
.panel{position:fixed;z-index:20;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));padding:9px 12px;border:1px solid #303861;border-radius:14px;background:#0b1020e8;text-align:center;font-size:10px;color:#94a3b8;pointer-events:none}.panel b{color:#93c5fd}
.note{position:fixed;z-index:18;right:16px;bottom:max(82px,calc(env(safe-area-inset-bottom) + 72px));width:150px;padding:9px 10px;border:1px solid #243657;border-radius:12px;background:#09111ecc;color:#7180a4;font-size:9px;line-height:1.4;text-align:center}
.load{position:fixed;z-index:30;inset:0;display:grid;place-items:center;background:#050710f3}.card{width:min(380px,calc(100% - 30px));padding:20px;border:1px solid #303861;border-radius:18px;background:#0b1020;text-align:center}.card h2{margin:0 0 8px}.card p{margin:0;color:#94a3b8;font-size:12px;line-height:1.45}
@media(max-height:700px){.target{top:18%;width:64px;height:64px}.target-label{top:calc(18% + 48px)}.player{top:65%;width:118px;height:118px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<div class="arena" id="arena">
  <div class="hud">CAOS <b>LIVE</b><small>TESTE · TIRO PARADO</small><span class="ver">v1.0.7 · FIRE TEST</span></div>
  <div class="target" id="target"></div><div class="target-label">ALVO FIXO</div>
  <div class="player" id="player"><div class="shadow"></div><img id="sprite" class="char" alt="Personagem"><img id="weapon" class="weapon" alt="Arma"><div id="muzzle" class="muzzle"></div></div>
  <div class="note">Personagem travado no lugar.<br>Disparo automático para testar alinhamento.</div>
  <div class="panel"><b id="status">CARREGANDO...</b><br><span id="detail">Teste de arma apontando para cima</span></div>
</div>
<div class="load" id="load"><div class="card"><h2>Preparando teste de tiro</h2><p>Carregando <b>Personagem.zip</b> e <b>weapons/recorte-split.zip</b>.</p></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),arena=$('arena'),player=$('player'),sprite=$('sprite'),weapon=$('weapon'),muzzle=$('muzzle'),target=$('target'),status=$('status'),detail=$('detail'),load=$('load');
let dirs={up:[],down:[],right:[],left:[]},weaponDirs={up:[],down:[],right:[],left:[]},shots=0,ready=false;
async function zipPngs(path,crop=false){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error(path+' não carregou');const z=await JSZip.loadAsync(await r.arrayBuffer());const names=Object.keys(z.files).filter(n=>/\.png$/i.test(n)&&!z.files[n].dir).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));const urls=[];for(const n of names){const raw=URL.createObjectURL(await z.files[n].async('blob'));urls.push(crop?await cropTransparent(raw):raw);if(crop)URL.revokeObjectURL(raw)}return{names,urls}}
function cropTransparent(src){return new Promise(resolve=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});c.width=im.naturalWidth;c.height=im.naturalHeight;ctx.drawImage(im,0,0);const d=ctx.getImageData(0,0,c.width,c.height).data;let minX=c.width,minY=c.height,maxX=-1,maxY=-1;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){if(d[(y*c.width+x)*4+3]>12){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}}if(maxX<0){resolve(src);return}const pad=2,x0=Math.max(0,minX-pad),y0=Math.max(0,minY-pad),x1=Math.min(c.width-1,maxX+pad),y1=Math.min(c.height-1,maxY+pad),w=x1-x0+1,h=y1-y0+1,o=document.createElement('canvas');o.width=w;o.height=h;o.getContext('2d').drawImage(c,x0,y0,w,h,0,0,w,h);o.toBlob(b=>resolve(b?URL.createObjectURL(b):src),'image/png')};im.onerror=()=>resolve(src);im.src=src})}
function mapPack(pack,targetMap){const u=pack.urls,n=pack.names;if(u.length>=16){const indexed=n.map((name,i)=>{const m=name.match(/recorte-(\d+)-(\d+)\.png$/i);return m?{r:+m[1],c:+m[2],u:u[i]}:null}).filter(Boolean);if(indexed.length>=16){targetMap.up=indexed.filter(v=>v.r===1).sort((a,b)=>a.c-b.c).map(v=>v.u);targetMap.down=indexed.filter(v=>v.r===2).sort((a,b)=>a.c-b.c).map(v=>v.u);targetMap.right=indexed.filter(v=>v.r===3).sort((a,b)=>a.c-b.c).map(v=>v.u);targetMap.left=indexed.filter(v=>v.r===4).sort((a,b)=>a.c-b.c).map(v=>v.u)}else{targetMap.up=u.slice(0,4);targetMap.down=u.slice(4,8);targetMap.right=u.slice(8,12);targetMap.left=u.slice(12,16)}}else if(u.length>=4){targetMap.down=[u[0]];targetMap.left=[u[1]||u[0]];targetMap.right=[u[2]||u[0]];targetMap.up=[u[3]||u[0]]}else if(u.length){targetMap.up=targetMap.down=targetMap.right=targetMap.left=[u[0]]}}
function shoot(){if(!ready)return;shots++;muzzle.classList.add('on');weapon.classList.add('recoil');setTimeout(()=>{muzzle.classList.remove('on');weapon.classList.remove('recoil')},70);
 const ar=arena.getBoundingClientRect(),pr=player.getBoundingClientRect(),tr=target.getBoundingClientRect();
 const startX=pr.left+pr.width*.435-ar.left,startY=pr.top+pr.height*.285-ar.top,endX=tr.left+tr.width*.5-ar.left,endY=tr.top+tr.height*.5-ar.top;
 const b=document.createElement('div');b.className='bullet';b.style.left=startX+'px';b.style.top=startY+'px';arena.appendChild(b);
 const dx=endX-startX,dy=endY-startY,d=Math.hypot(dx,dy),dur=Math.max(120,d/2.7);b.animate([{transform:'translate(-50%,-50%)'},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`}],{duration:dur,easing:'linear'}).onfinish=()=>{b.remove();target.classList.add('hit');setTimeout(()=>target.classList.remove('hit'),70)};
 status.textContent='ATIRANDO NO ALVO · DISPARO '+shots;
}
async function loadAssets(){try{const charPack=await zipPngs('assets/Personagem.zip?v=skin107');if(charPack.urls.length<16)throw Error('Personagem.zip precisa dos 16 frames');mapPack(charPack,dirs);const gunPack=await zipPngs('assets/weapons/recorte-split.zip?v=weapon107',true);if(!gunPack.urls.length)throw Error('recorte-split.zip não tem PNGs');mapPack(gunPack,weaponDirs);
 sprite.src=(dirs.up&&dirs.up[0])||charPack.urls[0];weapon.src=(weaponDirs.up&&weaponDirs.up[0])||gunPack.urls[0];weapon.style.display='block';ready=true;load.style.display='none';status.textContent='CIMA · PARADO · MIRANDO NO ALVO';detail.textContent='Arma recalibrada para teste vertical · '+gunPack.urls.length+' frame(s)';setTimeout(shoot,500);setInterval(shoot,520)}catch(e){status.textContent='ERRO: '+e.message;load.querySelector('p').textContent='Erro ao carregar: '+e.message;console.error(e)}}
loadAssets();
})();
</script>
</body>
</html>
