<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070913"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Painel Caos Live v0.5.2</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070913;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:18px}.app{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.top h1{margin:0;font-size:25px}.top h1 b{color:#8b5cf6}.top a{color:#c4b5fd;text-decoration:none;font-size:12px}.card{padding:17px;border:1px solid #293153;border-radius:20px;background:#0b1020;margin-bottom:14px}.label{display:block;margin-bottom:7px;color:#8792bd;font-size:11px}.row{display:flex;gap:8px}.row input{flex:1;min-width:0;padding:14px;border:1px solid #35406d;border-radius:13px;background:#070b16;color:#fff;font-size:19px;font-weight:900;letter-spacing:3px;text-transform:uppercase}.row button,.btn{border:0;border-radius:13px;background:#7c3aed;color:#fff;font-weight:900;padding:13px 15px}.status{margin-top:10px;padding:9px;border-radius:10px;background:#151a2e;color:#f59e0b;text-align:center;font-size:11px;font-weight:900}.status.online{color:#22c55e;background:#0d2118}.state{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.state div{padding:11px 5px;border:1px solid #283052;border-radius:12px;text-align:center;background:#080d19}.state span{display:block;color:#7f8ab4;font-size:8px}.state b{font-size:18px}.controls.disabled{opacity:.42;pointer-events:none}h2{font-size:14px;margin:18px 0 9px;color:#c7cdee}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.grid button{min-height:54px;border:1px solid #323b65;border-radius:14px;background:#11172a;color:#fff;font-weight:850;font-size:12px}.grid button:active{transform:scale(.98)}.danger{background:#36131c!important;border-color:#6f2332!important}.good{background:#102b1d!important;border-color:#23643d!important}.purple{background:#22143e!important;border-color:#5b2fa1!important}.tools{display:grid;grid-template-columns:1fr 90px;gap:8px;margin-top:9px}.tools input,.tools select{padding:12px;border:1px solid #35406d;border-radius:12px;background:#070b16;color:#fff}.log{max-height:190px;overflow:auto;font-size:11px;color:#aeb7d8}.log p{margin:0;padding:7px 0;border-bottom:1px solid #202745}.version{color:#66719a;font-size:10px;text-align:center;margin-top:12px}@media(max-width:520px){.state{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><main class="app"><header class="top"><h1>CAOS <b>ADMIN</b></h1><a href="index.html">ABRIR JOGO</a></header>
<section class="card"><label class="label">CÓDIGO EXIBIDO AO PAUSAR O JOGO</label><div class="row"><input id="room" maxlength="12" placeholder="ABCD2345"><button id="connect">CONECTAR</button></div><div id="status" class="status">DESCONECTADO</div></section>
<section id="controls" class="controls disabled"><section class="card"><div class="state"><div><span>VIDA</span><b id="health">—</b></div><div><span>PONTOS</span><b id="score">—</b></div><div><span>MOBS</span><b id="mobs">—</b></div><div><span>ESTADO</span><b id="gameState">—</b></div></div></section>
<section class="card"><h2>CONTROLE DA PARTIDA</h2><div class="grid"><button data-cmd="pause">Ⅱ PAUSAR</button><button data-cmd="resume">▶ CONTINUAR</button><button class="good" data-cmd="heal" data-amount="1">❤ CURAR +1</button><button class="danger" data-cmd="damage" data-amount="2">💥 DANO -2</button><button data-cmd="clear">🧹 LIMPAR ARENA</button><button class="purple" data-cmd="boss">☠ SPAWN BOSS</button><button data-cmd="freeze" data-seconds="8">❄ CONGELAR 8s</button><button data-cmd="invincible" data-seconds="10">🛡 INVENCÍVEL 10s</button><button data-cmd="score" data-amount="500">⭐ +500 PONTOS</button><button class="danger" data-cmd="restart">↻ REINICIAR</button></div>
<h2>ADICIONAR MOBS</h2><div class="tools"><select id="mobType"><option value="">Mobs mistos</option><option value="wraith">Espectro</option><option value="eye">Olho do abismo</option><option value="hound">Cão sombrio</option><option value="reaper">Ceifador</option><option value="abomination">Aberração</option></select><input id="mobAmount" type="number" min="1" max="60" value="10"></div><button id="spawn" class="btn" style="width:100%;margin-top:9px">ADICIONAR MOBS</button>
<h2>VELOCIDADE DOS MOBS</h2><div class="grid"><button data-speed="0.5">0.5× LENTO</button><button data-speed="1">1× NORMAL</button><button data-speed="1.5">1.5× RÁPIDO</button><button data-speed="2.5">2.5× CAOS</button></div></section>
<section class="card"><h2>HISTÓRICO</h2><div id="log" class="log"><p>Aguardando conexão.</p></div></section></section><div class="version">PAINEL v0.5.2 · PEERJS / WEBRTC</div></main>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),room=$('room'),status=$('status'),controls=$('controls'),log=$('log');let peer,conn,retry=0,timer,manual=false;const params=new URLSearchParams(location.search);room.value=(params.get('sala')||localStorage.getItem('chaos-last-room')||'').toUpperCase();function add(t){if(log.children.length===1&&log.firstChild.textContent.includes('Aguardando'))log.innerHTML='';const p=document.createElement('p');p.textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' — '+t;log.prepend(p);while(log.children.length>25)log.lastChild.remove()}function setStatus(t,on=false){status.textContent=t;status.classList.toggle('online',on);controls.classList.toggle('disabled',!on)}function schedule(){if(manual)return;clearTimeout(timer);retry++;setStatus('RECONECTANDO '+retry+'...');timer=setTimeout(()=>connect(true),Math.min(6500,1000*retry))}function connect(auto=false){const code=room.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);room.value=code;if(code.length<6)return setStatus('CÓDIGO INVÁLIDO');localStorage.setItem('chaos-last-room',code);const u=new URL(location.href);u.searchParams.set('sala',code);history.replaceState(null,'',u);manual=false;try{conn?.close();peer?.destroy()}catch{}setStatus(auto?'RECONECTANDO...':'CONECTANDO...');peer=new Peer(undefined,{debug:1});peer.on('open',()=>{conn=peer.connect('chaos-live-'+code.toLowerCase(),{reliable:true,serialization:'json'});conn.on('open',()=>{retry=0;setStatus('CONECTADO AO JOGO',true);add('Conectado à sessão '+code)});conn.on('data',d=>{if(d?.type!=='state')return;$('health').textContent=d.health;$('score').textContent=d.score;$('mobs').textContent=d.mobs;$('gameState').textContent=d.paused?'PAUSADO':d.running?'RODANDO':'PARADO'});conn.on('close',()=>{add('Conexão encerrada');schedule()});conn.on('error',schedule)});peer.on('error',e=>{setStatus(e.type==='peer-unavailable'?'SESSÃO NÃO ENCONTRADA':'ERRO DE CONEXÃO');schedule()});peer.on('disconnected',schedule)}function send(data,label){if(!conn?.open){schedule();return}conn.send({type:'command',...data});add(label)}$('connect').onclick=()=>{retry=0;connect(false)};room.onkeydown=e=>{if(e.key==='Enter'){retry=0;connect(false)}};document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>send({command:b.dataset.cmd,amount:+b.dataset.amount||undefined,seconds:+b.dataset.seconds||undefined},b.textContent.trim()));document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>send({command:'speed',value:+b.dataset.speed},'Velocidade '+b.dataset.speed+'×'));$('spawn').onclick=()=>send({command:'spawn',amount:+$('mobAmount').value||10,mob:$('mobType').value||null},'Spawn de '+($('mobAmount').value||10)+' mobs');addEventListener('beforeunload',()=>manual=true);if(room.value)connect(false)})();
</script></body></html>
