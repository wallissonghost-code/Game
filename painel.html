<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070913"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Painel Caos Live v0.8.0</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070913;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:18px}.app{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.top h1{margin:0;font-size:25px}.top h1 b{color:#8b5cf6}.top a{color:#c4b5fd;text-decoration:none;font-size:12px}.card{padding:17px;border:1px solid #293153;border-radius:20px;background:#0b1020;margin-bottom:14px}.label{display:block;margin-bottom:7px;color:#8792bd;font-size:11px}.row{display:flex;gap:8px}.row input{flex:1;min-width:0;padding:14px;border:1px solid #35406d;border-radius:13px;background:#070b16;color:#fff;font-size:19px;font-weight:900;letter-spacing:3px;text-transform:uppercase}.row button,.btn{border:0;border-radius:13px;background:#7c3aed;color:#fff;font-weight:900;padding:13px 15px}.status{margin-top:10px;padding:9px;border-radius:10px;background:#151a2e;color:#f59e0b;text-align:center;font-size:11px;font-weight:900}.status.online{color:#22c55e;background:#0d2118}.state{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.state div{padding:11px 5px;border:1px solid #283052;border-radius:12px;text-align:center;background:#080d19}.state span{display:block;color:#7f8ab4;font-size:8px}.state b{font-size:16px}.controls.disabled{opacity:.42;pointer-events:none}h2{font-size:14px;margin:18px 0 9px;color:#c7cdee}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.grid button{min-height:54px;border:1px solid #323b65;border-radius:14px;background:#11172a;color:#fff;font-weight:850;font-size:12px}.grid button small{display:block;margin-top:4px;color:#8792bd;font-size:9px;font-weight:600}.danger{background:#36131c!important;border-color:#6f2332!important}.good{background:#102b1d!important;border-color:#23643d!important}.purple{background:#22143e!important;border-color:#5b2fa1!important}.gold{background:#33240b!important;border-color:#7c5b12!important}.blue{background:#10283b!important;border-color:#245f83!important}.tools{display:grid;grid-template-columns:1fr 90px;gap:8px;margin-top:9px}.tools input,.tools select{padding:12px;border:1px solid #35406d;border-radius:12px;background:#070b16;color:#fff}.log{max-height:190px;overflow:auto;font-size:11px;color:#aeb7d8}.log p{margin:0;padding:7px 0;border-bottom:1px solid #202745}.version{color:#66719a;font-size:10px;text-align:center;margin-top:12px}.net{font-size:9px;color:#66719a;text-align:center;margin-top:7px}@media(max-width:620px){.state{grid-template-columns:repeat(3,1fr)}}</style></head><body><main class="app"><header class="top"><h1>CAOS <b>ADMIN</b></h1><a href="index.html">ABRIR JOGO</a></header><section class="card"><label class="label">CÓDIGO EXIBIDO AO PAUSAR O JOGO</label><div class="row"><input id="room" maxlength="12" placeholder="ABCD2345"><button id="connect">CONECTAR</button></div><div id="status" class="status">DESCONECTADO</div><div id="net" class="net">Canal aguardando conexão</div></section><section id="controls" class="controls disabled"><section class="card"><div class="state"><div><span>VIDA</span><b id="health">—</b></div><div><span>LEVEL</span><b id="level">—</b></div><div><span>XP</span><b id="xp">—</b></div><div><span>PONTOS</span><b id="score">—</b></div><div><span>MOBS</span><b id="mobs">—</b></div><div><span>ESTADO</span><b id="gameState">—</b></div><div><span>AUTO</span><b id="autoState">OFF</b></div></div></section><section class="card"><h2>CONTROLE DA PARTIDA</h2><div class="grid"><button data-cmd="pause">Ⅱ PAUSAR</button><button data-cmd="resume">▶ CONTINUAR</button><button class="good" data-cmd="auto" data-value="true">🤖 AUTO INTELIGENTE ON<small>anda e desvia dos mobs</small></button><button class="blue" data-cmd="auto" data-value="false">🕹 AUTO OFF<small>volta ao controle manual</small></button><button class="good" data-cmd="heal" data-amount="1">❤ CURAR +1</button><button class="danger" data-cmd="damage" data-amount="2">💥 DANO -2</button><button data-cmd="clear">🧹 LIMPAR ARENA</button><button class="blue" data-cmd="freeze" data-seconds="8">❄ CONGELAR 8s</button><button class="gold" data-cmd="invincible" data-seconds="10">🛡 INVENCÍVEL 10s</button><button class="danger" data-cmd="restart">↻ REINICIAR</button></div><h2>BOSSES DE 100 DE VIDA</h2><div class="grid"><button class="gold" data-cmd="boss" data-mob="colossus">👹 COLOSSO CARMESIM</button><button class="purple" data-cmd="boss" data-mob="voidlord">👁 SENHOR DO VAZIO</button></div><h2>PROGRESSÃO</h2><div class="grid"><button data-cmd="xp" data-amount="50">✨ +50 XP</button><button data-cmd="xp" data-amount="200">✨ +200 XP</button><button data-cmd="level" data-amount="1">⬆ +1 LEVEL</button><button data-cmd="level" data-amount="3">⬆ +3 LEVELS</button></div><h2>ADICIONAR MOBS</h2><div class="tools"><select id="mobType"><option value="">Mobs mistos</option><option value="wraith">Espectro</option><option value="reaper">Ceifador</option><option value="infected">Infectado</option><option value="crawler">Criatura das Sombras</option><option value="eye">Observador</option><option value="brute">Brutamonte</option></select><input id="mobAmount" type="number" min="1" max="100" value="25"></div><button id="spawn" class="btn" style="width:100%;margin-top:9px">ADICIONAR MOBS</button><h2>VELOCIDADE DOS MOBS</h2><div class="grid"><button data-speed="0.5">0.5× LENTO</button><button data-speed="1">1× NORMAL</button><button data-speed="1.5">1.5× RÁPIDO</button><button data-speed="2.5">2.5× CAOS</button></div></section><section class="card"><h2>HISTÓRICO</h2><div id="log" class="log"><p>Aguardando conexão.</p></div></section></section><div class="version">PAINEL v0.8.0 · PEERJS / WEBRTC</div></main><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),room=$('room'),status=$('status'),controls=$('controls'),log=$('log'),net=$('net');let peer=null,conn=null,retryTimer=null,retry=0,generation=0,manual=false,connecting=false,lastStateAt=0,watchdog=null;const params=new URLSearchParams(location.search);room.value=(params.get('sala')||localStorage.getItem('chaos-last-room')||'').toUpperCase();function add(t){if(log.children.length===1&&log.firstChild.textContent.includes('Aguardando'))log.innerHTML='';const p=document.createElement('p');p.textContent=new Date().toLocaleTimeString('pt-BR')+' — '+t;log.prepend(p);while(log.children.length>25)log.lastChild.remove()}function setStatus(t,on=false){status.textContent=t;status.classList.toggle('online',on);controls.classList.toggle('disabled',!on)}function cleanup(){clearTimeout(retryTimer);retryTimer=null;clearInterval(watchdog);watchdog=null;connecting=false;try{conn?.close()}catch{}try{peer?.destroy()}catch{}conn=null;peer=null}function schedule(gen,reason='conexão perdida'){if(manual||gen!==generation||retryTimer||connecting)return;retry++;const delay=Math.min(7000,900*Math.pow(1.45,Math.min(retry,6)));setStatus('RECONECTANDO '+retry+'...');net.textContent=reason+' · nova tentativa em '+(delay/1000).toFixed(1)+'s';retryTimer=setTimeout(()=>{retryTimer=null;if(gen===generation)connect(true)},delay)}function startWatchdog(gen){clearInterval(watchdog);watchdog=setInterval(()=>{if(gen!==generation||!conn?.open)return;const age=Date.now()-lastStateAt;net.textContent='Canal estável · último estado há '+Math.round(age/1000)+'s';if(age>9000){add('Heartbeat expirou; reconectando');try{conn.close()}catch{}schedule(gen,'sem resposta do jogo')}} ,2000)}function connect(auto=false){const code=room.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);room.value=code;if(code.length<6)return setStatus('CÓDIGO INVÁLIDO');localStorage.setItem('chaos-last-room',code);manual=false;const gen=++generation;cleanup();connecting=true;setStatus(auto?'RECONECTANDO...':'CONECTANDO...');net.textContent='Abrindo canal seguro...';peer=new Peer(undefined,{debug:0});peer.on('open',()=>{if(gen!==generation)return;conn=peer.connect('chaos-live-'+code.toLowerCase(),{reliable:true,serialization:'json'});conn.on('open',()=>{if(gen!==generation)return;connecting=false;retry=0;lastStateAt=Date.now();setStatus('CONECTADO AO JOGO',true);net.textContent='Canal WebRTC estável';add('Conectado à sessão '+code);startWatchdog(gen);try{conn.send({type:'command',command:'ping'})}catch{}});conn.on('data',d=>{if(gen!==generation||d?.type!=='state')return;lastStateAt=Date.now();$('health').textContent=d.health+(d.maxHealth?'/'+d.maxHealth:'');$('level').textContent=d.level;$('xp').textContent=d.xp+'/'+d.xpNeed;$('score').textContent=d.score;$('mobs').textContent=d.mobs;$('gameState').textContent=d.paused?'PAUSADO':d.running?'RODANDO':'PARADO';$('autoState').textContent=d.autoMode?'ON':'OFF'});conn.on('close',()=>{if(gen!==generation)return;connecting=false;clearInterval(watchdog);schedule(gen,'canal fechado')});conn.on('error',()=>{if(gen!==generation)return;connecting=false;schedule(gen,'erro no canal')})});peer.on('error',e=>{if(gen!==generation)return;connecting=false;if(e?.type==='peer-unavailable'){setStatus('SESSÃO NÃO ENCONTRADA');schedule(gen,'jogo ainda não disponível')}else schedule(gen,'erro PeerJS')});peer.on('disconnected',()=>{if(gen!==generation)return;try{peer.reconnect();net.textContent='Sinal interrompido · tentando retomar...'}catch{connecting=false;schedule(gen,'sinal interrompido')}})}function send(data,label){if(!conn?.open){schedule(generation,'comando sem conexão');return}try{conn.send({type:'command',...data});add(label)}catch{schedule(generation,'falha ao enviar comando')}}$('connect').onclick=()=>{retry=0;connect(false)};room.onkeydown=e=>{if(e.key==='Enter'){retry=0;connect(false)}};document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>send({command:b.dataset.cmd,amount:+b.dataset.amount||undefined,seconds:+b.dataset.seconds||undefined,mob:b.dataset.mob||undefined,value:b.dataset.value==='true'?true:b.dataset.value==='false'?false:undefined},b.textContent.trim()));document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>send({command:'speed',value:+b.dataset.speed},'Velocidade '+b.dataset.speed+'×'));$('spawn').onclick=()=>send({command:'spawn',amount:+$('mobAmount').value||25,mob:$('mobType').value||null},'Spawn de '+($('mobAmount').value||25)+' mobs');addEventListener('beforeunload',()=>{manual=true;generation++;cleanup()});if(room.value)connect(false)})();</script></body></html>
