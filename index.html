<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070913">
<title>Caos Live</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070913;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;user-select:none}body{display:grid;place-items:center}.game{position:relative;width:100%;height:100%;overflow:hidden}.hud{position:fixed;z-index:5;top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between;pointer-events:none}.logo{font-size:18px;font-weight:900;text-shadow:0 2px 12px #000}.logo b{color:#8b5cf6}.stats{display:flex;gap:6px}.stats div{min-width:58px;padding:6px 8px;border:1px solid #2a3151;border-radius:11px;background:#0c1020dd;text-align:center;backdrop-filter:blur(5px)}.stats span{display:block;font-size:7px;color:#98a2c8}.stats strong{font-size:13px;font-variant-numeric:tabular-nums}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;z-index:10;display:none;place-items:center;padding:24px;background:#050710df;text-align:center}.overlay.show{display:grid}.card{max-width:430px}.card h1{margin:0 0 10px;font-size:clamp(34px,9vw,60px)}.card p{margin:0 0 18px;color:#adb6d2;line-height:1.45}.btn{min-height:52px;padding:14px 24px;border:0;border-radius:16px;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;font-weight:900;font-size:16px}.btn:active{transform:scale(.98)}
</style>
</head>
<body>
<main class="game" id="stage">
<header class="hud"><div class="logo">CAOS <b>LIVE</b></div><div class="stats"><div><span>PONTOS</span><strong id="score">0</strong></div><div><span>VIDA</span><strong id="life">100</strong></div><div><span>DISTÂNCIA</span><strong id="distance">0m</strong></div></div></header>
<canvas id="canvas"></canvas>
<section id="start" class="overlay show"><div class="card"><h1>Mapa infinito</h1><p>Arraste na tela ou use WASD/setas. O mundo continua em qualquer direção e a câmera acompanha o jogador.</p><button class="btn" id="startBtn">COMEÇAR</button></div></section>
<section id="over" class="overlay"><div class="card"><h1>Fim de jogo</h1><p id="finalText"></p><button class="btn" id="restartBtn">JOGAR NOVAMENTE</button></div></section>
</main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('canvas'),stage=document.getElementById('stage'),ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const scoreEl=document.getElementById('score'),lifeEl=document.getElementById('life'),distanceEl=document.getElementById('distance'),startEl=document.getElementById('start'),overEl=document.getElementById('over'),finalText=document.getElementById('finalText');
const keys=Object.create(null),player={x:0,y:0,r:17,speed:270,life:100,inv:0};
let W=0,H=0,dpr=1,running=false,last=0,raf=0,pointer=null,score=0,spawnTimer=0,shotTimer=0,enemies=[],bullets=[];
const MAX_ENEMIES=65,MAX_BULLETS=60,GRID=64;
function resize(){const r=stage.getBoundingClientRect();W=Math.max(320,Math.round(r.width));H=Math.max(320,Math.round(r.height));dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
addEventListener('resize',resize,{passive:true});addEventListener('orientationchange',()=>setTimeout(resize,120),{passive:true});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k.startsWith('arrow'))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',()=>{pointer=null;for(const k in keys)keys[k]=false});
function ppos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{if(!running)return;pointer=ppos(e);try{canvas.setPointerCapture(e.pointerId)}catch{}e.preventDefault()},{passive:false});
canvas.addEventListener('pointermove',e=>{if(pointer){pointer=ppos(e);e.preventDefault()}},{passive:false});
const clear=()=>pointer=null;canvas.addEventListener('pointerup',clear);canvas.addEventListener('pointercancel',clear);canvas.addEventListener('lostpointercapture',clear);
function reset(){cancelAnimationFrame(raf);player.x=0;player.y=0;player.life=100;player.inv=0;score=0;enemies=[];bullets=[];spawnTimer=.3;shotTimer=.1;scoreEl.textContent='0';lifeEl.textContent='100';distanceEl.textContent='0m';startEl.classList.remove('show');overEl.classList.remove('show');running=true;last=performance.now();raf=requestAnimationFrame(loop)}
function spawn(){if(enemies.length>=MAX_ENEMIES)return;const a=Math.random()*Math.PI*2,dist=Math.max(W,H)*.7+Math.random()*220,elite=Math.random()<Math.min(.22,score/2500);enemies.push({x:player.x+Math.cos(a)*dist,y:player.y+Math.sin(a)*dist,r:elite?23:14,speed:(elite?50:70)+Math.random()*22,hp:elite?4:1,max:elite?4:1,dead:false})}
function shoot(){if(!enemies.length||bullets.length>=MAX_BULLETS)return;let target=null,best=Infinity;for(const e of enemies){if(e.dead)continue;const dx=e.x-player.x,dy=e.y-player.y,q=dx*dx+dy*dy;if(q<best){best=q;target=e}}if(!target)return;const a=Math.atan2(target.y-player.y,target.x-player.x);bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*520,vy:Math.sin(a)*520,r:4.5,dead:false})}
function end(){running=false;cancelAnimationFrame(raf);finalText.textContent=`Você fez ${score} pontos e percorreu ${Math.floor(Math.hypot(player.x,player.y)/10)} metros.`;overEl.classList.add('show')}
function update(dt){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(pointer){dx=pointer.x-W/2;dy=pointer.y-H/2;if(Math.hypot(dx,dy)<16){dx=dy=0}}const len=Math.hypot(dx,dy)||1;if(dx||dy){player.x+=dx/len*player.speed*dt;player.y+=dy/len*player.speed*dt}player.inv=Math.max(0,player.inv-dt);distanceEl.textContent=Math.floor(Math.hypot(player.x,player.y)/10)+'m';
spawnTimer-=dt;if(spawnTimer<=0){spawn();spawnTimer=Math.max(.32,.9-score/5000)}shotTimer-=dt;if(shotTimer<=0){shoot();shotTimer=.34}
for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.abs(b.x-player.x)>W||Math.abs(b.y-player.y)>H)b.dead=true}
for(const e of enemies){if(e.dead)continue;const a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;const ex=e.x-player.x,ey=e.y-player.y,rr=e.r+player.r;if(ex*ex+ey*ey<rr*rr){e.dead=true;if(player.inv<=0){player.life=Math.max(0,player.life-(e.max===4?24:12));player.inv=.25;lifeEl.textContent=player.life;if(player.life<=0){end();return}}}}
for(const b of bullets){if(b.dead)continue;for(const e of enemies){if(e.dead)continue;const dx=b.x-e.x,dy=b.y-e.y,rr=b.r+e.r;if(dx*dx+dy*dy<rr*rr){b.dead=true;e.hp--;if(e.hp<=0){e.dead=true;score+=e.max===4?40:10;scoreEl.textContent=score}break}}}
bullets=bullets.filter(b=>!b.dead);enemies=enemies.filter(e=>!e.dead&&Math.abs(e.x-player.x)<W*1.4&&Math.abs(e.y-player.y)<H*1.4)}
function worldToScreen(x,y){return{x:x-player.x+W/2,y:y-player.y+H/2}}
function draw(){if(!W||!H)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#0a0d1c';ctx.fillRect(0,0,W,H);const ox=(((-player.x+W/2)%GRID)+GRID)%GRID,oy=(((-player.y+H/2)%GRID)+GRID)%GRID;ctx.strokeStyle='#171d39';ctx.lineWidth=1;for(let x=ox;x<W;x+=GRID){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=oy;y<H;y+=GRID){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
ctx.fillStyle='#121832';for(let gx=Math.floor((player.x-W/2)/320)-1;gx<=Math.floor((player.x+W/2)/320)+1;gx++)for(let gy=Math.floor((player.y-H/2)/320)-1;gy<=Math.floor((player.y+H/2)/320)+1;gy++){const seed=Math.abs((gx*73856093)^(gy*19349663));if(seed%3===0){const p=worldToScreen(gx*320+(seed%170),gy*320+((seed>>4)%170));ctx.beginPath();ctx.arc(p.x,p.y,5+(seed%9),0,Math.PI*2);ctx.fill()}}
ctx.fillStyle='#67e8f9';for(const b of bullets){const p=worldToScreen(b.x,b.y);ctx.beginPath();ctx.arc(p.x,p.y,b.r,0,Math.PI*2);ctx.fill()}
for(const e of enemies){const p=worldToScreen(e.x,e.y);ctx.fillStyle=e.max===4?'#ef4444':'#a855f7';ctx.beginPath();ctx.arc(p.x,p.y,e.r,0,Math.PI*2);ctx.fill();if(e.max>1){ctx.fillStyle='#2a1320';ctx.fillRect(p.x-20,p.y-e.r-10,40,4);ctx.fillStyle='#fb7185';ctx.fillRect(p.x-20,p.y-e.r-10,40*(e.hp/e.max),4)}}
ctx.globalAlpha=player.inv>0&&Math.floor(player.inv*30)%2?.35:1;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(W/2,H/2,player.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#7c3aed';ctx.beginPath();ctx.arc(W/2,H/2,7,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
function loop(t){if(!running)return;const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();if(running)raf=requestAnimationFrame(loop)}
document.getElementById('startBtn').onclick=reset;document.getElementById('restartBtn').onclick=reset;resize();draw();
})();
</script>
</body>
</html>
