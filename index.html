<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070913">
<title>Caos Live</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070913;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;user-select:none}body{display:grid;place-items:center}.game{position:relative;width:100%;height:100%;overflow:hidden}.hud{position:fixed;z-index:5;top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}.logo{font-size:18px;font-weight:900;text-shadow:0 2px 12px #000}.logo b{color:#8b5cf6}.coords{margin-top:4px;font-size:9px;color:#7f8ab4}.stats{display:flex;gap:6px}.stats div{min-width:58px;padding:6px 8px;border:1px solid #2a3151;border-radius:11px;background:#0c1020dd;text-align:center;backdrop-filter:blur(5px)}.stats span{display:block;font-size:7px;color:#98a2c8}.stats strong{font-size:13px;font-variant-numeric:tabular-nums}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;z-index:10;display:none;place-items:center;padding:24px;background:#050710df;text-align:center}.overlay.show{display:grid}.card{max-width:430px}.card h1{margin:0 0 10px;font-size:clamp(34px,9vw,60px)}.card p{margin:0 0 18px;color:#adb6d2;line-height:1.45}.btn{min-height:52px;padding:14px 24px;border:0;border-radius:16px;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;font-weight:900;font-size:16px}.btn:active{transform:scale(.98)}
</style>
</head>
<body>
<main class="game" id="stage">
<header class="hud"><div><div class="logo">CAOS <b>LIVE</b></div><div class="coords" id="coords">SETOR 0, 0</div></div><div class="stats"><div><span>PONTOS</span><strong id="score">0</strong></div><div><span>VIDA</span><strong id="life">100</strong></div><div><span>DISTÂNCIA</span><strong id="distance">0m</strong></div></div></header>
<canvas id="canvas"></canvas>
<section id="start" class="overlay show"><div class="card"><h1>Mapa infinito</h1><p>Explore sem bordas. Novos setores, terrenos e inimigos surgem continuamente.</p><button class="btn" id="startBtn">COMEÇAR</button></div></section>
<section id="over" class="overlay"><div class="card"><h1>Fim de jogo</h1><p id="finalText"></p><button class="btn" id="restartBtn">JOGAR NOVAMENTE</button></div></section>
</main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('canvas'),stage=document.getElementById('stage'),ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const scoreEl=document.getElementById('score'),lifeEl=document.getElementById('life'),distanceEl=document.getElementById('distance'),coordsEl=document.getElementById('coords'),startEl=document.getElementById('start'),overEl=document.getElementById('over'),finalText=document.getElementById('finalText');
const keys=Object.create(null),player={x:0,y:0,r:18,speed:270,life:100,inv:0,dir:1,moving:false,walk:0};
let W=0,H=0,dpr=1,running=false,last=0,raf=0,pointer=null,score=0,spawnTimer=0,shotTimer=0,totalDistance=0,enemies=[],bullets=[];
const MAX_ENEMIES=70,MAX_BULLETS=70,GRID=64,CHUNK=640;
function resize(){const r=stage.getBoundingClientRect();W=Math.max(320,Math.round(r.width));H=Math.max(320,Math.round(r.height));dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';draw()}
addEventListener('resize',resize,{passive:true});addEventListener('orientationchange',()=>setTimeout(resize,120),{passive:true});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k.startsWith('arrow'))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',()=>{pointer=null;for(const k in keys)keys[k]=false});
function ppos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{if(!running)return;pointer=ppos(e);try{canvas.setPointerCapture(e.pointerId)}catch{}e.preventDefault()},{passive:false});canvas.addEventListener('pointermove',e=>{if(pointer){pointer=ppos(e);e.preventDefault()}},{passive:false});const clear=()=>pointer=null;canvas.addEventListener('pointerup',clear);canvas.addEventListener('pointercancel',clear);canvas.addEventListener('lostpointercapture',clear);
function hash(x,y,s=0){let n=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1442695041);n=n^(n>>>13);n=Math.imul(n,1274126177);return((n^(n>>>16))>>>0)/4294967295}
function reset(){cancelAnimationFrame(raf);Object.assign(player,{x:0,y:0,life:100,inv:0,dir:1,moving:false,walk:0});score=0;totalDistance=0;enemies=[];bullets=[];spawnTimer=.3;shotTimer=.1;scoreEl.textContent='0';lifeEl.textContent='100';distanceEl.textContent='0m';coordsEl.textContent='SETOR 0, 0';startEl.classList.remove('show');overEl.classList.remove('show');running=true;last=performance.now();raf=requestAnimationFrame(loop)}
function spawn(){if(enemies.length>=MAX_ENEMIES)return;const a=Math.random()*Math.PI*2,dist=Math.max(W,H)*.7+Math.random()*260,elite=Math.random()<Math.min(.24,score/2400);enemies.push({x:player.x+Math.cos(a)*dist,y:player.y+Math.sin(a)*dist,r:elite?23:14,speed:(elite?50:70)+Math.random()*24,hp:elite?4:1,max:elite?4:1,dead:false})}
function shoot(){if(!enemies.length||bullets.length>=MAX_BULLETS)return;let target=null,best=Infinity;for(const e of enemies){if(e.dead)continue;const dx=e.x-player.x,dy=e.y-player.y,q=dx*dx+dy*dy;if(q<best){best=q;target=e}}if(!target)return;const a=Math.atan2(target.y-player.y,target.x-player.x);bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*520,vy:Math.sin(a)*520,r:4.5,dead:false})}
function end(){running=false;cancelAnimationFrame(raf);finalText.textContent=`Você fez ${score} pontos e percorreu ${Math.floor(totalDistance/10)} metros.`;overEl.classList.add('show')}
function update(dt){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(pointer){dx=pointer.x-W/2;dy=pointer.y-H/2;if(Math.hypot(dx,dy)<16)dx=dy=0}const len=Math.hypot(dx,dy)||1;player.moving=!!(dx||dy);if(player.moving){const mx=dx/len*player.speed*dt,my=dy/len*player.speed*dt;player.x+=mx;player.y+=my;totalDistance+=Math.hypot(mx,my);player.walk+=dt*11;if(Math.abs(dx)>.05)player.dir=dx<0?-1:1}else player.walk=0;player.inv=Math.max(0,player.inv-dt);distanceEl.textContent=Math.floor(totalDistance/10)+'m';coordsEl.textContent=`SETOR ${Math.floor(player.x/CHUNK)}, ${Math.floor(player.y/CHUNK)}`;spawnTimer-=dt;if(spawnTimer<=0){spawn();spawnTimer=Math.max(.3,.88-score/5000)}shotTimer-=dt;if(shotTimer<=0){shoot();shotTimer=.34}
for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.abs(b.x-player.x)>W||Math.abs(b.y-player.y)>H)b.dead=true}
for(const e of enemies){if(e.dead)continue;const a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;const ex=e.x-player.x,ey=e.y-player.y,rr=e.r+player.r;if(ex*ex+ey*ey<rr*rr){e.dead=true;if(player.inv<=0){player.life=Math.max(0,player.life-(e.max===4?24:12));player.inv=.25;lifeEl.textContent=player.life;if(player.life<=0){end();return}}}}
for(const b of bullets){if(b.dead)continue;for(const e of enemies){if(e.dead)continue;const dx=b.x-e.x,dy=b.y-e.y,rr=b.r+e.r;if(dx*dx+dy*dy<rr*rr){b.dead=true;e.hp--;if(e.hp<=0){e.dead=true;score+=e.max===4?40:10;scoreEl.textContent=score}break}}}bullets=bullets.filter(b=>!b.dead);enemies=enemies.filter(e=>!e.dead&&Math.abs(e.x-player.x)<W*1.5&&Math.abs(e.y-player.y)<H*1.5)}
function worldToScreen(x,y){return{x:x-player.x+W/2,y:y-player.y+H/2}}
function drawTerrain(){const minCX=Math.floor((player.x-W/2)/CHUNK)-1,maxCX=Math.floor((player.x+W/2)/CHUNK)+1,minCY=Math.floor((player.y-H/2)/CHUNK)-1,maxCY=Math.floor((player.y+H/2)/CHUNK)+1;for(let cx=minCX;cx<=maxCX;cx++)for(let cy=minCY;cy<=maxCY;cy++){const p=worldToScreen(cx*CHUNK,cy*CHUNK),biome=Math.floor(hash(cx,cy)*4),colors=['#090d1b','#0b1022','#0b1320','#100d20'];ctx.fillStyle=colors[biome];ctx.fillRect(p.x,p.y,CHUNK+1,CHUNK+1);ctx.strokeStyle='rgba(124,58,237,.12)';ctx.strokeRect(p.x,p.y,CHUNK,CHUNK);for(let i=0;i<12;i++){const rx=cx*CHUNK+hash(cx,cy,i*2)*CHUNK,ry=cy*CHUNK+hash(cx,cy,i*2+1)*CHUNK,rp=worldToScreen(rx,ry),size=3+hash(cx,cy,i+50)*12;ctx.fillStyle=biome===2?'#102a2a':'#151b36';ctx.beginPath();ctx.arc(rp.x,rp.y,size,0,Math.PI*2);ctx.fill()}}}
function drawPlayer(){const x=W/2,y=H/2,bob=player.moving?Math.sin(player.walk*2)*1.2:0,step=player.moving?Math.sin(player.walk)*3.5:0;ctx.save();ctx.translate(x,y+bob);ctx.scale(player.dir,1);
ctx.fillStyle='rgba(0,0,0,.38)';ctx.beginPath();ctx.ellipse(0,18,17,7,0,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#0d1020';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-5,9);ctx.lineTo(-7+step,20);ctx.moveTo(5,9);ctx.lineTo(7-step,20);ctx.stroke();
ctx.fillStyle='#111827';ctx.beginPath();ctx.ellipse(-7+step,22,6,3,0,0,Math.PI*2);ctx.ellipse(7-step,22,6,3,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#6d28d9';ctx.beginPath();ctx.roundRect(-12,-8,24,22,7);ctx.fill();ctx.fillStyle='#8b5cf6';ctx.beginPath();ctx.roundRect(-9,-6,18,14,5);ctx.fill();ctx.fillStyle='#f59e0b';ctx.fillRect(-10,5,20,3);
ctx.strokeStyle='#c4b5fd';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-10,-2);ctx.lineTo(-15-step*.5,8);ctx.moveTo(10,-2);ctx.lineTo(15+step*.5,8);ctx.stroke();
ctx.fillStyle='#f1c7a5';ctx.beginPath();ctx.arc(0,-17,10,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#1f2937';ctx.beginPath();ctx.arc(0,-20,10,Math.PI,Math.PI*2);ctx.lineTo(9,-17);ctx.quadraticCurveTo(4,-22,0,-18);ctx.quadraticCurveTo(-5,-22,-9,-17);ctx.closePath();ctx.fill();
ctx.fillStyle='#111827';ctx.beginPath();ctx.arc(3,-17,1.25,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#7c2d12';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-3,-13);ctx.quadraticCurveTo(0,-11.5,3,-13);ctx.stroke();
ctx.fillStyle='#0f172a';ctx.beginPath();ctx.roundRect(7,-6,9,7,2);ctx.fill();ctx.fillStyle='#22d3ee';ctx.fillRect(13,-4,5,2);ctx.restore()}
function draw(){if(!W||!H)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#0a0d1c';ctx.fillRect(0,0,W,H);drawTerrain();const ox=(((-player.x+W/2)%GRID)+GRID)%GRID,oy=(((-player.y+H/2)%GRID)+GRID)%GRID;ctx.strokeStyle='rgba(34,43,77,.45)';ctx.lineWidth=1;for(let x=ox;x<W;x+=GRID){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=oy;y<H;y+=GRID){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.fillStyle='#67e8f9';for(const b of bullets){const p=worldToScreen(b.x,b.y);ctx.beginPath();ctx.arc(p.x,p.y,b.r,0,Math.PI*2);ctx.fill()}for(const e of enemies){const p=worldToScreen(e.x,e.y);ctx.fillStyle=e.max===4?'#ef4444':'#a855f7';ctx.beginPath();ctx.arc(p.x,p.y,e.r,0,Math.PI*2);ctx.fill();if(e.max>1){ctx.fillStyle='#2a1320';ctx.fillRect(p.x-20,p.y-e.r-10,40,4);ctx.fillStyle='#fb7185';ctx.fillRect(p.x-20,p.y-e.r-10,40*(e.hp/e.max),4)}}ctx.globalAlpha=player.inv>0&&Math.floor(player.inv*30)%2?.35:1;drawPlayer();ctx.globalAlpha=1}
function loop(t){if(!running)return;const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();if(running)raf=requestAnimationFrame(loop)}document.getElementById('startBtn').onclick=reset;document.getElementById('restartBtn').onclick=reset;resize();draw();
})();
</script>
</body>
</html>
