<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070913">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Caos Live v0.5.0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070913;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;overscroll-behavior:none}.game{position:relative;width:100%;height:100%;overflow:hidden}.hud{position:fixed;z-index:5;top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}.logo{font-size:18px;font-weight:900;text-shadow:0 2px 12px #000}.logo b{color:#8b5cf6}.coords{margin-top:3px;font-size:9px;color:#7f8ab4}.version{display:inline-block;margin-top:5px;padding:3px 7px;border:1px solid #343b63;border-radius:999px;background:#0c1020cc;color:#aeb8df;font-size:8px;font-weight:800}.right{display:flex;gap:7px}.stats{display:flex;gap:5px}.stats div{min-width:54px;padding:6px;border:1px solid #2a3151;border-radius:11px;background:#0c1020dd;text-align:center}.stats span{display:block;font-size:7px;color:#98a2c8}.stats strong{font-size:13px}.pauseBtn{pointer-events:auto;width:38px;height:38px;border:1px solid #37406b;border-radius:12px;background:#0c1020e8;color:#fff;font-size:17px;font-weight:900}canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;z-index:10;display:none;place-items:center;padding:22px;background:#050710e8;text-align:center}.overlay.show{display:grid}.card{width:min(430px,100%);padding:22px;border:1px solid #2b3157;border-radius:24px;background:#0b1020f2;box-shadow:0 25px 80px #0008}.card h1{margin:0 0 9px;font-size:clamp(31px,9vw,54px)}.card p{margin:0 0 16px;color:#adb6d2;line-height:1.45}.btn{min-height:50px;padding:13px 22px;border:0;border-radius:15px;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;font-weight:900;font-size:15px}.session{margin:14px 0;padding:14px;border:1px solid #303861;border-radius:16px;background:#070b18}.session small{display:block;color:#7f8ab4;font-size:9px}.session b{display:block;margin:5px 0;font-size:26px;letter-spacing:4px}.remoteStatus{font-size:10px;color:#f59e0b}.remoteStatus.online{color:#22c55e}.pauseActions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.ghost{position:fixed;left:12px;bottom:max(10px,env(safe-area-inset-bottom));z-index:4;padding:5px 8px;border-radius:9px;background:#080c18b8;color:#7681aa;font-size:8px;pointer-events:none}
</style>
</head>
<body>
<main class="game" id="stage">
<header class="hud"><div><div class="logo">CAOS <b>LIVE</b></div><div class="coords" id="coords">SETOR 0, 0</div><div class="version">VERSÃO v0.5.0 · SOLDADO PREMIUM</div></div><div class="right"><div class="stats"><div><span>PONTOS</span><strong id="score">0</strong></div><div><span>VIDA</span><strong id="life">100</strong></div><div><span>MOBS</span><strong id="mobCount">0</strong></div></div><button class="pauseBtn" id="pauseBtn">Ⅱ</button></div></header>
<canvas id="canvas"></canvas><div class="ghost" id="connectionMini">PAINEL: DESCONECTADO</div>
<section id="start" class="overlay show"><div class="card"><h1>Mapa infinito</h1><p>Explore sem bordas. Criaturas assombradas surgem continuamente.</p><button class="btn" id="startBtn">COMEÇAR</button></div></section>
<section id="pause" class="overlay"><div class="card"><h1>Pausar né.</h1><p>Use o código para conectar o painel administrativo.</p><div class="session"><small>CÓDIGO DA SESSÃO</small><b id="roomCode">--------</b><div id="remoteStatus" class="remoteStatus">ABRINDO SALA...</div></div><div class="pauseActions"><button class="btn" id="resumeBtn">CONTINUAR</button><button class="btn" id="copyBtn">COPIAR CÓDIGO</button></div></div></section>
<section id="over" class="overlay"><div class="card"><h1>Fim de jogo</h1><p id="finalText"></p><button class="btn" id="restartBtn">JOGAR NOVAMENTE</button></div></section>
</main>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(()=>{'use strict';
const VERSION='0.5.0',SKIN_ID='soldier-premium-01',$=id=>document.getElementById(id),canvas=$('canvas'),stage=$('stage'),ctx=canvas.getContext('2d',{alpha:false});
const scoreEl=$('score'),lifeEl=$('life'),mobEl=$('mobCount'),coordsEl=$('coords'),startEl=$('start'),pauseEl=$('pause'),overEl=$('over'),finalText=$('finalText');
for(const n of['contextmenu','selectstart','dragstart','gesturestart'])document.addEventListener(n,e=>e.preventDefault(),{passive:false});
const sprite=new Image();sprite.crossOrigin='anonymous';sprite.src='https://raw.githubusercontent.com/wallissonghost-code/Game/premium-skin/assets/soldier-premium-01.png';
const keys={},player={x:0,y:0,r:20,speed:270,life:100,inv:0,moving:false,walk:0,aim:0,shotFlash:0};let W=0,H=0,dpr=1,running=false,paused=false,last=0,raf=0,pointer=null,score=0,totalDistance=0,spawnTimer=0,shotTimer=0,enemies=[],bullets=[],enemySpeed=1,freezeUntil=0,invincibleUntil=0;
const MAX_ENEMIES=120,GRID=64,CHUNK=640,types={wraith:{r:17,s:70,h:2,d:10,p:16},eye:{r:15,s:82,h:3,d:12,p:20},hound:{r:16,s:112,h:2,d:12,p:18},reaper:{r:20,s:64,h:5,d:18,p:38},abomination:{r:30,s:48,h:14,d:30,p:110}};
function resize(){const r=stage.getBoundingClientRect();W=Math.max(320,Math.round(r.width));H=Math.max(320,Math.round(r.height));dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';draw()}addEventListener('resize',resize,{passive:true});
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function ppos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.addEventListener('pointerdown',e=>{if(!running||paused)return;pointer=ppos(e);canvas.setPointerCapture?.(e.pointerId);e.preventDefault()},{passive:false});canvas.addEventListener('pointermove',e=>{if(pointer){pointer=ppos(e);e.preventDefault()}},{passive:false});for(const n of['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(n,()=>pointer=null);
function hash(x,y,s=0){let n=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1442695041);n^=n>>>13;n=Math.imul(n,1274126177);return((n^(n>>>16))>>>0)/4294967295}
function reset(){cancelAnimationFrame(raf);Object.assign(player,{x:0,y:0,life:100,inv:0,moving:false,walk:0,aim:0,shotFlash:0});score=0;totalDistance=0;enemies=[];bullets=[];enemySpeed=1;freezeUntil=invincibleUntil=0;spawnTimer=.2;shotTimer=.1;paused=false;scoreEl.textContent='0';lifeEl.textContent='100';mobEl.textContent='0';startEl.classList.remove('show');pauseEl.classList.remove('show');overEl.classList.remove('show');running=true;last=performance.now();raf=requestAnimationFrame(loop);broadcast()}
function makeEnemy(type,near=false){if(enemies.length>=MAX_ENEMIES)return;const c=types[type]||types.wraith,a=Math.random()*Math.PI*2,dist=near?180+Math.random()*180:Math.max(W,H)*.72+Math.random()*260;enemies.push({x:player.x+Math.cos(a)*dist,y:player.y+Math.sin(a)*dist,type,r:c.r,speed:c.s+Math.random()*12,hp:c.h,max:c.h,damage:c.d,points:c.p,dead:false,t:Math.random()*10,seed:Math.random()*10})}
function spawn(type){if(type)return makeEnemy(type,true);const r=Math.random();makeEnemy(r<.3?'wraith':r<.52?'eye':r<.74?'hound':r<.93?'reaper':'abomination')}function spawnMany(n,type){for(let i=0;i<Math.min(60,n);i++)spawn(type)}
function nearest(){let t=null,b=Infinity;for(const e of enemies){if(e.dead)continue;const dx=e.x-player.x,dy=e.y-player.y,q=dx*dx+dy*dy;if(q<b){b=q;t=e}}return t}
function shoot(){const t=nearest();if(!t)return;player.aim=Math.atan2(t.y-player.y,t.x-player.x);player.shotFlash=.12;bullets.push({x:player.x+Math.cos(player.aim)*42,y:player.y+Math.sin(player.aim)*42,vx:Math.cos(player.aim)*570,vy:Math.sin(player.aim)*570,r:4,dead:false})}
function setPaused(v){paused=v;pauseEl.classList.toggle('show',paused);$('pauseBtn').textContent=paused?'▶':'Ⅱ';pointer=null;broadcast()}
function end(){running=false;finalText.textContent=`Você fez ${score} pontos e percorreu ${Math.floor(totalDistance/10)} metros. Versão ${VERSION}.`;overEl.classList.add('show');broadcast()}
function command(d){if(!d||typeof d!=='object')return;const c=d.command;if(c==='pause')setPaused(true);if(c==='resume')setPaused(false);if(c==='toggle')setPaused(!paused);if(c==='heal'){player.life=Math.min(100,player.life+(+d.amount||35));lifeEl.textContent=player.life}if(c==='damage'){player.life=Math.max(0,player.life-(+d.amount||20));lifeEl.textContent=player.life;if(!player.life)end()}if(c==='spawn')spawnMany(+d.amount||10,d.mob||null);if(c==='boss')spawnMany(+d.amount||1,'abomination');if(c==='clear'){enemies=[];bullets=[]}if(c==='freeze')freezeUntil=performance.now()+(+d.seconds||8)*1000;if(c==='speed')enemySpeed=Math.max(.2,Math.min(3,+d.value||1));if(c==='invincible')invincibleUntil=performance.now()+(+d.seconds||10)*1000;if(c==='score'){score+=+d.amount||100;scoreEl.textContent=score}if(c==='restart')reset();broadcast()}
function update(dt){if(paused)return;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(pointer){dx=pointer.x-W/2;dy=pointer.y-H/2;if(Math.hypot(dx,dy)<16)dx=dy=0}const len=Math.hypot(dx,dy)||1;player.moving=!!(dx||dy);if(player.moving){const mx=dx/len*player.speed*dt,my=dy/len*player.speed*dt;player.x+=mx;player.y+=my;totalDistance+=Math.hypot(mx,my);player.walk+=dt*9}else player.walk=0;const t=nearest();if(t)player.aim=Math.atan2(t.y-player.y,t.x-player.x);player.inv=Math.max(0,player.inv-dt);player.shotFlash=Math.max(0,player.shotFlash-dt);coordsEl.textContent=`SETOR ${Math.floor(player.x/CHUNK)}, ${Math.floor(player.y/CHUNK)}`;spawnTimer-=dt;if(spawnTimer<=0){spawn();spawnTimer=Math.max(.18,.65-score/9000)}shotTimer-=dt;if(shotTimer<=0){shoot();shotTimer=.28}for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.abs(b.x-player.x)>W||Math.abs(b.y-player.y)>H)b.dead=true}const frozen=performance.now()<freezeUntil;for(const e of enemies){e.t+=dt;if(!frozen){const a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.speed*enemySpeed*dt;e.y+=Math.sin(a)*e.speed*enemySpeed*dt}const ex=e.x-player.x,ey=e.y-player.y,rr=e.r+player.r;if(ex*ex+ey*ey<rr*rr){e.dead=true;if(player.inv<=0&&performance.now()>invincibleUntil){player.life=Math.max(0,player.life-e.damage);player.inv=.3;lifeEl.textContent=player.life;if(!player.life){end();return}}}}for(const b of bullets){if(b.dead)continue;for(const e of enemies){if(e.dead)continue;const dx=b.x-e.x,dy=b.y-e.y,rr=b.r+e.r;if(dx*dx+dy*dy<rr*rr){b.dead=true;if(--e.hp<=0){e.dead=true;score+=e.points;scoreEl.textContent=score}break}}}bullets=bullets.filter(b=>!b.dead);enemies=enemies.filter(e=>!e.dead&&Math.abs(e.x-player.x)<W*1.8&&Math.abs(e.y-player.y)<H*1.8);mobEl.textContent=enemies.length}
function world(x,y){return{x:x-player.x+W/2,y:y-player.y+H/2}}function terrain(){const a=Math.floor((player.x-W/2)/CHUNK)-1,b=Math.floor((player.x+W/2)/CHUNK)+1,c=Math.floor((player.y-H/2)/CHUNK)-1,d=Math.floor((player.y+H/2)/CHUNK)+1;for(let x=a;x<=b;x++)for(let y=c;y<=d;y++){const p=world(x*CHUNK,y*CHUNK),bi=Math.floor(hash(x,y)*4),cols=['#090d1b','#0b1022','#0b1320','#100d20'];ctx.fillStyle=cols[bi];ctx.fillRect(p.x,p.y,CHUNK+1,CHUNK+1);for(let i=0;i<12;i++){const q=world(x*CHUNK+hash(x,y,i*2)*CHUNK,y*CHUNK+hash(x,y,i*2+1)*CHUNK);ctx.fillStyle=bi===2?'#102a2a':'#151b36';ctx.beginPath();ctx.arc(q.x,q.y,3+hash(x,y,i+50)*12,0,7);ctx.fill()}}}
function mob(e,p){ctx.save();ctx.translate(p.x,p.y);const f=Math.sin(e.t*3+e.seed)*2;ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(0,e.r*.8,e.r*.9,e.r*.3,0,0,7);ctx.fill();if(e.type==='wraith'){ctx.translate(0,f);ctx.shadowColor='#8b5cf6';ctx.shadowBlur=17;const g=ctx.createLinearGradient(0,-e.r,0,e.r);g.addColorStop(0,'#c4b5fd');g.addColorStop(.5,'#4c1d95');g.addColorStop(1,'#18082b00');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,-e.r);ctx.bezierCurveTo(e.r,-e.r,e.r,e.r*.3,e.r*.4,e.r);ctx.lineTo(0,e.r*.55);ctx.lineTo(-e.r*.4,e.r);ctx.bezierCurveTo(-e.r,e.r*.3,-e.r,-e.r,0,-e.r);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-6,-6,3,3);ctx.fillRect(3,-6,3,3)}else if(e.type==='eye'){ctx.shadowColor='#ef4444';ctx.shadowBlur=14;ctx.fillStyle='#1a1023';ctx.strokeStyle='#6d28d9';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,e.r,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.ellipse(0,0,e.r*.7,e.r*.43,0,0,7);ctx.fill();ctx.fillStyle='#050505';ctx.beginPath();ctx.ellipse(0,0,4,e.r*.35,0,0,7);ctx.fill()}else if(e.type==='hound'){ctx.shadowColor='#dc2626';ctx.shadowBlur=9;ctx.fillStyle='#16151d';ctx.strokeStyle='#4338ca';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,1,e.r*1.1,e.r*.65,0,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(e.r*.6,-4);ctx.lineTo(e.r*1.3,-10);ctx.lineTo(e.r,6);ctx.fill();ctx.fillStyle='#f33';ctx.beginPath();ctx.arc(e.r*.85,-4,2.5,0,7);ctx.fill()}else if(e.type==='reaper'){ctx.translate(0,f*.5);ctx.shadowColor='#06b6d4';ctx.shadowBlur=12;ctx.fillStyle='#06151a';ctx.strokeStyle='#155e75';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-e.r);ctx.bezierCurveTo(e.r,-e.r,e.r,e.r*.4,e.r*.4,e.r);ctx.lineTo(0,e.r*.55);ctx.lineTo(-e.r*.4,e.r);ctx.bezierCurveTo(-e.r,e.r*.4,-e.r,-e.r,0,-e.r);ctx.fill();ctx.stroke();ctx.fillStyle='#dbeafe';ctx.beginPath();ctx.arc(0,-5,e.r*.48,0,7);ctx.fill();ctx.fillStyle='#020617';ctx.fillRect(-7,-8,5,5);ctx.fillRect(2,-8,5,5)}else{ctx.shadowColor='#22d3ee';ctx.shadowBlur=18;ctx.fillStyle='#12313a';ctx.strokeStyle='#0f766e';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,e.r,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#dff9ff';ctx.beginPath();ctx.ellipse(0,-4,13,8,0,0,7);ctx.fill();ctx.fillStyle='#0f172a';ctx.beginPath();ctx.ellipse(0,-4,4,7,0,0,7);ctx.fill()}ctx.shadowBlur=0;if(e.hp<e.max){ctx.fillStyle='#210c15';ctx.fillRect(-e.r,-e.r-10,e.r*2,4);ctx.fillStyle='#fb7185';ctx.fillRect(-e.r,-e.r-10,e.r*2*e.hp/e.max,4)}ctx.restore()}
function drawPlayer(){const size=78,frameSize=48,row=player.shotFlash>0?2:player.moving?1:0,frame=player.shotFlash>0?3:player.moving?Math.floor(player.walk)%4:0,flip=Math.cos(player.aim)<0;ctx.save();ctx.translate(W/2,H/2+2);ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,29,26,9,0,0,7);ctx.fill();if(sprite.complete&&sprite.naturalWidth){if(flip)ctx.scale(-1,1);ctx.drawImage(sprite,frame*frameSize,row*frameSize,frameSize,frameSize,-size/2,-size/2,size,size)}else{ctx.fillStyle='#56643a';ctx.beginPath();ctx.arc(0,0,22,0,7);ctx.fill()}ctx.restore()}
function draw(){if(!W||!H)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#0a0d1c';ctx.fillRect(0,0,W,H);terrain();const ox=(((-player.x+W/2)%GRID)+GRID)%GRID,oy=(((-player.y+H/2)%GRID)+GRID)%GRID;ctx.strokeStyle='#222b4d73';for(let x=ox;x<W;x+=GRID){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=oy;y<H;y+=GRID){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.fillStyle='#67e8f9';ctx.shadowColor='#22d3ee';ctx.shadowBlur=8;for(const b of bullets){const p=world(b.x,b.y);ctx.beginPath();ctx.arc(p.x,p.y,b.r,0,7);ctx.fill()}ctx.shadowBlur=0;for(const e of enemies)mob(e,world(e.x,e.y));ctx.globalAlpha=player.inv>0&&Math.floor(player.inv*30)%2?.35:1;drawPlayer();ctx.globalAlpha=1}
function loop(t){if(!running)return;const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}
$('startBtn').onclick=reset;$('restartBtn').onclick=reset;$('pauseBtn').onclick=()=>setPaused(!paused);$('resumeBtn').onclick=()=>setPaused(false);
const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',makeCode=()=>Array.from({length:8},()=>alphabet[Math.floor(Math.random()*alphabet.length)]).join('');const params=new URLSearchParams(location.search),room=(params.get('sala')||sessionStorage.getItem('chaos-room')||makeCode()).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);sessionStorage.setItem('chaos-room',room);$('roomCode').textContent=room;$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(room);$('copyBtn').textContent='COPIADO';setTimeout(()=>$('copyBtn').textContent='COPIAR CÓDIGO',1200)}catch{prompt('Código da sessão:',room)}};
let peer,retry,connections=new Set();function status(text,on=false){$('remoteStatus').textContent=text;$('remoteStatus').classList.toggle('online',on);$('connectionMini').textContent='PAINEL: '+text;$('connectionMini').style.color=on?'#22c55e':'#7681aa'}function state(){return{type:'state',version:VERSION,skin:SKIN_ID,running,paused,health:player.life,score,mobs:enemies.length,enemySpeed,frozen:performance.now()<freezeUntil,invincible:performance.now()<invincibleUntil,room}}function broadcast(){const s=state();connections.forEach(c=>{if(c.open)c.send(s)})}function openPeer(){if(typeof Peer==='undefined'){status('PEERJS INDISPONÍVEL');return}status('ABRINDO SALA...');peer=new Peer('chaos-live-'+room.toLowerCase(),{debug:1});peer.on('open',()=>status('AGUARDANDO PAINEL'));peer.on('connection',c=>{connections.add(c);c.on('open',()=>{status('CONECTADO',true);c.send(state())});c.on('data',d=>{if(d?.type==='command')command(d);broadcast()});const close=()=>{connections.delete(c);if(!connections.size)status('AGUARDANDO PAINEL')};c.on('close',close);c.on('error',close)});peer.on('disconnected',()=>{status('RECONECTANDO...');try{peer.reconnect()}catch{}});peer.on('error',()=>{status('ERRO — RECONECTANDO');clearTimeout(retry);retry=setTimeout(()=>{try{peer.destroy()}catch{}openPeer()},2500)})}setInterval(broadcast,300);openPeer();resize();draw();
})();
</script>
</body>
</html>
