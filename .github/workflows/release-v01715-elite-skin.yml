name: Caos Live v0.17.15 Elite Skin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v01715-elite-skin.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply elite skin release
        run: node scripts/release-v01715-elite-skin.mjs
      - name: Validate JavaScript
        run: node --check src/game.js && node --check src/panel.js
      - name: Validate project
        run: node scripts/check-game.mjs
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game.js version.json index.html painel.html scripts/check-game.mjs
          git diff --cached --quiet && exit 0
          git commit -m "feat: exclusive Elite ogre skin v0.17.15"
          git push origin main
