name: Legacy Enemies v0.13.3
'on':
  push:
    paths: ['.github/workflows/legacy-enemies-v133.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore legacy mob visuals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          # Remove premium enemy sprite loaders. Player + weapon assets remain untouched.
          for chunk in [
            "const wraithSprite=new Image();let wraithReady=false;wraithSprite.onload=()=>wraithReady=true;wraithSprite.onerror=()=>wraithReady=false;wraithSprite.src='./assets/enemies/espectro.svg?v=083';\n",
            "const reaperSprite=new Image();let reaperReady=false;reaperSprite.onload=()=>reaperReady=true;reaperSprite.onerror=()=>reaperReady=false;reaperSprite.src='./assets/enemies/ceifador.svg?v=084';\n"
          ]:
            s=s.replace(chunk,'')

          # Replace only the premium branches in drawEnemy with the existing legacy procedural functions.
          start=s.index('function drawEnemy(e,p){')
          end=s.index('function drawPlayer(){', start)
          block=s[start:end]
          premium_start=block.index("if(e.type==='wraith'&&wraithReady)")
          legacy_tail=block.index("else if(e.type==='infected')", premium_start)
          block=block[:premium_start] + "if(e.type==='wraith')drawWraith(e);else if(e.type==='reaper')drawReaper(e);" + block[legacy_tail:]
          s=s[:start]+block+s[end:]

          s=s.replace('<title>Caos Live v0.13.2</title>','<title>Caos Live v0.13.3</title>')
          s=s.replace("const VERSION='0.13.2'","const VERSION='0.13.3'")
          s=s.replace('v0.13.2 · HOTFIX PLAY','v0.13.3 · MOBS CLÁSSICOS')
          p.write_text(s)
          PY

          # Remove every experimental enemy skin/sprite file. Main player and weapon assets are outside this directory.
          rm -rf assets/enemies

      - name: Sanity checks
        run: |
          test -f assets/soldier-premium-01.png
          test -f assets/weapons/assault-rifle-01.png
          ! grep -q "assets/enemies/" index.html
          grep -q "drawWraith(e)" index.html
          grep -q "drawReaper(e)" index.html
          grep -q "v0.13.3 · MOBS CLÁSSICOS" index.html

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: remove enemy skins and restore classic mobs v0.13.3'
          git pull --rebase origin main
          git push
