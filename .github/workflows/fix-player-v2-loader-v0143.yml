name: Fix Player V2 Loader v0.14.3
on:
  push:
    paths:
      - '.github/workflows/fix-player-v2-loader-v0143.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch loader and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""(async()=>{try{const [base,armed,weap,back,ammo]=await Promise.all([zipImgs('./assets/Oficial1.zip'),zipImgs('./assets/Oficial2.zip'),zipImgs('./assets/weapons/Arma3.zip'),zipImgs('./assets/weapons/Canodaarmasemfundo.zip',true),zipImgs('./assets/weapons/Municao.zip',true)]);mapPlayer16(base,playerBaseFrames);mapPlayer16(armed,playerArmedFrames);mapPlayer16(weap,playerWeaponFrames);playerBackFrames.up=back.slice(0,Math.max(1,Math.min(4,back.length)));ammoFrames=ammo;playerV2Ready=playerBaseFrames.down.length>0&&playerArmedFrames.down.length>0;weaponV2Ready=playerWeaponFrames.down.length>0;backV2Ready=playerBackFrames.up.length>0;ammoReady=ammoFrames.length>0;console.log('PLAYER V2 READY',playerV2Ready,weaponV2Ready,backV2Ready,ammoReady)}catch(e){console.warn('Player V2 fallback ativo',e)}})();"""
          new="""(async()=>{
          try{
            const base=await zipImgs('./assets/Oficial1.zip');
            mapPlayer16(base,playerBaseFrames);
            const armed=await zipImgs('./assets/Oficial2.zip');
            mapPlayer16(armed,playerArmedFrames);
            playerV2Ready=playerBaseFrames.down.length>0&&playerArmedFrames.down.length>0;
            console.log('PLAYER V2 BODY READY',playerV2Ready);
          }catch(e){console.error('PLAYER V2 BODY ERROR',e)}
          try{const weap=await zipImgs('./assets/weapons/Arma3.zip');mapPlayer16(weap,playerWeaponFrames);weaponV2Ready=playerWeaponFrames.down.length>0;console.log('ARMA3 READY',weaponV2Ready)}catch(e){console.warn('ARMA3 indisponivel',e)}
          try{const back=await zipImgs('./assets/weapons/Canodaarmasemfundo.zip',true);playerBackFrames.up=back.slice(0,Math.max(1,Math.min(4,back.length)));backV2Ready=playerBackFrames.up.length>0;console.log('CANO READY',backV2Ready)}catch(e){console.warn('Cano indisponivel',e)}
          try{ammoFrames=await zipImgs('./assets/weapons/Municao.zip',true);ammoReady=ammoFrames.length>0;console.log('MUNICAO READY',ammoReady)}catch(e){console.warn('Municao indisponivel',e)}
          })();"""
          if old not in s:
              raise SystemExit('loader antigo nao encontrado')
          s=s.replace(old,new,1)
          s=s.replace("const VERSION='0.14.2'","const VERSION='0.14.3'",1)
          s=s.replace('<title>Caos Live v0.14.1</title>','<title>Caos Live v0.14.3</title>',1)
          s=s.replace('v0.14.2 · SKIN V2 + LIVE @USERS','v0.14.3 · SKIN V2 LOADER FIX',1)
          s=s.replace('<span class="startVersion">v0.14.2</span>','<span class="startVersion">v0.14.3</span>',1)
          s=s.replace('Build · Arma3 proporcional + red dot corrigido','Build · Oficial1/2 prioritario · assets independentes',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate player V2 code
        run: |
          grep -q "PLAYER V2 BODY READY" index.html
          grep -q "const VERSION='0.14.3'" index.html
          grep -q "Oficial2.zip" index.html
          grep -q "Arma3.zip" index.html
      - name: Commit
        run: |
          git config user.name "wallissonghost-code"
          git config user.email "wallissonghost@gmail.com"
          git add index.html
          git commit -m "fix: make player v2 skin loader independent v0.14.3"
          git push origin main
