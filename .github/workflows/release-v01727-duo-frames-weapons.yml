name: Caos Live v0.17.27 Duo Frames Weapons
on:
  push:
    paths:
      - '.github/workflows/release-v01727-duo-frames-weapons.yml'
      - 'scripts/release-v01727-duo.py'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply visual parity patch
        run: python3 scripts/release-v01727-duo.py
      - name: Validate JavaScript
        run: |
          node --check src/game.js
          node --check src/duo.js
          node --check src/map-runtime.js
          node --check src/panel.js
      - name: Validate project
        run: npm run check
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.js src/duo.js src/map-runtime.js duo.html index.html painel.html map-lab.html src/panel.js src/map-lab.js version.json scripts/check-game.mjs
          git commit -m 'fix: full duo frames mobs and weapons v0.17.27'
          git push
