name: Diagnose Game Spawn User v0.13.1
'on':
  push:
    paths: ['.github/workflows/diagnose-index-spawn-v131.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect game spawn flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(); out=[]
          for needle in ["command==='spawn'","command=='spawn'","case 'spawn'","function spawn","enemies.push","owner","user","username","killer"]:
            pos=0; n=0
            while True:
              i=s.find(needle,pos)
              if i<0: break
              n+=1; out.append(f'\n-- {needle} #{n} @ {i} --\n'+s[max(0,i-700):i+1400]+'\n')
              pos=i+len(needle)
              if n>=12: break
          Path('.github/debug-index-spawn.txt').write_text(''.join(out))
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/debug-index-spawn.txt
          git commit -m 'chore: capture game spawn username handling' || exit 0
          git pull --rebase origin main
          git push
