name: Fix Reaper Walk v0.13.6
on:
  push:
    paths:
      - '.github/workflows/fix-reaper-walk-v0136.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore balanced S walk loop
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>Caos Live v0.13.5</title>','<title>Caos Live v0.13.6</title>')
          s=s.replace('v0.13.5 · CEIFADOR S CORRIGIDO','v0.13.6 · CEIFADOR PASSOS ALTERNADOS')
          s=s.replace("const VERSION='0.13.5'","const VERSION='0.13.6'")
          s=s.replace('const rogueWalkSeq=[10,11,12,13,14,13,12,11];','const rogueWalkSeq=[8,9,10,11,10,9];')
          s=s.replace("recortes_sem_fundo_CORRIGIDO.zip?v=0135","recortes_sem_fundo_CORRIGIDO.zip?v=0136")
          p.write_text(s,encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: restore alternating Reaper S walk loop" || exit 0
          git push
