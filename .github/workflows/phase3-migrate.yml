name: Caos Live Phase 3 Migration
on:
  push:
    branches: [agent/core-phase3]
permissions:
  contents: write
jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[phase3-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-phase3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/apply-phase3.mjs
      - run: npm run check
      - name: Commit generated migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game.js scripts/check-game.mjs scripts/check-architecture.mjs
          git commit -m "refactor: wire mobs and combat modules [phase3-generated]"
          git push origin HEAD:agent/core-phase3
