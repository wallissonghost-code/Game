name: Skin Test Arena v0.0.17 Hotfix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/skin-test-arena-v017-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate arena logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('skin-test-local.html')
          s=p.read_text()
          s=s.replace('v0.0.16','v0.0.17')
          marker='boot();requestAnimationFrame(loop)})();'
          code=r'''
          function arenaSpawnEnemy(){enemyHp=100;enemyX=.14+Math.random()*.72;enemyY=.18+Math.random()*.60;enemy.style.left=(enemyX*100)+'%';enemy.style.top=(enemyY*100)+'%';enemy.style.display='flex';enemyHpBar.style.width='100%'}
          function arenaAim(){if(enemyHp<=0)return;const dx=enemyX-x,dy=enemyY-y;if(Math.abs(dx)>Math.abs(dy)*1.05)dir=dx>0?'right':'left';else dir=dy>0?'down':'up';show()}
          function arenaMuzzle(){const rr=arena.getBoundingClientRect(),ar=actor.getBoundingClientRect(),wr=weapon.getBoundingClientRect();let sx=wr.left-rr.left+wr.width/2,sy=wr.top-rr.top+wr.height/2;if(dir==='right')sx=wr.right-rr.left-2;if(dir==='left')sx=wr.left-rr.left+2;if(dir==='down')sy=wr.bottom-rr.top-2;if(dir==='up')sy=wr.top-rr.top+2;return [sx,sy]}
          function arenaShoot(){if(!ready||!armed||enemyHp<=0)return;arenaAim();const rr=arena.getBoundingClientRect(),[sx,sy]=arenaMuzzle(),tx=enemyX*rr.width,ty=enemyY*rr.height,dx=tx-sx,dy=ty-sy,d=Math.hypot(dx,dy)||1;const b=document.createElement('div');b.style.cssText='position:absolute;width:9px;height:4px;border-radius:4px;background:#fff3a3;box-shadow:0 0 9px #f59e0b;z-index:14;pointer-events:none;left:'+sx+'px;top:'+sy+'px;transform:translate(-50%,-50%)';arena.appendChild(b);muzzle.classList.add('on');setTimeout(()=>muzzle.classList.remove('on'),55);weapon.classList.remove('fire');void weapon.offsetWidth;weapon.classList.add('fire');const dur=Math.max(90,Math.min(360,d/1.8));b.animate([{left:sx+'px',top:sy+'px'},{left:tx+'px',top:ty+'px'}],{duration:dur,easing:'linear'}).onfinish=()=>{b.remove();if(enemyHp<=0)return;enemyHp=Math.max(0,enemyHp-25);enemyHpBar.style.width=enemyHp+'%';enemy.animate([{filter:'brightness(2)'},{filter:'brightness(1)'}],{duration:100});if(enemyHp<=0){enemy.style.display='none';setTimeout(arenaSpawnEnemy,450)}}}
          setInterval(arenaShoot,320);setTimeout(arenaSpawnEnemy,250);
          '''
          if marker not in s:
              raise SystemExit('marker not found')
          s=s.replace(marker,code+'\n'+marker,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skin-test-local.html
          git commit -m "feat: activate target auto-fire arena v0.0.17" || exit 0
          git push
