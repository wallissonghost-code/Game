name: Fix Asset And Shot CI
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-asset-and-shot-ci.mjs'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/fix-asset-and-shot-ci.mjs
      - run: npm run check
      - run: |
          git config user.name "caos-live-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/game.js
          git commit -m "fix: repair player fallback and instrument shots"
          git push origin HEAD:main
