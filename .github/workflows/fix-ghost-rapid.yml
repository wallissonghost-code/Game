name: Fix Ghost Rapid Scenario

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci: isolate Ghost rapid-fire scenario'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolate Rapid test and diagnose stale aim recovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/gameplay-bot.mjs')
          s=p.read_text()
          old="""  await cmd({command:'clear'});await cmd({command:'autofire',value:false});for(let i=0;i<16;i++)await spawnTarget(120+(i%5)*10);await cmd({command:'autofire',value:true});
  const base0=await snap();await sleep(2200);const base1=await snap();const baseRate=base1.test.shotsFired-base0.test.shotsFired;
  await cmd({command:'skilltest',skill:'rapid',level:5});for(let i=0;i<16;i++)await spawnTarget(120+(i%5)*10);
  const rapid0=await snap();await sleep(2200);const rapid1=await snap();const rapidRate=rapid1.test.shotsFired-rapid0.test.shotsFired;
  assert(rapidRate>baseRate*1.20,`Rapid did not increase fire cadence enough: base=${baseRate}, rapid=${rapidRate}`);
"""
          new="""  // RAPID: compare two fully isolated scenarios so stale mobs/timers do not contaminate cadence.
  await cmd({command:'skillreset'});await cmd({command:'clear'});await cmd({command:'autofire',value:false});
  for(let i=0;i<24;i++)await spawnTarget(115+(i%6)*9);
  await cmd({command:'autofire',value:true});await sleep(250);
  const base0=await snap();await sleep(2200);const base1=await snap();const baseRate=base1.test.shotsFired-base0.test.shotsFired;

  await cmd({command:'autofire',value:false});await cmd({command:'skillreset'});await cmd({command:'clear'});await sleep(120);
  await cmd({command:'skilltest',skill:'rapid',level:5});
  for(let i=0;i<24;i++)await spawnTarget(115+(i%6)*9);
  await cmd({command:'autofire',value:true});await sleep(250);
  const rapid0=await snap();await sleep(2200);let rapid1=await snap();let rapidRate=rapid1.test.shotsFired-rapid0.test.shotsFired;
  if(rapidRate===0){
    const beforeMove=rapid1.test.shotsFired,rx=rapid1.test.playerX,ry=rapid1.test.playerY;
    await page.keyboard.down('d');await sleep(220);await page.keyboard.up('d');await sleep(120);
    await sleep(900);rapid1=await snap();
    const afterMove=rapid1.test.shotsFired-beforeMove;
    if(afterMove>0){
      const movedPx=Math.hypot(rapid1.test.playerX-rx,rapid1.test.playerY-ry);
      throw Error(`[${name}] GHOST REPRODUCED STALE AIM DURING RAPID: rapid produced 0 shots while stationary, movement ${movedPx.toFixed(1)}px restored ${afterMove} shot(s); base=${baseRate}`);
    }
  }
  assert(baseRate>0,`baseline cadence scenario produced no shots: base=${baseRate}`);
  assert(rapidRate>baseRate*1.20,`Rapid did not increase fire cadence enough after isolated reset: base=${baseRate}, rapid=${rapidRate}`);
"""
          if old not in s:
              raise SystemExit('Rapid block not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/fix-ghost-rapid.yml
          git config user.name "Ghost QA"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/gameplay-bot.mjs .github/workflows/fix-ghost-rapid.yml
          git commit -m "test: isolate Rapid cadence and probe movement recovery"
          git push
