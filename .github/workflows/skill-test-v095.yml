name: Skill test admin v0.9.5
on:
  push:
    paths:
      - '.github/workflows/skill-test-v095.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply fixed skill test patch
        run: python scripts/patch-skill-test-v095.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud/connector-server.mjs version.json
          git diff --cached --quiet || git commit -m "feat: admin skill test console v0.9.5"
          git push
