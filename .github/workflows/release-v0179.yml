name: Release Caos Live v0.17.9
on:
  push:
    paths:
      - '.github/workflows/release-v0179.yml'
permissions:
  contents: write
jobs:
  repair-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch v0.17.9
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8')

          # Version source of truth.
          write('version.json', json.dumps({
              'version':'0.17.9',
              'build':'colossus-direction-admin-pro-ci-fix'
          }, ensure_ascii=False, indent=2) + '\n')

          # Game: version, cache bust, armor reset and verified Colossus vertical orientation.
          p='src/game.js'; s=read(p)
          s,n=re.subn(r"const VERSION='\d+\.\d+\.\d+'", "const VERSION='0.17.9'", s, count=1)
          assert n==1, 'VERSION marker not found in game.js'
          s=s.replace("cacheTag='0174'", "cacheTag='0179'")
          s=s.replace("loadDirectPngSequence('./assets/player',32,'0174')", "loadDirectPngSequence('./assets/player',32,'0179')")
          s=s.replace("loadNamedPngSequence('./assets/player-armed','Posearma',32,'0174')", "loadNamedPngSequence('./assets/player-armed','Posearma',32,'0179')")
          s=s.replace("loadDirectPngSequence('./assets/weapons',32,'0174')", "loadDirectPngSequence('./assets/weapons',32,'0179')")
          s=s.replace("loadDirectPngSequence('./assets/mobs',32,'0174')", "loadDirectPngSequence('./assets/mobs',32,'0179')")
          s=s.replace("path+'?v=0158'", "path+'?v=0179'")
          old="damage:2});for(const k in skillLv)skillLv[k]=0;"
          new="damage:2,armorReduction:0});for(const k in skillLv)skillLv[k]=0;"
          assert old in s or new in s, 'reset player marker not found'
          s=s.replace(old,new)
          old="let dir=e.facing||'down';const arr=pack[dir]||pack.down||[];"
          new="let dir=e.facing||'down';if(e.type==='colossus'){if(dir==='up')dir='down';else if(dir==='down')dir='up'}const arr=pack[dir]||pack.down||[];"
          assert old in s or new in s, 'boss direction marker not found'
          s=s.replace(old,new)
          write(p,s)

          # Game HTML: force cache refresh and expose the correct build to mobile users.
          p='index.html'; s=read(p)
          s=re.sub(r'<title>Caos Live v\d+\.\d+\.\d+</title>','<title>Caos Live v0.17.9</title>',s)
          s=re.sub(r'<div class="version">v\d+\.\d+\.\d+ · [^<]+</div>','<div class="version">v0.17.9 · BOSS + ADMIN PRO</div>',s)
          s=re.sub(r'<span class="startVersion">v\d+\.\d+\.\d+</span>','<span class="startVersion">v0.17.9</span>',s)
          s=re.sub(r'src="src/game\.js\?v=\d+"','src="src/game.js?v=0179"',s)
          write(p,s)

          # Panel HTML was already redesigned; guarantee release cache tags/version.
          p='painel.html'; s=read(p)
          s=re.sub(r'<title>Caos Admin v\d+\.\d+\.\d+</title>','<title>Caos Admin v0.17.9</title>',s)
          s=re.sub(r'<span class="topVersion">v\d+\.\d+\.\d+</span>','<span class="topVersion">v0.17.9</span>',s)
          s=re.sub(r'src/panel\.js\?v=\d+','src/panel.js?v=0179',s)
          s=re.sub(r'src/styles/panel\.css\?v=\d+','src/styles/panel.css?v=0179',s)
          write(p,s)

          # The Cloud server must serve the native panel as-is. Remove legacy runtime HTML mutation.
          p='cloud/connector-server.mjs'; s=read(p)
          start=s.find('function patchAdminHtml(html){')
          end=s.find('\n\nfunction serveFile', start)
          assert start!=-1 and end!=-1, 'patchAdminHtml block not found'
          s=s[:start] + 'function patchAdminHtml(html){return patchSharedVersion(html)}' + s[end:]
          write(p,s)

          # Permanent CI: validate the assets that are actually used now (direct PNG frames).
          checker="""import fs from 'node:fs';
          const fail=m=>{console.error('FAIL:',m);process.exitCode=1};
          const ok=m=>console.log('OK:',m);
          const read=p=>fs.readFileSync(p,'utf8');
          const gameHtml=read('index.html'),panelHtml=read('painel.html'),game=read('src/game.js'),panel=read('src/panel.js');
          const version=JSON.parse(read('version.json')).version;
          if(!game.includes(`const VERSION='${version}'`)) fail('VERSION do jogo divergente'); else ok('versao sincronizada '+version);
          if(!gameHtml.includes(`v${version}`)) fail('HTML do jogo sem versao atual'); else ok('HTML do jogo versionado');
          if(!panelHtml.includes(`v${version}`)) fail('Painel sem versao atual'); else ok('painel versionado');
          if(!gameHtml.includes('src/game.js?v=0179')) fail('cache tag do game.js divergente'); else ok('cache tag game.js');
          if(!panelHtml.includes('src/panel.js?v=0179')) fail('cache tag do panel.js divergente'); else ok('cache tag panel.js');
          if(!game.includes("startButton.onclick=()=>reset()")) fail('handler do PLAY ausente'); else ok('handler do PLAY');
          if(!game.includes("e.type==='colossus'")) fail('correcao vertical do Colosso ausente'); else ok('direcao vertical Colosso protegida');
          if(!game.includes('damage:2,armorReduction:0')) fail('reset da Armadura ausente'); else ok('reset de Armadura');
          for(let i=1;i<=32;i++){
            const n=String(i).padStart(3,'0');
            for(const dir of ['assets/player','assets/mobs','assets/weapons']){
              const f=`${dir}/frame_${n}.png`; if(!fs.existsSync(f)) fail('asset ausente '+f);
            }
            const armed=`assets/player-armed/Posearma${i}.png`; if(!fs.existsSync(armed)) fail('asset ausente '+armed);
          }
          for(const f of ['assets/bosses/Ogroboss1.zip','assets/bosses/Ogro2.0Boss.zip']) fs.existsSync(f)?ok(f):fail('asset ausente '+f);
          const required=['room','connect','status','net','cloudConnect','tiktokConnect','liveEnabled','health','level','xp','fpsState','mobs','kills','elapsed','wave','score','eliteCount','corruptedCount','bossCount','gameState','autoState','perfState','autoModeToggle','hordeModeToggle','autoFireModeToggle','fpsModeToggle','skillTestSelect','skillTestLevel','skillApply','skillAll','skillReset','skillMax','mobTier','mobType','mobAmount','spawn','spawnElite','spawnCorrupted','log'];
          for(const id of required) if(!panelHtml.includes(`id="${id}"`)) fail('ID do painel ausente: '+id);
          const cloud=read('cloud/connector-server.mjs');
          if(!cloud.includes('function patchGameHtml(html){return patchSharedVersion(html)}')) fail('Cloud pode mutar gameplay'); else ok('Cloud nao muta gameplay');
          if(!cloud.includes('function patchAdminHtml(html){return patchSharedVersion(html)}')) fail('Cloud ainda muta painel'); else ok('Painel nativo sem injecao legada');
          if(process.exitCode) process.exit(process.exitCode);
          """
          write('scripts/check-game.mjs', checker)
          PY
      - name: Syntax check
        run: |
          node --check src/game.js
          node --check src/panel.js
          node --check cloud/connector-server.mjs
      - name: Validate project
        run: node scripts/check-game.mjs
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html painel.html version.json src/game.js scripts/check-game.mjs cloud/connector-server.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: release v0.17.9 boss direction admin pro and CI"
          git push
