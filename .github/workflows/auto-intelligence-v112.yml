name: Auto Intelligence v0.11.2
on:
  push:
    paths:
      - '.github/workflows/auto-intelligence-v112.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch smart auto mode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('index.html')
          s=p.read_text()
          original=s
          s=s.replace('<title>Caos Live v0.11.1</title>','<title>Caos Live v0.11.2</title>')
          s=s.replace('<div class="version">v0.11.1 · PERFORMANCE</div>','<div class="version">v0.11.2 · AUTO INTELIGENTE</div>')
          s=s.replace("const VERSION='0.11.1'","const VERSION='0.11.2'")

          marker="const box=$('skillChoices');box.innerHTML='';"
          inject="""if(autoMode){const scoreAuto=x=>{const id=x.id,cur=skillLv[id]||0;if(id==='phoenix')return phoenixConsumed?-999:120;if(id==='medic')return player.life/player.maxLife<.55?110:72;if(id==='regen')return player.life/player.maxLife<.7?92:68;if(id==='arc')return 88-cur*2;if(id==='flash')return 84-cur*2;if(id==='rapid')return 80-cur*2;if(id==='speed')return 72-cur*2;if(id==='blood')return 65-cur;if(id==='xp')return level<12?78:52;return 50};pick.sort((a,b)=>scoreAuto(b)-scoreAuto(a));const s=pick[0],cur=skillLv[s.id],next=s.id==='phoenix'?1:Math.min(5,cur+1);skillLv[s.id]=next;s.apply(next);choosing=false;toast('🤖 AUTO · '+s.n.toUpperCase()+' · LV '+next);last=performance.now();ui();broadcast();return}const box=$('skillChoices');box.innerHTML='';"""
          if marker not in s: raise SystemExit('skill marker missing')
          s=s.replace(marker,inject,1)

          pattern=r"function autoVector\(dt\)\{.*?\}function update\(dt\)\{"
          repl="""function autoVector(dt){let nearestMob=null,nearestDist=Infinity;for(const e of enemies){if(e.dead)continue;const d=Math.hypot(player.x-e.x,player.y-e.y);if(d<nearestDist){nearestDist=d;nearestMob=e}}const threatRange=Math.max(300,Math.min(520,Math.max(W,H)*.58));if(!nearestMob||nearestDist>threatRange)return{x:0,y:0};let vx=0,vy=0;for(const e of enemies){if(e.dead)continue;const dx=player.x-e.x,dy=player.y-e.y,dist=Math.hypot(dx,dy)||1;const safe=(e.max>=100?235:145)+e.r;if(dist<safe){const force=Math.max(.15,(safe-dist)/safe)*(e.max>=100?5.2:3.1);vx+=dx/dist*force;vy+=dy/dist*force}}if(Math.abs(vx)<.001&&Math.abs(vy)<.001){const dx=player.x-nearestMob.x,dy=player.y-nearestMob.y,d=nearestDist||1;if(nearestDist<220){vx=dx/d;vy=dy/d}else return{x:0,y:0}}const n=Math.hypot(vx,vy)||1;return{x:vx/n,y:vy/n}}function update(dt){"""
          s2,n=re.subn(pattern,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('autoVector marker missing')
          s=s2

          p.write_text(s)
          Path('version.json').write_text(json.dumps({
            'version':'0.11.2','label':'v0.11.2','releasedAt':'2026-08-08T16:10:00Z','build':'smart-auto-player',
            'notes':[
              'Modo Automático escolhe skills sozinho ao subir de level',
              'Escolha automática usa prioridade contextual de sobrevivência e dano',
              'Sem ameaça próxima o personagem fica parado',
              'Com mobs próximos o personagem recua e mantém distância segura',
              'Bosses recebem distância de segurança maior no modo automático'
            ]
          },ensure_ascii=False,indent=2)+'\n')
          ap=Path('painel.html')
          if ap.exists():
            a=ap.read_text().replace('Caos Admin v0.11.1','Caos Admin v0.11.2').replace('v0.11.1 ·','v0.11.2 ·')
            ap.write_text(a)
          if s==original: raise SystemExit('no changes')
          PY
      - name: Commit smart auto mode
        run: |
          git config user.name "wallissonghost-code"
          git config user.email "wallissonghost@gmail.com"
          git add index.html painel.html version.json
          git commit -m "feat: smart human-like auto mode v0.11.2" || exit 0
          git push
