name: Hotfix Play v0.13.2
'on':
  push:
    paths: ['.github/workflows/hotfix-play-v132.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last known playable index
        run: |
          git show ebb56300293fe4e9141dd8f3dc42174707528606:index.html > index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace('<title>Caos Live v0.13.0</title>','<title>Caos Live v0.13.2</title>')
          s=s.replace("const VERSION='0.13.0'","const VERSION='0.13.2'")
          s=s.replace('v0.13.0 · PLAYER SEM GIRO','v0.13.2 · HOTFIX PLAY')
          p.write_text(s)
          PY
      - name: Commit hotfix
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m 'hotfix: restore playable game v0.13.2'
          git pull --rebase origin main
          git push