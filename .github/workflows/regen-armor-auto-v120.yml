name: Regen Armor Auto v0.12.0
on:
  push:
    paths:
      - '.github/workflows/regen-armor-auto-v120.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game and admin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s=s.replace('Caos Live v0.11.9','Caos Live v0.12.0').replace('v0.11.9 · AUTO SUAVE','v0.12.0 · REGEN + ARMADURA').replace("const VERSION='0.11.9'","const VERSION='0.12.0'")
          s=s.replace('autoMoveX=0,autoMoveY=0,autoDecisionUntil=0;', 'autoMoveX=0,autoMoveY=0,autoDecisionUntil=0,lastDamageAt=0,regenStage=0;')
          s=s.replace('arc:0,phoenix:0};', 'arc:0,phoenix:0,armor:0};')
          s=s.replace('bloodHeal:0,damage:2};', 'bloodHeal:0,damage:2,armorReduction:0};')
          old="{id:'regen',n:'Regeneração',i:'💚',r:'rare',desc:l=>`Regenera ${(l*.5).toFixed(1).replace('.',',')} HP/s.`,apply:l=>player.regen=l*.5}"
          new="{id:'regen',n:'Regeneração',i:'💚',r:'rare',desc:l=>`Regen progressiva: ${[0,.4,.6,.8,1,1.2][l]} HP/s base; acelera após 3s, 6s e 10s sem sofrer dano.`,apply:l=>player.regen=[0,.4,.6,.8,1,1.2][l]},{id:'armor',n:'Armadura',i:'🛡️',r:'rare',desc:l=>`${['','Bronze','Prata','Ouro','Diamante'][l]} · reduz ${[0,5,9,13,18][l]}% do dano recebido por criaturas.`,apply:l=>player.armorReduction=[0,.05,.09,.13,.18][l]}"
          if old not in s: raise SystemExit('regen skill marker missing')
          s=s.replace(old,new)
          # Progressive regen: replace direct regen tick wherever present.
          pats=[r"if\(player\.regen>0&&player\.life<player\.maxLife\)player\.life=Math\.min\(player\.maxLife,player\.life\+player\.regen\*dt\);",r"if\(player\.regen&&player\.life<player\.maxLife\)player\.life=Math\.min\(player\.maxLife,player\.life\+player\.regen\*dt\);"]
          repl="if(player.regen>0&&player.life<player.maxLife){const safe=(performance.now()-lastDamageAt)/1000;if(safe>=1){const lv=skillLv.regen;let rate=player.regen;if(safe>=10)rate=[0,1,1.5,2,2.5,3.5][lv];else if(safe>=6)rate=[0,.8,1.2,1.6,2,2.5][lv];else if(safe>=3)rate=[0,.6,.9,1.2,1.5,1.8][lv];regenStage=safe>=10?3:safe>=6?2:safe>=3?1:0;player.life=Math.min(player.maxLife,player.life+rate*dt)}else regenStage=0;}"
          changed=False
          for pat in pats:
            ns,n=re.subn(pat,repl,s,count=1)
            if n: s=ns;changed=True;break
          if not changed: raise SystemExit('regen tick marker missing')
          # Damage application: armor + damage timestamp. Find player.life decrement from enemy damage.
          pat=r"player\.life-=([^;]+);"
          def dmg(m):
            expr=m.group(1)
            if 'e.d' in expr or 'dmg' in expr or 'damage' in expr:
              return "lastDamageAt=performance.now();player.life-=Math.max(1,("+expr+")*(1-player.armorReduction));"
            return m.group(0)
          s,n=re.subn(pat,dmg,s,count=1)
          if not n: raise SystemExit('damage marker missing')
          # Auto movement: replace zero/stop branch so approaching mobs cause gentle preventive retreat.
          marker="if(!near.length){autoMoveX=autoMoveY=0;return{x:0,y:0}}"
          if marker in s:
            s=s.replace(marker,"if(!near.length){const approaching=enemies.filter(e=>!e.dead&&Math.hypot(e.x-player.x,e.y-player.y)<520);if(!approaching.length){autoMoveX=autoMoveY=0;return{x:0,y:0}}let ax=0,ay=0;for(const e of approaching){const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1,w=Math.max(0,(520-d)/520);ax+=dx/d*w;ay+=dy/d*w}const al=Math.hypot(ax,ay)||1;autoMoveX=autoMoveX*.82+(ax/al)*.18;autoMoveY=autoMoveY*.82+(ay/al)*.18;return{x:autoMoveX*.42,y:autoMoveY*.42}}")
          else:
            # robustly alter common safe-stop return in autoVector
            s,n2=re.subn(r"if\(!threats?\.length\)\{?autoMoveX=0;autoMoveY=0;return\{x:0,y:0\};?\}?", "if(!threats.length){const approaching=enemies.filter(e=>!e.dead&&Math.hypot(e.x-player.x,e.y-player.y)<520);if(!approaching.length){autoMoveX=autoMoveY=0;return{x:0,y:0}}let ax=0,ay=0;for(const e of approaching){const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1,w=(520-d)/520;ax+=dx/d*w;ay+=dy/d*w}const al=Math.hypot(ax,ay)||1;autoMoveX=autoMoveX*.82+(ax/al)*.18;autoMoveY=autoMoveY*.82+(ay/al)*.18;return{x:autoMoveX*.42,y:autoMoveY*.42}}", s, count=1)
          p.write_text(s)

          q=Path('painel.html'); a=q.read_text()
          a=a.replace('Caos Admin v0.11.9','Caos Admin v0.12.0').replace('v0.11.7</span>','v0.12.0</span>').replace('index.html?v=116','index.html?v=120')
          # Add armor to skill test select if identifiable.
          if 'value="armor"' not in a:
            for anchor in ['<option value="regen">Regeneração</option>','<option value="phoenix">Fênix</option>']:
              if anchor in a:
                a=a.replace(anchor,anchor+'<option value="armor">Armadura</option>',1);break
          q.write_text(a)
          PY
      - name: Validate
        run: |
          grep -q "v0.12.0" index.html
          grep -q "id:'armor'" index.html
          grep -q "3.5" index.html
          grep -q "armorReduction" index.html
          grep -q "v0.12.0" painel.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html painel.html
          git commit -m "feat: v0.12.0 progressive regen armor and predictive auto" || exit 0
          git push
