name: Skin Test Outraarma v0.0.9
'on':
  push:
    paths: ['.github/workflows/skin-test-outraarma-v009.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch skin test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('skin-test-local.html')
          s=p.read_text()
          s=s.replace('v0.0.8','v0.0.9')
          s=s.replace('recorte-split.zip','Outraarma.zip')
          s=s.replace('pivô fixo e arma normalizada','Outraarma sincronizada')
          s=s.replace("const cfg={down:{l:52,t:53,w:60,h:30},up:{l:49,t:46,w:56,h:28},right:{l:57,t:50,w:64,h:28},left:{l:43,t:50,w:64,h:28}}[dir]", "const cfg={down:{l:52,t:52,w:78,h:40},up:{l:50,t:45,w:72,h:36},right:{l:58,t:49,w:82,h:36},left:{l:42,t:49,w:82,h:36}}[dir]")
          s=s.replace("muzzle.style.left=(dir==='left'?18:dir==='right'?82:dir==='up'?48:58)+'%'", "muzzle.style.left=(dir==='left'?15:dir==='right'?85:dir==='up'?50:60)+'%'")
          s=s.replace("muzzle.style.top=(dir==='up'?35:dir==='down'?60:50)+'%'", "muzzle.style.top=(dir==='up'?34:dir==='down'?58:49)+'%'")
          s=s.replace("status.textContent=armed?'MODO ARMADO · OFICIAL2 + ARMA NORMALIZADA':'MODO SEM ARMA · OFICIAL1'", "status.textContent=armed?'MODO ARMADO · OFICIAL2 + OUTRAARMA':'MODO SEM ARMA · OFICIAL1'")
          s=s.replace("status.textContent='TESTE PRONTO · v0.0.9 · PIVÔ ESTÁVEL'", "status.textContent='TESTE PRONTO · v0.0.9 · OUTRAARMA SINCRONIZADA'")
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add skin-test-local.html
          git diff --cached --quiet && exit 0
          git commit -m 'test: use Outraarma.zip and sync weapon frames v0.0.9'
          git pull --rebase origin main
          git push
