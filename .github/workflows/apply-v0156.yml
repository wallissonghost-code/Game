name: Apply v0.15.6
on:
  push:
    paths:
      - '.github/workflows/apply-v0156.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_v0156_damage_numbers.py
      - run: node --check src/game.js
      - run: |
          git config user.name wallissonghost-code
          git config user.email wallissonghost@gmail.com
          git add src/game.js index.html version.json
          git commit -m 'fix: restore floating damage numbers v0.15.6'
          git pull --rebase origin main
          git push origin main
