name: Horde AI v0.14.6
on:
  push:
    paths: ['.github/workflows/horde-engine-ai-v0146.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch staggered AI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          start="if(!frozen){const dxp=player.x-e.x,dyp=player.y-e.y,distp=Math.hypot(dxp,dyp)||1,baseA=Math.atan2(dyp,dxp);"
          marker="}{const hitDist="
          a=s.find(start)
          if a<0: raise SystemExit('AI start not found')
          b=s.find(marker,a)
          if b<0: raise SystemExit('attack marker not found')
          new="if(!frozen){const dxp=player.x-e.x,dyp=player.y-e.y,dist2=dxp*dxp+dyp*dyp,near2=420*420,stride=dist2<near2?1:(perfMode>=2?4:perfMode===1?3:2);if(!e.mvx||((frameSeq+(e.aiPhase||0))%stride===0)){const distp=Math.sqrt(dist2)||1,baseA=Math.atan2(dyp,dxp);let steer=baseA;if(e.type==='crawler')steer+=Math.sin(e.t*7+e.seed)*.6;const crowdRadius=player.r+e.r+26,approachRadius=crowdRadius+74;if(distp<approachRadius){const slot=((e.seed*1.618)%1)*Math.PI*2,tx=player.x+Math.cos(slot)*crowdRadius,ty=player.y+Math.sin(slot)*crowdRadius;steer=Math.atan2(ty-e.y,tx-e.x);if(distp<crowdRadius*.78)steer=Math.atan2(e.y-player.y,e.x-player.x)}e.mvx=Math.cos(steer);e.mvy=Math.sin(steer);e.speedMul=distp<crowdRadius*1.15?.72:1;e.facing=Math.abs(e.mvx)>Math.abs(e.mvy)?(e.mvx>0?'right':'left'):(e.mvy>0?'down':'up')}e.x+=e.mvx*e.speed*enemySpeed*(1+level*.015)*dt*(e.speedMul||1);e.y+=e.mvy*e.speed*enemySpeed*(1+level*.015)*dt*(e.speedMul||1);}" 
          s=s[:a]+new+s[b:]
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name wallissonghost-code
          git config user.email wallissonghost@gmail.com
          git add index.html
          git commit -m "perf: stagger distant mob AI for horde engine v0.14.6"
          git pull --rebase origin main
          git push origin main
