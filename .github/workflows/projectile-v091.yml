name: Projectile visual v0.9.1

on:
  push:
    paths:
      - '.github/workflows/projectile-v091.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace blue orb with directional projectile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p=Path('index.html')
          s=p.read_text()
          old="}else{const p=world(b.x,b.y);ctx.fillStyle='#67e8f9';ctx.beginPath();ctx.arc(p.x,p.y,b.r,0,7);ctx.fill()}"
          new="""}else{const p=world(b.x,b.y),a=Math.atan2(b.vy,b.vx);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(a);const trail=ctx.createLinearGradient(-22,0,5,0);trail.addColorStop(0,'rgba(34,211,238,0)');trail.addColorStop(.55,'rgba(34,211,238,.22)');trail.addColorStop(1,'rgba(125,211,252,.8)');ctx.fillStyle=trail;ctx.beginPath();ctx.moveTo(-22,-2.2);ctx.lineTo(2,-3.5);ctx.lineTo(5,0);ctx.lineTo(2,3.5);ctx.lineTo(-22,2.2);ctx.closePath();ctx.fill();ctx.shadowColor='#38bdf8';ctx.shadowBlur=10;ctx.fillStyle='#e0f2fe';ctx.beginPath();ctx.roundRect(-2,-3.2,15,6.4,3);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(13,-3.2);ctx.lineTo(20,0);ctx.lineTo(13,3.2);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.restore()}"""
          if old not in s:
              raise SystemExit('old bullet renderer not found')
          s=s.replace(old,new,1)
          s=s.replace('VERSÃO v0.9.0 · CENÁRIO LIMPO','VERSÃO v0.9.1 · PROJÉTEIS + CENÁRIO LIMPO')
          p.write_text(s)

          vp=Path('version.json')
          v=json.loads(vp.read_text())
          v['version']='0.9.1'
          v['label']='v0.9.1'
          v['releasedAt']='2026-08-07T16:06:00-03:00'
          v['build']='directional-projectiles-clean-terrain'
          v['notes']=[
            'Troca bolinha azul por projétil direcional',
            'Projétil com corpo, ponta luminosa e rastro curto',
            'Mantém cenário limpo sem formas geométricas seguidoras',
            'Renderização leve em canvas para preservar FPS'
          ]
          vp.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit patch
        run: |
          git config user.name "wallissonghost-code"
          git config user.email "wallissonghost@gmail.com"
          git add index.html version.json
          git commit -m "feat: directional projectiles v0.9.1" || exit 0
          git push
