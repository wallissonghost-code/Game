name: Player Professional Rig v0.12.6
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/player-professional-rig-v126.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch player rig
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          start=s.index('function drawPlayer(){')
          end=s.index('function drawBullets()', start)
          new=r'''function drawPlayer(){
  ctx.save();ctx.translate(W/2,H/2);
  ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(0,25,23,7,0,0,Math.PI*2);ctx.fill();
  const aim=player.aim||0;
  const bob=player.moving?Math.sin(player.walk*1.8)*1.3:0;
  ctx.save();ctx.translate(0,bob);
  ctx.rotate(aim+Math.PI/2);
  // pernas
  const step=player.moving?Math.sin(player.walk*2.2)*2.2:0;
  ctx.fillStyle='#202719';ctx.fillRect(-12,-1+step,8,19);ctx.fillRect(4,-1-step,8,19);
  ctx.fillStyle='#11150e';ctx.fillRect(-13,14+step,10,7);ctx.fillRect(3,14-step,10,7);
  // mochila atrás do tronco
  ctx.fillStyle='#303923';ctx.fillRect(-13,-15,26,8);
  ctx.fillStyle='#1f2618';ctx.fillRect(-10,-14,20,5);
  // tronco/colete
  ctx.fillStyle='#4b5632';ctx.fillRect(-15,-9,30,24);
  ctx.fillStyle='#343d27';ctx.fillRect(-11,-7,22,19);
  ctx.fillStyle='#677044';ctx.fillRect(-9,-5,18,5);
  // cabeça/capacete
  ctx.fillStyle='#b89a69';ctx.fillRect(-9,-24,18,10);
  ctx.fillStyle='#56613a';ctx.beginPath();ctx.arc(0,-25,14,Math.PI,0);ctx.fill();ctx.fillRect(-14,-25,28,8);
  ctx.fillStyle='#181b14';ctx.fillRect(-10,-20,20,5);
  // ombros
  ctx.fillStyle='#59643d';ctx.fillRect(-20,-7,7,11);ctx.fillRect(13,-7,7,11);
  // arma e braços: sempre parte do mesmo rig rotacionado
  const recoil=player.shotFlash>0?-2:0;
  const gunY=-5+recoil;
  // braço esquerdo
  ctx.strokeStyle='#4b5632';ctx.lineWidth=7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-16,-2);ctx.lineTo(-9,gunY-6);ctx.stroke();
  // braço direito
  ctx.beginPath();ctx.moveTo(16,-2);ctx.lineTo(7,gunY-6);ctx.stroke();
  // mãos
  ctx.fillStyle='#b89a69';ctx.beginPath();ctx.arc(-8,gunY-6,4,0,7);ctx.fill();ctx.beginPath();ctx.arc(7,gunY-6,4,0,7);ctx.fill();
  // rifle apontando para frente do corpo local (cima)
  ctx.save();ctx.translate(0,gunY-7);
  ctx.fillStyle='#222831';ctx.fillRect(-4,-25,8,29);ctx.fillStyle='#374151';ctx.fillRect(-6,-13,12,8);ctx.fillStyle='#111827';ctx.fillRect(-2,-31,4,8);ctx.fillRect(3,-6,4,9);
  if(player.shotFlash>0){ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.moveTo(0,-36);ctx.lineTo(-5,-29);ctx.lineTo(0,-31);ctx.lineTo(5,-29);ctx.closePath();ctx.fill()}
  ctx.restore();
  ctx.restore();
  if(performance.now()<invincibleUntil||performance.now()<phoenixShieldUntil){ctx.strokeStyle=performance.now()<phoenixShieldUntil?'#fbbf24':'#38bdf8';ctx.lineWidth=3;ctx.setLineDash([8,6]);ctx.beginPath();ctx.arc(0,0,38,0,7);ctx.stroke();ctx.setLineDash([])}
  ctx.restore();
}'''
          s=s[:start]+new+'\n'+s[end:]
          s=s.replace('Caos Live v0.12.5','Caos Live v0.12.6').replace("const VERSION='0.12.5'","const VERSION='0.12.6'").replace('v0.12.5 · SOLDADO 8 DIREÇÕES','v0.12.6 · RIG PROFISSIONAL')
          p.write_text(s)
          pp=Path('painel.html')
          if pp.exists():
            t=pp.read_text().replace('v0.12.5','v0.12.6').replace('?v=125','?v=126')
            pp.write_text(t)
          vp=Path('version.json')
          if vp.exists(): vp.write_text('{"version":"0.12.6"}\n')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html painel.html version.json 2>/dev/null || true
          git commit -m "fix: professional full-body rotating player rig v0.12.6" || exit 0
          git push
