name: Fix FPS sync and mob melee v0.11.0
on:
  push:
    paths:
      - '.github/workflows/fix-fps-mob-v110.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game and admin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          index = Path('index.html')
          s = index.read_text()

          s = s.replace('<title>Caos Live v0.10.9</title>', '<title>Caos Live v0.11.0</title>')
          s = s.replace('<div class="version">v0.10.9</div>', '<div class="version">v0.11.0</div>')
          s = s.replace("const VERSION='0.10.9'", "const VERSION='0.11.0'")

          old_enemy = "xp:Math.ceil(c.x*mult),dead:false,t:Math.random()*8,seed:Math.random()*99})"
          new_enemy = "xp:Math.ceil(c.x*mult),dead:false,t:Math.random()*8,seed:Math.random()*99,attackAt:0,attackFlash:0})"
          if old_enemy not in s:
              raise SystemExit('enemy constructor marker not found')
          s = s.replace(old_enemy, new_enemy, 1)

          old_collision = "if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r){e.dead=true;if(player.inv<=0&&performance.now()>invincibleUntil){player.life=Math.max(0,player.life-e.damage);player.inv=.3;if(player.life<=0){if(!tryPhoenix()){running=false;$('finalText').textContent='Level '+level+' · '+score+' pontos';$('over').classList.add('show')}}}}"
          new_collision = "if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r){const now=performance.now();if(now>=(e.attackAt||0)&&player.inv<=0&&now>invincibleUntil){e.attackAt=now+900;e.attackFlash=.18;player.life=Math.max(0,player.life-e.damage);player.inv=.28;const kx=e.x-player.x,ky=e.y-player.y,kd=Math.hypot(kx,ky)||1;e.x+=kx/kd*10;e.y+=ky/kd*10;if(player.life<=0){if(!tryPhoenix()){running=false;$('finalText').textContent='Level '+level+' · '+score+' pontos';$('over').classList.add('show')}}}}"
          if old_collision not in s:
              raise SystemExit('collision marker not found')
          s = s.replace(old_collision, new_collision, 1)

          old_tick = "if(t-last>=500){fps=Math.round(frames*1000/(t-last));frames=0;last=t;paint()}"
          new_tick = "if(t-last>=500){fps=Math.round(frames*1000/(t-last));window.caosCurrentFps=fps;frames=0;last=t;paint()}"
          if old_tick not in s:
              raise SystemExit('fps tick marker not found')
          s = s.replace(old_tick, new_tick, 1)

          old_state = "autoMode,hordeEnabled,skillLv:{...skillLv},room,ts:Date.now()"
          new_state = "autoMode,hordeEnabled,fps:Math.max(0,Math.round(window.caosCurrentFps||0)),skillLv:{...skillLv},room,ts:Date.now()"
          if old_state not in s:
              raise SystemExit('state marker not found')
          s = s.replace(old_state, new_state, 1)

          index.write_text(s)

          panel = Path('painel.html')
          p = panel.read_text()
          p = p.replace('<title>Caos Admin v0.10.9</title>', '<title>Caos Admin v0.11.0</title>')
          p = p.replace('PAINEL v0.10.9', 'PAINEL v0.11.0')

          old_auto = '<div><span>AUTO</span><b id="autoState">OFF</b></div>'
          new_auto = '<div><span>AUTO</span><b id="autoState">OFF</b></div><div><span>FPS</span><b id="fpsState">—</b></div>'
          if old_auto not in p:
              raise SystemExit('admin state marker not found')
          p = p.replace(old_auto, new_auto, 1)

          old_handler = "$('autoState').textContent=d.autoMode?'ON':'OFF';const at=$('autoModeToggle')"
          new_handler = "$('autoState').textContent=d.autoMode?'ON':'OFF';if($('fpsState')){$('fpsState').textContent=(Number.isFinite(+d.fps)&&+d.fps>0)?Math.round(+d.fps):'--';$('fpsState').style.color=(+d.fps>=50?'#86efac':+d.fps>=30?'#fde68a':'#fca5a5')}const at=$('autoModeToggle')"
          if old_handler not in p:
              raise SystemExit('admin data handler marker not found')
          p = p.replace(old_handler, new_handler, 1)

          panel.write_text(p)

          Path('version.json').write_text(json.dumps({
            'version':'0.11.0',
            'label':'v0.11.0',
            'releasedAt':'2026-08-08T15:42:00Z',
            'build':'fps-sync-mob-melee',
            'notes':[
              'FPS real do jogo sincronizado e exibido no painel Admin',
              'Mobs não morrem mais ao colidir com o player',
              'Cada mob aplica dano corpo a corpo com cooldown individual de 0.9s',
              'Pequeno recuo visual após o ataque para deixar o contato legível'
            ]
          }, ensure_ascii=False, indent=2)+'\n')
          PY
      - name: Commit patch
        run: |
          git config user.name "wallissonghost-code"
          git config user.email "wallissonghost@gmail.com"
          git add index.html painel.html version.json
          git commit -m "feat: sync FPS and add mob melee cooldown v0.11.0"
          git push
