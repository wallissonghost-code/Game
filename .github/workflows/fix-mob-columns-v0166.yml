name: Fix exact mob columns v0.16.6
on:
  push:
    paths:
      - '.github/workflows/fix-mob-columns-v0166.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact mob mapping
        run: python3 scripts/fix-mob-columns-v0166.py
      - name: Validate
        run: |
          node --check src/game.js
          node scripts/check-game.mjs
          grep -q "const up=\[\],down=\[\],right=\[\],left=\[\]" src/game.js
          grep -q "target.right=right;target.left=left" src/game.js
      - name: Commit
        run: |
          git config user.name wallissonghost-code
          git config user.email wallissonghost@gmail.com
          git add src/game.js index.html version.json
          git commit -m 'fix: isolate all four mob directions v0.16.6'
          git pull --rebase origin main
          git push origin main
