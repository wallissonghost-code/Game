name: Combat Balance + Death Cam v0.11.3
on:
  push:
    paths:
      - '.github/workflows/combat-deathcam-v113.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch combat, autofire and death cam
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('index.html'); s=p.read_text(); original=s
          # Version
          s=s.replace('<title>Caos Live v0.11.2</title>','<title>Caos Live v0.11.3</title>')
          s=s.replace('<div class="version">v0.11.2 · AUTO INTELIGENTE</div>','<div class="version">v0.11.3 · COMBATE</div>')
          s=s.replace("const VERSION='0.11.2'","const VERSION='0.11.3'")

          # Death camera styles
          css=""".deathCam{position:absolute;inset:0;z-index:11;display:none;align-items:flex-end;justify-content:center;padding:0 18px max(34px,env(safe-area-inset-bottom));pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 0 26%,rgba(100,0,12,.12) 48%,rgba(2,4,10,.82) 100%)}.deathCam.show{display:flex}.deathBox{width:min(430px,100%);padding:16px 18px;border:1px solid #7f1d1d;border-radius:20px;background:rgba(8,10,20,.92);box-shadow:0 0 36px rgba(239,68,68,.22);text-align:center;backdrop-filter:blur(8px)}.deathBox .killed{font-size:9px;letter-spacing:2px;color:#fca5a5;font-weight:900}.deathBox h2{margin:5px 0 12px;font-size:22px}.deathStats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.deathStats div{padding:8px 4px;border:1px solid #252b46;border-radius:11px;background:#0b1020}.deathStats small{display:block;font-size:6px;color:#7f8ab4}.deathStats b{font-size:11px}.deathHint{margin-top:9px;font-size:8px;color:#94a3b8}"""
          s=s.replace('</style>',css+'</style>',1)

          # Insert death cam before over overlay
          old='<section id="over" class="overlay"><div class="card"><h1>Fim de jogo</h1><p id="finalText"></p><button class="btn" id="restartBtn">JOGAR NOVAMENTE</button></div></section>'
          new='<section id="deathCam" class="deathCam"><div class="deathBox"><div class="killed">VOCÊ FOI ELIMINADO POR</div><h2 id="deathKiller">—</h2><div class="deathStats"><div><small>LEVEL</small><b id="deathLevel">1</b></div><div><small>TEMPO</small><b id="deathTime">00:00</b></div><div><small>HORDA</small><b id="deathWave">0</b></div><div><small>ABATES</small><b id="deathKills">0</b></div></div><div class="deathHint">Câmera focada no golpe final</div></div></section>'+old
          if old not in s: raise SystemExit('over marker missing')
          s=s.replace(old,new,1)

          # Runtime state + player base damage
          old='phoenixShieldUntil=0,perfMode=0,perfFrames=0,perfWindowStart=performance.now(),perfLastFps=60,renderScale=1,frameSeq=0;const skillLv='
          new='phoenixShieldUntil=0,perfMode=0,perfFrames=0,perfWindowStart=performance.now(),perfLastFps=60,renderScale=1,frameSeq=0,autoFire=true,runStartedAt=0,waveCount=0,deathState=null;const skillLv='
          if old not in s: raise SystemExit('state marker missing')
          s=s.replace(old,new,1)
          s=s.replace('bloodChance:0,bloodHeal:0};const MAX_ENEMIES','bloodChance:0,bloodHeal:0,damage:2};const MAX_ENEMIES',1)

          # Balance enemy damage. HP is preserved; only contact damage is normalized now that mobs survive collisions.
          old="const types={wraith:{name:'Espectro',r:15,s:96,h:3,d:8,x:7,c:'#7c3aed'},reaper:{name:'Ceifador',r:21,s:67,h:8,d:15,x:18,c:'#0e7490'},infected:{name:'Infectado',r:17,s:76,h:5,d:10,x:10,c:'#4d7c0f'},crawler:{name:'Criatura das Sombras',r:16,s:124,h:4,d:10,x:9,c:'#1e293b'},eye:{name:'Observador',r:16,s:86,h:5,d:9,x:11,c:'#b91c1c'},brute:{name:'Brutamonte',r:24,s:54,h:14,d:20,x:24,c:'#92400e'},colossus:{name:'Colosso Carmesim',r:42,s:42,h:100,d:28,x:150,c:'#991b1b',boss:1},voidlord:{name:'Senhor do Vazio',r:39,s:55,h:100,d:24,x:170,c:'#312e81',boss:1}};"
          new="const types={wraith:{name:'Espectro',r:15,s:96,h:3,d:2,x:7,c:'#7c3aed'},reaper:{name:'Ceifador',r:21,s:67,h:8,d:4,x:18,c:'#0e7490'},infected:{name:'Infectado',r:17,s:76,h:5,d:3,x:10,c:'#4d7c0f'},crawler:{name:'Criatura das Sombras',r:16,s:124,h:4,d:2,x:9,c:'#1e293b'},eye:{name:'Observador',r:16,s:86,h:5,d:2,x:11,c:'#b91c1c'},brute:{name:'Brutamonte',r:24,s:54,h:14,d:5,x:24,c:'#92400e'},colossus:{name:'Colosso Carmesim',r:42,s:42,h:100,d:8,x:150,c:'#991b1b',boss:1},voidlord:{name:'Senhor do Vazio',r:39,s:55,h:100,d:7,x:170,c:'#312e81',boss:1}};"
          if old not in s: raise SystemExit('types marker missing')
          s=s.replace(old,new,1)

          # Reset run counters and damage
          s=s.replace('bloodChance:0,bloodHeal:0});for(const k in skillLv)','bloodChance:0,bloodHeal:0,damage:2});for(const k in skillLv)',1)
          s=s.replace('phoenixShieldUntil=0;document.querySelectorAll',"phoenixShieldUntil=0;autoFire=true;runStartedAt=performance.now();waveCount=0;deathState=null;$('deathCam').classList.remove('show');document.querySelectorAll",1)

          # Horde counter
          old='function spawnWave(){const n=Math.min(11,3+Math.floor(level/2));for(let i=0;i<n;i++)spawn()}'
          new='function spawnWave(){waveCount++;const n=Math.min(11,3+Math.floor(level/2));for(let i=0;i<n;i++)spawn()}'
          if old not in s: raise SystemExit('spawnWave marker missing')
          s=s.replace(old,new,1)

          # Bullet damage 2 instead of 1
          s=s.replace('if(e){b.dead=true;e.hp--;if(e.hp<=0){e.dead=true;onKill(e)}}','if(e){b.dead=true;e.hp-=player.damage;if(e.hp<=0){e.dead=true;onKill(e)}}',1)

          # Admin autofire command
          marker="if(c==='auto'){autoMode=!!d.value;pointer=null}"
          if marker not in s: raise SystemExit('auto command marker missing')
          s=s.replace(marker,marker+"if(c==='autofire'){autoFire=!!d.value;toast('🔫 TIRO AUTOMÁTICO '+(autoFire?'ON':'OFF'))}",1)

          # Stop regular shooting when admin disables it
          s=s.replace('castArc();shotTimer-=dt;if(shotTimer<=0){shoot();shotTimer=player.fireRate}',"castArc();shotTimer-=dt;if(autoFire&&shotTimer<=0){shoot();shotTimer=player.fireRate}else if(!autoFire){shotTimer=Math.min(shotTimer,.05)}",1)

          # Helpers for killer identity + death camera
          insert="""function fmtRunTime(ms){const total=Math.max(0,Math.floor(ms/1000)),m=Math.floor(total/60),s=total%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function killerLabel(e){if(!e)return 'CAOS';const live=e.username||e.viewer||e.owner||e.sender||e.user;if(live)return '@'+String(live).replace(/^@/,'');return (types[e.type]?.name||'Mob desconhecido')+(e.tier===2?' · CORROMPIDO':e.tier===1?' · ELITE':'')}function beginDeath(e){if(deathState)return;const now=performance.now();deathState={killer:e,at:now,showOverAt:now+1800};$('deathKiller').textContent=killerLabel(e);$('deathLevel').textContent=level;$('deathTime').textContent=fmtRunTime(now-runStartedAt);$('deathWave').textContent=waveCount;$('deathKills').textContent=killCount;$('deathCam').classList.add('show');pointer=null;broadcast()}"""
          marker='function tryPhoenix(){'
          if marker not in s: raise SystemExit('phoenix marker missing')
          s=s.replace(marker,insert+marker,1)

          # Replace immediate death with death camera sequence
          old="if(player.life<=0){if(!tryPhoenix()){running=false;$('finalText').textContent='Level '+level+' · '+score+' pontos';$('over').classList.add('show')}}"
          new="if(player.life<=0){if(!tryPhoenix()){beginDeath(e)}}"
          if old not in s: raise SystemExit('death marker missing')
          s=s.replace(old,new,1)

          # While dead, freeze combat and reveal final screen after cinematic delay
          old='function update(dt){if(paused||choosing)return;'
          new="function update(dt){if(paused||choosing)return;if(deathState){const now=performance.now();if(now>=deathState.showOverAt){running=false;$('deathCam').classList.remove('show');$('finalText').textContent='Level '+level+' · '+score+' pontos · '+killCount+' abates · '+fmtRunTime(now-runStartedAt);$('over').classList.add('show')}return;}"
          if old not in s: raise SystemExit('update marker missing')
          s=s.replace(old,new,1)

          # Camera focus: shift world center toward killer during death cam
          old='function world(x,y){return{x:x-player.x+W/2,y:y-player.y+H/2}}'
          new="function world(x,y){let cx=player.x,cy=player.y;if(deathState?.killer){const k=deathState.killer,t=Math.min(1,(performance.now()-deathState.at)/900);cx=player.x+(k.x-player.x)*t*.62;cy=player.y+(k.y-player.y)*t*.62}return{x:x-cx+W/2,y:y-cy+H/2}}"
          if old not in s: raise SystemExit('world marker missing')
          s=s.replace(old,new,1)

          # Broadcast new combat state to admin
          # Append fields to an existing state object if recognizable.
          s=s.replace('auto:autoMode,horde:hordeEnabled', 'auto:autoMode,horde:hordeEnabled,autofire:autoFire,wave:waveCount',1)

          p.write_text(s)

          # Patch Admin: add autofire toggle and receive state.
          ap=Path('painel.html'); a=ap.read_text(); a0=a
          # Add a compact control next to automatic mode section using resilient insertion before hordas label.
          target='🌊 HORDAS AUTOMÁTICAS'
          idx=a.find(target)
          if idx<0: raise SystemExit('admin horde label missing')
          # Find previous card boundary and inject before it to avoid depending on exact markup.
          card_start=a.rfind('<div',0,idx)
          admin_block='''<div class="mode-card" style="margin-bottom:12px"><div><b>🔫 TIRO AUTOMÁTICO</b><small>liga/desliga os disparos normais do soldado</small></div><label class="switch"><input id="autoFireToggle" type="checkbox" checked><span></span></label></div>'''
          if 'id="autoFireToggle"' not in a:
            a=a[:card_start]+admin_block+a[card_start:]
          # Bind control near other change listeners, before closing script.
          bind="""const aft=document.getElementById('autoFireToggle');if(aft)aft.addEventListener('change',()=>send({command:'autofire',value:aft.checked}));"""
          if bind not in a:
            a=a.replace('</script>',bind+'</script>',1)
          # Sync checkbox from incoming state by hooking common state assignment patterns.
          sync="""try{const af=document.getElementById('autoFireToggle');if(af&&typeof d.autofire==='boolean')af.checked=d.autofire}catch{}"""
          # Insert into message handler after JSON/data variable d usage when possible.
          pos=a.find("d.auto")
          if pos>=0:
            stmt_end=a.find(';',pos)
            a=a[:stmt_end+1]+sync+a[stmt_end+1:]
          else:
            # Fallback harmless global event listener receives state custom event if available.
            a=a.replace('</script>',"window.addEventListener('caos:state',ev=>{const d=ev.detail||{};"+sync+"});</script>",1)
          # Version labels
          a=a.replace('Caos Admin v0.11.2','Caos Admin v0.11.3').replace('v0.11.2 ·','v0.11.3 ·')
          ap.write_text(a)

          Path('version.json').write_text(json.dumps({
            'version':'0.11.3','label':'v0.11.3','releasedAt':'2026-08-08T16:20:00Z','build':'combat-balance-deathcam',
            'notes':[
              'Dano base do rifle aumentado de 1 para 2 por projétil',
              'Dano corpo a corpo dos mobs rebalanceado para o novo sistema de cooldown',
              'Painel Admin ganhou Tiro Automático ON/OFF',
              'Câmera de morte foca o mob responsável pelo golpe final',
              'Tela de morte mostra assassino, level, tempo, horda e abates',
              'Mobs de live exibem @usuário quando o evento fornecer username/viewer/owner'
            ]
          },ensure_ascii=False,indent=2)+'\n')
          if s==original: raise SystemExit('no game changes')
          PY
      - name: Commit v0.11.3
        run: |
          git config user.name "wallissonghost-code"
          git config user.email "wallissonghost@gmail.com"
          git add index.html painel.html version.json
          git commit -m "feat: balance combat, autofire control and death cam v0.11.3" || exit 0
          git push
