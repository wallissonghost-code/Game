name: Weapon skin v0.10.5

on:
  push:
    paths:
      - '.github/workflows/weapon-skin-v0105.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Generate chunky pixel rifle and sync version
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          import json, re

          # 32x16 logical pixel-art sprite, scaled 4x to 128x64.
          img = Image.new('RGBA', (32,16), (0,0,0,0))
          d = ImageDraw.Draw(img)
          outline=(18,20,18,255)
          dark=(39,43,36,255)
          olive=(93,96,57,255)
          olive2=(126,120,72,255)
          tan=(156,139,82,255)
          metal=(76,82,76,255)
          hi=(174,164,105,255)

          # Stock
          d.rectangle([2,6,8,10], fill=outline)
          d.rectangle([3,7,8,9], fill=olive)
          d.rectangle([2,9,4,12], fill=outline)
          d.rectangle([3,9,5,11], fill=olive2)
          # Receiver
          d.rectangle([8,5,18,10], fill=outline)
          d.rectangle([9,6,17,9], fill=dark)
          d.rectangle([10,6,15,7], fill=metal)
          d.rectangle([13,8,17,9], fill=olive)
          # Grip
          d.rectangle([10,10,13,14], fill=outline)
          d.rectangle([11,10,12,13], fill=tan)
          # Magazine
          d.rectangle([15,10,18,14], fill=outline)
          d.rectangle([16,10,17,13], fill=metal)
          d.rectangle([16,13,18,14], fill=tan)
          # Handguard + barrel
          d.rectangle([18,6,27,9], fill=outline)
          d.rectangle([19,7,26,8], fill=olive2)
          d.rectangle([21,7,22,8], fill=hi)
          d.rectangle([27,6,29,9], fill=outline)
          d.rectangle([28,7,31,8], fill=metal)
          # Sight
          d.rectangle([13,3,16,5], fill=outline)
          d.rectangle([14,4,15,5], fill=metal)
          # Muzzle socket pixel accent
          d.rectangle([31,7,31,8], fill=hi)

          img = img.resize((128,64), Image.Resampling.NEAREST)
          out=Path('assets/weapons/assault-rifle-01.png')
          out.parent.mkdir(parents=True, exist_ok=True)
          img.save(out)

          # Sync game to 0.10.5 and tune weapon dimensions/anchor for this chunkier sprite.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('v0.10.4','v0.10.5').replace("VERSION='0.10.4'","VERSION='0.10.5'")
          s=s.replace('assault-rifle-01.png?v=0104','assault-rifle-01.png?v=0105')
          s=s.replace('backX=10,handY=-1,w=34,h=10,pivotX=7,pivotY=h/2','backX=9,handY=-2,w=32,h=12,pivotX=7,pivotY=h/2')
          p.write_text(s,encoding='utf-8')

          # Sync admin visible version.
          ap=Path('admin.html')
          if ap.exists():
              a=ap.read_text(encoding='utf-8').replace('v0.10.4','v0.10.5').replace('v0.9.5','v0.10.5')
              ap.write_text(a,encoding='utf-8')

          vp=Path('version.json')
          data={}
          if vp.exists():
              try: data=json.loads(vp.read_text(encoding='utf-8'))
              except: data={}
          data.update({
              'version':'0.10.5',
              'label':'v0.10.5',
              'releasedAt':'2026-08-08T11:08:00-03:00',
              'build':'chunky-pixel-rifle',
              'notes':['Nova skin pixel-art da arma com leitura melhor em escala pequena','Arma mais grossa e curta','Anchor e altura refinados','Jogo e painel sincronizados']
          })
          vp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/weapons/assault-rifle-01.png index.html admin.html version.json
          git commit -m 'release: weapon skin and version v0.10.5' || exit 0
          git push
