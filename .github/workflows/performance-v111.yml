name: Performance Update v0.11.1
on:
  push:
    paths:
      - '.github/workflows/performance-v111.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize game loop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p=Path('index.html')
          s=p.read_text()
          original=s

          s=s.replace('<title>Caos Live v0.11.0</title>','<title>Caos Live v0.11.1</title>')
          s=s.replace('<div class="version">v0.11.0</div>','<div class="version">v0.11.1 · PERFORMANCE</div>')
          s=s.replace("const VERSION='0.11.0'","const VERSION='0.11.1'")

          old="phoenixShieldUntil=0;const skillLv="
          new="phoenixShieldUntil=0,perfMode=0,perfFrames=0,perfWindowStart=performance.now(),perfLastFps=60,renderScale=1,frameSeq=0;const skillLv="
          if old not in s: raise SystemExit('perf vars marker missing')
          s=s.replace(old,new,1)

          old="function resize(){const r=stage.getBoundingClientRect();W=Math.max(320,r.width|0);H=Math.max(320,r.height|0);dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;draw()}"
          new="function resize(){const r=stage.getBoundingClientRect();W=Math.max(320,r.width|0);H=Math.max(320,r.height|0);const base=Math.min(devicePixelRatio||1,2);dpr=Math.max(.7,base*renderScale);canvas.width=Math.max(1,Math.floor(W*dpr));canvas.height=Math.max(1,Math.floor(H*dpr));draw()}"
          if old not in s: raise SystemExit('resize marker missing')
          s=s.replace(old,new,1)

          old="dead:false,t:Math.random()*8,seed:Math.random()*99})"
          new="dead:false,t:Math.random()*8,seed:Math.random()*99,nextAttack:0,aiPhase:(Math.random()*3)|0})"
          if old not in s: raise SystemExit('enemy fields marker missing')
          s=s.replace(old,new,1)

          # Spatial hash helpers for bullet/enemy collisions.
          marker="function autoVector(dt){"
          helper="const SPATIAL=96;function buildEnemyGrid(){const g=new Map();for(const e of enemies){if(e.dead)continue;const cx=Math.floor(e.x/SPATIAL),cy=Math.floor(e.y/SPATIAL),k=cx+','+cy;let a=g.get(k);if(!a)g.set(k,a=[]);a.push(e)}return g}function bulletHitsFromGrid(b,g){const cx=Math.floor(b.x/SPATIAL),cy=Math.floor(b.y/SPATIAL);for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){const a=g.get((cx+ox)+','+(cy+oy));if(!a)continue;for(const e of a){if(e.dead)continue;const dx=b.x-e.x,dy=b.y-e.y,rr=b.r+e.r;if(dx*dx+dy*dy<rr*rr)return e}}return null}"
          if marker not in s: raise SystemExit('autoVector marker missing')
          s=s.replace(marker,helper+marker,1)

          old="for(const b of bullets){if(b.flash||b.dead)continue;for(const e of enemies){if(e.dead)continue;if(Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r){b.dead=true;e.hp--;if(e.hp<=0){e.dead=true;onKill(e)}break}}}"
          new="const enemyGrid=buildEnemyGrid();for(const b of bullets){if(b.flash||b.dead)continue;const e=bulletHitsFromGrid(b,enemyGrid);if(e){b.dead=true;e.hp--;if(e.hp<=0){e.dead=true;onKill(e)}}}"
          if old not in s: raise SystemExit('bullet collision marker missing')
          s=s.replace(old,new,1)

          # Render only enemies that can actually be seen.
          old="for(const e of enemies)drawEnemy(e,world(e.x,e.y));drawMed();"
          new="for(const e of enemies){const p=world(e.x,e.y),m=e.r+70;if(p.x<-m||p.x>W+m||p.y<-m||p.y>H+m)continue;drawEnemy(e,p)}drawMed();"
          if old not in s: raise SystemExit('render culling marker missing')
          s=s.replace(old,new,1)

          # Adaptive effect quality.
          old="ctx.shadowBlur=c.boss?24:e.tier===2?18:e.tier===1?12:7;"
          new="ctx.shadowBlur=perfMode>=2?(c.boss?8:0):perfMode===1?(c.boss?14:e.tier===2?7:e.tier===1?5:2):(c.boss?24:e.tier===2?18:e.tier===1?12:7);"
          if old not in s: raise SystemExit('shadow marker missing')
          s=s.replace(old,new,1)
          s=s.replace("for(let wi=0;wi<3;wi++){const wa=ph*.35+wi*2.1","for(let wi=0;wi<(perfMode>=2?0:perfMode===1?1:3);wi++){const wa=ph*.35+wi*2.1",1)
          s=s.replace("ctx.shadowBlur=0;tierAura(e);if(e.hp<e.max", "ctx.shadowBlur=0;if(perfMode<2||c.boss)tierAura(e);if(e.hp<e.max",1)

          # Adaptive quality controller. 60 FPS target, with hysteresis to prevent oscillation.
          old="function loop(t){if(!running)return;const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}"
          new="function tunePerformance(t){perfFrames++;if(t-perfWindowStart<1000)return;perfLastFps=Math.max(1,Math.round(perfFrames*1000/(t-perfWindowStart)));window.__caosFps=perfLastFps;perfFrames=0;perfWindowStart=t;let next=perfMode;if(perfLastFps<34)next=2;else if(perfLastFps<49)next=Math.max(1,perfMode);else if(perfLastFps>57)next=0;else if(perfLastFps>53&&perfMode===2)next=1;if(next!==perfMode){perfMode=next;const target=perfMode===2?.62:perfMode===1?.80:1;if(Math.abs(renderScale-target)>.01){renderScale=target;resize()}}}function loop(t){if(!running)return;frameSeq++;tunePerformance(t);const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}"
          if old not in s: raise SystemExit('loop marker missing')
          s=s.replace(old,new,1)

          if s==original: raise SystemExit('no index changes')
          p.write_text(s)

          vp=Path('version.json')
          vp.write_text(json.dumps({
            'version':'0.11.1','label':'v0.11.1','releasedAt':'2026-08-08T15:50:00Z','build':'adaptive-performance',
            'notes':[
              'Render culling: mobs fora da tela deixam de ser desenhados',
              'Colisão bala x mob usa grade espacial em vez de varrer todos os inimigos',
              'Qualidade adaptativa reduz sombras e partículas quando o FPS cai',
              'Resolução interna do Canvas reduz automaticamente sob carga e recupera ao estabilizar',
              'Limite máximo de 230 mobs mantido'
            ]
          },ensure_ascii=False,indent=2)+'\n')

          # Keep admin label aligned with the game version when possible.
          ap=Path('painel.html')
          if ap.exists():
            a=ap.read_text()
            a=a.replace('Caos Admin v0.10.9','Caos Admin v0.11.1').replace('Caos Admin v0.11.0','Caos Admin v0.11.1')
            a=a.replace('v0.10.9 ·','v0.11.1 ·').replace('v0.11.0 ·','v0.11.1 ·')
            ap.write_text(a)
          PY
      - name: Commit optimized build
        run: |
          git config user.name "wallissonghost-code"
          git config user.email "wallissonghost@gmail.com"
          git add index.html painel.html version.json
          git commit -m "perf: adaptive rendering and spatial collisions v0.11.1" || exit 0
          git push
