name: Export Colossus Groups
on:
  push:
    paths: ['.github/workflows/export-colossus-groups.yml']
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install --user pillow
      - name: Build four group sheets
        run: |
          rm -rf /tmp/colossus-groups /tmp/colossus-src
          mkdir -p /tmp/colossus-groups /tmp/colossus-src debug/colossus-groups
          unzip -q assets/bosses/Ogroboss1.zip -d /tmp/colossus-src
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          root=Path('/tmp/colossus-src')
          files=sorted([p for p in root.rglob('*.png')],key=lambda p:str(p).lower())
          out=Path('debug/colossus-groups')
          for g in range(4):
              group=files[g*4:(g+1)*4]
              sheet=Image.new('RGB',(480,160),(12,15,22))
              for j,p in enumerate(group):
                  im=Image.open(p).convert('RGBA')
                  bb=im.getbbox()
                  if bb: im=im.crop(bb)
                  im.thumbnail((110,125),Image.Resampling.LANCZOS)
                  x=j*120+(120-im.width)//2; y=28+(125-im.height)//2
                  sheet.paste(im.convert('RGB'),(x,y))
                  d=ImageDraw.Draw(sheet)
                  d.text((j*120+4,6),f'{g*4+j+1:02d}',fill='white')
              jpg=out/f'group-{g+1}.jpg'; sheet.save(jpg,quality=65,optimize=True)
              import base64
              (out/f'group-{g+1}.b64.txt').write_text(base64.b64encode(jpg.read_bytes()).decode())
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/colossus-groups
          git diff --cached --quiet || git commit -m 'debug: export four Colossus frame groups'
          git push
