name: Gameplay v0.9.9
on:
  push:
    paths:
      - '.github/workflows/gameplay-v099.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch gameplay
        run: python3 scripts/patch_gameplay_v099.py
      - name: Validate connector syntax
        run: node --check cloud/connector-server.mjs
      - name: Validate inline game JavaScript
        run: |
          node <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('index.html','utf8');
          const scripts=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if(!scripts.length) throw new Error('No inline script found');
          for(const m of scripts) new Function(m[1]);
          console.log('inline game JS OK');
          NODE
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html version.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: horde off and auto skill native v0.9.9"
          git push
