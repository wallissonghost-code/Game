name: Armed weapon contact sheet
on:
  push:
    paths:
      - '.github/workflows/armed-weapon-contact-sheet.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow reportlab
      - run: python3 scripts/make-armed-weapon-contact-sheet.py
      - uses: actions/upload-artifact@v4
        with:
          name: armed-weapon-contact
          path: debug/*.pdf
