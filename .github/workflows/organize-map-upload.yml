name: Organize uploaded map pack

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/organize-map-upload.yml'

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Organize Map assets
        shell: bash
        run: |
          set -euo pipefail
          SRC='assets/Map/Caos-Live-Field-Pack-Corrigido.zip'
          test -f "$SRC"

          TMP="$(mktemp -d)"
          unzip -q "$SRC" -d "$TMP"
          ROOT="$TMP/Caos-Live-Field-Pack-Corrigido"
          test -d "$ROOT/assets/map/field"

          rm -rf assets/Map/field
          mkdir -p assets/Map/field
          cp -R "$ROOT/assets/map/field/." assets/Map/field/
          cp "$ROOT/manifest.json" assets/Map/field/manifest.json
          cp "$ROOT/README.md" assets/Map/field/README.md

          # Preserve loose uploads safely until visual classification is finished.
          mkdir -p assets/Map/extras-uploaded
          shopt -s nullglob
          for f in assets/Map/*.png; do
            mv "$f" assets/Map/extras-uploaded/
          done

          rm -f assets/Map/.gitkeep
          rm -f "$SRC"

          {
            echo '# Map upload organization report'
            echo
            echo 'Field pack:'
            find assets/Map/field -type f | sort
            echo
            echo 'Loose PNGs preserved for review:'
            find assets/Map/extras-uploaded -maxdepth 1 -type f -name '*.png' | sort || true
            echo
            echo 'PNG metadata:'
            find assets/Map -type f -name '*.png' -print0 | sort -z | xargs -0 -r file
          } > assets/Map/upload-report.txt

      - name: Commit organized map
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/Map
          if git diff --cached --quiet; then
            echo 'No map changes to commit.'
            exit 0
          fi
          git commit -m 'assets: organize Field map pack'
          git push
