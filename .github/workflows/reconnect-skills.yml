name: Safe skills reconnection
on:
  push:
    branches:
      - agent/reconnect-skills-safe3
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reconnect-skills-safe3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply incremental skills migration
        run: python3 scripts/reconnect-skills-migration.py
      - name: Validate code and interactive menu
        run: |
          node --check src/game.js
          node --check src/core/skills-bootstrap.mjs
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run check
          npm run check:menu
      - name: Commit validated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reconnect-skills.yml scripts/reconnect-skills-migration.py
          git add index.html src/game.js scripts/check-game.mjs scripts/check-architecture.mjs scripts/audit-runtime.mjs src/core/skills-bootstrap.mjs
          git commit -m "refactor: reconnect skills domain safely"
          git push origin HEAD:agent/reconnect-skills-safe3
