name: Skills v0.9.4
on:
  push:
    paths:
      - 'scripts/patch_skills_v094.py'
      - '.github/workflows/skills-v094.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply skills patch
        run: python scripts/patch_skills_v094.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud/connector-server.mjs version.json
          git diff --cached --quiet || git commit -m "feat: arco voltaico e pacto do abismo v0.9.4"
          git push
