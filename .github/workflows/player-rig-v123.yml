name: Player Rig v0.12.3
on:
  push:
    paths:
      - '.github/workflows/player-rig-v123.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch player rig
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          p=Path('index.html'); s=p.read_text()
          s=s.replace('Caos Live v0.12.2','Caos Live v0.12.3').replace('v0.12.2 · ARMA + BRAÇOS','v0.12.3 · RIG ESTÁVEL').replace("const VERSION='0.12.2'","const VERSION='0.12.3'")
          pat=r"function drawPlayer\(\)\{.*?\}function drawPhoenixShield\(\)\{"
          repl=r'''function drawPlayer(){
            ctx.save();ctx.translate(W/2,H/2);
            ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,25,24,8,0,0,7);ctx.fill();
            if(soldierReady&&soldierSprite.naturalWidth>=192){
              const fs=48,size=72,row=player.moving?1:0,frame=player.moving?Math.floor(player.walk)%4:0;
              const facing=Math.cos(player.aim||0)>=0?1:-1;
              const bob=player.moving?Math.sin(player.walk*Math.PI*.5)*.65:0;
              ctx.save();ctx.translate(0,bob);ctx.scale(facing,1);ctx.imageSmoothingEnabled=false;
              ctx.drawImage(soldierSprite,frame*fs,row*fs,fs,fs,-size/2,-size/2-5,size,size);
              if(weaponReady){
                let a=facing>0?(player.aim||0):Math.PI-(player.aim||0);
                while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;
                // In local character space the rifle always points to +X, so its texture never flips upside-down.
                if(a>Math.PI/2)a=Math.PI-a;else if(a<-Math.PI/2)a=-Math.PI-a;
                const ca=Math.cos(a),sa=Math.sin(a),originX=1,originY=-1;
                const point=(x,y)=>({x:originX+x*ca-y*sa,y:originY+x*sa+y*ca});
                const rearHand=point(8,1),frontHand=point(20,1);
                const rearShoulder={x:-7,y:-2},frontShoulder={x:-5,y:4};
                // sleeves are physically attached to fixed shoulder points on the soldier
                ctx.lineCap='round';ctx.lineJoin='round';
                ctx.strokeStyle='#465233';ctx.lineWidth=7;
                ctx.beginPath();ctx.moveTo(rearShoulder.x,rearShoulder.y);ctx.lineTo((rearShoulder.x+rearHand.x)*.5,(rearShoulder.y+rearHand.y)*.5);ctx.lineTo(rearHand.x,rearHand.y);ctx.stroke();
                ctx.beginPath();ctx.moveTo(frontShoulder.x,frontShoulder.y);ctx.lineTo((frontShoulder.x+frontHand.x)*.5,(frontShoulder.y+frontHand.y)*.5);ctx.lineTo(frontHand.x,frontHand.y);ctx.stroke();
                // rifle anchored at the chest/stock, with only a tiny recoil along its own axis
                const recoil=player.shotFlash>0?-1.4:0,w=32,h=12,pivotX=4,pivotY=h/2;
                ctx.save();ctx.translate(originX,originY);ctx.rotate(a);ctx.imageSmoothingEnabled=true;ctx.drawImage(weaponSprite,-pivotX+recoil,-pivotY,w,h);ctx.restore();
                // hands sit exactly on the two grip points, hiding any arm/rifle seam
                ctx.fillStyle='#c7996b';
                ctx.beginPath();ctx.arc(rearHand.x,rearHand.y,3.1,0,Math.PI*2);ctx.fill();
                ctx.beginPath();ctx.arc(frontHand.x,frontHand.y,3.1,0,Math.PI*2);ctx.fill();
              }
              ctx.restore();
            }else{
              ctx.fillStyle='#3f4a2e';ctx.fillRect(-15,-10,30,32);ctx.fillStyle='#c7996b';ctx.beginPath();ctx.arc(0,-18,11,0,7);ctx.fill();
            }
            ctx.restore()
          }function drawPhoenixShield(){'''
          s2,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('drawPlayer marker missing')
          p.write_text(s2)

          q=Path('painel.html'); a=q.read_text()
          a=a.replace('Caos Admin v0.12.2','Caos Admin v0.12.3').replace('v0.12.2</span>','v0.12.3</span>').replace('index.html?v=122','index.html?v=123')
          q.write_text(a)
          Path('version.json').write_text(json.dumps({'version':'0.12.3','label':'v0.12.3','releasedAt':'2026-08-08T17:40:00Z','build':'stable-player-rig','notes':['Rifle nunca inverte verticalmente','Braços presos a pontos fixos dos ombros','Mãos presas aos pontos de empunhadura do rifle','Sprite, braços e arma espelhados como um único rig','Recuo e balanço reduzidos para eliminar efeito de peça flutuante']},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Validate
        run: |
          grep -q "v0.12.3" index.html
          grep -q "rearShoulder" index.html
          grep -q "frontHand" index.html
          grep -q "v0.12.3" painel.html
          grep -q '"version": "0.12.3"' version.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html painel.html version.json
          git commit -m "fix: v0.12.3 stable player weapon rig" || exit 0
          git push
