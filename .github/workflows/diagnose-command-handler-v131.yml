name: Diagnose Command Handler v0.13.1
'on':
  push:
    paths: ['.github/workflows/diagnose-command-handler-v131.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect command handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(); out=[]
          for needle in ['command','data.command','d.command','msg.command','spawn(', 'boss(']:
            pos=0;n=0
            while True:
              i=s.find(needle,pos)
              if i<0: break
              n+=1; out.append(f'\n-- {needle} #{n} @ {i} --\n'+s[max(0,i-350):i+900]+'\n')
              pos=i+len(needle)
              if n>=20: break
          Path('.github/debug-command-handler.txt').write_text(''.join(out))
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/debug-command-handler.txt
          git commit -m 'chore: capture remote command handler' || exit 0
          git pull --rebase origin main
          git push
