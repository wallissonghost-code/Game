name: Ogre Unification v0.13.7

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ogre-unification-v0137.yml'
      - 'tools/apply_ogre_v0137.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch real game
        run: python3 tools/apply_ogre_v0137.py

      - name: Remove old mob art
        run: rm -f assets/ogre-boss-test.png assets/recortes_sem_fundo_CORRIGIDO.zip

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json assets
          git diff --cached --check
          git commit -m "feat: unify mobs as ogres and add ogre boss v0.13.7"
          git push origin main
