name: Apply Special Mob LOD
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply special mob render optimization
        run: node scripts/apply-special-mob-lod.mjs
      - name: Verify runtime
        run: |
          grep -F "if(crowd>=80||perfMode>=2)return" src/game.js
          grep -F "ctx.shadowBlur=crowd>=30?2" src/game.js
          node --check src/game.js
      - name: Commit optimized runtime and remove one-shot files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/game.js
          git rm scripts/apply-special-mob-lod.mjs .github/workflows/apply-special-mob-lod.yml
          git commit -m "perf: cut elite and corrupted aura render cost"
          git push origin HEAD:main
