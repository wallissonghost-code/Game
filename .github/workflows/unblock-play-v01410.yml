name: Unblock Play 01410
on:
  push:
    paths:
      - .github/workflows/unblock-play-v01410.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          a=s.index("const startButton=$('startBtn');")
          b=s.index("$('pauseBtn').onclick",a)
          n="const startButton=$('startBtn');if(startButton){startButton.disabled=false;startButton.textContent='ENTRAR NA ARENA';startButton.style.opacity='1';startButton.onclick=()=>reset()}$('restartBtn').onclick=()=>reset();"
          s=s[:a]+n+s[b:]
          s=s.replace("const VERSION='0.14.9'","const VERSION='0.14.10'",1)
          s=s.replace('Caos Live v0.14.9','Caos Live v0.14.10',1)
          s=s.replace('v0.14.9 · PLAY HOTFIX','v0.14.10 · PLAY LIBERADO',1)
          s=s.replace('<span class="startVersion">v0.14.9</span>','<span class="startVersion">v0.14.10</span>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name wallissonghost-code
          git config user.email wallissonghost@gmail.com
          git add index.html
          git commit -m "fix: unblock arena play v0.14.10"
          git pull --rebase origin main
          git push origin main
