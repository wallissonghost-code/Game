name: Unblock Play v0.14.10
on:
  push:
    paths: ['.github/workflows/unblock-play-v01410.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove skin gate from PLAY
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""const startButton=$('startBtn');
let skinGateTimer=null;
function updateSkinGate(){
  if(!startButton)return;
  if(playerV2Ready){startButton.disabled=false;startButton.textContent='ENTRAR NA ARENA';startButton.style.opacity='1';if(skinGateTimer){clearInterval(skinGateTimer);skinGateTimer=null}}
  else{startButton.disabled=true;startButton.textContent='CARREGANDO SKIN...';startButton.style.opacity='.58'}
}
updateSkinGate();skinGateTimer=setInterval(updateSkinGate,120);
startButton.onclick=()=>{if(playerV2Ready)reset()};$('restartBtn').onclick=()=>{if(playerV2Ready)reset()};"""
          new="""const startButton=$('startBtn');
if(startButton){startButton.disabled=false;startButton.textContent='ENTRAR NA ARENA';startButton.style.opacity='1';startButton.onclick=()=>reset()}
$('restartBtn').onclick=()=>reset();"""
          if old not in s:
              raise SystemExit('skin gate block not found')
          s=s.replace(old,new,1)
          s=s.replace("const VERSION='0.14.9'","const VERSION='0.14.10'",1)
          s=s.replace('Caos Live v0.14.9','Caos Live v0.14.10',1)
          s=s.replace('v0.14.9 · PLAY HOTFIX','v0.14.10 · PLAY LIBERADO',1)
          s=s.replace('<span class="startVersion">v0.14.9</span>','<span class="startVersion">v0.14.10</span>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q "const VERSION='0.14.10'" index.html
          grep -q "startButton.onclick=()=>reset()" index.html
          ! grep -q "CARREGANDO SKIN" index.html
      - name: Commit
        run: |
          git config user.name wallissonghost-code
          git config user.email wallissonghost@gmail.com
          git add index.html
          git commit -m "fix: unblock arena play independent of skin loader v0.14.10"
          git pull --rebase origin main
          git push origin main
