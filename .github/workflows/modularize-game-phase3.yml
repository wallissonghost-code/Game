name: Modularize Game Phase 3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/modularize-game-phase3.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded mobs and combat extraction
        run: node scripts/modularize-game-phase3.mjs
      - name: Validate architecture before commit
        run: npm run check
      - name: Commit migration
        run: |
          git config user.name "wallissonghost-code"
          git config user.email "wallissonghost@gmail.com"
          git add src/game.js scripts/check-architecture.mjs scripts/check-game.mjs
          git commit -m "refactor: extract solo mobs and combat from game runtime"
          git push origin HEAD:main
# retry: runtime audit aligned with core3
