name: Debug Arma3 Render

on:
  push:
    paths:
      - '.github/workflows/debug-arma3-render.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Mostrar trecho atual
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for key in ['weaponV2Ready','playerWeaponFrames','drawImage(wi','autoFire&&dir']:
              i=s.find(key)
              print('\nKEY',key,'INDEX',i)
              if i>=0:
                  print(s[max(0,i-500):i+1400])
          PY
