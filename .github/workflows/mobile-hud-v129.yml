name: Player No Spin v0.13.0
'on':
  push:
    paths: ['.github/workflows/mobile-hud-v129.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch player
        run: |
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          a=s.index('function drawPlayer(){'); b=s.index('function drawPhoenixShield()',a)
          new=r'''function drawPlayer(){
            ctx.save();ctx.translate(W/2,H/2);
            const aim=player.aim||0,ca=Math.cos(aim),sa=Math.sin(aim),moving=!!player.moving;
            const bob=moving?Math.sin(player.walk*Math.PI*.5)*1.0:0,step=moving?Math.sin(player.walk*Math.PI)*2:0;
            const back=sa<-.42,side=Math.abs(ca)>.72;
            ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(0,25,23,7,0,0,Math.PI*2);ctx.fill();
            ctx.save();ctx.translate(0,bob);
            ctx.fillStyle='#27331f';ctx.fillRect(-10,-1+step,7,24);ctx.fillRect(3,-1-step,7,24);
            ctx.fillStyle='#171d17';ctx.fillRect(-11,17+step,9,6);ctx.fillRect(2,17-step,9,6);
            ctx.fillStyle='#4b5b2d';ctx.beginPath();ctx.roundRect(-15,-20,30,31,6);ctx.fill();
            ctx.fillStyle=back?'#20291d':'#303b22';ctx.beginPath();ctx.roundRect(-11,-16,22,22,4);ctx.fill();
            if(back){ctx.strokeStyle='#596b43';ctx.lineWidth=2;ctx.strokeRect(-8,-13,16,17);ctx.fillStyle='#171d17';ctx.fillRect(-6,-10,12,3)}else if(side){ctx.fillStyle='#69774a';ctx.fillRect(ca>0?1:-9,-12,8,17);ctx.fillStyle='#20291d';ctx.fillRect(ca>0?-8:1,-8,7,12)}else{ctx.fillStyle='#69774a';ctx.fillRect(-8,-12,16,4);ctx.fillStyle='#20291d';ctx.fillRect(-7,-5,14,8)}
            ctx.fillStyle='#b88b63';ctx.beginPath();ctx.arc(0,-25,9,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#596332';ctx.beginPath();ctx.arc(0,-28,11,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-11,-28,22,5);
            if(back){ctx.fillStyle='#30381f';ctx.fillRect(-8,-27,16,6)}else if(side){ctx.fillStyle='#111827';ctx.fillRect(ca>0?0:-8,-26,8,5)}else{ctx.fillStyle='#111827';ctx.fillRect(-8,-26,16,5)}
            const px=-sa,py=ca,s1={x:px*9,y:-8+py*3},s2={x:-px*9,y:-8-py*3};
            const h1={x:ca*12+px*4,y:sa*12+py*4-8},h2={x:ca*20-px*3,y:sa*20-py*3-8};
            function limb(q,h){ctx.strokeStyle='#46562e';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(h.x,h.y);ctx.stroke();ctx.fillStyle='#b88b63';ctx.beginPath();ctx.arc(h.x,h.y,3.4,0,Math.PI*2);ctx.fill()}
            limb(s2,h2);limb(s1,h1);
            ctx.save();ctx.translate(ca*14,sa*14-8);ctx.rotate(aim);ctx.translate(player.shotFlash>0?-2:0,0);
            if(weaponReady){ctx.imageSmoothingEnabled=true;ctx.drawImage(weaponSprite,-8,-6,35,12)}else{ctx.fillStyle='#242b27';ctx.fillRect(-7,-3,31,6);ctx.fillStyle='#111827';ctx.fillRect(18,-2,12,4)}ctx.restore();
            if(player.shotFlash>0){ctx.save();ctx.translate(ca*43,sa*43-8);ctx.fillStyle='#fde68a';ctx.shadowColor='#f59e0b';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();ctx.restore()}
            ctx.restore();ctx.restore();
          }'''
          s=s[:a]+new+s[b:]
          s=s.replace('<title>Caos Live v0.12.9</title>','<title>Caos Live v0.13.0</title>')
          s=s.replace("const VERSION='0.12.9'","const VERSION='0.13.0'")
          s=s.replace('v0.12.9 · MOBILE HUD','v0.13.0 · PLAYER SEM GIRO')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: stable player body with independent aim v0.13.0'
          git push
