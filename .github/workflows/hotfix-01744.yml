name: Caos Live 0.17.44 Hotfix
on:
  push:
    branches: [agent/hotfix-01744]
permissions:
  contents: write
jobs:
  hotfix:
    if: ${{ !contains(github.event.head_commit.message, '[01744-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hotfix-01744
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/hotfix-01744.mjs
      - run: npm run check
      - name: Commit generated hotfix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json index.html src/game.js src/core/game-bootstrap.mjs scripts/check-architecture.mjs
          git commit -m "fix: release 0.17.44 runtime cache hotfix [01744-generated]"
          git push origin HEAD:agent/hotfix-01744
