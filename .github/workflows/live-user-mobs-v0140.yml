name: Live User Mobs v0.14.0
on:
  push:
    paths:
      - '.github/workflows/live-user-mobs-v0140.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch live mob owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Caos Live v0.13.9','Caos Live v0.14.0')
          s=s.replace("const VERSION='0.13.9'","const VERSION='0.14.0'")
          s=s.replace('v0.13.9 · RED DOT CORRIGIDO','v0.14.0 · LIVE @USERS')
          s=s.replace('v0.13.9 · ARMA3 PROPORCIONAL','v0.14.0 · LIVE @USERS')
          s=s.replace('<span class="startVersion">v0.13.9</span>','<span class="startVersion">v0.14.0</span>')
          old="if(c==='boss')boss(d.mob||null);"
          new="if(c==='boss'){const before=enemies.length;boss(d.mob||null);if(enemies.length>before&&d.user)enemies[enemies.length-1].username=String(d.user).replace(/^@/,'')}"
          if old not in s: raise SystemExit('boss block not found')
          s=s.replace(old,new,1)
          marker="function killerLabel(e){"
          helper="function liveUserLabel(v){v=String(v||'').trim();return v?'@'+v.replace(/^@/,''):''}"
          if helper not in s: s=s.replace(marker,helper+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "wallissonghost-code"
          git config user.email "wallissonghost@gmail.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: attach TikTok donor names to spawned mobs and bosses v0.14.0"
          git push origin main