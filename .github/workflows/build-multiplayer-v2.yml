name: Build Caos Live Multiplayer V2

on:
  push:
    paths:
      - '.github/workflows/build-multiplayer-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build isolated V2 files
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil, re, json

          VERSION='0.17.37-online-v2.0.1'
          TAG='01737v201'

          # Start from the proven Online.7 gameplay/rendering and fork only the network layer.
          shutil.copyfile('src/multiplayer.js','src/multiplayer-v2.js')
          shutil.copyfile('multiplayer.html','multiplayer-v2.html')
          shutil.copyfile('cloud/game-server-v2.mjs','cloud/game-server-v3.mjs')

          # ---------- CLIENT V2 ----------
          p=Path('src/multiplayer-v2.js'); s=p.read_text()
          s=s.replace("const ONLINE_VERSION='0.17.37-online.7'",f"const ONLINE_VERSION='{VERSION}'",1)
          s=s.replace("TAG='01737o7'",f"TAG='{TAG}'",1)
          s=s.replace("skillPendingUntil=0,localWalk=0;","skillPendingUntil=0,localWalk=0,pendingInputs=[],lastAck=0;",1)
          s=s.replace("const SESSION_KEY='caos-mp-session-v2'","const SESSION_KEY='caos-mp-session-v3'",1)
          s=s.replace("const raw='https://caos-live-game-server-va.onrender.com'","const raw=params.get('server')||'https://caos-live-game-server-v2-va.onrender.com'",1)
          s=s.replace("u.pathname='/game'","u.pathname='/game-v2'",1)
          s=s.replace("players.set(myId,{...p,x:p.x,y:p.y,tx:p.x,ty:p.y,local:true});","players.set(myId,{...p,x:p.x,y:p.y,tx:p.x,ty:p.y,predX:p.x,predY:p.y,local:true});",1)

          # Input history. Client position is never sent as authority.
          s,n=re.subn(
            r"function sendInput\(stop=false\)\{.*?\}\nfunction dir8",
            """function sendInput(stop=false){if(!joined||!started)return;computeInput();const payload={type:'input',seq:++seq,dx:input.dx,dy:input.dy,clientTime:performance.now(),stop:!!stop};pendingInputs.push({seq:payload.seq,dx:payload.dx,dy:payload.dy});if(pendingInputs.length>32)pendingInputs.splice(0,pendingInputs.length-32);if(stop)pendingStop=seq;send(payload)}\nfunction dir8""",
            s,count=1,flags=re.S)
          if n!=1: raise SystemExit('V2 client: sendInput patch failed')

          # Canonical prediction/reconciliation for local player + buffered interpolation for remote actors.
          new_snapshot=r"""function applySnapshot(m){if(!started)return;const now=performance.now();if(!firstSnapshot){firstSnapshot=true;ui.startCover.classList.remove('show')}let snapMs=70;if(lastSnapAt){const d=now-lastSnapAt;snapIntervals.push(d);if(snapIntervals.length>30)snapIntervals.shift();snapMs=Math.max(55,Math.min(110,snapIntervals.reduce((a,b)=>a+b,0)/snapIntervals.length*1.35))}lastSnapAt=now;meta=m.meta||meta;const liveP=new Set();for(const st of m.players||[]){liveP.add(st.id);let p=players.get(st.id);if(!p){p={...st,x:st.x,y:st.y,tx:st.x,ty:st.y,predX:st.x,predY:st.y,local:st.id===myId};players.set(st.id,p)}if(st.id===myId){const rx=p.x,ry=p.y,px=Number.isFinite(p.predX)?p.predX:rx,py=Number.isFinite(p.predY)?p.predY:ry;Object.assign(p,st);p.x=rx;p.y=ry;p.predX=px;p.predY=py;p.tx=st.x;p.ty=st.y;lastAck=Math.max(lastAck,Number(st.ack||0));pendingInputs=pendingInputs.filter(i=>i.seq>lastAck);const ghost={x:st.x,y:st.y,r:p.r||18},sp=255*(1+((st.skills?.speed||0)*.10));for(const cmd of pendingInputs){ghost.x+=cmd.dx*sp/30;ghost.y+=cmd.dy*sp/30;resolveLocalPlayer(ghost)}const ex=ghost.x-p.predX,ey=ghost.y-p.predY,err=Math.hypot(ex,ey);if(!Number.isFinite(p.predX)||err>145){p.predX=ghost.x;p.predY=ghost.y;p.x=ghost.x;p.y=ghost.y}else if(err>.35){const gain=err>55?.32:.16;p.predX+=ex*gain;p.predY+=ey*gain}if(pendingStop&&lastAck>=pendingStop)pendingStop=0}else{const ox=Number.isFinite(p.x)?p.x:st.x,oy=Number.isFinite(p.y)?p.y:st.y;Object.assign(p,st);p.x=ox;p.y=oy;p.i0x=ox;p.i0y=oy;p.i1x=st.x;p.i1y=st.y;p.iAt=now;p.iMs=snapMs}}for(const id of [...players.keys()])if(id!==myId&&!liveP.has(id))players.delete(id);const liveE=new Set();for(const a of m.enemies||[]){const[id,x,y,hp,maxHp,vx,vy,typeIndex,walk,tier,boss,evolution=1,radius]=a;liveE.add(id);let e=enemies.get(id);if(!e){e={id,x,y};enemies.set(id,e)}const ox=Number.isFinite(e.x)?e.x:x,oy=Number.isFinite(e.y)?e.y:y;Object.assign(e,{hp,maxHp,vx,vy,typeIndex,walk,tier,boss:!!boss,evolution:evolution||1,r:radius||TYPE_RADIUS[typeIndex]||16});e.x=ox;e.y=oy;e.i0x=ox;e.i0y=oy;e.i1x=x;e.i1y=y;e.iAt=now;e.iMs=snapMs}for(const id of [...enemies.keys()])if(!liveE.has(id))enemies.delete(id);const liveB=new Set();for(const a of m.bullets||[]){const[id,x,y,vx,vy,ownerRole,flash]=a;liveB.add(id);let b=bullets.get(id);if(!b){b={id,x,y};bullets.set(id,b)}const ox=Number.isFinite(b.x)?b.x:x,oy=Number.isFinite(b.y)?b.y:y;Object.assign(b,{vx,vy,ownerRole,flash:!!flash});b.x=ox;b.y=oy;b.i0x=ox;b.i0y=oy;b.i1x=x;b.i1y=y;b.iAt=now;b.iMs=Math.max(40,snapMs*.75)}for(const id of [...bullets.keys()])if(!liveB.has(id))bullets.delete(id);refreshUi();refreshSkill();if(meta.gameOver){ui.finalText.textContent=`${meta.totalKills||0} abates · ${fmtTime(meta.durationMs)}`;ui.gameOver.classList.add('show')}else ui.gameOver.classList.remove('show')}"""
          s,n=re.subn(r"function applySnapshot\(m\)\{.*?\}\nfunction refreshUi",new_snapshot+"\nfunction refreshUi",s,count=1,flags=re.S)
          if n!=1: raise SystemExit('V2 client: applySnapshot patch failed')

          new_sim=r"""function interpActor(a,now){if(!Number.isFinite(a.i1x)||!Number.isFinite(a.iAt))return;const t=Math.max(0,Math.min(1,(now-a.iAt)/Math.max(1,a.iMs||70))),k=t*t*(3-2*t);a.x=a.i0x+(a.i1x-a.i0x)*k;a.y=a.i0y+(a.i1y-a.i0y)*k}function simulate(dt){const now=performance.now();for(const p of players.values()){if(p.id===myId){if(!Number.isFinite(p.predX)){p.predX=p.x;p.predY=p.y}if(started&&!p.down&&!p.choices){computeInput();const mag=Math.hypot(input.dx,input.dy),sp=255*(1+((p.skills?.speed||0)*.10));if(mag>.08){p.predX+=input.dx*sp*dt;p.predY+=input.dy*sp*dt;const g={x:p.predX,y:p.predY,r:p.r||18};resolveLocalPlayer(g);p.predX=g.x;p.predY=g.y;localWalk=(localWalk+dt*9)%4096}}p.x=p.predX;p.y=p.predY;continue}interpActor(p,now)}for(const e of enemies.values())interpActor(e,now);for(const b of bullets.values())interpActor(b,now)}"""
          s,n=re.subn(r"function simulate\(dt\)\{.*?\}\nfunction resize",new_sim+"\nfunction resize",s,count=1,flags=re.S)
          if n!=1: raise SystemExit('V2 client: simulate patch failed')
          p.write_text(s)

          # ---------- SERVER V3 ----------
          p=Path('cloud/game-server-v3.mjs'); s=p.read_text()
          s=s.replace("ONLINE_VERSION='0.17.37-online.7'",f"ONLINE_VERSION='{VERSION}'",1)
          s=s.replace("html:path.join(ROOT,'multiplayer.html'),js:path.join(ROOT,'src','multiplayer.js')","html:path.join(ROOT,'multiplayer-v2.html'),js:path.join(ROOT,'src','multiplayer-v2.js')",1)
          s=s.replace("lastSeq:0,lastInputAt", "recvSeq:0,lastSeq:0,lastInputAt",1)

          # Ack input only after the authoritative simulation tick has consumed the latest state.
          new_input="""function inputMsg(ws,m){const{r,p}=stateFor(ws);if(!r||r.status!=='running'||r.gameOver||!p)return;let dx=clamp(safe(m.dx),-1,1),dy=clamp(safe(m.dy),-1,1),n=Math.hypot(dx,dy);if(n>1){dx/=n;dy/=n}p.inputX=dx;p.inputY=dy;p.recvSeq=Math.max(p.recvSeq||0,Math.floor(safe(m.seq,p.recvSeq||0)));p.lastInputAt=Date.now()}"""
          s,n=re.subn(r"function inputMsg\(ws,m\)\{.*?\}\nfunction skillMsg",new_input+"\nfunction skillMsg",s,count=1,flags=re.S)
          if n!=1: raise SystemExit('V3 server: inputMsg patch failed')

          # Mark the latest received input as processed only inside the server tick.
          s=s.replace("if(now-p.lastInputAt>INPUT_TIMEOUT_MS)p.inputX=p.inputY=0;p.shotFlash", "if(now-p.lastInputAt>INPUT_TIMEOUT_MS)p.inputX=p.inputY=0;p.lastSeq=p.recvSeq||p.lastSeq||0;p.shotFlash",1)

          # V2 endpoints are isolated from Online.7.
          s=s.replace("websocket:'/game',multiplayer:'/multiplayer'","websocket:'/game-v2',multiplayer:'/multiplayer-v2'",1)
          s=s.replace("if(u.pathname==='/'||u.pathname==='/multiplayer')", "if(u.pathname==='/'||u.pathname==='/multiplayer-v2')",1)
          s=s.replace("location:'/multiplayer'+(qs?'?'+qs:'')", "location:'/multiplayer-v2'+(qs?'?'+qs:'')",1)
          s=s.replace("if(u.pathname==='/src/multiplayer.js')", "if(u.pathname==='/src/multiplayer-v2.js')",1)
          s=s.replace("path:'/game'", "path:'/game-v2'",1)

          # Area-of-interest snapshots: each socket receives only entities that can matter locally.
          old="const snaps=setInterval(()=>{const now=Date.now();for(const r of rooms.values())if(r.status==='running')broadcast(r,{type:'snapshot'"
          if old not in s: raise SystemExit('V3 server: snapshot block anchor missing')
          start=s.index("const snaps=setInterval")
          end=s.index("snaps.unref?.();",start)+len("snaps.unref?.();")
          new_snaps=r"""const AOI_ENEMY=1550,AOI_BULLET=1750;function snapshotFor(r,p,now){const er2=AOI_ENEMY*AOI_ENEMY,br2=AOI_BULLET*AOI_BULLET,nearEnemies=r.enemies.filter(e=>e.boss||(e.x-p.x)**2+(e.y-p.y)**2<=er2),nearBullets=r.bullets.filter(b=>(b.x-p.x)**2+(b.y-p.y)**2<=br2);return{type:'snapshot',version:ONLINE_VERSION,room:r.code,tick:serverTick,serverTime:now,meta:{totalKills:r.totalKills,totalXp:Math.floor(r.totalXp),wave:r.wave,mobs:r.enemies.length,visibleMobs:nearEnemies.length,boss:r.enemies.some(e=>e.boss),gameOver:r.gameOver,durationMs:r.startedAt?now-r.startedAt:0,matchId:r.matchId,medDrop:r.medDrop?{x:q(r.medDrop.x),y:q(r.medDrop.y)}:null},players:[...r.players.values()].map(serializePlayer),enemies:nearEnemies.map(e=>[e.id,q(e.x),q(e.y),q(e.hp),q(e.maxHp),q(e.vx),q(e.vy),e.typeIndex,q(e.walk),e.tier,e.boss?1:0,e.evolution||1,q(e.r)]),bullets:nearBullets.map(b=>[b.id,q(b.x),q(b.y),q(b.vx),q(b.vy),b.ownerRole,b.flash?1:0])}}const snaps=setInterval(()=>{const now=Date.now();for(const r of rooms.values())if(r.status==='running')for(const p of connected(r))send(p.ws,snapshotFor(r,p,now))},Math.round(1000/SNAPSHOT_RATE));snaps.unref?.();"""
          s=s[:start]+new_snaps+s[end:]
          p.write_text(s)

          # ---------- HTML V2 ----------
          p=Path('multiplayer-v2.html'); s=p.read_text()
          s=s.replace('<title>Caos Live · Multiplayer</title>','<title>Caos Live · Multiplayer V2 Beta</title>',1)
          s=s.replace('ONLINE 0.17.37-online.7 · BASE 0.17.37',f'{VERSION} · BASE 0.17.37',1)
          s=s.replace('CAOS LIVE · MULTIPLAYER</span>','CAOS LIVE · MULTIPLAYER V2 BETA</span>',1)
          s=s.replace('ONLINE.7</span>','V2 BETA</span>',1)
          s=s.replace('Nenhum celular vira Host. O Render calcula a partida; cada celular carrega apenas mapa, skins, animações e controles.','Prediction local + reconciliação por sequência + interpolação. O servidor continua autoritativo para combate, XP, skills, mobs e revive.',1)
          s=s.replace('/src/multiplayer.js?v=01737o7',f'/src/multiplayer-v2.js?v={TAG}',1)
          p.write_text(s)

          # ---------- PACKAGE + RENDER ----------
          p=Path('package.json'); pkg=json.loads(p.read_text()); pkg['scripts']['game-server-v3']='node cloud/game-server-v3.mjs'; p.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n')
          p=Path('render.yaml'); r=p.read_text()
          if 'name: caos-live-game-server-v2-va' not in r:
              r += '''\n  - type: web\n    name: caos-live-game-server-v2-va\n    runtime: node\n    region: virginia\n    plan: free\n    buildCommand: npm install\n    startCommand: npm run game-server-v3\n    healthCheckPath: /health\n    autoDeployTrigger: commit\n    envVars:\n      - key: NODE_VERSION\n        value: "24"\n'''
          p.write_text(r)
          PY

      - name: Validate JavaScript and preserve Solo/Online.7
        run: |
          node --check src/multiplayer-v2.js
          node --check cloud/game-server-v3.mjs
          grep -q "online-v2.0.1" src/multiplayer-v2.js
          grep -q "AOI_ENEMY" cloud/game-server-v3.mjs
          grep -q "pendingInputs" src/multiplayer-v2.js
          grep -q "game-v2" cloud/game-server-v3.mjs
          grep -q "game-server-v3" package.json
          grep -q "caos-live-game-server-v2-va" render.yaml
          git diff --exit-code -- src/multiplayer.js cloud/game-server-v2.mjs multiplayer.html version.json
          npm run check

      - name: Smoke test V2 with two clients
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          PORT=11000 npm run game-server-v3 > /tmp/v2-server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11000/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:11000/health | grep -q 'online-v2.0.1'
          curl -fsS http://127.0.0.1:11000/multiplayer-v2 | grep -q 'V2 BETA'
          node --input-type=module <<'NODE'
          import WebSocket from 'ws';
          const url='ws://127.0.0.1:11000/game-v2', room='V2TEST01';
          function client(name,session,create){return new Promise((resolve,reject)=>{const ws=new WebSocket(url);let welcome=null;const timer=setTimeout(()=>reject(Error(name+' timeout')),8000);ws.on('error',reject);ws.on('message',buf=>{const m=JSON.parse(buf.toString());if(m.type==='hello')ws.send(JSON.stringify({type:'join',room,name,session,create}));if(m.type==='welcome'){welcome=m;clearTimeout(timer);resolve({ws,welcome})}})})}
          const a=await client('P1','v2-p1',true),b=await client('P2','v2-p2',false);
          if(a.welcome.role!=='p1'||b.welcome.role!=='p2')throw Error('roles invalid');
          a.ws.send(JSON.stringify({type:'ready',ready:true}));b.ws.send(JSON.stringify({type:'ready',ready:true}));
          await new Promise(r=>setTimeout(r,150));a.ws.send(JSON.stringify({type:'start-match'}));
          const snap=await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('snapshot timeout')),7000);a.ws.on('message',buf=>{const m=JSON.parse(buf.toString());if(m.type==='match-start'){for(let i=1;i<=5;i++)setTimeout(()=>a.ws.send(JSON.stringify({type:'input',seq:i,dx:1,dy:0})),i*35)}if(m.type==='snapshot'&&m.players?.some(p=>p.ack>=1)){clearTimeout(timer);resolve(m)}})});
          if(snap.version!=='0.17.37-online-v2.0.1')throw Error('wrong V2 version');
          if(!Array.isArray(snap.enemies)||!Array.isArray(snap.bullets))throw Error('invalid AOI snapshot');
          a.ws.close();b.ws.close();
          console.log('V2 SMOKE OK',{tick:snap.tick,players:snap.players.length,enemies:snap.enemies.length,ack:snap.players.find(p=>p.role==='p1')?.ack});
          NODE
          kill $SERVER_PID || true

      - name: Commit isolated V2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add multiplayer-v2.html src/multiplayer-v2.js cloud/game-server-v3.mjs package.json render.yaml
          git commit -m 'feat: add isolated multiplayer v2 network architecture'
          git push
