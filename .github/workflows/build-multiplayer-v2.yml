name: Repair Multiplayer V2 Render v2.0.5

on:
  push:
    paths:
      - '.github/workflows/build-multiplayer-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Repair sprites weapon and boss facing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cp=Path('src/multiplayer-v2.js')
          s=cp.read_text(encoding='utf-8')

          old="const ONLINE_VERSION='0.17.37-online-v2.0.4',BASE_SOLO='0.17.37',TAG='01737v204'"
          new="const ONLINE_VERSION='0.17.37-online-v2.0.5',BASE_SOLO='0.17.37',TAG='01737v205'"
          assert old in s, 'client version marker missing'
          s=s.replace(old,new,1)

          mark="function loadImg(src){return new Promise(resolve=>{const im=new Image();im.decoding='async';im.onload=()=>resolve(im);im.onerror=()=>resolve(null);im.src=src})}"
          assert mark in s, 'loadImg marker missing'
          s=s.replace(mark,mark+"\nfunction spriteSize(im){return{w:Number(im?.naturalWidth||im?.videoWidth||im?.width||0),h:Number(im?.naturalHeight||im?.videoHeight||im?.height||0)}}\nfunction spriteDrawable(im){const z=spriteSize(im);return z.w>0&&z.h>0}\nfunction packDrawable(t){return['up','down','left','right'].every(d=>Array.isArray(t?.[d])&&t[d].some(spriteDrawable))}",1)

          old="function dirVec(vx,vy,fallback='down'){if(Math.hypot(vx,vy)<.1)return fallback;return dir8(Math.atan2(vy,vx))}"
          assert old in s, 'dirVec marker missing'
          s=s.replace(old,old+"\nfunction dir4Vec(vx,vy,fallback='down'){if(Math.hypot(vx,vy)<.1)return fallback;return Math.abs(vx)>Math.abs(vy)?(vx>=0?'right':'left'):(vy>=0?'down':'up')}\nfunction enemyRenderDir(e){const fallback=e._facing||'down';if(Math.hypot(e.vx||0,e.vy||0)>.1)e._facing=e.boss?dir4Vec(e.vx,e.vy,fallback):dirVec(e.vx,e.vy,fallback);return e._facing||fallback}",1)

          old="function drawWeapon(dir,frame,bob=0){if(!ready.weapon)return;const a=sprites.weapon[dir]?.length?sprites.weapon[dir]:sprites.weapon.down,im=a[frame%Math.max(1,a.length)]||a[0];if(!im?.naturalWidth)return;const z=WL[dir]||WL.down,ratio=im.naturalWidth/Math.max(1,im.naturalHeight);"
          new="function drawWeapon(dir,frame,bob=0){if(!ready.weapon)return;const a=sprites.weapon[dir]?.length?sprites.weapon[dir]:sprites.weapon.down,im=a[frame%Math.max(1,a.length)]||a[0],sz=spriteSize(im);if(!sz.w||!sz.h)return;const z=WL[dir]||WL.down,ratio=sz.w/Math.max(1,sz.h);"
          assert old in s, 'drawWeapon marker missing'
          s=s.replace(old,new,1)

          old="arr=sprites.player[dir]?.length?sprites.player[dir]:sprites.player.down,img=arr?.[frame],bob=moving?Math.sin(animWalk*Math.PI*.5)*.8:0;ctx.save();"
          new="arr=sprites.player[dir]?.length?sprites.player[dir]:sprites.player.down,img=arr?.[frame],bob=moving?Math.sin(animWalk*Math.PI*.5)*.8:0,psz=spriteSize(img);ctx.save();"
          assert old in s, 'drawPlayer size marker missing'
          s=s.replace(old,new,1)
          old="if(ready.player&&img?.naturalWidth){const h=70,ratio=img.naturalWidth/Math.max(1,img.naturalHeight),w=Math.min(76,h*ratio);"
          new="if(ready.player&&psz.w&&psz.h){const h=70,ratio=psz.w/Math.max(1,psz.h),w=Math.min(76,h*ratio);"
          assert old in s, 'drawPlayer drawable marker missing'
          s=s.replace(old,new,1)

          old="const dir=dirVec(e.vx||0,e.vy||0,'down'),{pack,ok}=enemyPack(e),arr=pack[dir]?.length?pack[dir]:pack.down,frame=Math.floor(e.walk||0)%Math.max(1,arr?.length||1),img=arr?.[frame],h=mobHeight(e);"
          new="const dir=enemyRenderDir(e),{pack,ok}=enemyPack(e),arr=pack[dir]?.length?pack[dir]:pack.down,frame=Math.floor(e.walk||0)%Math.max(1,arr?.length||1),img=arr?.[frame],h=mobHeight(e),esz=spriteSize(img);"
          assert old in s, 'drawEnemy direction marker missing'
          s=s.replace(old,new,1)
          old="if(ok&&img?.naturalWidth){const ratio=img.naturalWidth/Math.max(1,img.naturalHeight),side=['left','right'].includes(dir)?.84:1,w=h*ratio*side;"
          new="if(ok&&esz.w&&esz.h){const ratio=esz.w/Math.max(1,esz.h),side=['left','right'].includes(dir)?.84:1,w=h*ratio*side;"
          assert old in s, 'drawEnemy drawable marker missing'
          s=s.replace(old,new,1)

          checks={
            "ready.player=mapPlayer32(a,sprites.player)":"ready.player=mapPlayer32(a,sprites.player)&&packDrawable(sprites.player)",
            "ready.weapon=mapPlayer32(a,sprites.weapon)":"ready.weapon=mapPlayer32(a,sprites.weapon)&&packDrawable(sprites.weapon)",
            "ready.normal=mapMob32(a,sprites.normal)":"ready.normal=mapMob32(a,sprites.normal)&&packDrawable(sprites.normal)",
            "ready.elite1=mapMob32(a,sprites.elite1)":"ready.elite1=mapMob32(a,sprites.elite1)&&packDrawable(sprites.elite1)",
            "ready.corrupt1=mapMob32(a,sprites.corrupt1)":"ready.corrupt1=mapMob32(a,sprites.corrupt1)&&packDrawable(sprites.corrupt1)"
          }
          for a,b in checks.items():
              assert a in s, 'preload marker missing: '+a
              s=s.replace(a,b,1)

          cp.write_text(s,encoding='utf-8')

          sp=Path('cloud/game-server-v3.mjs')
          sv=sp.read_text(encoding='utf-8')
          assert "ONLINE_VERSION='0.17.37-online-v2.0.4'" in sv, 'server version marker missing'
          sv=sv.replace("ONLINE_VERSION='0.17.37-online-v2.0.4'","ONLINE_VERSION='0.17.37-online-v2.0.5'",1)
          sp.write_text(sv,encoding='utf-8')

          hp=Path('multiplayer-v2.html')
          h=hp.read_text(encoding='utf-8')
          assert '0.17.37-online-v2.0.4' in h, 'html version marker missing'
          h=h.replace('0.17.37-online-v2.0.4','0.17.37-online-v2.0.5')
          h=h.replace('/src/multiplayer-v2.js?v=01737v204','/src/multiplayer-v2.js?v=01737v205')
          hp.write_text(h,encoding='utf-8')
          PY

      - name: Validate render contract
        run: |
          node --check src/multiplayer-v2.js
          node --check cloud/game-server-v3.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/multiplayer-v2.js').read_text()
          assert "online-v2.0.5" in s
          assert "naturalWidth||im?.videoWidth||im?.width" in s
          assert "e.boss?dir4Vec" in s
          assert "if(ok&&esz.w&&esz.h)" in s
          assert "if(!sz.w||!sz.h)return" in s
          assert "packDrawable(sprites.normal)" in s
          assert "packDrawable(sprites.weapon)" in s
          print('sprite/canvas + weapon + boss-facing guards OK')
          PY
          node scripts/check-game.mjs

      - name: Commit V2.0.5
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/multiplayer-v2.js cloud/game-server-v3.mjs multiplayer-v2.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: multiplayer v2 canvas sprites weapon and boss facing'
          git push
