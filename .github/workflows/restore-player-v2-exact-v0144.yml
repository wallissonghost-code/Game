name: Restore Player V2 Exact v0.14.4
on:
  push:
    paths:
      - '.github/workflows/restore-player-v2-exact-v0144.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore exact V2 renderer and loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          GOOD='f7af781cd6930daff39cc9a4eae731a6164ae3d1'
          current=Path('index.html').read_text(encoding='utf-8')
          good=subprocess.check_output(['git','show',f'{GOOD}:index.html'],text=True)

          def extract_function(src, name):
              needle=f'function {name}('
              start=src.find(needle)
              if start<0: raise SystemExit(f'{name} não encontrada na build boa')
              brace=src.find('{',start)
              depth=0
              quote=None
              esc=False
              i=brace
              while i<len(src):
                  ch=src[i]
                  if quote:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: quote=None
                  else:
                      if ch in "'\"`": quote=ch
                      elif ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0: return src[start:i+1]
                  i+=1
              raise SystemExit(f'fim de {name} não encontrado')

          # Restaura o bloco V2 inteiro da última build comprovadamente funcional.
          marker='// PLAYER_V2_REAL_0138'
          good_a=good.find(marker)
          good_b=good.find('function resize()', good_a)
          cur_a=current.find(marker)
          cur_b=current.find('function resize()', cur_a)
          if min(good_a,good_b,cur_a,cur_b)<0:
              raise SystemExit('bloco PLAYER V2 não localizado')
          current=current[:cur_a]+good[good_a:good_b]+current[cur_b:]

          # Restaura drawPlayer exato da v0.13.9.
          good_fn=extract_function(good,'drawPlayer')
          cur_fn=extract_function(current,'drawPlayer')
          current=current.replace(cur_fn,good_fn,1)

          # v0.14.4
          current=current.replace("const VERSION='0.14.3'","const VERSION='0.14.4'",1)
          current=current.replace('<title>Caos Live v0.14.3</title>','<title>Caos Live v0.14.4</title>',1)
          current=current.replace('v0.14.3 · SKIN V2 LOADER FIX','v0.14.4 · SKIN V2 RESTAURADA',1)
          current=current.replace('<span class="startVersion">v0.14.3</span>','<span class="startVersion">v0.14.4</span>',1)
          current=current.replace('Build · Oficial1/2 prioritario · assets independentes','Build · Oficial1/Oficial2 + Arma3 · preload obrigatório',1)

          # Não inicia com fallback antigo: aguarda corpo V2 carregar.
          old="$('startBtn').onclick=reset;$('restartBtn').onclick=reset;"
          new="""const startButton=$('startBtn');
          let skinGateTimer=null;
          function updateSkinGate(){
            if(!startButton)return;
            if(playerV2Ready){startButton.disabled=false;startButton.textContent='ENTRAR NA ARENA';startButton.style.opacity='1';if(skinGateTimer){clearInterval(skinGateTimer);skinGateTimer=null}}
            else{startButton.disabled=true;startButton.textContent='CARREGANDO SKIN...';startButton.style.opacity='.58'}
          }
          updateSkinGate();skinGateTimer=setInterval(updateSkinGate,120);
          startButton.onclick=()=>{if(playerV2Ready)reset()};$('restartBtn').onclick=()=>{if(playerV2Ready)reset()};"""
          if old not in current: raise SystemExit('handler startBtn não encontrado')
          current=current.replace(old,new,1)

          Path('index.html').write_text(current,encoding='utf-8')
          PY
      - name: Validate exact V2
        run: |
          grep -q "const VERSION='0.14.4'" index.html
          grep -q "playerArmedFrames" index.html
          grep -q "if(playerV2Ready)" index.html
          grep -q "CARREGANDO SKIN" index.html
          grep -q "Arma3.zip" index.html
          grep -q "Oficial2.zip" index.html
      - name: Commit safely
        run: |
          git config user.name "wallissonghost-code"
          git config user.email "wallissonghost@gmail.com"
          git add index.html
          git commit -m "fix: restore exact working player V2 renderer v0.14.4"
          git pull --rebase origin main
          git push origin main
