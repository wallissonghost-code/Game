name: Apply Safe Perf V2

on:
  push:
    branches:
      - 'ci/perf-safe-v2'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/perf-safe-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply isolated patch
        run: node scripts/apply-safe-perf-v2.mjs
      - name: Syntax check
        run: node --check src/game.js
      - name: Commit patched game only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game.js
          git diff --cached --quiet && exit 0
          git commit -m "perf: safe corrupted optimization and meteor freeze v2"
          git push origin HEAD:ci/perf-safe-v2
