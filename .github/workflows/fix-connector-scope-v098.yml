name: Fix connector scope v0.9.8

on:
  push:
    paths:
      - '.github/workflows/fix-connector-scope-v098.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply scope fix
        run: python3 scripts/fix_connector_scope_v098.py
      - name: Validate connector syntax
        run: node --check cloud/connector-server.mjs
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud/connector-server.mjs version.json
          git diff --cached --quiet || git commit -m 'fix: connector skill scope crash v0.9.8'
          git push
