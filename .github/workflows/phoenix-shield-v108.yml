name: Phoenix Shield v0.10.8

on:
  push:
    paths:
      - 'tools/phoenix_shield_v108.py'
      - '.github/workflows/phoenix-shield-v108.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Phoenix shield patch
        run: python tools/phoenix_shield_v108.py
      - name: Validate
        run: |
          grep -q "drawPhoenixShield" index.html
          grep -q "phoenixShieldUntil" index.html
          grep -q "v0.10.8" index.html
          grep -q '"version": "0.10.8"' version.json
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git diff --cached --quiet && exit 0
          git commit -m "feat: Phoenix golden resurrection shield v0.10.8"
          git push
