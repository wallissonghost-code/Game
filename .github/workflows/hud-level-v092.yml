name: HUD level progress v0.9.2
on:
  push:
    paths:
      - '.github/workflows/hud-level-v092.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch HUD and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html')
          s=p.read_text()

          old_css=".version{display:inline-block;margin-top:4px;padding:3px 7px;border:1px solid #343b63;border-radius:999px;background:#0c1020cc;color:#aeb8df;font-size:8px;font-weight:800}"
          new_css=".version{display:inline-block;margin-top:4px;padding:3px 7px;border:1px solid #343b63;border-radius:999px;background:#0c1020cc;color:#aeb8df;font-size:8px;font-weight:900;white-space:nowrap;line-height:1}.stats small{display:block;margin-top:2px;color:#7f8ab4;font-size:6px;font-weight:800;white-space:nowrap}.stats small.near{color:#fbbf24}"
          if old_css in s:
              s=s.replace(old_css,new_css,1)

          import re
          s=re.sub(r'<div class="version">VERSÃO v[^<]+</div>', '<div class="version">v0.9.2</div>', s, count=1)

          old_lv='<div><span>LV</span><strong id="level">1</strong></div>'
          new_lv='<div><span>LV</span><strong id="level">1</strong><small id="levelPct">0%</small></div>'
          if old_lv in s:
              s=s.replace(old_lv,new_lv,1)

          old_ui="function ui(){$('level').textContent=level;$('xp').textContent=Math.floor(xp)+'/'+xpNeed;$('life').textContent=(Math.round(player.life*10)/10)+'/'+player.maxLife;$('mobCount').textContent=enemies.length;$('xpFill').style.width=Math.min(100,xp/xpNeed*100)+'%'}"
          new_ui="function ui(){const pct=Math.max(0,Math.min(100,Math.floor(xp/Math.max(1,xpNeed)*100)));$('level').textContent=level;$('xp').textContent=Math.floor(xp)+'/'+xpNeed;$('life').textContent=(Math.round(player.life*10)/10)+'/'+player.maxLife;$('mobCount').textContent=enemies.length;$('xpFill').style.width=pct+'%';const lp=$('levelPct');if(lp){lp.textContent=pct>=85?'QUASE LÁ · '+pct+'%':pct+'%';lp.classList.toggle('near',pct>=85)}}"
          if old_ui in s:
              s=s.replace(old_ui,new_ui,1)
          else:
              raise SystemExit('ui() pattern not found')

          s=s.replace("const VERSION='0.8.4'","const VERSION='0.9.2'",1)
          p.write_text(s)

          v={
            'version':'0.9.2',
            'label':'v0.9.2',
            'releasedAt':'2026-08-07T16:17:00-03:00',
            'build':'compact-version-level-progress',
            'notes':['Badge de versão compacto','Percentual visível para próximo level','QUASE LÁ acima de 85%','Mantém projéteis e cenário limpo']
          }
          Path('version.json').write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: compact HUD version and add level progress v0.9.2"
          git push
