name: Migrate armed/weapons PNG v0.17.0
on:
  push:
    paths:
      - '.github/workflows/migrate-armed-weapons-png-v0170.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/migrate-armed-weapons-png-v0170.py
      - run: node --check game.js
      - run: |
          test $(find assets/player-armed -maxdepth 1 -name 'Posearma*.png' | wc -l) -eq 32
          test $(find assets/weapons -maxdepth 1 -name 'frame_*.png' | wc -l) -eq 32
          grep -q "VERSION='0.17.0'" game.js
          grep -q "player-armed" game.js
          grep -q "WEAPON PNG READY 8DIR" game.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js
          git commit -m 'feat: migrate armed player and weapon assets to direct PNG v0.17.0'
          git push
