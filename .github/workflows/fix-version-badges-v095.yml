name: Fix shared version badges v0.9.5
on:
  push:
    paths:
      - '.github/workflows/fix-version-badges-v095.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Align game and admin version badges
        run: python scripts/fix-version-badges-v095.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud/connector-server.mjs index.html painel.html
          git diff --cached --quiet || git commit -m "fix: sync game and admin version badges to version.json"
          git push
