name: Caos Live v0.17.12 Manual Aim
on:
  push:
    paths:
      - '.github/workflows/release-v01712-manual-aim.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply optional gameplay mode
        run: python3 scripts/release_v01712_manual_aim.py
      - name: Validate JavaScript and project
        run: |
          node --check src/game.js
          node --check src/panel.js
          node scripts/check-game.mjs
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json index.html painel.html src/game.js src/panel.js src/styles/panel.css scripts/check-game.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'feat: optional movement aim gameplay v0.17.12'
          git push
