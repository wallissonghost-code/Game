name: Scale mobs v0.8.3
on:
  push:
    paths:
      - '.github/scripts/scale-mobs-v083.py'
      - '.github/workflows/scale-mobs-v083.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/scale-mobs-v083.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git diff --cached --quiet || git commit -m "fix: reduce Espectro and Ceifador scale v0.8.3"
          git push
