name: Version Sync v0.11.6
on:
  push:
    paths:
      - '.github/workflows/version-sync-v116.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync game and admin version UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          p=Path('index.html'); s=p.read_text()
          s=s.replace('<title>Caos Live v0.11.5</title>','<title>Caos Live v0.11.6</title>')
          s=s.replace("const VERSION='0.11.5'","const VERSION='0.11.6'")
          s=re.sub(r'<div class="version">v0\.11\.4 · DEATH CAM</div>', '<div class="version">v0.11.6 · PAINEL DE MORTE</div>', s, count=1)
          s=re.sub(r'<div class="version">v0\.11\.5 · PAINEL DE MORTE</div>', '<div class="version">v0.11.6 · PAINEL DE MORTE</div>', s, count=1)
          p.write_text(s)

          ap=Path('painel.html'); a=ap.read_text()
          a=a.replace('<title>Caos Admin v0.11.5</title>','<title>Caos Admin v0.11.6</title>')
          a=a.replace('.top a{color:#c4b5fd;text-decoration:none;font-size:12px}', '.top a{color:#c4b5fd;text-decoration:none;font-size:12px}.topMeta{display:flex;align-items:center;gap:8px}.topVersion{padding:5px 8px;border:1px solid #343b63;border-radius:999px;background:#0c1020;color:#aeb8df;font-size:9px;font-weight:900;white-space:nowrap}',1)
          old='<header class="top"><h1>CAOS <b>ADMIN</b></h1><a href="index.html">ABRIR JOGO</a></header>'
          new='<header class="top"><h1>CAOS <b>ADMIN</b></h1><div class="topMeta"><span class="topVersion">v0.11.6</span><a href="index.html?v=116">ABRIR JOGO</a></div></header>'
          if old not in a: raise SystemExit('admin header marker missing')
          a=a.replace(old,new,1)
          # Remove old bottom version label if present.
          a=re.sub(r'<div class="version">(?:PAINEL )?v0\.11\.5[^<]*</div>','',a)
          a=a.replace('PAINEL v0.11.5','PAINEL v0.11.6')
          ap.write_text(a)
          Path('version.json').write_text(json.dumps({'version':'0.11.6','label':'v0.11.6','releasedAt':'2026-08-08T16:36:00Z','build':'version-sync','notes':['Versão visível do jogo sincronizada com o build atual','Versão do painel movida para o cabeçalho superior','Links internos com cache-buster v116']},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit v0.11.6
        run: |
          git config user.name "wallissonghost-code"
          git config user.email "wallissonghost@gmail.com"
          git add index.html painel.html version.json
          git commit -m "fix: sync visible versions and move admin version to top v0.11.6" || exit 0
          git push
