name: Player Rig v0.12.6
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch-player-v126.py
      - run: |
          git config user.name "wallissonghost-code"
          git config user.email "wallissonghost@gmail.com"
          git add index.html painel.html version.json || true
          git diff --cached --quiet && exit 0
          git commit -m "fix: professional unified rotating player rig v0.12.6"
          git push
