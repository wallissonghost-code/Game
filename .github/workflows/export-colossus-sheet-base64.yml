name: Export Colossus Sheet Base64
on:
  push:
    paths: ['.github/workflows/export-colossus-sheet-base64.yml']
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export contact sheet as text
        run: |
          base64 -w 0 debug/colossus-inspect/contact-sheet.jpg > debug/colossus-inspect/contact-sheet.base64.txt
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/colossus-inspect/contact-sheet.base64.txt
          git diff --cached --quiet || git commit -m 'debug: export Colossus contact sheet base64'
          git push
