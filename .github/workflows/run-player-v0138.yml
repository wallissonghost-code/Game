name: Run Player v0.13.8

on:
  push:
    paths:
      - '.github/workflows/run-player-v0138.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar player V2 no jogo real
        run: python3 tools/apply_player_v0138.py
      - name: Commit
        run: |
          git config user.name "wallissonghost-code"
          git config user.email "wallissonghost@gmail.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: player Oficial1/2 Arma3 Municao v0.13.8"
          git push origin main
