name: Skin Test Municao v0.0.18

on:
  push:
    paths:
      - '.github/workflows/skin-test-ammo-v018.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar munição real e boca da arma
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('skin-test-local.html')
          s = p.read_text(encoding='utf-8')
          if 'AMMO_V018_PATCH' in s:
              print('patch já aplicado')
              raise SystemExit(0)
          s = s.replace('v0.0.17', 'v0.0.18')
          s = s.replace('AUTO TIRO + ALVO + RESPAWN', 'MUNICAO.ZIP + BOCA REAL + AUTO TIRO')
          addon = r'''<style id="AMMO_V018_PATCH">#shots{display:none!important}.ammoProjectile{position:absolute;z-index:40;pointer-events:none;object-fit:contain;filter:drop-shadow(0 0 5px rgba(250,204,21,.85));transform-origin:center center}</style><script>(async()=>{const arena=document.getElementById('arena'),weapon=document.getElementById('weapon'),enemy=document.getElementById('enemy');if(!arena||!weapon||!enemy)return;let ammoUrl=null;async function cleanAmmo(raw){return await new Promise(resolve=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});c.width=im.naturalWidth;c.height=im.naturalHeight;ctx.drawImage(im,0,0);let id=ctx.getImageData(0,0,c.width,c.height),d=id.data;for(let i=0;i<d.length;i+=4){const mn=Math.min(d[i],d[i+1],d[i+2]);if(mn>246)d[i+3]=0;else if(mn>225)d[i+3]=Math.round(d[i+3]*(246-mn)/21)}ctx.putImageData(id,0,0);let minX=c.width,minY=c.height,maxX=-1,maxY=-1;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){if(d[(y*c.width+x)*4+3]>12){minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}}if(maxX<0){resolve(raw);return}const pad=2,x0=Math.max(0,minX-pad),y0=Math.max(0,minY-pad),x1=Math.min(c.width-1,maxX+pad),y1=Math.min(c.height-1,maxY+pad),w=x1-x0+1,h=y1-y0+1,o=document.createElement('canvas');o.width=w;o.height=h;o.getContext('2d').drawImage(c,x0,y0,w,h,0,0,w,h);o.toBlob(b=>resolve(b?URL.createObjectURL(b):raw),'image/png')};im.onerror=()=>resolve(raw);im.src=raw})}try{const r=await fetch('./assets/weapons/Municao.zip?v=018',{cache:'no-store'});if(!r.ok)throw new Error('Municao.zip não carregou');const z=await JSZip.loadAsync(await r.arrayBuffer()),names=Object.keys(z.files).filter(n=>/\.png$/i.test(n)&&!z.files[n].dir).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));if(!names.length)throw new Error('Municao.zip sem PNG');const raw=URL.createObjectURL(await z.files[names[0]].async('blob'));ammoUrl=await cleanAmmo(raw);console.log('Municao.zip pronta:',names[0])}catch(e){console.error(e);return}function pointOnGunTowardTarget(){const ar=arena.getBoundingClientRect(),wr=weapon.getBoundingClientRect(),er=enemy.getBoundingClientRect();const wcx=wr.left+wr.width/2,wcy=wr.top+wr.height/2,tx=er.left+er.width/2,ty=er.top+er.height/2,dx=tx-wcx,dy=ty-wcy,len=Math.hypot(dx,dy)||1,nx=dx/len,ny=dy/len,hx=Math.max(3,wr.width/2),hy=Math.max(3,wr.height/2);const sx=Math.abs(nx)>0.001?hx/Math.abs(nx):Infinity,sy=Math.abs(ny)>0.001?hy/Math.abs(ny):Infinity,t=Math.min(sx,sy);return{x:wcx+nx*(t+3)-ar.left,y:wcy+ny*(t+3)-ar.top,tx:tx-ar.left,ty:ty-ar.top,angle:Math.atan2(dy,dx)*180/Math.PI}}function shootAmmo(){if(!ammoUrl||weapon.offsetParent===null||enemy.style.display==='none')return;const p=pointOnGunTowardTarget(),img=document.createElement('img');img.src=ammoUrl;img.className='ammoProjectile';img.style.width='20px';img.style.height='10px';img.style.left=p.x+'px';img.style.top=p.y+'px';img.style.transform=`translate(-50%,-50%) rotate(${p.angle}deg)`;arena.appendChild(img);const born=performance.now(),duration=260;function step(now){const q=Math.min(1,(now-born)/duration),ease=q;img.style.left=(p.x+(p.tx-p.x)*ease)+'px';img.style.top=(p.y+(p.ty-p.y)*ease)+'px';if(q<1)requestAnimationFrame(step);else img.remove()}requestAnimationFrame(step)}setInterval(shootAmmo,260)})();</script>'''
          s = s.replace('</body></html>', addon + '</body></html>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "wallissonghost-code"
          git config user.email "wallissonghost@gmail.com"
          git add skin-test-local.html
          git diff --cached --quiet && exit 0
          git commit -m "test: use Municao.zip from exact weapon muzzle v0.0.18"
          git push origin main
