name: Caos Live CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies first
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Validate current architecture
        run: |
          node scripts/check-ci-sanity.mjs
          npm run check:architecture
          npm run check:runtime
          npm run check:events
      - name: Smoke test menu and short gameplay
        run: npm run check:menu
      - name: Ghost aim regression · Rapid + close target + stale aim
        run: npm run check:ghost-aim
      - name: Full gameplay bot · mobile + desktop
        id: gameplay
        continue-on-error: true
        run: npm run check:gameplay
      - name: Accelerated progression · LV1 to LV50
        if: always()
        run: npm run check:progression
      - name: Fail if gameplay bot failed
        if: always() && steps.gameplay.outcome == 'failure'
        run: exit 1
