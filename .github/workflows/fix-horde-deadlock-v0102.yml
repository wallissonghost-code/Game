name: Fix Horde Deadlock v0.10.2

on:
  push:
    paths:
      - '.github/workflows/fix-horde-deadlock-v0102.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply horde watchdog
        run: node scripts/fix-horde-deadlock-v0102.mjs
      - name: Validate connector syntax
        run: node --check cloud/connector-server.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud/connector-server.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: prevent horde deadlock v0.10.2"
          git push origin main
