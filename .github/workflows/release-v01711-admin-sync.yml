name: Caos Live v0.17.11 Admin Sync
on:
  push:
    paths:
      - '.github/workflows/release-v01711-admin-sync.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply release patch
        run: python3 scripts/release-v01711.py
      - name: Validate JavaScript and project
        run: |
          node --check src/game.js
          node --check src/panel.js
          node --check cloud/connector-server.mjs
          node scripts/check-game.mjs
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json index.html painel.html src/game.js src/panel.js src/styles/panel.css scripts/check-game.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: synchronized admin reliability v0.17.11'
          git push
