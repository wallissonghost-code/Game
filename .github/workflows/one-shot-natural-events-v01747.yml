name: One-shot Natural Events v0.17.47
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Align Natural Events runtime version guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/core/natural-events-runtime.mjs')
          s=p.read_text(encoding='utf-8')
          old="else if (!s.includes(\"VERSION='0.17.46'\")) throw new Error('NaturalEvents/version: unsupported runtime version');"
          new="else if (!s.includes(\"VERSION='0.17.46'\") && !s.includes(\"VERSION='0.17.47'\")) throw new Error('NaturalEvents/version: unsupported runtime version');"
          if old not in s:
              raise SystemExit('expected Natural Events version guard not found')
          s=s.replace(old,new,1)
          s=s.replace('// v0.17.46 is already the active classic runtime. Keep compatibility with', '// v0.17.47 is the active classic runtime. Keep compatibility with',1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check src/core/natural-events-runtime.mjs
          npm run check:events
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/natural-events-runtime.mjs
          git commit -m 'fix: accept v0.17.47 in natural events runtime'
          git push
