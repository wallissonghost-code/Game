name: Player 8 Direction Rig v0.12.5
on:
  push:
    paths:
      - '.github/workflows/player-8dir-v125.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch player rig
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('Caos Live v0.12.4','Caos Live v0.12.5')
          s=s.replace('v0.12.4 · SOLDADO RIG 2.0','v0.12.5 · SOLDADO 8 DIREÇÕES')
          s=s.replace("const VERSION='0.12.4'","const VERSION='0.12.5'")

          pat=r"function drawPlayer\(\)\{.*?\}function drawPhoenixShield\(\)\{"
          repl=r'''function drawPlayer(){
            ctx.save();ctx.translate(W/2,H/2);
            const a=player.aim||0,TAU=Math.PI*2;
            const norm=(a%TAU+TAU)%TAU;
            const dir=Math.round(norm/(Math.PI/4))%8;
            const back=dir>=5&&dir<=7;
            const rightSide=dir===0||dir===1||dir===7;
            const leftSide=dir===3||dir===4||dir===5;
            const diag=dir===1||dir===3||dir===5||dir===7;
            const bob=player.moving?Math.sin(player.walk*Math.PI*.5)*1.1:0;
            const step=player.moving?Math.sin(player.walk*Math.PI*.5)*2.2:0;

            // sombra
            ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,26,22,7,0,0,TAU);ctx.fill();
            ctx.save();ctx.translate(0,bob);

            // pernas - duas apenas, com passada discreta
            ctx.fillStyle='#20261b';ctx.fillRect(-10+step*.35,12,8,15);ctx.fillRect(2-step*.35,12,8,15);
            ctx.fillStyle='#11160f';ctx.fillRect(-12+step*.35,23,11,6);ctx.fillRect(1-step*.35,23,11,6);

            // torso/colete; sem blocos laterais que pareçam braços
            ctx.fillStyle='#354029';ctx.beginPath();ctx.roundRect(-15,-10,30,27,5);ctx.fill();
            ctx.fillStyle='#20281b';ctx.beginPath();ctx.roundRect(-11,-7,22,21,4);ctx.fill();

            if(back){
              // costas/mochila quando mira para cima
              ctx.fillStyle='#29331f';ctx.beginPath();ctx.roundRect(-11,-7,22,23,4);ctx.fill();
              ctx.fillStyle='#172015';ctx.fillRect(-7,-3,14,4);ctx.fillRect(-7,4,14,4);
              ctx.strokeStyle='#56623f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-9,-7);ctx.lineTo(-12,12);ctx.moveTo(9,-7);ctx.lineTo(12,12);ctx.stroke();
            }else{
              // frente do colete
              ctx.fillStyle='#56623a';ctx.fillRect(-7,-4,14,7);
              ctx.fillStyle='#78855a';ctx.fillRect(-5,-2,4,3);ctx.fillRect(2,-2,4,3);
              ctx.fillStyle='#161b13';ctx.fillRect(-1,3,2,10);
            }

            // pescoço/cabeça
            ctx.fillStyle='#b18a61';ctx.fillRect(-5,-17,10,8);
            ctx.fillStyle='#1a2017';ctx.beginPath();ctx.arc(0,-19,13,0,TAU);ctx.fill();

            // capacete muda conforme direção
            ctx.fillStyle='#677044';ctx.beginPath();ctx.arc(0,-22,14,Math.PI,TAU);ctx.lineTo(14,-18);ctx.lineTo(-14,-18);ctx.closePath();ctx.fill();
            ctx.fillStyle='#808957';ctx.fillRect(-10,-26,8,3);
            if(back){
              ctx.fillStyle='#40492f';ctx.fillRect(-12,-19,24,5);
            }else if(rightSide||leftSide){
              ctx.fillStyle='#050706';ctx.fillRect(rightSide?-2:-12,-20,14,6);
              ctx.fillStyle='#c7b879';ctx.fillRect(rightSide?5:-9,-19,3,2);
            }else{
              ctx.fillStyle='#050706';ctx.fillRect(-10,-20,20,6);
              ctx.fillStyle='#c7b879';ctx.fillRect(-6,-19,3,2);ctx.fillRect(3,-19,3,2);
            }

            // arma: sempre segue a mira real; PNG nunca é espelhado verticalmente
            const recoil=player.shotFlash>0?-1.5:0;
            const gripRear=11+recoil,gripFront=22+recoil,gunBase=7+recoil;
            const shoulderSpread=diag?8:9;
            const sx1=-shoulderSpread,sy1=-4,sx2=shoulderSpread,sy2=-3;
            const hx1=Math.cos(a)*gripRear,hy1=Math.sin(a)*gripRear-1;
            const hx2=Math.cos(a)*gripFront,hy2=Math.sin(a)*gripFront+1;

            // exatamente dois braços, conectados aos ombros e às mãos
            function arm(x1,y1,x2,y2){
              ctx.strokeStyle='#2f3924';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
              ctx.strokeStyle='#596640';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
            }
            arm(sx1,sy1,hx1,hy1);arm(sx2,sy2,hx2,hy2);

            // rifle preso entre as duas mãos
            ctx.save();ctx.translate(Math.cos(a)*gunBase,Math.sin(a)*gunBase-1);ctx.rotate(a);
            if(weaponReady){ctx.imageSmoothingEnabled=true;ctx.drawImage(weaponSprite,-4,-6,34,12)}
            else{ctx.fillStyle='#171c1d';ctx.fillRect(-4,-4,32,8);ctx.fillStyle='#4b5563';ctx.fillRect(16,-2,18,4)}
            ctx.restore();

            // mãos por cima da arma escondem qualquer emenda
            ctx.fillStyle='#b98b5f';ctx.beginPath();ctx.arc(hx1,hy1,4,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(hx2,hy2,4,0,TAU);ctx.fill();
            ctx.restore();ctx.restore();
          }function drawPhoenixShield(){'''
          s2,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('drawPlayer block not found')
          p.write_text(s2)

          q=Path('painel.html')
          if q.exists():
            a=q.read_text()
            a=a.replace('Caos Admin v0.12.4','Caos Admin v0.12.5').replace('v0.12.4</span>','v0.12.5</span>').replace('index.html?v=124','index.html?v=125')
            q.write_text(a)
          Path('version.json').write_text(json.dumps({'version':'0.12.5','label':'v0.12.5','releasedAt':'2026-08-08T17:57:00Z','build':'soldier-8-direction-rig','notes':['Soldado com 8 orientações reais baseadas na mira','Costas e mochila aparecem ao mirar para cima','Perfil e diagonais alteram a silhueta','Exatamente dois braços presos ao corpo','Rifle preso às mãos e sem flip vertical']},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Validate
        run: |
          grep -q "v0.12.5 · SOLDADO 8 DIREÇÕES" index.html
          grep -q "const VERSION='0.12.5'" index.html
          grep -q "const dir=Math.round" index.html
          grep -q "Exatamente dois braços\|exatamente dois braços" index.html
          grep -q '"version": "0.12.5"' version.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html painel.html version.json
          git commit -m "feat: v0.12.5 8-direction soldier rig" || exit 0
          git push
