name: Caos Live v0.17.14 Gameplay Modes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v01714-gameplay-weapon.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply gameplay and weapon release
        run: node scripts/release-v01714-gameplay-weapon.mjs
      - name: Validate JavaScript
        run: |
          node --check src/game.js
          node --check src/panel.js
          node --check scripts/check-game.mjs
      - name: Validate project
        run: node scripts/check-game.mjs
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game.js src/panel.js painel.html src/styles/panel.css index.html version.json scripts/check-game.mjs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: gameplay Classico Varredura Hardcore + weapon calibration v0.17.14"
            git push origin main
          fi
