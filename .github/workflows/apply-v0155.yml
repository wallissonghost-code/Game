name: Apply v0.15.5
on:
  push:
    paths:
      - '.github/workflows/apply-v0155.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_v0155_play_touch.py
      - run: node --check src/game.js
      - run: |
          git config user.name wallissonghost-code
          git config user.email wallissonghost@gmail.com
          git add src/game.js src/styles/game.css index.html version.json
          git commit -m 'fix: restore play button touch on iOS v0.15.5'
          git pull --rebase origin main
          git push origin main
