name: Player Rig v0.12.4
on:
  push:
    paths:
      - '.github/workflows/player-rig-v124.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild player rig
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          p=Path('index.html'); s=p.read_text()
          s=s.replace('Caos Live v0.12.3','Caos Live v0.12.4').replace('v0.12.3 · RIG ESTÁVEL','v0.12.4 · SOLDADO RIG 2.0').replace("const VERSION='0.12.3'","const VERSION='0.12.4'")
          pat=r"function drawPlayer\(\)\{.*?\}function drawPhoenixShield\(\)\{"
          repl=r'''function drawPlayer(){
            ctx.save();ctx.translate(W/2,H/2);
            ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(0,25,23,7,0,0,Math.PI*2);ctx.fill();
            const a=player.aim||0,facing=Math.cos(a)>=0?1:-1;
            let la=facing===1?a:Math.PI-a;
            while(la>Math.PI)la-=Math.PI*2;while(la<-Math.PI)la+=Math.PI*2;
            la=Math.max(-1.28,Math.min(1.28,la));
            const bob=player.moving?Math.sin(player.walk*Math.PI*.5)*.65:0;
            ctx.translate(0,bob);ctx.scale(facing,1);
            ctx.imageSmoothingEnabled=false;

            // pernas e botas: parte do corpo, sem braços embutidos
            ctx.fillStyle='#26311f';ctx.fillRect(-12,9,9,15);ctx.fillRect(3,9,9,15);
            ctx.fillStyle='#111713';ctx.fillRect(-13,19,11,7);ctx.fillRect(2,19,11,7);
            ctx.fillStyle='#53613a';ctx.fillRect(-10,10,5,4);ctx.fillRect(5,10,5,4);

            // tronco / colete
            ctx.fillStyle='#344128';ctx.beginPath();ctx.roundRect(-15,-9,30,25,4);ctx.fill();
            ctx.fillStyle='#56633b';ctx.fillRect(-12,-7,24,6);
            ctx.fillStyle='#20291d';ctx.fillRect(-10,1,20,13);
            ctx.fillStyle='#647346';ctx.fillRect(-7,3,5,7);ctx.fillRect(2,3,5,7);
            ctx.fillStyle='#0f1511';ctx.fillRect(-2,-7,4,21);
            ctx.fillStyle='#727f4c';ctx.fillRect(-16,-5,4,9);ctx.fillRect(12,-5,4,9);

            // cabeça, máscara e capacete
            ctx.fillStyle='#b58a62';ctx.fillRect(-10,-22,20,13);
            ctx.fillStyle='#111713';ctx.fillRect(-11,-18,22,10);
            ctx.fillStyle='#667342';ctx.beginPath();ctx.arc(0,-22,13,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-13,-23,26,5);
            ctx.fillStyle='#7d894f';ctx.fillRect(-7,-30,9,4);ctx.fillRect(3,-27,7,3);
            ctx.fillStyle='#0a0d0b';ctx.fillRect(-8,-17,16,4);
            ctx.fillStyle='#c7b66d';ctx.fillRect(-6,-16,3,2);ctx.fillRect(3,-16,3,2);

            // arma e braços compartilham o MESMO pivô
            if(weaponReady){
              const recoil=player.shotFlash>0?-1.3:0;
              const ox=2,oy=-1,ca=Math.cos(la),sa=Math.sin(la),px=-sa,py=ca;
              const rear={x:ox+ca*(7+recoil)+px*3,y:oy+sa*(7+recoil)+py*3};
              const front={x:ox+ca*(19+recoil)+px*2,y:oy+sa*(19+recoil)+py*2};
              const shoulderRear={x:-10,y:-3},shoulderFront={x:10,y:-3};
              function arm(sx,sy,hx,hy){
                const mx=sx+(hx-sx)*.48,my=sy+(hy-sy)*.48+2;
                ctx.lineCap='round';ctx.lineJoin='round';
                ctx.strokeStyle='#52613a';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(mx,my);ctx.lineTo(hx,hy);ctx.stroke();
                ctx.strokeStyle='#26311f';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(mx,my);ctx.stroke();
              }
              arm(shoulderRear.x,shoulderRear.y,rear.x,rear.y);
              arm(shoulderFront.x,shoulderFront.y,front.x,front.y);

              ctx.save();ctx.translate(ox,oy);ctx.rotate(la);ctx.imageSmoothingEnabled=true;
              ctx.drawImage(weaponSprite,-7+recoil,-6,34,12);ctx.restore();

              // mãos ficam sobre a arma e escondem as emendas
              ctx.fillStyle='#c79a6d';
              ctx.beginPath();ctx.arc(rear.x,rear.y,3.7,0,Math.PI*2);ctx.fill();
              ctx.beginPath();ctx.arc(front.x,front.y,3.7,0,Math.PI*2);ctx.fill();
              ctx.fillStyle='#8b6849';ctx.beginPath();ctx.arc(rear.x-.7,rear.y+.7,1.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(front.x-.7,front.y+.7,1.2,0,Math.PI*2);ctx.fill();
            }else{
              ctx.fillStyle='#52613a';ctx.fillRect(-17,-4,6,14);ctx.fillRect(11,-4,6,14);
              ctx.fillStyle='#c79a6d';ctx.fillRect(-18,7,7,6);ctx.fillRect(11,7,7,6);
            }
            ctx.restore();
          }function drawPhoenixShield(){'''
          s2,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('drawPlayer marker missing')
          p.write_text(s2)

          q=Path('painel.html'); a=q.read_text()
          a=a.replace('Caos Admin v0.12.3','Caos Admin v0.12.4').replace('v0.12.3</span>','v0.12.4</span>').replace('index.html?v=123','index.html?v=124')
          q.write_text(a)
          Path('version.json').write_text(json.dumps({'version':'0.12.4','label':'v0.12.4','releasedAt':'2026-08-08T17:39:00Z','build':'soldier-rig-2','notes':['Soldado redesenhado sem braços embutidos no sprite','Exatamente dois braços conectados aos ombros','Duas mãos fixas nos pontos de empunhadura','Rifle usa o mesmo pivô do corpo e nunca recebe flip vertical','Corpo e arma espelham juntos para esquerda/direita']},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Validate
        run: |
          grep -q "v0.12.4" index.html
          grep -q "SOLDADO RIG 2.0" index.html
          grep -q "function arm" index.html
          grep -q "v0.12.4" painel.html
          grep -q '"version": "0.12.4"' version.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html painel.html version.json
          git commit -m "fix: v0.12.4 rebuild soldier as single two-arm rig" || exit 0
          git push
