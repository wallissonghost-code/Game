name: Replace Player Render v0.13.9

on:
  push:
    paths:
      - '.github/workflows/replace-player-render-v0139.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Substituir somente o render do player
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('function drawPlayer(){')
          end=s.find('function drawPhoenixShield()',start)
          if start<0 or end<0:
              raise SystemExit('limites drawPlayer não encontrados')
          newdraw='''function drawPlayer(){
            ctx.save();ctx.translate(W/2,H/2);
            ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(0,25,23,7,0,0,Math.PI*2);ctx.fill();
            const a=player.aim||0,dir=playerFacing(a),frame=player.moving?Math.floor(player.walk)%4:0,bob=player.moving?Math.sin(player.walk*Math.PI*.5)*.8:0;
            if(playerV2Ready){
              const pack=autoFire?playerArmedFrames:playerBaseFrames,arr=pack[dir]?.length?pack[dir]:pack.down,img=arr[frame%arr.length]||arr[0];
              const h=80,bodyRatio=(img.naturalWidth&&img.naturalHeight)?img.naturalWidth/img.naturalHeight:.8,w=Math.min(78,h*bodyRatio),bottom=36+bob;
              if(autoFire&&dir==='up'&&backV2Ready){const ba=playerBackFrames.up,bi=ba[frame%ba.length]||ba[0],bh=43,br=(bi.naturalWidth&&bi.naturalHeight)?bi.naturalWidth/bi.naturalHeight:.45,bw=Math.min(27,bh*br);ctx.save();ctx.imageSmoothingEnabled=true;ctx.drawImage(bi,-bw/2,-50+bob,bw,bh);ctx.restore()}
              ctx.save();ctx.imageSmoothingEnabled=true;ctx.drawImage(img,-w/2,bottom-h,w,h);ctx.restore();
              if(autoFire&&dir!=='up'&&weaponV2Ready){
                const wd=dir==='left'?'right':dir==='right'?'left':dir,wa=playerWeaponFrames[wd]?.length?playerWeaponFrames[wd]:playerWeaponFrames.down,wi=wa[frame%wa.length]||wa[0];
                const ratio=(wi.naturalWidth&&wi.naturalHeight)?wi.naturalWidth/wi.naturalHeight:1;
                let wx=0,wy=-1,maxW=50,maxH=30;
                if(dir==='right'){wx=14;maxW=50;maxH=27}else if(dir==='left'){wx=-14;maxW=50;maxH=27}else if(dir==='down'){wx=1;wy=0;maxW=30;maxH=39}
                let ww=maxW,wh=ww/Math.max(.05,ratio);if(wh>maxH){wh=maxH;ww=wh*ratio}
                ctx.save();ctx.imageSmoothingEnabled=true;ctx.drawImage(wi,wx-ww/2,wy-wh/2+bob,ww,wh);ctx.restore()
              }
              if(autoFire&&player.shotFlash>0){const m=muzzleLocal(dir);ctx.save();ctx.globalCompositeOperation='screen';ctx.fillStyle='#fff7b2';ctx.shadowColor='#f59e0b';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(m.x,m.y+bob,4.2,0,Math.PI*2);ctx.fill();ctx.restore()}
              ctx.restore();return;
            }
            const frameOld=player.moving?Math.floor(player.walk)%4:0,row=player.moving?1:0,fs=48,size=72;
            ctx.save();ctx.translate(0,bob);ctx.rotate(a);
            if(soldierReady&&soldierSprite.naturalWidth>=192){ctx.save();ctx.imageSmoothingEnabled=false;ctx.rotate(Math.PI/2);ctx.drawImage(soldierSprite,frameOld*fs,row*fs,fs,fs,-size/2,-size/2-5,size,size);ctx.restore()}else{ctx.fillStyle='#374151';ctx.beginPath();ctx.roundRect(-13,-19,26,38,8);ctx.fill();ctx.fillStyle='#556b2f';ctx.beginPath();ctx.roundRect(-10,-15,20,26,6);ctx.fill();ctx.fillStyle='#c7996b';ctx.beginPath();ctx.arc(0,-18,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3d4b27';ctx.beginPath();ctx.arc(0,-21,11,Math.PI,Math.PI*2);ctx.fill()}
            if(weaponReady){const recoil=player.shotFlash>0?-2:0;ctx.save();ctx.translate(11+recoil,-1);ctx.imageSmoothingEnabled=true;ctx.drawImage(weaponSprite,-7,-6,34,12);ctx.restore()}ctx.restore();ctx.restore();
          }'''
          s=s[:start]+newdraw+s[end:]
          s=s.replace('Caos Live v0.13.8','Caos Live v0.13.9')
          s=s.replace("const VERSION='0.13.8'","const VERSION='0.13.9'")
          s=s.replace('v0.13.8 · PLAYER ARMADO V2','v0.13.9 · RED DOT CORRIGIDO')
          s=s.replace('<span class="startVersion">v0.13.8</span>','<span class="startVersion">v0.13.9</span>')
          s=s.replace('Build · Oficial1/2 + Arma3 + Munição','Build · Arma3 proporcional + red dot corrigido')
          p.write_text(s,encoding='utf-8')
          print('drawPlayer substituído; v0.13.9')
          PY
      - name: Commit
        run: |
          git config user.name "wallissonghost-code"
          git config user.email "wallissonghost@gmail.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: replace player renderer and correct front red dot v0.13.9"
          git push origin main
