name: Combat Range + Auto Focus v0.11.7
on:
  push:
    paths:
      - '.github/workflows/combat-range-auto-focus-v117.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch attack range and auto focus lock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          p=Path('index.html'); s=p.read_text(); original=s
          s=s.replace('<title>Caos Live v0.11.6</title>','<title>Caos Live v0.11.7</title>')
          s=s.replace("const VERSION='0.11.6'","const VERSION='0.11.7'")
          s=re.sub(r'<div class="version">v0\.11\.6[^<]*</div>','<div class="version">v0.11.7 · RANGE + FOCO</div>',s,count=1)

          # Auto target lock state
          old='autoFire=true,runStartedAt=0,waveCount=0,deathState=null;const skillLv='
          new='autoFire=true,runStartedAt=0,waveCount=0,deathState=null,autoTarget=null,autoTargetUntil=0;const skillLv='
          if old not in s: raise SystemExit('state marker missing')
          s=s.replace(old,new,1)
          s=s.replace('autoFire=true;runStartedAt=performance.now();waveCount=0;deathState=null;', 'autoFire=true;runStartedAt=performance.now();waveCount=0;deathState=null;autoTarget=null;autoTargetUntil=0;',1)

          # Locked target helper; keeps same target ~2.2s unless dead/far.
          marker='function flash(){'
          helper="""function focusedTarget(){const now=performance.now();if(autoTarget&&(!autoTarget.dead)&&enemies.includes(autoTarget)){const d=Math.hypot(autoTarget.x-player.x,autoTarget.y-player.y);if(d<680&&now<autoTargetUntil)return autoTarget}autoTarget=nearest();autoTargetUntil=now+2200;return autoTarget}function clearAutoTarget(){autoTarget=null;autoTargetUntil=0}"""
          if marker not in s: raise SystemExit('focus insert marker missing')
          s=s.replace(marker,helper+marker,1)

          # Shoot uses focus lock only in automatic mode.
          old='function shoot(){const t=nearest();if(!t)return;player.aim=Math.atan2(t.y-player.y,t.x-player.x);'
          new='function shoot(){const t=autoMode?focusedTarget():nearest();if(!t)return;player.aim=Math.atan2(t.y-player.y,t.x-player.x);'
          if old not in s: raise SystemExit('shoot marker missing')
          s=s.replace(old,new,1)

          # Aim tracking also respects focus lock.
          old="if(autoFire){const target=nearest();if(target)player.aim=Math.atan2(target.y-player.y,target.x-player.x)}else if(player.moving){player.aim=Math.atan2(dy,dx)}"
          new="if(autoFire){const target=autoMode?focusedTarget():nearest();if(target)player.aim=Math.atan2(target.y-player.y,target.x-player.x)}else if(player.moving){player.aim=Math.atan2(dy,dx)}"
          if old not in s: raise SystemExit('aim marker missing')
          s=s.replace(old,new,1)

          # Clear lock when automatic mode is toggled.
          old="if(c==='auto'){autoMode=!!d.value;pointer=null}"
          new="if(c==='auto'){autoMode=!!d.value;pointer=null;clearAutoTarget()}"
          if old not in s: raise SystemExit('auto command marker missing')
          s=s.replace(old,new,1)

          # Mobs attack from their ring/range instead of requiring body collision.
          old="if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r){const now=performance.now();if(now>=(e.attackAt||0)&&player.inv<=0&&now>invincibleUntil){e.attackAt=now+900;e.attackFlash=.18;player.life=Math.max(0,player.life-e.damage);player.inv=.28;const kx=e.x-player.x,ky=e.y-player.y,kd=Math.hypot(kx,ky)||1;e.x+=kx/kd*10;e.y+=ky/kd*10;if(player.life<=0){if(!tryPhoenix())beginDeath(e)}}}"
          new="""{const hitDist=Math.hypot(e.x-player.x,e.y-player.y),attackRange=player.r+e.r+(e.max>=100?58:38);if(hitDist<attackRange){const now=performance.now();if(now>=(e.attackAt||0)&&player.inv<=0&&now>invincibleUntil){e.attackAt=now+(e.max>=100?1100:900);e.attackFlash=.18;player.life=Math.max(0,player.life-e.damage);player.inv=.28;const kx=e.x-player.x,ky=e.y-player.y,kd=Math.hypot(kx,ky)||1;e.x+=kx/kd*8;e.y+=ky/kd*8;if(player.life<=0){if(!tryPhoenix())beginDeath(e)}}}}"""
          if old not in s: raise SystemExit('attack collision marker missing')
          s=s.replace(old,new,1)

          p.write_text(s)

          ap=Path('painel.html')
          if ap.exists():
            a=ap.read_text()
            a=a.replace('Caos Admin v0.11.6','Caos Admin v0.11.7')
            a=a.replace('v0.11.6','v0.11.7')
            ap.write_text(a)

          Path('version.json').write_text(json.dumps({
            'version':'0.11.7','label':'v0.11.7','releasedAt':'2026-08-08T16:45:00Z','build':'combat-range-auto-focus',
            'notes':[
              'Mobs atacam dentro de uma zona de alcance ao redor do player, sem precisar colidir com o corpo',
              'Bosses possuem alcance de ataque maior e cooldown levemente maior',
              'Auto Inteligente trava o foco no mesmo alvo por cerca de 2,2 segundos',
              'O alvo só troca antes do tempo se morrer ou sair muito longe',
              'Redução de jitter da mira/câmera causado por troca de alvo a cada frame'
            ]
          },ensure_ascii=False,indent=2)+'\n')
          if s==original: raise SystemExit('no game changes')
          PY
      - name: Commit v0.11.7
        run: |
          git config user.name "wallissonghost-code"
          git config user.email "wallissonghost@gmail.com"
          git add index.html painel.html version.json
          git commit -m "feat: mob attack range and auto target focus v0.11.7" || exit 0
          git push
