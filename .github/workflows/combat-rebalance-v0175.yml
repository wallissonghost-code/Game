name: Solo special events v0.17.41
on:
  push:
    paths:
      - '.github/workflows/combat-rebalance-v0175.yml'
      - 'scripts/fix-special-events-v01741.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Solo v0.17.41 special events
        run: python3 scripts/fix-special-events-v01741.py
      - name: Validate special events and release isolation
        run: |
          node --check src/game.js
          node --check src/panel.js
          node scripts/check-game.mjs
          grep -q "VERSION='0.17.41'" src/game.js
          grep -q "doubleXpEvent=false" src/game.js
          grep -q "xpEventMul:doubleXpEvent?2:1" src/game.js
          grep -q "fillText('2× XP'" src/game.js
          grep -q "function updateMeteorEvent" src/game.js
          grep -q "function drawMeteorFx" src/game.js
          grep -q "eventdoublexp" src/game.js
          grep -q "eventmeteorconfig" src/game.js
          grep -q "eventmeteor" src/game.js
          grep -q "doubleXpEventToggle" painel.html
          grep -q "meteorEventToggle" painel.html
          grep -q "meteorConfigSave" painel.html
          grep -q "syncSpecialEventState" src/panel.js
          grep -q "solo-special-events-double-xp-meteor-rain" version.json
          grep -q "src/game.js?v=01741" index.html
          grep -q "src/panel.js?v=01741" painel.html
          grep -q "backup/solo-v0.17.40-stable" docs/RECOVERY.md
          grep -q "ONLINE_VERSION='0.17.37-online-v2.0.5'" src/multiplayer-v2.js
          ! grep -q "ONLINE_VERSION='0.17.41" src/multiplayer-v2.js
      - name: Commit Solo v0.17.41
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.js src/panel.js index.html painel.html duo.html map-lab.html version.json docs/RECOVERY.md
          git diff --cached --quiet && exit 0
          git commit -m 'feat: Double XP and Meteor Rain events v0.17.41'
          git push
