name: Combat rebalance v0.17.5
on:
  push:
    paths:
      - '.github/workflows/combat-rebalance-v0175.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/combat-rebalance-v0175.py
      - run: node --check src/game.js
      - run: |
          grep -q "VERSION='0.17.5'" src/game.js
          grep -q "Munição Perfurante" src/game.js
          grep -q "softCap" src/game.js
          grep -q "waves-dual-aura-piercing" version.json
          grep -q "src/game.js?v=0175" index.html
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.js index.html version.json
          git commit -m 'feat: rebalance waves, dual auras and piercing ammo v0.17.5'
          git push
