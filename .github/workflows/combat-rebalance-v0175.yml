name: Solo persistent meteor config v0.17.43
on:
  push:
    paths:
      - '.github/workflows/combat-rebalance-v0175.yml'
      - 'scripts/fix-meteor-persistence-v01743.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Solo v0.17.43 meteor persistence
        run: python3 scripts/fix-meteor-persistence-v01743.py
      - name: Validate persistent meteor configuration
        run: |
          node --check src/game.js
          node --check src/panel.js
          node scripts/check-game.mjs
          grep -q "VERSION='0.17.43'" src/game.js
          grep -q "METEOR_CONFIG_KEY='caos-meteor-config-v1'" src/game.js
          grep -q "function saveMeteorConfig" src/game.js
          grep -q "function loadMeteorConfig" src/game.js
          grep -q "applyMeteorConfig(cfg,false)" src/game.js
          grep -q "METEOR_CONFIG_KEY='caos-meteor-config-v1'" src/panel.js
          grep -q "function persistMeteorPanelConfig" src/panel.js
          grep -q "function loadMeteorPanelConfig" src/panel.js
          grep -q "SALVO NESTE DISPOSITIVO" src/panel.js
          grep -q "Configuração persistente neste dispositivo" painel.html
          grep -q "solo-persistent-meteor-admin-config" version.json
          grep -q "src/game.js?v=01743" index.html
          grep -q "src/panel.js?v=01743" painel.html
          grep -q "backup/solo-v0.17.42-stable" docs/RECOVERY.md
          grep -q "ONLINE_VERSION='0.17.37-online-v2.0.5'" src/multiplayer-v2.js
          ! grep -q "ONLINE_VERSION='0.17.43" src/multiplayer-v2.js
      - name: Commit Solo v0.17.43
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.js src/panel.js index.html painel.html duo.html map-lab.html version.json docs/RECOVERY.md
          git diff --cached --quiet && exit 0
          git commit -m 'fix: persist meteor admin configuration v0.17.43'
          git push
