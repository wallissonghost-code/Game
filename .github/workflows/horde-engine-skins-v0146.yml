name: Horde Skins v0.14.6
on:
  push:
    paths: ['.github/workflows/horde-engine-skins-v0146.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace("const VERSION='0.14.5'","const VERSION='0.14.6'",1)
          s=s.replace('Caos Live v0.14.5','Caos Live v0.14.6')
          s=s.replace('v0.14.5 · FPS BOOST','v0.14.6 · HORDE ENGINE',1)
          s=s.replace('<span class="startVersion">v0.14.5</span>','<span class="startVersion">v0.14.6</span>',1)
          s=s.replace('const MAX_ENEMIES=230,GRID=64,CHUNK=640;','const MAX_ENEMIES=320,GRID=64,CHUNK=640;',1)
          s=s.replace("attackAt:0,attackFlash:0,facing:'down'})","attackAt:0,attackFlash:0,facing:'down',skinVariant:Math.floor(Math.random()*3),aiPhase:Math.floor(Math.random()*4),mvx:0,mvy:0})",1)
          anchor='function drawOgreSkin(e,isBoss){'
          helper="const mobSkinCache=new WeakMap();function mobSkinFrame(img,v){if(!img||!v)return img;let m=mobSkinCache.get(img);if(!m){m=new Map();mobSkinCache.set(img,m)}if(m.has(v))return m.get(v);const c=document.createElement('canvas');c.width=img.naturalWidth||img.width;c.height=img.naturalHeight||img.height;const x=c.getContext('2d');x.drawImage(img,0,0);x.globalCompositeOperation='source-atop';x.globalAlpha=.22;x.fillStyle=v===1?'#34d399':'#ef4444';x.fillRect(0,0,c.width,c.height);x.globalAlpha=1;x.globalCompositeOperation='source-over';m.set(v,c);return c;}"
          if anchor not in s: raise SystemExit('drawOgreSkin missing')
          s=s.replace(anchor,helper+anchor,1)
          old="const img=arr[Math.floor(e.t/(isBoss?.15:.135))%arr.length]||pack.down[0];if(!img)return false;"
          new="let img=arr[Math.floor(e.t/(isBoss?.15:.135))%arr.length]||pack.down[0];if(!img)return false;if(!isBoss)img=mobSkinFrame(img,e.skinVariant||0);"
          if old not in s: raise SystemExit('img anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('const p=world(e.x,e.y),m=e.r+70;','const p=world(e.x,e.y),m=e.r+46;',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name wallissonghost-code
          git config user.email wallissonghost@gmail.com
          git add index.html
          git commit -m "perf: add 3 cached mob skins and horde capacity v0.14.6"
          git pull --rebase origin main
          git push origin main
