name: Fix modular rifle anchor
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-modular-rifle-anchor.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust rifle pivot, scale and hand socket
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="ctx.translate(0,-2+bob);ctx.rotate(player.aim||0);ctx.imageSmoothingEnabled=true;ctx.drawImage(weaponSprite,-8+recoil,-7,48,14);"
          new="const a=player.aim||0,backX=10,handY=-1,w=34,h=10,pivotX=7,pivotY=h/2;ctx.translate(Math.cos(a)*backX,handY+Math.sin(a)*backX+bob);ctx.rotate(a);ctx.imageSmoothingEnabled=true;ctx.drawImage(weaponSprite,-pivotX+recoil,-pivotY,w,h);"
          if old not in s:
              raise SystemExit('weapon render target not found')
          s=s.replace(old,new,1)
          s=s.replace("./assets/weapons/assault-rifle-01.png?v=modular101","./assets/weapons/assault-rifle-01.png?v=modular102",1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: align modular rifle to player hands" || exit 0
          git push
