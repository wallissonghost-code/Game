name: Caos Live Phase 4 Audit
on:
  push:
    branches: [agent/core-phase4-audit]
permissions:
  contents: write
jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[phase4-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-phase4-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/apply-phase4.mjs
      - run: npm run check
      - run: node scripts/audit-runtime.mjs
      - name: Commit generated migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game.js
          git commit -m "refactor: wire events and effects modules [phase4-generated]"
          git push origin HEAD:agent/core-phase4-audit
