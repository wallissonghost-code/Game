name: Skin Test Back Barrel v0.0.13
'on':
  push:
    paths: ['.github/workflows/skin-back-barrel-v013.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch back weapon layering
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('skin-test-local.html')
          s=p.read_text()
          s=re.sub(r'v0\.0\.(?:11|12)', 'v0.0.13', s)
          s=s.replace('Arma3 lados invertidos','Arma3 cano atrás').replace('cano visível nas costas','só o cano acima do capacete').replace('CANO NAS COSTAS','CANO ATRÁS')
          # Recalibra somente COSTAS: arma alta/estreita e atrás do corpo.
          s=s.replace("up:{l:50,t:45,w:74,h:44,mx:50,my:31}","up:{l:50,t:32,w:26,h:74,mx:50,my:12}")
          # Em placeWeapon, força a arma para trás do corpo quando olhando para costas.
          old="weapon.style.transform='translate(-50%,-50%)';muzzle.style.left=cfg.mx+'%';muzzle.style.top=cfg.my+'%'"
          new="weapon.style.transform='translate(-50%,-50%)';weapon.style.zIndex=dir==='up'?'3':'7';muzzle.style.left=cfg.mx+'%';muzzle.style.top=cfg.my+'%'"
          if old in s:
              s=s.replace(old,new)
          # Texto/status explícito.
          s=s.replace('ARMA3 LADOS INVERTIDOS','ARMA3 · CANO ATRÁS').replace('ARMA3 SINCRONIZADA','ARMA3 · CANO ATRÁS')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add skin-test-local.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: hide back rifle behind player and expose only barrel v0.0.13'
          git pull --rebase origin main
          git push
