name: Bosses + Live Tags + Stop Spin v0.14.8
on:
  push:
    paths: ['.github/workflows/boss-live-tags-stop-spin-v0148.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Version
          s=s.replace("const VERSION='0.14.7'","const VERSION='0.14.8'",1)
          s=s.replace('<title>Caos Live v0.14.7</title>','<title>Caos Live v0.14.8</title>',1)
          s=s.replace('v0.14.7 · HORDE FIX','v0.14.8 · 2 BOSSES + LIVE TAG',1)
          s=s.replace('<span class="startVersion">v0.14.7</span>','<span class="startVersion">v0.14.8</span>',1)

          # New boss packs
          old="(async()=>{ogreReady=await loadOgrePack('./assets/recorte-split (1).zip?v=0137',ogreFrames,false);bossOgreReady=false;bossColossusReady=false;bossVoidReady=false})();"
          new="(async()=>{ogreReady=await loadOgrePack('./assets/recorte-split (1).zip?v=0137',ogreFrames,false);bossOgreReady=false;bossColossusReady=await loadOgrePack('./assets/Ogroboss1.zip?v=0148',bossColossusFrames,true);bossVoidReady=await loadOgrePack('./assets/Ogro2.0Boss.zip?v=0148',bossVoidFrames,true);console.log('BOSSES READY',bossColossusReady,bossVoidReady)})();"
          if old not in s: raise SystemExit('boss loader anchor missing')
          s=s.replace(old,new,1)

          # Fallback sequential mapping for boss zip if filenames are not recorte-X-Y
          oldmap="if(bossMode){target.up=[1,2,3,4].map(c=>urls[by(1,c)]).filter(Boolean);target.down=[1,2,3,4].map(c=>urls[by(2,c)]).filter(Boolean);target.right=[1,2,3,4].map(c=>urls[by(3,c)]).filter(Boolean);target.left=[1,2,3,4].map(c=>urls[by(4,c)]).filter(Boolean)}else{"
          newmap="if(bossMode){target.up=[1,2,3,4].map(c=>urls[by(1,c)]).filter(Boolean);target.down=[1,2,3,4].map(c=>urls[by(2,c)]).filter(Boolean);target.right=[1,2,3,4].map(c=>urls[by(3,c)]).filter(Boolean);target.left=[1,2,3,4].map(c=>urls[by(4,c)]).filter(Boolean);if((target.up.length<4||target.down.length<4||target.right.length<4||target.left.length<4)&&names.length>=16){const seq=names.map(n=>urls[n]).filter(Boolean);target.up=seq.slice(0,4);target.down=seq.slice(4,8);target.right=seq.slice(8,12);target.left=seq.slice(12,16)}}else{"
          if oldmap not in s: raise SystemExit('boss map anchor missing')
          s=s.replace(oldmap,newmap,1)

          # Use separate pack for each boss
          olddraw="function drawOgreSkin(e,isBoss){const pack=isBoss?bossOgreFrames:ogreFrames,ready=isBoss?bossOgreReady:ogreReady,dir=e.facing||'down',arr=pack[dir]||pack.down||[];"
          newdraw="function drawOgreSkin(e,isBoss){let pack=ogreFrames,ready=ogreReady;if(isBoss){if(e.type==='colossus'){pack=bossColossusFrames;ready=bossColossusReady}else{pack=bossVoidFrames;ready=bossVoidReady}}const dir=e.facing||'down',arr=pack[dir]||pack.down||[];"
          if olddraw not in s: raise SystemExit('drawOgreSkin anchor missing')
          s=s.replace(olddraw,newdraw,1)

          # Stop mobs/bosses from orbiting while already in attack range
          oldai="const crowdRadius=player.r+e.r+26,approachRadius=crowdRadius+74;if(distp<approachRadius){const slot=((e.seed*1.618)%1)*Math.PI*2,tx=player.x+Math.cos(slot)*crowdRadius,ty=player.y+Math.sin(slot)*crowdRadius;steer=Math.atan2(ty-e.y,tx-e.x);if(distp<crowdRadius*.78)steer=Math.atan2(e.y-player.y,e.x-player.x)}e.mvx=Math.cos(steer);e.mvy=Math.sin(steer);e.speedMul=distp<crowdRadius*1.15?.72:1;e.facing=Math.abs(e.mvx)>Math.abs(e.mvy)?(e.mvx>0?'right':'left'):(e.mvy>0?'down':'up')"
          newai="const crowdRadius=player.r+e.r+26,attackHold=player.r+e.r+(e.max>=100?56:36),approachRadius=crowdRadius+74;if(distp<=attackHold){e.mvx=0;e.mvy=0;e.speedMul=0;const fx=dxp,fy=dyp;e.facing=Math.abs(fx)>Math.abs(fy)?(fx>0?'right':'left'):(fy>0?'down':'up')}else{if(distp<approachRadius){const slot=((e.seed*1.618)%1)*Math.PI*2,tx=player.x+Math.cos(slot)*crowdRadius,ty=player.y+Math.sin(slot)*crowdRadius;steer=Math.atan2(ty-e.y,tx-e.x)}e.mvx=Math.cos(steer);e.mvy=Math.sin(steer);e.speedMul=distp<crowdRadius*1.15?.72:1;e.facing=Math.abs(e.mvx)>Math.abs(e.mvy)?(e.mvx>0?'right':'left'):(e.mvy>0?'down':'up')}"
          if oldai not in s: raise SystemExit('AI orbit anchor missing')
          s=s.replace(oldai,newai,1)

          # Put @username clearly above the whole sprite/boss header
          oldtag="const lw=ctx.measureText(lu).width+12,lh=17,lx=lp.x-lw/2,ly=lp.y-le.r-31;"
          newtag="const lw=ctx.measureText(lu).width+12,lh=17,lx=lp.x-lw/2,bossTag=!!types[le.type]?.boss,ly=lp.y-(bossTag?le.r*3.15+34:le.r*2.15+26);"
          if oldtag not in s: raise SystemExit('live tag anchor missing')
          s=s.replace(oldtag,newtag,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q "const VERSION='0.14.8'" index.html
          grep -q "Ogroboss1.zip" index.html
          grep -q "Ogro2.0Boss.zip" index.html
          grep -q "attackHold" index.html
          grep -q "bossTag" index.html
      - name: Commit
        run: |
          git config user.name wallissonghost-code
          git config user.email wallissonghost@gmail.com
          git add index.html
          git commit -m "feat: add two boss skins, move live tags above mobs and stop attack orbit v0.14.8"
          git pull --rebase origin main
          git push origin main
