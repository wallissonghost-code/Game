name: Skin Test Canodaarma v0.0.15
'on':
  push:
    paths: ['.github/workflows/skin-test-canodaarma-v015.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch rear weapon transparency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('skin-test-local.html')
          s=p.read_text()
          s=s.replace('v0.0.14','v0.0.15')
          old="function crop(src,pad=2){return new Promise(resolve=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});c.width=im.naturalWidth;c.height=im.naturalHeight;ctx.drawImage(im,0,0);const d=ctx.getImageData(0,0,c.width,c.height).data;let minX=c.width,minY=c.height,maxX=-1,maxY=-1;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(d[(y*c.width+x)*4+3]>12){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}if(maxX<0){resolve(src);return}const x0=Math.max(0,minX-pad),y0=Math.max(0,minY-pad),x1=Math.min(c.width-1,maxX+pad),y1=Math.min(c.height-1,maxY+pad),w=x1-x0+1,h=y1-y0+1,o=document.createElement('canvas');o.width=w;o.height=h;o.getContext('2d').drawImage(c,x0,y0,w,h,0,0,w,h);o.toBlob(b=>resolve(b?URL.createObjectURL(b):src),'image/png')};im.onerror=()=>resolve(src);im.src=src})}"
          new="function crop(src,pad=2,removeWhite=false){return new Promise(resolve=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});c.width=im.naturalWidth;c.height=im.naturalHeight;ctx.drawImage(im,0,0);let id=ctx.getImageData(0,0,c.width,c.height),d=id.data;if(removeWhite){for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];const hi=Math.min(r,g,b);if(hi>242){d[i+3]=0}else if(hi>220){d[i+3]=Math.round(d[i+3]*(242-hi)/22)}}ctx.putImageData(id,0,0);id=ctx.getImageData(0,0,c.width,c.height);d=id.data}let minX=c.width,minY=c.height,maxX=-1,maxY=-1;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(d[(y*c.width+x)*4+3]>12){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}if(maxX<0){resolve(src);return}const x0=Math.max(0,minX-pad),y0=Math.max(0,minY-pad),x1=Math.min(c.width-1,maxX+pad),y1=Math.min(c.height-1,maxY+pad),w=x1-x0+1,h=y1-y0+1,o=document.createElement('canvas');o.width=w;o.height=h;o.getContext('2d').drawImage(c,x0,y0,w,h,0,0,w,h);o.toBlob(b=>resolve(b?URL.createObjectURL(b):src),'image/png')};im.onerror=()=>resolve(src);im.src=src})}"
          if old not in s:
              raise SystemExit('crop function not found')
          s=s.replace(old,new)
          s=s.replace("async function loadZip(src,doCrop=false){","async function loadZip(src,doCrop=false,removeWhite=false){")
          s=s.replace("urls.push(doCrop?await crop(raw,2):raw)","urls.push(doCrop?await crop(raw,2,removeWhite):raw)")
          s=s.replace("loadZip('./assets/weapons/Canodaarma.zip',true)","loadZip('./assets/weapons/Canodaarma.zip',true,true)")
          s=s.replace('COSTAS usa Canodaarma.zip','COSTAS usa Canodaarma sem fundo branco')
          s=s.replace('CANO + RED DOT NAS COSTAS','CANO + RED DOT SEM FUNDO')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add skin-test-local.html
          git commit -m 'fix: remove white background from Canodaarma v0.0.15'
          git pull --rebase origin main
          git push
