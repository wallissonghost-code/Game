name: Admin UX v0.12.8
'on':
  push:
    paths: ['.github/workflows/admin-ux-v128.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch painel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('painel.html'); s=p.read_text()
          s=s.replace('Caos Admin v0.12.6','Caos Admin v0.12.8').replace('<span class="topVersion">v0.12.6</span>','<span class="topVersion">v0.12.8</span>').replace('index.html?v=125','index.html?v=128').replace('TIKTOK LIVE / PRESENTES','TIKTOK LIVE / AUTOMAÇÕES').replace('Ativar ações automáticas de presentes','Ativar automações da live')
          a=s.index('<div class="liveForm">'); b=s.index('</div><div class="liveActions">',a)+6
          form='''<div class="ruleBuilder"><div class="field"><label>GATILHO</label><select id="triggerType"><option value="gift">🎁 Presente</option><option value="comment">💬 Comentário</option></select></div><div class="field triggerGift"><label>Presente</label><input id="giftName" placeholder="Ex.: Rosa"></div><div class="field triggerGift"><label>Quantidade</label><input id="giftCount" type="number" min="1" value="1"></div><div class="field triggerComment" style="display:none"><label>Comentário / comando</label><input id="commentText" placeholder="Ex.: !gelo"></div><div class="field"><label>Ação no jogo</label><select id="giftAction"><option value="spawn">👾 Criar inimigo</option><option value="heal">❤️ Curar jogador</option><option value="damage">💥 Tirar vida</option><option value="freeze">❄️ Congelar arena</option><option value="invincible">🛡️ Invencibilidade</option><option value="boss">☠️ Criar Boss</option><option value="clear">🧹 Limpar arena</option><option value="xp">✨ Dar XP</option><option value="level">⬆️ Dar Level</option></select></div><div class="field mobOnly"><label>Inimigo</label><select id="giftMob"><option value="wraith">Espectro</option><option value="reaper">Ceifador</option><option value="infected">Infectado</option><option value="crawler">Criatura das Sombras</option><option value="eye">Observador</option><option value="brute">Brutamonte</option><option value="colossus">Colosso Carmesim</option><option value="voidlord">Senhor do Vazio</option></select></div><div class="field valueField"><label id="valueLabel">Quantidade</label><input id="giftValue" type="number" min="1" value="1"><small id="valueHint"></small></div><div class="field"><label>Cooldown (s)</label><input id="giftCooldown" type="number" min="0" value="2"></div></div>'''
          s=s[:a]+form+s[b:]
          s=s.replace('<h2>TESTAR EVENTO</h2>','<h2>TESTAR GATILHO</h2>').replace('>SIMULAR PRESENTE<','>SIMULAR<')
          css='.ruleBuilder{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.field{padding:11px;border:1px solid #283052;border-radius:13px;background:#080d19}.field label{display:block;margin-bottom:6px;color:#aeb7d8;font-size:9px;font-weight:900}.field input,.field select{width:100%;padding:12px;border:1px solid #35406d;border-radius:11px;background:#070b16;color:#fff}.field small{display:block;margin-top:5px;color:#66719a;font-size:9px}@media(max-width:620px){.ruleBuilder{grid-template-columns:1fr}}'
          s=s.replace('</style>',css+'</style>',1)
          s=s.replace("if(d.type==='chat')$('liveStatus').textContent='💬 @'+(d.user||'viewer')+': '+(d.comment||'');","if(d.type==='chat'){const ce={comment:d.comment||'',user:'@'+(d.user||'viewer')};$('liveStatus').textContent='💬 '+ce.user+': '+ce.comment;processComment(ce)}")
          s=s.replace("info.innerHTML='<b>'+r.gift+' ×'+r.count+' → '+actionText(r)+'</b><small>Cooldown '+r.cooldown+'s</small>';","const trig=r.type==='comment'?'💬 '+r.comment:'🎁 '+r.gift+' ×'+r.count;info.innerHTML='<b>'+trig+' → '+actionText(r)+'</b><small>Cooldown '+r.cooldown+'s</small>';")
          s=s.replace('window.caosTikTokGift=processGift;',"function processComment(evt){const comment=String(evt?.comment||'').trim(),user=evt?.user||'viewer';if(!comment)return;$('liveStatus').textContent='Último comentário: '+user+' · '+comment;add('💬 '+user+' comentou '+comment);if(!$('liveEnabled').checked)return;const now=Date.now();for(const r of rules){if(r.type!=='comment'||norm(r.comment)!==norm(comment))continue;const key=r.id||'comment-'+norm(r.comment)+'-'+r.action,last=cooldowns.get(key)||0;if(now-last<r.cooldown*1000)continue;cooldowns.set(key,now);const cmd=commandFromRule(r);cmd.user=user;send(cmd,'💬 '+user+' · '+comment+' → '+actionText(r))}}window.caosTikTokGift=processGift;")
          x=s.index("$('saveRule').onclick=()=>{"); y=s.index("$('presetRose').onclick",x)
          save="$('saveRule').onclick=()=>{const type=$('triggerType').value,base={id:Date.now()+'-'+Math.random().toString(36).slice(2,7),type,action:$('giftAction').value,mob:$('giftMob').value,value:Math.max(1,+$('giftValue').value||1),cooldown:Math.max(0,+$('giftCooldown').value||0)};if(type==='gift'){base.gift=$('giftName').value.trim();base.count=Math.max(1,+$('giftCount').value||1);if(!base.gift)return $('liveStatus').textContent='Informe o nome do presente.'}else{base.comment=$('commentText').value.trim();if(!base.comment)return $('liveStatus').textContent='Informe o comentário/comando.'}rules.push(base);saveRules();$('liveStatus').textContent='Regra salva.'};"
          s=s[:x]+save+s[y:]
          s=s.replace("$('testEvent').onclick=()=>processGift({gift:$('testGift').value,count:+$('testCount').value||1,user:'@TESTE'});","$('testEvent').onclick=()=>$('triggerType').value==='comment'?processComment({comment:$('testGift').value,user:'@TESTE'}):processGift({gift:$('testGift').value,count:+$('testCount').value||1,user:'@TESTE'});")
          ui="const triggerType=$('triggerType'),giftAction=$('giftAction');function refreshRuleUI(){const c=triggerType.value==='comment';document.querySelectorAll('.triggerGift').forEach(x=>x.style.display=c?'none':'block');document.querySelectorAll('.triggerComment').forEach(x=>x.style.display=c?'block':'none');const a=giftAction.value;document.querySelectorAll('.mobOnly').forEach(x=>x.style.display=(a==='spawn'||a==='boss')?'block':'none');const meta={spawn:['QUANTIDADE DE INIMIGOS','Quantos serão criados.'],boss:['QUANTIDADE DE BOSSES','Quantos bosses serão criados.'],heal:['HP DE CURA','Vida recuperada.'],damage:['HP DE DANO','Vida retirada.'],freeze:['DURAÇÃO (SEGUNDOS)','Congela a arena inteira.'],invincible:['DURAÇÃO (SEGUNDOS)','Tempo de invencibilidade.'],xp:['QUANTIDADE DE XP','XP entregue.'],level:['QUANTIDADE DE LEVELS','Levels entregues.'],clear:['','']}[a];$('valueLabel').textContent=meta[0];$('valueHint').textContent=meta[1];document.querySelector('.valueField').style.display=a==='clear'?'none':'block'}triggerType.onchange=refreshRuleUI;giftAction.onchange=refreshRuleUI;refreshRuleUI();"
          s=s.replace("loadRules();cloudState('Cloud desconectado.');",ui+"loadRules();cloudState('Cloud desconectado.');")
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add painel.html
          git commit -m 'fix: simplify admin automation builder v0.12.8'
          git push
