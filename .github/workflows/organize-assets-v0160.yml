name: Organize assets v0.16.0
on:
  push:
    paths:
      - '.github/workflows/organize-assets-v0160.yml'
permissions:
  contents: write
jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorganize assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/bosses assets/mobs assets/player assets/weapons

          [ ! -f assets/Ogroboss1.zip ] || git mv assets/Ogroboss1.zip assets/bosses/Ogroboss1.zip
          [ ! -f assets/Ogro2.0Boss.zip ] || git mv assets/Ogro2.0Boss.zip assets/bosses/Ogro2.0Boss.zip
          [ ! -f 'assets/recorte-split (1).zip' ] || git mv 'assets/recorte-split (1).zip' 'assets/mobs/recorte-split (1).zip'
          [ ! -f assets/Oficial1.zip ] || git mv assets/Oficial1.zip assets/player/Oficial1.zip
          [ ! -f assets/Oficial2.zip ] || git mv assets/Oficial2.zip assets/player/Oficial2.zip
          [ ! -f assets/soldier-premium-01.png ] || git mv assets/soldier-premium-01.png assets/player/soldier-premium-01.png

          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              './assets/Ogroboss1.zip': './assets/bosses/Ogroboss1.zip',
              './assets/Ogro2.0Boss.zip': './assets/bosses/Ogro2.0Boss.zip',
              './assets/recorte-split (1).zip': './assets/mobs/recorte-split (1).zip',
              './assets/Oficial1.zip': './assets/player/Oficial1.zip',
              './assets/Oficial2.zip': './assets/player/Oficial2.zip',
              './assets/soldier-premium-01.png': './assets/player/soldier-premium-01.png',
          }
          exts={'.js','.mjs','.html','.css','.json','.md','.txt','.bat'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or '.github' in p.parts or p.suffix.lower() not in exts:
                  continue
              try:
                  s=p.read_text(encoding='utf-8')
              except Exception:
                  continue
              old=s
              for a,b in replacements.items(): s=s.replace(a,b)
              if s!=old: p.write_text(s,encoding='utf-8')

          game=Path('src/game.js')
          s=game.read_text(encoding='utf-8')
          s=s.replace("const VERSION='0.15.9'","const VERSION='0.16.0'",1)
          game.write_text(s,encoding='utf-8')

          Path('version.json').write_text('{\n  "version": "0.16.0",\n  "build": "organized-assets"\n}\n',encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          import re
          h=re.sub(r'v0\.15\.\d+', 'v0.16.0', h)
          h=re.sub(r'src/game\.js\?v=\d+', 'src/game.js?v=0160', h, count=1)
          idx.write_text(h,encoding='utf-8')

          Path('assets/README.md').write_text('''# Assets do CAOS LIVE\n\n- [Bosses](./bosses/) — skins dos bosses.\n- [Mobs](./mobs/) — skins dos inimigos comuns.\n- [Player](./player/) — personagem principal.\n- [Weapons](./weapons/) — armas, cano, munição e efeitos relacionados.\n\nCada categoria deve receber novos arquivos somente dentro da própria pasta.\n''',encoding='utf-8')
          PY

      - name: Validate game
        run: |
          node --check src/game.js
          test -f assets/bosses/Ogroboss1.zip
          test -f assets/bosses/Ogro2.0Boss.zip
          test -f 'assets/mobs/recorte-split (1).zip'
          test -f assets/player/Oficial1.zip
          test -f assets/player/Oficial2.zip
          test -d assets/weapons
          ! grep -q "'./assets/Ogroboss1.zip'" src/game.js
          ! grep -q "'./assets/Oficial1.zip'" src/game.js

      - name: Commit organized structure
        run: |
          git config user.name wallissonghost-code
          git config user.email wallissonghost@gmail.com
          git add assets src/game.js index.html version.json skin-test-local.html 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: organize assets into bosses mobs player weapons v0.16.0'
          git pull --rebase origin main
          git push origin main
