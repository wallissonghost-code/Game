name: Fix admin route v0.9.7
on:
  push:
    paths:
      - '.github/workflows/fix-admin-route-v097.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch admin route
        run: python scripts/fix_admin_route_v097.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud/connector-server.mjs version.json
          git diff --cached --quiet || git commit -m "fix: serve current admin directly v0.9.7"
          git push
