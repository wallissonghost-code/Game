name: Skin Test Arena v0.0.17
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/skin-test-arena-v017.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch skin test arena
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('skin-test-local.html')
          s=p.read_text()
          s=s.replace('v0.0.15','v0.0.17').replace('COSTAS usa Canodaarma sem fundo branco','AUTO TIRO + ALVO + RESPAWN')
          s=s.replace('<div class="actor" id="actor">','<div id="enemy" style="position:absolute;width:54px;height:54px;border-radius:50%;background:#5b1b1b;border:2px solid #ef4444;box-shadow:0 0 18px #ef444466;z-index:6;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-size:30px">👾<div id="enemyHp" style="position:absolute;left:50%;top:-13px;transform:translateX(-50%);width:58px;height:7px;border:1px solid #475569;background:#111827;border-radius:6px;overflow:hidden"><div id="enemyHpBar" style="height:100%;width:100%;background:#ef4444"></div></div></div><div class="actor" id="actor">')
          s=s.replace('<div id="muzzle" class="muzzle"></div>','<div id="muzzle" class="muzzle"></div><div id="shots"></div>')
          s=s.replace("dirBadge=$('dirBadge');let packs=", "dirBadge=$('dirBadge'),enemy=$('enemy'),enemyHpBar=$('enemyHpBar'),shots=$('shots');let enemyX=.72,enemyY=.30,enemyHp=100,lastAutoShot=0,bullets=[];let packs=")
          insert="""
          function spawnEnemy(){enemyHp=100;enemyX=.15+Math.random()*.7;enemyY=.20+Math.random()*.58;enemy.style.left=(enemyX*100)+'%';enemy.style.top=(enemyY*100)+'%';enemyHpBar.style.width='100%';enemy.style.display='flex'}
          function aimAtEnemy(){const dx=enemyX-x,dy=enemyY-y;if(Math.abs(dx)>Math.abs(dy)*1.05)dir=dx>0?'right':'left';else dir=dy>0?'down':'up';show()}
          function muzzlePoint(){const r=arena.getBoundingClientRect(),ax=x*r.width,ay=y*r.height;const o={down:[8,26],up:[0,-38],right:[42,0],left:[-42,0]}[dir];return [ax+o[0],ay+o[1]]}
          function shootAuto(now){if(!armed||enemyHp<=0||now-lastAutoShot<260)return;lastAutoShot=now;aimAtEnemy();const r=arena.getBoundingClientRect(),[sx,sy]=muzzlePoint(),tx=enemyX*r.width,ty=enemyY*r.height,d=Math.hypot(tx-sx,ty-sy)||1,v=520;const el=document.createElement('div');el.style.cssText='position:absolute;width:8px;height:3px;border-radius:3px;background:#fde68a;box-shadow:0 0 8px #f59e0b;z-index:12;pointer-events:none';arena.appendChild(el);bullets.push({x:sx,y:sy,vx:(tx-sx)/d*v,vy:(ty-sy)/d*v,el});weapon.classList.remove('fire');void weapon.offsetWidth;weapon.classList.add('fire');muzzle.classList.add('on');setTimeout(()=>muzzle.classList.remove('on'),55)}
          function updateBullets(dt){const r=arena.getBoundingClientRect(),tx=enemyX*r.width,ty=enemyY*r.height;for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.el.style.left=b.x+'px';b.el.style.top=b.y+'px';if(Math.hypot(b.x-tx,b.y-ty)<28){b.el.remove();bullets.splice(i,1);enemyHp=Math.max(0,enemyHp-25);enemyHpBar.style.width=enemyHp+'%';if(enemyHp<=0){enemy.style.display='none';setTimeout(spawnEnemy,450)}continue}if(b.x<0||b.y<0||b.x>r.width||b.y>r.height){b.el.remove();bullets.splice(i,1)}}}
          """
          s=s.replace("function loop(now){",insert+"\nfunction loop(now){")
          s=s.replace("function loop(now){const r=arena.getBoundingClientRect(),", "let prevLoop=performance.now();function loop(now){const dt=Math.min(.05,(now-prevLoop)/1000);prevLoop=now;const r=arena.getBoundingClientRect(),")
          s=s.replace("actor.style.left=(x*100)+'%';actor.style.top=(y*100)+'%';requestAnimationFrame(loop)", "actor.style.left=(x*100)+'%';actor.style.top=(y*100)+'%';shootAuto(now);updateBullets(dt);requestAnimationFrame(loop)")
          s=s.replace("boot();requestAnimationFrame(loop)","spawnEnemy();boot();requestAnimationFrame(loop)")
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skin-test-local.html
          git commit -m "feat: auto-fire target arena v0.0.17" || exit 0
          git push
