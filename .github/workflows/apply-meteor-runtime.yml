name: Apply Meteor Runtime Fix
on:
  push:
    branches: [fix/meteor-freeze-runtime-apply]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meteor-freeze-runtime-apply
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply bootstrap compatibility
        run: node scripts/fix-meteor-bootstrap-compat.mjs
      - name: Verify materialized runtime and bootstrap
        run: |
          grep -F "function updateMeteorEvent(dt){const frozen=performance.now()<freezeUntil" src/game.js
          grep -F "MeteorCompat: natural event loop not found after patch" src/core/skills-bootstrap.mjs
          node --check src/game.js
          node --check src/core/skills-bootstrap.mjs
      - name: Commit compatibility fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/core/skills-bootstrap.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: bootstrap materialized meteor runtime"
          git push origin HEAD:fix/meteor-freeze-runtime-apply
