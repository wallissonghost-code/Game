name: Apply Meteor Runtime Fix
on:
  push:
    branches: [fix/meteor-freeze-runtime-apply]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meteor-freeze-runtime-apply
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply meteor freeze to real runtime
        run: node scripts/apply-safe-perf-v2.mjs
      - name: Bump runtime version
        run: node -e "const fs=require('fs');const p='src/game.js';let s=fs.readFileSync(p,'utf8');s=s.replace(\"const VERSION='0.17.45'\",\"const VERSION='0.17.46'\");fs.writeFileSync(p,s)"
      - name: Verify runtime contains freeze
        run: |
          grep -F "function updateMeteorEvent(dt){const frozen=performance.now()<freezeUntil" src/game.js
          grep -F "const VERSION='0.17.46'" src/game.js
          node --check src/game.js
      - name: Commit materialized runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/game.js
          git commit -m "fix: materialize meteor freeze runtime v0.17.46"
          git push origin HEAD:fix/meteor-freeze-runtime-apply
