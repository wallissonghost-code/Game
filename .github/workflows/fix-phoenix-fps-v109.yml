name: Fix Phoenix and FPS v0.10.9
on:
  push:
    paths:
      - 'tools/fix_phoenix_fps_v109.py'
      - '.github/workflows/fix-phoenix-fps-v109.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/fix_phoenix_fps_v109.py
      - name: Commit changes
        run: |
          git config user.name "wallissonghost-code"
          git config user.email "wallissonghost@gmail.com"
          git add index.html painel.html version.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: Phoenix 80 percent and visible FPS HUD v0.10.9"
          git push
