name: Caos Live v0.17.34 Migrate Legacy Ranking

on:
  push:
    paths:
      - 'scripts/release-v01734-migrate-local-rank.py'
      - '.github/workflows/release-v01734-migrate-local-rank.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply legacy ranking migration patch
        run: python3 scripts/release-v01734-migrate-local-rank.py
      - name: Sync legacy Map Lab cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('map-lab.html')
          s=p.read_text().replace('v0.17.31','v0.17.34').replace('v=01731','v=01734')
          p.write_text(s)
          PY
      - name: Update validator for cooperative admin damage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/check-game.mjs')
          s=p.read_text()
          old='if(!game.includes("if(running&&player.life<=0&&!deathState)")) fail(\'dano fatal admin sem morte\'); else ok(\'dano fatal admin tratado\');'
          new='if(!game.includes("knockDownPlayer(\'p1\'")||!game.includes("knockDownPlayer(\'p2\'")) fail(\'dano fatal admin sem down cooperativo\'); else ok(\'dano fatal admin tratado em P1/P2\');'
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          node --check src/firebase-ranking.js
          node --check src/game.js
          node --check src/duo.js
      - name: Validate project
        run: npm run check
      - name: Validate migration contract
        run: |
          grep -q "migrateLocalHistory" src/firebase-ranking.js
          grep -q "caos-rank-global-migrated-v1" src/firebase-ranking.js
          grep -q '"version": "0.17.34"' version.json
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: v0.17.34 migrate legacy ranking to Firebase" || exit 0
          git push
