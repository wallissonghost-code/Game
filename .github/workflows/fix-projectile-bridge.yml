name: Fix Projectile Bridge
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-projectile-bridge.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/fix-projectile-bridge.mjs
      - run: npm run check
      - run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - run: npm run check:menu
      - run: |
          git config user.name "caos-live-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/game.js
          git commit -m "fix: repair projectile traits bridge"
          git push origin HEAD:main
