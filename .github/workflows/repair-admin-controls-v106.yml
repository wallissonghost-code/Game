name: Repair Admin Controls v0.10.6
on:
  push:
    paths:
      - '.github/workflows/repair-admin-controls-v106.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch game and admin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json, sys

          game_p=Path('index.html'); admin_p=Path('painel.html')
          g=game_p.read_text(encoding='utf-8'); a=admin_p.read_text(encoding='utf-8')

          def once(text, old, new, label):
              if old not in text:
                  print('MISSING',label); return text, False
              return text.replace(old,new,1), True

          # ---- GAME: horde state ----
          old="autoMode=false,autoAngle=0,autoTurn=0,killCount=0"
          new="autoMode=false,autoAngle=0,autoTurn=0,hordeEnabled=true,killCount=0"
          g,_=once(g,old,new,'game horde var')
          old="paused=choosing=false;autoMode=false;killCount=0"
          new="paused=choosing=false;autoMode=false;hordeEnabled=true;killCount=0"
          g,_=once(g,old,new,'reset horde')

          # Gate native automatic spawning. Keep manual/admin spawn untouched.
          pat=r"spawnTimer-=dt;if\(spawnTimer<=0\)\{spawnWave\(\);spawnTimer=Math\.max\(\.11,\.52-level\*\.012\)\}"
          if re.search(pat,g):
              g=re.sub(pat,"if(hordeEnabled){spawnTimer-=dt;if(spawnTimer<=0){spawnWave();spawnTimer=Math.max(.11,.52-level*.012)}}else{spawnTimer=.1}",g,count=1)
          else:
              print('WARN native spawn pattern not found')

          # ---- GAME: test skills helpers ----
          helper="""function adminSkillReset(){for(const k in skillLv)skillLv[k]=0;Object.assign(player,{speed:255,fireRate:.28,xpMult:1,regen:0,flashDamage:0,bloodChance:0,bloodHeal:0,maxLife:100});player.life=Math.min(player.life,player.maxLife)}function adminSkillApply(id,lv){lv=Math.max(0,Math.min(5,+lv||0));const sk=skills.find(x=>x.id===id);if(!sk)return false;skillLv[id]=lv;if(id==='medic'){player.maxLife=100+lv*10;player.life=Math.min(player.maxLife,player.life);return true}if(lv>0)sk.apply(lv);else{if(id==='speed')player.speed=255;if(id==='rapid')player.fireRate=.28;if(id==='regen')player.regen=0;if(id==='xp')player.xpMult=1;if(id==='blood'){player.bloodChance=0;player.bloodHeal=0}if(id==='flash')player.flashDamage=0}return true}"""
          if 'function adminSkillApply(' not in g:
              marker='function command(d){'
              if marker in g:g=g.replace(marker,helper+marker,1)
              else: print('MISSING command marker')

          # Dispatch telemetry event, then add missing command cases right before ping.
          g=g.replace("function command(d){const c=d?.command;","function command(d){try{window.dispatchEvent(new CustomEvent('caos:admin-command',{detail:d}))}catch{}const c=d?.command;",1)
          inject="""if(c==='horde'){hordeEnabled=!!d.value;spawnTimer=.1;toast('🌊 HORDAS '+(hordeEnabled?'ON':'OFF'))}if(c==='skilltest'){const id=String(d.skill||''),lv=Math.max(0,Math.min(5,+d.level||1));if(adminSkillApply(id,lv))toast('🧪 '+id.toUpperCase()+' · LV '+lv)}if(c==='skilltestall'){const lv=Math.max(1,Math.min(5,+d.level||5));for(const sk of skills)adminSkillApply(sk.id,lv);toast('🧪 TODAS · LV '+lv)}if(c==='skillmax'){for(const sk of skills)adminSkillApply(sk.id,5);toast('🧪 TODAS NO MÁXIMO')}if(c==='skillreset'){adminSkillReset();toast('🧪 HABILIDADES RESETADAS')}"""
          if "if(c==='horde')" not in g:
              target="if(c==='ping')broadcast();"
              if target in g:g=g.replace(target,inject+target,1)
              else: print('MISSING ping target')

          # Include horde in state so admin toggle reflects actual game state.
          old="autoMode,skillLv:{...skillLv},room,ts:Date.now()"
          new="autoMode,hordeEnabled,skillLv:{...skillLv},room,ts:Date.now()"
          g,_=once(g,old,new,'state horde')

          # ---- GAME: safe FPS monitor layer ----
          if 'data-caos-fps-v0106' not in g:
              fps_script="""<script data-caos-fps-v0106>(()=>{'use strict';let visible=true,frames=0,last=performance.now(),fps=0;try{visible=localStorage.getItem('caos-show-fps')!=='0'}catch{}let el=document.getElementById('fpsMini');if(!el){const host=document.getElementById('connectionMini');if(host){el=document.createElement('div');el.id='fpsMini';el.style.marginTop='3px';host.parentNode.insertBefore(el,host.nextSibling)}}function paint(){if(el){el.style.display=visible?'block':'none';el.textContent='FPS: '+(fps||'--')}}function tick(t){frames++;if(t-last>=500){fps=Math.max(0,Math.round(frames*1000/(t-last)));frames=0;last=t;paint()}requestAnimationFrame(tick)}window.addEventListener('caos:admin-command',e=>{const d=e.detail||{};if(d.command==='fps'){visible=!!d.value;try{localStorage.setItem('caos-show-fps',visible?'1':'0')}catch{}paint()}});paint();requestAnimationFrame(tick)})();</script>"""
              g=g.replace('</body>',fps_script+'</body>',1)

          # ---- ADMIN: restore FPS toggle ----
          fps_button="""<button id=\"fpsModeToggle\" class=\"modeToggle\" type=\"button\" data-on=\"true\"><span class=\"modeInfo\"><span class=\"modeIcon\">📊</span><span><b>MOSTRAR FPS</b><small>exibe ou oculta o contador no jogo</small></span></span><span class=\"modeRight\"><span class=\"modeBadge\">ON</span><span class=\"toggleTrack\"><span class=\"toggleKnob\"></span></span></span></button>"""
          if 'id="fpsModeToggle"' not in a:
              marker='</div><div class="grid actionGrid">'
              if marker in a:a=a.replace(marker,fps_button+'</div><div class="grid actionGrid">',1)
              else: print('MISSING admin modegrid marker')

          # Remove options that the current game does not implement, so Test Skills never offers dead buttons.
          a=a.replace('<option value="arc">⚡ Arco Voltaico</option>','').replace('<option value="pact">◈ Pacto do Abismo · SECRETA</option>','')

          # Add FPS click handler after horde handler.
          if "$('fpsModeToggle').onclick" not in a:
              h="if($('hordeModeToggle'))$('hordeModeToggle').onclick=()=>{const next=$('hordeModeToggle').dataset.on!=='true';send({command:'horde',value:next},'🌊 Hordas '+(next?'ON':'OFF'))};"
              fps="if($('fpsModeToggle')){let fpsOn=true;try{fpsOn=localStorage.getItem('caos-show-fps')!=='0'}catch{}const draw=()=>{const f=$('fpsModeToggle');f.dataset.on=fpsOn?'true':'false';f.classList.toggle('isOn',fpsOn);const b=f.querySelector('.modeBadge');if(b)b.textContent=fpsOn?'ON':'OFF'};draw();$('fpsModeToggle').onclick=()=>{fpsOn=!fpsOn;try{localStorage.setItem('caos-show-fps',fpsOn?'1':'0')}catch{}draw();send({command:'fps',value:fpsOn},'📊 FPS '+(fpsOn?'ON':'OFF'))}};"
              if h in a:a=a.replace(h,h+fps,1)
              else: print('MISSING admin horde handler')

          # Clean pact-specific UI JS now that unsupported option is removed.
          a=a.replace("$('skillTestSelect').onchange=()=>{$('skillTestLevel').disabled=$('skillTestSelect').value==='pact';if($('skillTestSelect').value==='pact')$('skillTestLevel').value='1'};","")

          # Versions
          for oldv in ['0.10.5']:
              g=g.replace(oldv,'0.10.6')
              a=a.replace(oldv,'0.10.6')
          game_p.write_text(g,encoding='utf-8'); admin_p.write_text(a,encoding='utf-8')
          Path('version.json').write_text(json.dumps({
            'version':'0.10.6','label':'v0.10.6','releasedAt':'2026-08-08T14:50:00Z','build':'repair-admin-controls',
            'notes':['Restaura toggle Mostrar FPS','Corrige Hordas Automáticas ON/OFF','Corrige Teste de Habilidades do Admin','Sincroniza hordeEnabled no estado do jogo']
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Lightweight validation
          checks=[
            ('game horde command',"if(c==='horde')" in g),('game skill test',"if(c==='skilltest')" in g),
            ('game horde state','hordeEnabled,skillLv' in g),('game fps layer','data-caos-fps-v0106' in g),
            ('admin fps','id="fpsModeToggle"' in a),('admin horde handler',"command:'horde'" in a),('admin skill handler',"command:'skilltest'" in a)
          ]
          print('\n'.join(f'{n}: {ok}' for n,ok in checks))
          if not all(ok for _,ok in checks):sys.exit(2)
          PY
      - name: Commit fixes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html painel.html version.json
          git commit -m "fix: restore admin controls v0.10.6"
          git push
