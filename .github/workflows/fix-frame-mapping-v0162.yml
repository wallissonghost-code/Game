name: Fix frame mapping v0.16.2
on:
  push:
    paths:
      - '.github/workflows/fix-frame-mapping-v0162.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/fix-map-v0162.py
      - name: Validate
        run: |
          node --check src/game.js
          node scripts/check-game.mjs
      - name: Commit
        run: |
          git config user.name wallissonghost-code
          git config user.email wallissonghost@gmail.com
          git add src/game.js index.html version.json scripts/check-game.mjs
          git commit -m 'fix: correct player and mob frame direction mapping v0.16.2'
          git pull --rebase origin main
          git push origin main
