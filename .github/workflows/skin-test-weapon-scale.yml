name: Skin Test Weapon Scale
'on':
  push:
    paths: ['.github/workflows/skin-test-weapon-scale.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix weapon proportions in skin test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('skin-test-local.html')
          s=p.read_text()
          s=s.replace('.body,.weapon{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.body{z-index:4}.weapon{z-index:7;display:none}', '.body{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:4}.weapon{position:absolute;z-index:7;display:none;object-fit:contain;pointer-events:none;transform-origin:50% 50%}')
          old="function show(){if(!ready)return;const p=currentBody(),a=p?.[dir]||p?.down||[];if(a.length)body.src=a[frame%a.length];if(armed&&packs.weapon){const wa=packs.weapon[dir]||packs.weapon.down||[];if(wa.length)weapon.src=wa[frame%wa.length]}weapon.classList.toggle('on',armed);dirBadge.textContent=labels[dir]}"
          new="function placeWeapon(){const cfg={down:{l:50,t:49,w:42,h:42,r:0},up:{l:50,t:45,w:38,h:38,r:0},right:{l:57,t:50,w:44,h:32,r:0},left:{l:43,t:50,w:44,h:32,r:0}}[dir];weapon.style.left=cfg.l+'%';weapon.style.top=cfg.t+'%';weapon.style.width=cfg.w+'%';weapon.style.height=cfg.h+'%';weapon.style.transform='translate(-50%,-50%) rotate('+cfg.r+'deg)'}function show(){if(!ready)return;const p=currentBody(),a=p?.[dir]||p?.down||[];if(a.length)body.src=a[frame%a.length];if(armed&&packs.weapon){const wa=packs.weapon[dir]||packs.weapon.down||[];if(wa.length)weapon.src=wa[frame%wa.length]}weapon.classList.toggle('on',armed);placeWeapon();dirBadge.textContent=labels[dir]}"
          if old not in s: raise SystemExit('show function not found')
          s=s.replace(old,new)
          s=s.replace('arma correta: recorte-split.zip','arma correta: recorte-split.zip · escala proporcional v2')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add skin-test-local.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: proportional weapon scaling in skin test'
          git push