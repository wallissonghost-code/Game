name: Caos Live Multiplayer Join Test

on:
  push:
    paths:
      - '.github/workflows/release-online2-lobby.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-room-join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate server syntax and room grace
        run: |
          node --check cloud/game-server-v2.mjs
          grep -q 'RECONNECT_GRACE_MS=600000' cloud/game-server-v2.mjs
      - name: Start dedicated server
        run: |
          npm run game-server > /tmp/caos-server.log 2>&1 &
          echo $! > /tmp/caos-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/caos-server.log
          exit 1
      - name: Simulate P1 and P2 joining same room
        run: |
          node --input-type=module <<'NODE'
          import WebSocket from 'ws';
          const url='ws://127.0.0.1:10000/game';
          const room='TEST8P2X';
          const connect=(name,session,create)=>new Promise((resolve,reject)=>{
            const ws=new WebSocket(url);
            const timer=setTimeout(()=>reject(new Error('timeout '+name)),5000);
            ws.on('open',()=>ws.send(JSON.stringify({type:'join',room,name,session,create})));
            ws.on('message',raw=>{
              const m=JSON.parse(raw.toString());
              if(m.type==='error'){clearTimeout(timer);reject(new Error(name+': '+m.code+' '+m.message));}
              if(m.type==='welcome'){clearTimeout(timer);resolve({ws,m});}
            });
            ws.on('error',reject);
          });
          const p1=await connect('P1TEST','session-p1',true);
          const p2=await connect('P2TEST','session-p2',false);
          if(p1.m.room!==room||p2.m.room!==room) throw new Error('room mismatch');
          if(p1.m.role!=='p1') throw new Error('P1 role='+p1.m.role);
          if(p2.m.role!=='p2') throw new Error('P2 role='+p2.m.role);
          console.log('PASS',p1.m.room,p1.m.role,p2.m.role);
          p1.ws.close(); p2.ws.close();
          NODE
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/caos-server.log || true
