name: Caos Live Multiplayer Online.7 Movement Overhaul
on:
  push:
    paths: ['.github/workflows/release-online2-lobby.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild local movement and animation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/multiplayer.js'); s=p.read_text()
          s=s.replace("const ONLINE_VERSION='0.17.37-online.6'","const ONLINE_VERSION='0.17.37-online.7'",1)
          s=s.replace("TAG='01737o6'","TAG='01737o7'",1)
          old="skillKey='',skillPendingKey='',skillPendingUntil=0;"
          new="skillKey='',skillPendingKey='',skillPendingUntil=0,localWalk=0;"
          if old not in s: raise SystemExit('localWalk declaration anchor not found')
          s=s.replace(old,new,1)
          old="if(d>150){p.x=s.x;p.y=s.y}else if(d>3){const stopped=Math.hypot(input.dx,input.dy)<.02,k=stopped?.20:.05;p.x+=dx*k;p.y+=dy*k}"
          new="if(d>180){p.x=s.x;p.y=s.y}else if(Math.hypot(input.dx,input.dy)<.02&&d>1){p.x+=dx*.32;p.y+=dy*.32}"
          if old not in s: raise SystemExit('snapshot reconciliation anchor not found')
          s=s.replace(old,new,1)
          old="moving=Math.hypot(p.vx||0,p.vy||0)>3,frame=moving?Math.floor(p.walk||0)%4:0"
          new="moving=me?Math.hypot(input.dx,input.dy)>.08:Math.hypot(p.vx||0,p.vy||0)>3,animWalk=me?localWalk:(p.walk||0),frame=moving?Math.floor(animWalk)%4:0"
          if old not in s: raise SystemExit('drawPlayer movement anchor not found')
          s=s.replace(old,new,1)
          old="bob=moving?Math.sin((p.walk||0)*Math.PI*.5)*.8:0"
          new="bob=moving?Math.sin(animWalk*Math.PI*.5)*.8:0"
          if old not in s: raise SystemExit('drawPlayer bob anchor not found')
          s=s.replace(old,new,1)
          old="if(p.id===myId){if(started&&!p.down&&!p.choices){computeInput();p.x+=input.dx*255*(1+((p.skills?.speed||0)*.10))*dt;p.y+=input.dy*255*(1+((p.skills?.speed||0)*.10))*dt;resolveLocalPlayer(p)}continue}"
          new="if(p.id===myId){if(started&&!p.down&&!p.choices){computeInput();const mag=Math.hypot(input.dx,input.dy),sp=255*(1+((p.skills?.speed||0)*.10));if(mag>.08){p.x+=input.dx*sp*dt;p.y+=input.dy*sp*dt;localWalk=(localWalk+dt*9)%4096;resolveLocalPlayer(p)}else if(Number.isFinite(p.tx)&&Number.isFinite(p.ty)){const k=Math.min(1,dt*12);p.x+=(p.tx-p.x)*k;p.y+=(p.ty-p.y)*k;resolveLocalPlayer(p)}}continue}"
          if old not in s: raise SystemExit('simulate local player anchor not found')
          s=s.replace(old,new,1)
          old="function updateTouch(e){const max=52,dx=e.clientX-touch.sx,dy=e.clientY-touch.sy,n=Math.hypot(dx,dy);if(n>max){touch.dx=dx/n;touch.dy=dy/n}else{touch.dx=dx/max;touch.dy=dy/max}}"
          new="function updateTouch(e){const dx=e.clientX-touch.sx,dy=e.clientY-touch.sy,n=Math.hypot(dx,dy),dead=8;if(n<=dead){touch.dx=0;touch.dy=0;return}touch.dx=dx/n;touch.dy=dy/n}"
          if old not in s: raise SystemExit('touch controller anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Expand authoritative world and soften collision snagging
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloud/game-server-v2.mjs'); s=p.read_text()
          s=s.replace("ONLINE_VERSION='0.17.37-online.6'","ONLINE_VERSION='0.17.37-online.7'",1)
          old="const WORLD={width:3072,height:3072},PLAYER_RADIUS=18"
          new="const WORLD={width:6144,height:6144},PLAYER_RADIUS=18"
          if old not in s: raise SystemExit('WORLD anchor not found')
          s=s.replace(old,new,1)
          old="const CHUNK_SIZE=512,MAP_N=6,MAP_SEED='ICE-BMFSXT';"
          new="const CHUNK_SIZE=512,MAP_N=12,MAP_SEED='ICE-BMFSXT';"
          if old not in s: raise SystemExit('MAP_N anchor not found')
          s=s.replace(old,new,1)
          old="r:c.r*CHUNK_SIZE})"
          new="r:c.r*CHUNK_SIZE*.82})"
          if old not in s: raise SystemExit('collision radius anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Bump multiplayer cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('multiplayer.html'); s=p.read_text()
          s=s.replace('ONLINE 0.17.37-online.6','ONLINE 0.17.37-online.7').replace('ONLINE.6','ONLINE.7').replace('/src/multiplayer.js?v=01737o6','/src/multiplayer.js?v=01737o7')
          p.write_text(s)
          PY
      - name: Validate movement release
        run: |
          node --check src/multiplayer.js
          node --check cloud/game-server-v2.mjs
          grep -q "online.7" src/multiplayer.js
          grep -q "online.7" cloud/game-server-v2.mjs
          grep -q "localWalk" src/multiplayer.js
          grep -q "dead=8" src/multiplayer.js
          grep -q "width:6144,height:6144" cloud/game-server-v2.mjs
          grep -q "MAP_N=12" cloud/game-server-v2.mjs
          npm run check
      - name: Commit online.7
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/multiplayer.js cloud/game-server-v2.mjs multiplayer.html
          git commit -m 'feat: rebuild multiplayer movement and expand world'
          git push
