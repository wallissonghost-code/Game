name: Caos Live Multiplayer Online.5 Camera Fix
on:
  push:
    paths: ['.github/workflows/release-online2-lobby.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch camera and touch input
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/multiplayer.js'); s=p.read_text()
          s=s.replace("const ONLINE_VERSION='0.17.37-online.4'","const ONLINE_VERSION='0.17.37-online.5'",1)
          s=s.replace("TAG='01737o4'","TAG='01737o5'",1)
          old="const me=players.get(myId),cx=me?.x??world.width/2,cy=me?.y??world.height/2;ctx.setTransform"
          new="const me=players.get(myId),hw=Math.min(innerWidth/2,world.width/2),hh=Math.min(innerHeight/2,world.height/2),cx=Math.min(world.width-hw,Math.max(hw,me?.x??world.width/2)),cy=Math.min(world.height-hh,Math.max(hh,me?.y??world.height/2));ctx.setTransform"
          if old not in s: raise SystemExit('camera block not found')
          s=s.replace(old,new,1)
          old="canvas.addEventListener('pointermove',e=>{if(touch.active&&e.pointerId===touch.id){updateTouch(e);sendInput(false);e.preventDefault()}});"
          new="canvas.addEventListener('pointermove',e=>{if(touch.active&&e.pointerId===touch.id){updateTouch(e);e.preventDefault()}});"
          if old not in s: raise SystemExit('pointer block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Bump server and HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloud/game-server-v2.mjs'); s=p.read_text().replace("ONLINE_VERSION='0.17.37-online.4'","ONLINE_VERSION='0.17.37-online.5'",1); p.write_text(s)
          p=Path('multiplayer.html'); s=p.read_text().replace('ONLINE 0.17.37-online.4','ONLINE 0.17.37-online.5').replace('ONLINE.4','ONLINE.5').replace('/src/multiplayer.js?v=01737o4','/src/multiplayer.js?v=01737o5'); p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check src/multiplayer.js
          node --check cloud/game-server-v2.mjs
          npm run check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/multiplayer.js cloud/game-server-v2.mjs multiplayer.html
          git commit -m 'fix: clamp multiplayer camera and reduce touch input spam'
          git push
