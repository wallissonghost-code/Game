name: Caos Live Online Room Persistence Hotfix

on:
  push:
    paths:
      - '.github/workflows/release-online2-lobby.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extend waiting room reconnect grace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloud/game-server-v2.mjs')
          s=p.read_text(encoding='utf-8')
          old='RECONNECT_GRACE_MS=20000'
          if old not in s:
              raise SystemExit('expected room grace token not found')
          s=s.replace(old,'RECONNECT_GRACE_MS=600000',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate dedicated server
        run: |
          node --check cloud/game-server-v2.mjs
          grep -q 'RECONNECT_GRACE_MS=600000' cloud/game-server-v2.mjs
          grep -q "status:'waiting'" cloud/game-server-v2.mjs
          grep -q "code:'room_not_found'" cloud/game-server-v2.mjs
      - name: Validate Solo unchanged
        run: npm run check
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud/game-server-v2.mjs
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'fix: keep multiplayer waiting rooms alive for 10 minutes'
            git push
          fi
