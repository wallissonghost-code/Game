name: Repair Natural Events v0.17.47

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-natural-events-v01747.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Align Natural Events runtime and test with current release
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('src/core/natural-events-runtime.mjs')
          s = runtime.read_text()
          old = '''  // v0.17.46 is already the active classic runtime. Keep compatibility with
          // older 0.17.45 sources, but don't fail when the version bump is pre-applied.
          if (s.includes("VERSION='0.17.45'")) one("VERSION='0.17.45'", "VERSION='0.17.46'", 'version');
          else if (!s.includes("VERSION='0.17.46'")) throw new Error('NaturalEvents/version: unsupported runtime version');'''
          new = '''  // v0.17.47 is the active classic runtime. Keep compatibility with older
          // 0.17.45/0.17.46 sources, while accepting an already-current source unchanged.
          if (s.includes("VERSION='0.17.45'")) one("VERSION='0.17.45'", "VERSION='0.17.47'", 'version');
          else if (s.includes("VERSION='0.17.46'")) one("VERSION='0.17.46'", "VERSION='0.17.47'", 'version');
          else if (!s.includes("VERSION='0.17.47'")) throw new Error('NaturalEvents/version: unsupported runtime version');'''
          if old not in s:
              raise SystemExit('runtime version guard block not found')
          runtime.write_text(s.replace(old, new))

          test = Path('scripts/check-natural-events.mjs')
          t = test.read_text()
          t = t.replace("const original=fs.readFileSync('src/game.js','utf8');", "const original=fs.readFileSync('src/game.js','utf8');\nconst currentVersion=JSON.parse(fs.readFileSync('version.json','utf8')).version;")
          t = t.replace("compatible=compatible.replace(\"VERSION='0.17.46'\",\"VERSION='0.17.45'\");", "compatible=compatible.replace(`VERSION='${currentVersion}'`,\"VERSION='0.17.45'\");")
          t = t.replace('  "VERSION=\'0.17.46\'",', "  `VERSION='${currentVersion}'`,")
          test.write_text(t)
          PY
          node --check src/core/natural-events-runtime.mjs
          node --check scripts/check-natural-events.mjs
          npm run check:events
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-natural-events-v01747.yml
          git add src/core/natural-events-runtime.mjs scripts/check-natural-events.mjs
          git commit -m "fix: align Natural Events with v0.17.47"
          git push
