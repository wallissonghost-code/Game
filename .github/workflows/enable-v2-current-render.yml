name: Promote Multiplayer V2.0.4 Skills

on:
  push:
    paths:
      - '.github/workflows/enable-v2-current-render.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply V2.0.4 skill parity
        run: python3 scripts/patch-v204-skills.py

      - name: Validate V2.0.4
        run: |
          node --check src/multiplayer-v2.js
          node --check cloud/game-server-v3.mjs
          grep -q 'online-v2.0.4' src/multiplayer-v2.js
          grep -q 'online-v2.0.4' cloud/game-server-v3.mjs
          grep -q 'mobInvUntil' cloud/game-server-v3.mjs
          grep -q "kind:'flash'" cloud/game-server-v3.mjs
          grep -q "kind:'arc'" cloud/game-server-v3.mjs
          grep -q "kind:'phoenix'" cloud/game-server-v3.mjs
          grep -q 'regenStage' cloud/game-server-v3.mjs
          grep -q 'drawSkillEffects' src/multiplayer-v2.js
          grep -q 'piercing' src/multiplayer-v2.js
          grep -q '01737v204' multiplayer-v2.html
          node scripts/check-game.mjs

      - name: Commit V2.0.4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/multiplayer-v2.js cloud/game-server-v3.mjs multiplayer-v2.html
          git commit -m 'fix: multiplayer v2.0.4 skill parity and damage cadence'
          git push
