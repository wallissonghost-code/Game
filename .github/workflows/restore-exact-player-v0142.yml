name: Restore Exact Player v0.14.2
on:
  push:
    paths:
      - '.github/workflows/restore-exact-player-v0142.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact player renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          OLD='f7af781cd6930daff39cc9a4eae731a6164ae3d1'
          current=Path('index.html').read_text(encoding='utf-8')
          old=subprocess.check_output(['git','show',f'{OLD}:index.html'], text=True)

          def extract_function(src, name):
              marker=f'function {name}('
              start=src.find(marker)
              if start < 0:
                  raise RuntimeError(f'{name} not found')
              brace=src.find('{', start)
              if brace < 0:
                  raise RuntimeError('opening brace not found')
              depth=0
              i=brace
              quote=None
              esc=False
              while i < len(src):
                  ch=src[i]
                  if quote:
                      if esc:
                          esc=False
                      elif ch=='\\':
                          esc=True
                      elif ch==quote:
                          quote=None
                  else:
                      if ch in ('\"', "'", '`'):
                          quote=ch
                      elif ch=='{':
                          depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0:
                              return start, i+1, src[start:i+1]
                  i+=1
              raise RuntimeError('function end not found')

          _,_,old_fn=extract_function(old,'drawPlayer')
          a,b,_=extract_function(current,'drawPlayer')
          current=current[:a]+old_fn+current[b:]
          current=current.replace("const VERSION='0.14.1'", "const VERSION='0.14.2'")
          current=current.replace('v0.14.1 · SKIN + LIVE @USERS','v0.14.2 · SKIN V2 + LIVE @USERS')
          current=current.replace('>v0.14.1</span>','>v0.14.2</span>')
          Path('index.html').write_text(current, encoding='utf-8')
          print('Restored drawPlayer bytes:', len(old_fn))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: restore exact v0.13.9 player skin renderer v0.14.2"
          git push
