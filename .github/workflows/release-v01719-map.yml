name: Caos Live v0.17.19 Field Map
on:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare-map-extras.py'
      - 'scripts/release-v01719-map.mjs'
      - 'src/map-runtime.js'
      - '.github/workflows/release-v01719-map.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --quiet pillow
      - name: Identify and optimize uploaded map extras
        run: python scripts/prepare-map-extras.py
      - name: Apply map release
        run: node scripts/release-v01719-map.mjs
      - name: Validate JavaScript
        run: |
          node --check src/map-runtime.js
          node --check src/game.js
          node --check src/panel.js
      - name: Validate project
        run: node scripts/check-game.mjs
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/map-runtime.js src/game.js index.html painel.html painel-live.html version.json scripts/check-game.mjs assets/README.md assets/Map/field assets/Map/wasteland
          git commit -m "feat: add Field Swamp procedural map v0.17.19"
          git push
