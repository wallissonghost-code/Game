name: Regen Armor Auto v0.12.0 Fix
on:
  push:
    paths:
      - '.github/workflows/regen-armor-auto-v120-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.12.0
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('index.html'); s=p.read_text()
          s=s.replace('<title>Caos Live v0.11.9</title>','<title>Caos Live v0.12.0</title>')
          s=s.replace('v0.11.9 · AUTO SUAVE','v0.12.0 · REGEN + ARMADURA')
          s=s.replace("const VERSION='0.11.9'","const VERSION='0.12.0'")
          s=s.replace('autoMoveX=0,autoMoveY=0,autoDecisionUntil=0;','autoMoveX=0,autoMoveY=0,autoDecisionUntil=0,lastDamageAt=0,regenStage=0;')
          s=s.replace('arc:0,phoenix:0};','arc:0,phoenix:0,armor:0};')
          s=s.replace('bloodHeal:0,damage:2};','bloodHeal:0,damage:2,armorReduction:0};')
          old="{id:'regen',n:'Regeneração',i:'💚',r:'rare',desc:l=>`Regenera ${(l*.5).toFixed(1).replace('.',',')} HP/s.`,apply:l=>player.regen=l*.5}"
          new="{id:'regen',n:'Regeneração',i:'💚',r:'rare',desc:l=>`Regen progressiva: ${[0,.4,.6,.8,1,1.2][l]} HP/s base; acelera após 3s, 6s e 10s sem sofrer dano.`,apply:l=>player.regen=[0,.4,.6,.8,1,1.2][l]},{id:'armor',n:'Armadura',i:'🛡️',r:'rare',desc:l=>`${['','Bronze','Prata','Ouro','Diamante'][l]} · reduz ${[0,5,9,13,18][l]}% do dano recebido por criaturas.`,apply:l=>player.armorReduction=[0,.05,.09,.13,.18][l]}"
          if old not in s: raise SystemExit('regen skill marker missing')
          s=s.replace(old,new,1)
          old_tick="if(player.regen)player.life=Math.min(player.maxLife,player.life+player.regen*dt);"
          new_tick="if(player.regen>0&&player.life<player.maxLife){const safe=(performance.now()-lastDamageAt)/1000;if(safe>=1){const lv=skillLv.regen;let rate=player.regen;if(safe>=10)rate=[0,1,1.5,2,2.5,3.5][lv];else if(safe>=6)rate=[0,.8,1.2,1.6,2,2.5][lv];else if(safe>=3)rate=[0,.6,.9,1.2,1.5,1.8][lv];regenStage=safe>=10?3:safe>=6?2:safe>=3?1:0;player.life=Math.min(player.maxLife,player.life+rate*dt)}else regenStage=0;}"
          if old_tick not in s: raise SystemExit('regen tick marker missing')
          s=s.replace(old_tick,new_tick,1)
          old_dmg="player.life=Math.max(0,player.life-e.damage);"
          new_dmg="lastDamageAt=performance.now();player.life=Math.max(0,player.life-Math.max(1,e.damage*(1-player.armorReduction)));"
          if old_dmg not in s: raise SystemExit('damage marker missing')
          s=s.replace(old_dmg,new_dmg,1)
          old_safe="if(!nearestMob||!hasThreat){autoMoveX=0;autoMoveY=0;autoDecisionUntil=0;return{x:0,y:0}}"
          new_safe="if(!nearestMob){autoMoveX=0;autoMoveY=0;autoDecisionUntil=0;return{x:0,y:0}}if(!hasThreat){const approaching=enemies.filter(e=>!e.dead&&Math.hypot(e.x-player.x,e.y-player.y)<520);if(!approaching.length){autoMoveX=0;autoMoveY=0;autoDecisionUntil=0;return{x:0,y:0}}let ax=0,ay=0;for(const e of approaching){const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1,w=Math.max(0,(520-d)/520);ax+=dx/d*w;ay+=dy/d*w}const al=Math.hypot(ax,ay)||1;autoMoveX=autoMoveX*.82+(ax/al)*.18;autoMoveY=autoMoveY*.82+(ay/al)*.18;return{x:autoMoveX*.42,y:autoMoveY*.42}}"
          if old_safe not in s: raise SystemExit('auto safe marker missing')
          s=s.replace(old_safe,new_safe,1)
          s=s.replace("if(id==='regen')player.regen=0;","if(id==='regen')player.regen=0;if(id==='armor')player.armorReduction=0;")
          s=s.replace("Object.assign(player,{speed:255,fireRate:.28,xpMult:1,regen:0,flashDamage:0,bloodChance:0,bloodHeal:0,maxLife:100});","Object.assign(player,{speed:255,fireRate:.28,xpMult:1,regen:0,flashDamage:0,bloodChance:0,bloodHeal:0,maxLife:100,armorReduction:0});")
          p.write_text(s)

          q=Path('painel.html'); a=q.read_text()
          a=a.replace('<title>Caos Admin v0.11.9</title>','<title>Caos Admin v0.12.0</title>')
          a=a.replace('v0.11.7</span>','v0.12.0</span>')
          a=a.replace('index.html?v=116','index.html?v=120')
          if 'value="armor"' not in a:
            anchor='<option value="regen">Regeneração</option>'
            if anchor in a:a=a.replace(anchor,anchor+'<option value="armor">Armadura</option>',1)
          q.write_text(a)
          Path('version.json').write_text(json.dumps({'version':'0.12.0','label':'v0.12.0','releasedAt':'2026-08-08T17:20:00Z','build':'regen-armor-auto','notes':['Regeneração progressiva por tempo sem dano','Armadura Bronze/Prata/Ouro/Diamante','Auto mantém recuo preventivo enquanto mobs se aproximam','Jogo e painel sincronizados em v0.12.0']},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Validate
        run: |
          grep -q "v0.12.0 · REGEN + ARMADURA" index.html
          grep -q "id:'armor'" index.html
          grep -q "armorReduction" index.html
          grep -q "3.5" index.html
          grep -q "v0.12.0</span>" painel.html
          grep -q '"version": "0.12.0"' version.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html painel.html version.json
          git commit -m "feat: v0.12.0 regen armor predictive auto" || exit 0
          git push
