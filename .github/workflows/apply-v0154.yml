name: Apply v0.15.4
on:
  push:
    paths:
      - '.github/workflows/apply-v0154.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_v0154_interaction_lock.py
      - run: node --check src/game.js
      - run: |
          git config user.name wallissonghost-code
          git config user.email wallissonghost@gmail.com
          git add src/game.js src/styles/game.css index.html version.json
          git commit -m 'fix: prevent arena selection on iOS v0.15.4'
          git pull --rebase origin main
          git push origin main
