name: Sync CAOS LIVE v0.10.4
on:
  push:
    paths:
      - '.github/workflows/sync-version-v0104.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync versions and bust weapon cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_all(path, pairs):
              p = Path(path)
              if not p.exists():
                  return
              s = p.read_text(encoding='utf-8')
              old = s
              for a,b in pairs:
                  s = s.replace(a,b)
              if s != old:
                  p.write_text(s, encoding='utf-8')

          replace_all('index.html', [
              ('Caos Live v0.9.5','Caos Live v0.10.4'),
              ('<div class="version">v0.9.5</div>','<div class="version">v0.10.4</div>'),
              ("const VERSION='0.9.5'","const VERSION='0.10.4'"),
              ('assault-rifle-01.png?v=modular102','assault-rifle-01.png?v=0104')
          ])

          replace_all('painel.html', [
              ('Caos Admin v0.9.5','Caos Admin v0.10.4'),
              ('v0.9.5','v0.10.4'),
              ("const VERSION='0.9.5'","const VERSION='0.10.4'")
          ])

          replace_all('painel-live.html', [
              ('v0.9.5','v0.10.4'),
              ('v0.10.3','v0.10.4'),
              ("const VERSION='0.9.5'","const VERSION='0.10.4'"),
              ("const VERSION='0.10.3'","const VERSION='0.10.4'")
          ])

          v = Path('version.json')
          data = json.loads(v.read_text(encoding='utf-8')) if v.exists() else {}
          data['version'] = '0.10.4'
          data['label'] = 'v0.10.4'
          data['releasedAt'] = '2026-08-08T10:55:00-03:00'
          data['build'] = 'weapon-skin-cache-sync'
          data['notes'] = [
              'Skin pixel-art da arma atualizada',
              'Cache da arma forçado para nova versão',
              'Jogo e painel sincronizados em v0.10.4'
          ]
          v.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit synchronized version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html painel.html painel-live.html version.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'release: sync game and panel v0.10.4'
          git push
