name: Death Cam + Autofire Fix v0.11.4
on:
  push:
    paths:
      - '.github/workflows/deathcam-autofire-v114.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch death camera and target acquisition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html')
          s=p.read_text()
          original=s

          s=s.replace('<title>Caos Live v0.11.3</title>','<title>Caos Live v0.11.4</title>')
          s=s.replace('<div class="version">v0.11.3 · COMBATE</div>','<div class="version">v0.11.4 · DEATH CAM</div>')
          s=s.replace("const VERSION='0.11.3'","const VERSION='0.11.4'")

          # Death camera: 1.8s was too fast. Keep cinematic/readout for 5 seconds.
          old='deathState={killer:e,at:now,showOverAt:now+1800}'
          new='deathState={killer:e,at:now,showOverAt:now+5000}'
          if old not in s: raise SystemExit('death duration marker missing')
          s=s.replace(old,new,1)

          # When normal autofire is OFF, the rifle no longer acquires/tracks targets.
          old="const target=nearest();if(target)player.aim=Math.atan2(target.y-player.y,target.x-player.x);"
          new="if(autoFire){const target=nearest();if(target)player.aim=Math.atan2(target.y-player.y,target.x-player.x)}else if(player.moving){player.aim=Math.atan2(dy,dx)}"
          if old not in s: raise SystemExit('target acquisition marker missing')
          s=s.replace(old,new,1)

          # Clearing autofire immediately removes muzzle flash and resets shot timer.
          old="if(c==='autofire'){autoFire=!!d.value;toast('🔫 TIRO AUTOMÁTICO '+(autoFire?'ON':'OFF'))}"
          new="if(c==='autofire'){autoFire=!!d.value;player.shotFlash=0;shotTimer=.05;toast('🔫 TIRO AUTOMÁTICO '+(autoFire?'ON':'OFF'))}"
          if old not in s: raise SystemExit('autofire command marker missing')
          s=s.replace(old,new,1)

          p.write_text(s)

          ap=Path('painel.html')
          if ap.exists():
            a=ap.read_text()
            a=a.replace('<title>Caos Admin v0.11.3</title>','<title>Caos Admin v0.11.4</title>')
            a=a.replace('PAINEL v0.11.3 ·','PAINEL v0.11.4 ·')
            ap.write_text(a)

          Path('version.json').write_text(json.dumps({
            'version':'0.11.4','label':'v0.11.4','releasedAt':'2026-08-08T16:25:00Z','build':'deathcam-autofire-fix',
            'notes':[
              'Câmera de morte permanece por 5 segundos antes do resumo final',
              'Tiro Automático OFF também desativa busca e rastreamento automático de alvos',
              'Arma acompanha apenas a direção de movimento quando o autofire está desligado',
              'Ao desligar autofire, muzzle flash e temporizador do disparo são resetados'
            ]
          },ensure_ascii=False,indent=2)+'\n')

          if s==original: raise SystemExit('no changes')
          PY
      - name: Commit v0.11.4
        run: |
          git config user.name "wallissonghost-code"
          git config user.email "wallissonghost@gmail.com"
          git add index.html painel.html version.json
          git commit -m "fix: slower death cam and disable target tracking with autofire v0.11.4" || exit 0
          git push
