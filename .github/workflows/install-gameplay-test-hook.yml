name: Install Gameplay CI Hook
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-gameplay-test-hook.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/install-gameplay-test-hook.mjs
      - run: npm run check
      - run: |
          git config user.name "caos-live-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/game.js
          git commit -m "test: expose isolated gameplay CI hook"
          git push origin HEAD:main
