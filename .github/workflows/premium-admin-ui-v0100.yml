name: Premium Admin UI v0.10.0

on:
  push:
    paths:
      - '.github/workflows/premium-admin-ui-v0100.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply premium Admin UI
        run: python scripts/premium-admin-ui-v0100.py
      - name: Validate connector syntax
        run: node --check cloud/connector-server.mjs
      - name: Validate premium controls exist
        run: |
          grep -q 'id="autoModeToggle"' painel.html
          grep -q 'id="hordeModeToggle"' painel.html
          grep -q 'modeToggle' painel.html
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add painel.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: premium admin toggles and controls v0.10.0'
          git push
