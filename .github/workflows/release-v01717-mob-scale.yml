name: Caos Live v0.17.17 Mob Scale
on:
  push:
    branches: [main]
    paths:
      - 'scripts/release-v01717-mob-scale.mjs'
      - '.github/workflows/release-v01717-mob-scale.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply mob scale release
        run: node scripts/release-v01717-mob-scale.mjs
      - name: Validate JavaScript
        run: |
          node --check src/game.js
          node --check src/panel.js
      - name: Validate project
        run: node scripts/check-game.mjs
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game.js index.html painel.html version.json scripts/check-game.mjs assets/README.md
          git commit -m "feat: add visual mob scale system v0.17.17"
          git push
