name: Animate Reaper v0.8.4

on:
  push:
    paths:
      - '.github/workflows/animate-reaper-v084.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch reaper animation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html')
          s=p.read_text()
          old="""else if(e.type==='reaper'&&reaperReady){const bob=Math.sin(e.t*3+e.seed)*1.5,sz=e.r*3.0;ctx.save();ctx.globalAlpha=.98;if(e.tier===2)ctx.filter='saturate(1.5) hue-rotate(300deg) brightness(1.05)';else if(e.tier===1)ctx.filter='saturate(1.3) brightness(1.15)';ctx.drawImage(reaperSprite,-sz/2,-sz*.57+bob,sz,sz);ctx.restore()}"""
          new="""else if(e.type==='reaper'&&reaperReady){const ph=e.t*4+e.seed,bob=Math.sin(ph)*3,sway=Math.sin(ph*.52)*.075,breath=1+Math.sin(ph*2)*.035,squash=1-Math.abs(Math.sin(ph))*.045,sz=e.r*3.0;ctx.save();ctx.globalAlpha=.98;if(e.tier===2)ctx.filter='saturate(1.5) hue-rotate(300deg) brightness(1.05)';else if(e.tier===1)ctx.filter='saturate(1.3) brightness(1.15)';for(let wi=0;wi<3;wi++){const wa=ph*.35+wi*2.1,wx=-Math.cos(wa)*(e.r*.55+wi*2),wy=e.r*.45+Math.sin(wa*1.4)*5;ctx.save();ctx.globalAlpha=.12+wi*.035;ctx.fillStyle=e.tier===2?'#ef4444':'#8b5cf6';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(wx,wy,4+wi*1.5,0,7);ctx.fill();ctx.restore()}ctx.translate(Math.sin(ph*.5)*2,bob);ctx.rotate(sway);ctx.scale(breath,squash);ctx.drawImage(reaperSprite,-sz/2,-sz*.57,sz,sz);ctx.restore()}"""
          if old not in s:
              raise SystemExit('renderer alvo do Ceifador não encontrado; abortando sem alterar o jogo')
          s=s.replace(old,new,1)
          s=s.replace('<title>Caos Live v0.8.3</title>','<title>Caos Live v0.8.4</title>',1)
          s=s.replace('VERSÃO v0.8.3 · ESCALA MOBS','VERSÃO v0.8.4 · CEIFADOR ANIMADO',1)
          s=s.replace("const VERSION='0.8.3'","const VERSION='0.8.4'",1)
          s=s.replace("ceifador.svg?v=083","ceifador.svg?v=084",1)
          p.write_text(s)
          vp=Path('version.json')
          data=json.loads(vp.read_text())
          data.update({'version':'0.8.4','label':'v0.8.4','releasedAt':'2026-08-07T15:03:00Z','build':'reaper-motion-animation','notes':['Ceifador agora flutua e balança durante o movimento','Capa ganha compressão e expansão sutil','Rastro de energia acompanha o Ceifador','Atributos e hitbox preservados']})
          vp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git diff --cached --quiet && exit 0
          git commit -m "feat: animate detailed reaper movement v0.8.4"
          git push origin main
