name: Inspect Coop Hooks v0.17.28
on:
  push:
    paths:
      - '.github/workflows/inspect-coop-v01728.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print coop hook contexts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/game.js').read_text()
          needles=['xp+=','xpNeed','choosing=true','skillLv','player.life<=0','deathState','owner:\'p2\'','b.owner','showSkills','chooseSkill','level++','killCount++','e.dead=true','function update(']
          for needle in needles:
              print('\n===',needle,'===')
              start=0; n=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  n+=1
                  print(f'-- occurrence {n} @ {i} --')
                  print(s[max(0,i-900):min(len(s),i+1800)])
                  start=i+len(needle)
                  if n>=8: break
          PY
