name: Upgrade CI Shot Target
on:
  push:
    paths:
      - 'scripts/upgrade-ci-shot-target.mjs'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/upgrade-ci-shot-target.mjs
      - run: npm run check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game.js
          git diff --cached --quiet || git commit -m "test: robust directional shot target helper"
          git push
