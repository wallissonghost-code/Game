name: Apply v0.15.7
on:
  push:
    paths:
      - '.github/workflows/apply-v0157.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_v0157_healthbars.py
      - run: node --check src/game.js
      - run: |
          git config user.name wallissonghost-code
          git config user.email wallissonghost@gmail.com
          git add src/game.js index.html version.json
          git commit -m 'fix: keep enemy health bars visible v0.15.7'
          git pull --rebase origin main
          git push origin main
