name: Ghost Performance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/ghost-perf-suite.mjs'
      - 'scripts/fps-stress-qa.mjs'
      - 'package.json'
      - '.github/workflows/ghost-performance.yml'

concurrency:
  group: ghost-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Ghost Performance Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser benchmark dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run comparative CPU benchmark
        run: node scripts/ghost-perf-suite.mjs
      - name: Run Canvas FPS stress QA
        run: node scripts/fps-stress-qa.mjs
      - name: Publish benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghost-performance-report
          path: |
            artifacts/ghost-perf-report.json
            artifacts/fps-stress-report.json
          retention-days: 14
