name: Fix Gameplay Shot Ranges
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gameplay-shot-ranges.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/fix-gameplay-shot-ranges.mjs
      - run: npm run check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/gameplay-bot.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test: keep projectile targets inside visible mobile range"
          git push
