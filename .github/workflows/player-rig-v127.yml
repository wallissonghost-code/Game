name: Player Rig v0.12.7
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/player-rig-v127.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch player rig
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('function drawPlayer(){')
          end=s.index('function drawPhoenixShield()', start)
          new=r'''function drawPlayer(){
  ctx.save();ctx.translate(W/2,H/2);
  ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(0,25,23,7,0,0,Math.PI*2);ctx.fill();
  const aim=player.aim||0, moveBob=player.moving?Math.sin(player.walk*Math.PI*.5)*1.2:0;
  const ca=Math.cos(aim),sa=Math.sin(aim);
  // pernas/base nunca giram como uma imagem deitada; apenas alternam o passo
  const step=player.moving?Math.sin(player.walk*Math.PI)*2:0;
  ctx.save();ctx.translate(0,moveBob);
  ctx.fillStyle='#27331f';ctx.fillRect(-10,-1+step,7,24);ctx.fillRect(3,-1-step,7,24);
  ctx.fillStyle='#171d17';ctx.fillRect(-11,17+step,9,6);ctx.fillRect(2,17-step,9,6);
  // tronco permanece vertical na tela; detalhes indicam frente/costas conforme a mira
  const back=sa<-.38;
  ctx.fillStyle='#4b5b2d';ctx.beginPath();ctx.roundRect(-15,-20,30,31,6);ctx.fill();
  ctx.fillStyle=back?'#20291d':'#303b22';ctx.beginPath();ctx.roundRect(-11,-16,22,22,4);ctx.fill();
  if(back){ctx.strokeStyle='#596b43';ctx.lineWidth=2;ctx.strokeRect(-8,-13,16,17);ctx.fillStyle='#1a2118';ctx.fillRect(-6,-10,12,3)}
  else{ctx.fillStyle='#69774a';ctx.fillRect(-8,-12,16,4);ctx.fillStyle='#20291d';ctx.fillRect(-7,-5,14,8)}
  // cabeça/capacete: orientação visual, sem rotacionar o sprite inteiro
  ctx.fillStyle='#b88b63';ctx.beginPath();ctx.arc(0,-25,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#596332';ctx.beginPath();ctx.arc(0,-28,11,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-11,-28,22,5);
  if(back){ctx.fillStyle='#30381f';ctx.fillRect(-8,-27,16,6)}else{ctx.fillStyle='#111827';ctx.fillRect(-8,-26,16,5)}
  // upper rig: exatamente dois braços + duas mãos + rifle, todos derivados da mesma mira
  const px=-sa,py=ca, shoulder=10;
  const sx1=px*shoulder,sy1=py*shoulder-8,sx2=-px*shoulder,sy2=-py*shoulder-8;
  const hand1={x:ca*12+px*5,y:sa*12+py*5-8},hand2={x:ca*20-px*3,y:sa*20-py*3-8};
  function limb(sx,sy,hx,hy){ctx.strokeStyle='#46562e';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(hx,hy);ctx.stroke();ctx.fillStyle='#b88b63';ctx.beginPath();ctx.arc(hx,hy,3.5,0,Math.PI*2);ctx.fill()}
  // braço distante primeiro para layering correto
  limb(sx2,sy2,hand2.x,hand2.y);limb(sx1,sy1,hand1.x,hand1.y);
  ctx.save();ctx.translate(ca*14,sa*14-8);ctx.rotate(aim);const recoil=player.shotFlash>0?-2:0;ctx.translate(recoil,0);
  if(weaponReady){ctx.imageSmoothingEnabled=true;ctx.drawImage(weaponSprite,-8,-6,35,12)}else{ctx.fillStyle='#242b27';ctx.fillRect(-7,-3,31,6);ctx.fillStyle='#111827';ctx.fillRect(18,-2,12,4)}ctx.restore();
  if(player.shotFlash>0){ctx.save();ctx.translate(ca*43,sa*43-8);ctx.fillStyle='#fde68a';ctx.shadowColor='#f59e0b';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();ctx.restore()}
  ctx.restore();ctx.restore();
}'''
          s=s[:start]+new+s[end:]
          s=s.replace("<title>Caos Live v0.12.6</title>","<title>Caos Live v0.12.7</title>")
          s=s.replace("v0.12.6 · RIG ÚNICO PROFISSIONAL","v0.12.7 · RIG MODULAR PROFISSIONAL")
          s=s.replace("const VERSION='0.12.6'","const VERSION='0.12.7'")
          p.write_text(s)
          vp=Path('version.json')
          if vp.exists():
            import json
            d=json.loads(vp.read_text());d['version']='0.12.7';d['label']='RIG MODULAR PROFISSIONAL';vp.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html version.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix: professional modular player rig v0.12.7'
          git push