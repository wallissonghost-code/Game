name: Verify Phase 3 Runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-phase3.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate game architecture and runtime
        run: npm run check
      - name: Install browser smoke dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Smoke test Start Rank Multiplayer
        run: npm run check:menu
