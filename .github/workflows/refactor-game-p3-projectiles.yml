name: Refactor game P6 enemy spawn

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refactor-game-p3-projectiles.mjs'
      - '.github/workflows/refactor-game-p3-projectiles.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply P6 spawn extraction
        run: node scripts/refactor-game-p3-projectiles.mjs
      - name: Syntax checks
        run: |
          node --check src/game.js
          node --check src/core/skills-bootstrap.mjs
          node --check src/core/projectiles-runtime.mjs
          node --check src/core/enemies-runtime.mjs
          node --check src/core/waves-runtime.mjs
          node --check scripts/refactor-game-p3-projectiles.mjs
      - name: Architecture contracts
        run: |
          node scripts/check-game.mjs
          node scripts/check-architecture.mjs
      - name: Domain self-checks
        run: |
          node --input-type=module -e "import('./src/core/projectiles-runtime.mjs').then(m=>{if(!m.assertProjectileState())process.exit(1); console.log('Projectile domain OK')})"
          node --input-type=module -e "import('./src/core/enemies-runtime.mjs').then(m=>{if(!m.assertEnemyState())process.exit(1); console.log('Enemy domain OK')})"
          node --input-type=module -e "import('./src/core/waves-runtime.mjs').then(m=>{if(!m.assertWaveState())process.exit(1); console.log('Wave domain OK')})"
      - name: Commit extracted P6 boundaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.js src/core/skills-bootstrap.mjs index.html
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
            exit 0
          fi
          git commit -m 'refactor(game): extract enemy spawn and wave composition'
          git push
