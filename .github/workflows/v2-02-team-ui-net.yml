name: Multiplayer V2.0.2

on:
  push:
    paths:
      - '.github/workflows/v2-02-team-ui-net.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch V2.0.2
        run: python -c "import base64;exec(base64.b64decode(' '))"
      - name: Validate
        run: |
          node --check src/multiplayer-v2.js
          node --check cloud/game-server-v3.mjs
          grep -q 'drawTeammateLocator' src/multiplayer-v2.js
          grep -q 'serializeRemotePlayer' cloud/game-server-v3.mjs
          grep -q 'SNAPSHOT_BACKPRESSURE' cloud/game-server-v3.mjs
          npm run check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/multiplayer-v2.js cloud/game-server-v3.mjs multiplayer-v2.html
          git commit -m 'feat: multiplayer v2.0.2 teammate rescue and network optimization'
          git push
