name: Multiplayer V2.0.3

on:
  push:
    paths:
      - '.github/workflows/v2-02-team-ui-net.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Patch V2.0.3
        run: python scripts/patch-v203.py

      - name: Validate
        run: |
          node --check src/multiplayer-v2.js
          node --check cloud/game-server-v3.mjs
          grep -q 'online-v2.0.3' src/multiplayer-v2.js
          grep -q 'cropAlphaFrame' src/multiplayer-v2.js
          grep -q "!p.down&&!p.choices" cloud/game-server-v3.mjs
          grep -q 'saveGlobalDuoRank' src/multiplayer-v2.js
          grep -q 'firebase-ranking.js' multiplayer-v2.html
          npm run check

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/multiplayer-v2.js cloud/game-server-v3.mjs multiplayer-v2.html
          git commit -m 'fix: multiplayer v2.0.3 skins revive exploit and duo rank'
          git push
