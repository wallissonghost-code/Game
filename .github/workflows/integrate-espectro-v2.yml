name: Integrate Espectro v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/integrate-espectro-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch game
        run: python3 scripts/integrate_espectro.py
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: integrate premium Espectro v0.8.1"
            git push origin main
          fi
