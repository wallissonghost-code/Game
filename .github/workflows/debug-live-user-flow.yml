name: Debug Live User Flow
on:
  push:
    paths:
      - '.github/workflows/debug-live-user-flow.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect live flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for fn in ['painel.html','index.html']:
              s=Path(fn).read_text(encoding='utf-8')
              print('\n===== ',fn,' =====')
              keys=['gift','comment','cloud','spawn','peer','send','action','username','user','nickname','uniqueId','sender']
              seen=[]
              for k in keys:
                  start=0
                  while True:
                      i=s.lower().find(k.lower(),start)
                      if i<0: break
                      a=max(0,i-280); b=min(len(s),i+700)
                      chunk=s[a:b]
                      sig=chunk[:100]
                      if sig not in seen:
                          print('\n---',k,'@',i,'---\n',chunk)
                          seen.append(sig)
                      start=i+len(k)
                      if len(seen)>45: break
                  if len(seen)>45: break
          PY