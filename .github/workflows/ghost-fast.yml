name: Ghost Fast CI

on:
  push:
    branches:
      - main
      - 'ci/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ghost-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-chromium

      - name: Install Playwright package
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Ensure matching Chromium is installed
        run: npx playwright install chromium

      - name: Install Chromium system deps
        run: npx playwright install-deps chromium

      - name: Ghost aim regression
        run: node scripts/ghost-aim-bot.mjs

      - name: Ghost whole-game hunter
        run: node scripts/ghost-whole-game-bot.mjs
