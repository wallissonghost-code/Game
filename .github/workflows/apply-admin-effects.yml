name: Apply admin effects update

on:
  push:
    paths:
      - '.github/workflows/apply-admin-effects.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update game and panel
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          text = text.replace("<title>Caos Live v0.5.1</title>", "<title>Caos Live v0.5.2</title>")
          text = text.replace("const VERSION='0.5.1'", "const VERSION='0.5.2'")
          text = text.replace("VERSÃO v0.5.1 · CARREGANDO SKIN", "VERSÃO v0.5.2 · CARREGANDO SKIN")
          text = text.replace("VERSÃO v0.5.1 · SOLDADO PREMIUM", "VERSÃO v0.5.2 · SOLDADO PREMIUM")
          text = text.replace("VERSÃO v0.5.1 · SKIN RESERVA", "VERSÃO v0.5.2 · SKIN RESERVA")
          text = text.replace("png?v=051", "png?v=052")

          old_command = "if(c==='heal'){player.life=Math.min(100,player.life+(+d.amount||35));lifeEl.textContent=player.life}if(c==='damage'){player.life=Math.max(0,player.life-(+d.amount||20));lifeEl.textContent=player.life;if(!player.life)end()}"
          new_command = "if(c==='heal'){player.life=Math.min(100,player.life+(+d.amount||1));lifeEl.textContent=player.life}if(c==='damage'){player.life=Math.max(0,player.life-(+d.amount||2));lifeEl.textContent=player.life;if(!player.life)end()}"
          if old_command not in text:
              raise SystemExit('command block not found')
          text = text.replace(old_command, new_command)

          old_mob_end = "if(e.hp<e.max){ctx.fillStyle='#210c15';ctx.fillRect(-e.r,-e.r-10,e.r*2,4);ctx.fillStyle='#fb7185';ctx.fillRect(-e.r,-e.r-10,e.r*2*e.hp/e.max,4)}ctx.restore()}"
          new_mob_end = "if(e.hp<e.max){ctx.fillStyle='#210c15';ctx.fillRect(-e.r,-e.r-10,e.r*2,4);ctx.fillStyle='#fb7185';ctx.fillRect(-e.r,-e.r-10,e.r*2*e.hp/e.max,4)}if(performance.now()<freezeUntil){const left=Math.max(0,Math.ceil((freezeUntil-performance.now())/1000));ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 18px sans-serif';ctx.shadowColor='#67e8f9';ctx.shadowBlur=10;ctx.fillStyle='#e0f2fe';ctx.fillText('❄',0,-e.r-22);ctx.shadowBlur=0;ctx.font='bold 9px sans-serif';ctx.fillStyle='#ffffff';ctx.fillText(left+'s',0,-e.r-34)}ctx.restore()}"
          if old_mob_end not in text:
              raise SystemExit('mob block not found')
          text = text.replace(old_mob_end, new_mob_end)

          old_draw_end = "ctx.globalAlpha=player.inv>0&&Math.floor(player.inv*30)%2?.35:1;drawPlayer();ctx.globalAlpha=1}"
          new_draw_end = "ctx.globalAlpha=player.inv>0&&Math.floor(player.inv*30)%2?.35:1;drawPlayer();ctx.globalAlpha=1;const now=performance.now();if(now<invincibleUntil){const remaining=(invincibleUntil-now)/1000,blink=remaining<3&&Math.floor(now/180)%2===0,alpha=blink?.22:Math.max(.35,Math.min(.9,remaining/10));ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle='#60a5fa';ctx.fillStyle='rgba(37,99,235,.12)';ctx.lineWidth=4;ctx.shadowColor='#38bdf8';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(W/2,H/2,46,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#dbeafe';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.fillText('🛡',W/2,H/2-50);ctx.restore()}if(now<freezeUntil){const remaining=Math.max(0,Math.ceil((freezeUntil-now)/1000));ctx.save();const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(125,211,252,.25)');g.addColorStop(.5,'rgba(14,165,233,.08)');g.addColorStop(1,'rgba(186,230,253,.22)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(224,242,254,.8)';ctx.lineWidth=8;ctx.strokeRect(4,4,W-8,H-8);ctx.fillStyle='#e0f2fe';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.shadowColor='#38bdf8';ctx.shadowBlur=12;ctx.fillText('❄ CONGELADO '+remaining+'s',W/2,Math.max(88,H*.12));ctx.restore()}}"
          if old_draw_end not in text:
              raise SystemExit('draw block not found')
          text = text.replace(old_draw_end, new_draw_end)
          index.write_text(text, encoding='utf-8')

          panel = Path('painel.html')
          p = panel.read_text(encoding='utf-8')
          p = p.replace('<title>Painel Caos Live v0.4.0</title>', '<title>Painel Caos Live v0.5.2</title>')
          p = p.replace('data-cmd="heal" data-amount="35">❤ CURAR +35', 'data-cmd="heal" data-amount="1">❤ CURAR +1')
          p = p.replace('data-cmd="damage" data-amount="20">💥 DANO -20', 'data-cmd="damage" data-amount="2">💥 DANO -2')
          p = p.replace('PAINEL v0.4.0 · PEERJS / WEBRTC', 'PAINEL v0.5.2 · PEERJS / WEBRTC')
          panel.write_text(p, encoding='utf-8')

          vf = Path('version.json')
          if vf.exists():
              data = json.loads(vf.read_text(encoding='utf-8'))
              data.update({
                  'version':'0.5.2',
                  'label':'v0.5.2',
                  'releasedAt':'2026-08-07T04:23:00Z',
                  'build':'admin-effects-visual-feedback',
                  'notes':[
                      'Painel: cura +1 e dano -2',
                      'Congelamento com efeito de gelo, floco e contador nos mobs',
                      'Invencibilidade com escudo e aviso piscante no fim',
                      'Limpar Arena e Spawn Boss mantidos'
                  ]
              })
              vf.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html painel.html version.json
          git commit -m "feat: add admin gameplay effects v0.5.2"
          git push
