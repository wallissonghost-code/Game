name: Premium Start v0.13.6
on:
  push:
    paths:
      - '.github/workflows/ui-start-v0136.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Caos Live v0.13.5','Caos Live v0.13.6')
          s=s.replace("const VERSION='0.13.5'","const VERSION='0.13.6'")
          s=s.replace('v0.13.5 · CEIFADOR S CORRIGIDO','v0.13.6 · CAMINHADA EQUILIBRADA')
          s=s.replace("const rogueWalkSeq=[10,11,12,13,14,13,12,11]","const rogueWalkSeq=[8,9,10,11,10,9]")
          old='<section id="start" class="overlay show"><div class="card"><h1>Caos Live</h1><p>Novas famílias de inimigos, elites, corrompidos, skills, bosses e drops.</p><button class="btn" id="startBtn">COMEÇAR</button></div></section>'
          new='''<section id="start" class="overlay show startOverlay"><div class="startCard"><div class="startTop"><div><span class="startEyebrow">CAOS LIVE</span><h1>Pronto para entrar?</h1></div><span class="startVersion">v0.13.6</span></div><p>Sobreviva às hordas, evolua suas skills e avance pelo caos.</p><div class="startMeta"><span><b>100</b> VIDA</span><span><b>60</b> FPS</span><span><b>ONLINE</b> STATUS</span></div><button class="startBtnPremium" id="startBtn">ENTRAR NA ARENA</button><small>Build · caminhada equilibrada do Ceifador</small></div></section>'''
          if old not in s:
              raise SystemExit('start section pattern not found')
          s=s.replace(old,new)
          css='''\n.startOverlay{background:radial-gradient(circle at 50% 25%,rgba(124,58,237,.10),transparent 34%),rgba(3,6,14,.94);backdrop-filter:blur(5px)}
.startCard{width:min(430px,calc(100% - 28px));padding:22px;border:1px solid rgba(139,92,246,.34);border-radius:24px;background:linear-gradient(180deg,rgba(16,20,38,.96),rgba(8,11,24,.98));box-shadow:0 24px 80px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.035)}
.startTop{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.startEyebrow{display:block;margin-bottom:6px;color:#9ca3c7;font-size:9px;font-weight:900;letter-spacing:2.2px}.startCard h1{margin:0;font-size:28px;line-height:1.05;letter-spacing:-.7px}.startVersion{flex:0 0 auto;padding:7px 10px;border:1px solid rgba(139,92,246,.45);border-radius:999px;background:rgba(124,58,237,.10);color:#c4b5fd;font-size:10px;font-weight:900}.startCard>p{margin:14px 0 18px;color:#aeb7d8;font-size:13px;line-height:1.5}.startMeta{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:16px}.startMeta span{padding:10px 8px;border:1px solid #252c4b;border-radius:13px;background:#0a0f20;color:#7883aa;font-size:7px;font-weight:800;text-align:center}.startMeta b{display:block;margin-bottom:2px;color:#f8fafc;font-size:12px}.startBtnPremium{width:100%;min-height:50px;border:0;border-radius:15px;background:linear-gradient(135deg,#7c3aed,#a855f7);box-shadow:0 10px 28px rgba(124,58,237,.20);color:white;font-size:13px;font-weight:950;letter-spacing:.4px}.startBtnPremium:active{transform:scale(.985)}.startCard>small{display:block;margin-top:11px;color:#596486;font-size:8px;text-align:center}
@media(max-width:430px){.startCard{padding:19px;border-radius:21px}.startCard h1{font-size:25px}.startVersion{font-size:9px;padding:6px 8px}.startMeta span{padding:9px 5px}.startBtnPremium{min-height:48px}}\n'''
          s=s.replace('</style></head>',css+'</style></head>')
          p.write_text(s,encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'ui: simplify premium start screen and sync v0.13.6' || exit 0
          git push