name: Premium Start v0.13.6

on:
  push:
    paths:
      - '.github/workflows/ui-start-v0136.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch premium start
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<section id="start" class="overlay show"><div class="card"><h1>Caos Live</h1><p>Novas famílias de inimigos, elites, corrompidos, skills, bosses e drops.</p><button class="btn" id="startBtn">COMEÇAR</button></div></section>'
          new=base64.b64decode('').decode()
          css=base64.b64decode('').decode()
          if old not in s:
              raise SystemExit('start section pattern not found')
          s=s.replace(old,new,1)
          s=s.replace('</style></head>',css+'</style></head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'ui: simplify premium start screen v0.13.6'
          git push
