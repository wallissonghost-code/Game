<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Caos · Necromancer Lab V0</title><style>*{box-sizing:border-box}html,body{margin:0;background:#070913;color:#eef2ff;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;inset:10px 10px auto 10px;display:flex;justify-content:space-between;pointer-events:none}.tag,.soul{background:#0b1020dd;border:1px solid #33265c;border-radius:12px;padding:8px 10px;font-weight:900;font-size:12px}.soul{pointer-events:auto;cursor:pointer;color:#d8b4fe}.panel{display:none;position:fixed;right:10px;top:56px;width:min(300px,90vw);background:#090d19f2;border:1px solid #553c9a;border-radius:16px;padding:12px}.panel.show{display:block}.panel h3{margin:0 0 8px}.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:7px 0}.row button,.raise{border:1px solid #6d4cc4;background:#17112c;color:#fff;border-radius:9px;padding:7px 9px;font-weight:900}.raise{position:fixed;left:10px;bottom:12px}.note{font-size:10px;color:#94a3b8;line-height:1.35}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="tag">☠ NECROMANTE · LAB V0</div><button class="soul" id="soul">☠ 0</button></div><div class="panel" id="panel"><h3>☠ Poder das Sombras</h3><div id="stats" class="note"></div><div class="row"><span>❤️ Vida</span><button data-up="life">+</button></div><div class="row"><span>⚔️ Dano</span><button data-up="damage">+</button></div><div class="row"><span>💚 Regeneração</span><button data-up="regen">+</button></div><div class="row"><span>🛡️ Armadura</span><button data-up="armor">+</button></div><div class="note">Não pausa. Pontos acumulam. Sombras ficam até morrer. Este laboratório não entra no catálogo normal de skills.</div></div><button class="raise" id="raise">ERGA-SE · invocar teste</button><script type="module" src="src/experimental/ne
