n class="ver">TESTE v0.2.4</span></div><div class="stage" id="stage"><div class="tag">HUMANOIDE · WALK</div><div class="hp"><i></i></div><div class="enemy"><div class="frame"><img class="sheet" id="sheet" src="./assets/enemies/ED210C0D-94F4-4206-8D8F-790C3514C51F.png?v=024" alt="Humanoide"></div></div></div><div class="info"><strong id="status">WALK · S</strong>v0.2.4 · frames estabilizados · sem giro vertical · sem invasão do frame acima</div></div><script>const stage=document.getElementById('stage'),img=document.getElementById('sheet'),status=document.getElementById('status');const SCALE=.9,VW=64,VH=108;const WALK={S:{cy:322,cx:[80,150,225,295,365]},SW:{cy:430,cx:[75,145,215,290,365]},W:{cy:530,cx:[76,150,225,300,370]},NW:{cy:632,cx:[77,145,220,295,365]},N:{cy:322,cx:[488,558,635,708,795]},NE:{cy:430,cx:[485,558,635,708,795]},E:{cy:530,cx:[485,558,635,708,795]},SE:{cy:632,cx:[485,558,635,708,795]}};const SAFE={S:[0,1,2,3,4],SW:[0,1,2,3,4],W:[0,1,2,3,4],NW:[0,1,2,3,4],N:[0,1,2,3,4],NE:[0,1,2,3,4],E:[0,1,2,3,4],SE:[0,1,2,3,4]};let x=innerWidth*.5,y=innerHeight*.48,vx=52,vy=36,dir='SE',anim=0,lastFrame=0,last=performance.now();function direction(dx,dy){const a=Math.atan2(dy,dx)*180/Math.PI;if(a>=-22.5&&a<22.5)return'E';if(a>=22.5&&a<67.5)return'SE';if(a>=67.5&&a<112.5)return'S';if(a>=112.5&&a<157.5)return'SW';if(a>=157.5||a<-157.5)return'W';if(a>=-157.5&&a<-112.5)return'NW';if(a>=-112.5&&a<-67.5)return'N';return'NE'}function draw(){const w=WALK[dir],seq=SAFE[dir],fi=seq[anim%seq.length],cx=w.cx[fi],cy=w.cy;img.style.left=(VW/2-cx*SCALE)+'px';img.style.top=(VH/2-cy*SCALE)+'px';status.textContent='WALK · '+dir+' · FRAME '+(fi+1)+'/5'}function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;x+=vx*dt;y+=vy*dt;const mx=60,top=170,bottom=innerHeight-190;if(x<mx){x=mx;vx=Math.abs(vx)}if(x>innerWidth-mx){x=innerWidth-mx;vx=-Math.abs(vx)}if(y<top){y=top;vy=Math.abs(vy)}if(y>bottom){y=bottom;vy=-Math.abs(vy)}const nd=direction(vx,vy);if(nd!==dir){dir=nd;anim=0;draw()}if(now-lastFrame>145){anim=(anim+1)%SAFE[dir].length;lastFrame=now;draw()}stage.style.left=(x-44)+'px';stage.style.top=(y-63)+'px';requestAnimationFrame(loop)}addEventListener('resize',()=>{x=Math.min(Math.max(x,60),innerWidth-60);y=Math.min(Math.max(y,170),innerHeight-190)});draw();requestAnimationFrame(loop);</script></body></html>
