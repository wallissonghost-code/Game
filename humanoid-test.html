<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CAOS LIVE · Humanoide v0.1.6</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.arena{position:absolute;inset:0;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:64px 64px}.hud{position:fixed;z-index:5;top:12px;left:12px;padding:10px 13px;border:1px solid #303861;border-radius:14px;background:#0b1020ee}.hud b{color:#a855f7}.hud small{display:block;color:#94a3b8;margin-top:3px}.ver{display:inline-block;margin-top:7px;padding:3px 7px;border:1px solid #4c1d95;border-radius:999px;background:#2e1065;color:#d8b4fe;font-size:10px;font-weight:900}.stage{position:absolute;left:50%;top:48%;width:88px;height:126px;transform:translate(-50%,-50%)}.enemy{position:absolute;left:50%;bottom:0;width:88px;height:126px;overflow:hidden;transform:translateX(-50%);pointer-events:none}.sheet{position:absolute;width:1536px;height:1024px;max-width:none}.tag{position:absolute;left:50%;top:-35px;transform:translateX(-50%);white-space:nowrap;font-size:10px;font-weight:900;color:#fecaca;text-shadow:0 1px 3px #000}.hp{position:absolute;left:50%;top:-18px;transform:translateX(-50%);width:70px;height:5px;background:#2b0b10;border-radius:8px;overflow:hidden}.hp i{display:block;width:100%;height:100%;background:#ef4444}.controls{position:fixed;left:12px;right:12px;bottom:24px;padding:10px;border:1px solid #303861;border-radius:14px;background:#0b1020ee}.label{text-align:center;color:#a78bfa;font-size:11px;font-weight:900;margin-bottom:8px}.dirs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.dirs button{appearance:none;border:1px solid #334155;border-radius:10px;background:#111827;color:#cbd5e1;padding:10px 2px;font-size:11px;font-weight:900}.dirs button.active{border-color:#a855f7;background:#3b0764;color:#fff}.note{text-align:center;color:#94a3b8;font-size:10px;margin-top:8px}</style></head><body><div class="arena"><div class="hud">CAOS <b>LIVE</b><small>HUMANOIDE · IDLE 8 DIREÇÕES</small><span class="ver">TESTE v0.1.6</span></div><div class="stage"><div class="tag">HUMANOIDE · IDLE</div><div class="hp"><i></i></div><div class="enemy"><img class="sheet" id="sheet" src="./assets/enemies/ED210C0D-94F4-4206-8D8F-790C3514C51F.png?v=016" alt="Humanoide"></div></div><div class="controls"><div class="label" id="label">DIREÇÃO: S</div><div class="dirs" id="dirs"></div><div class="note">PARADO · somente rotação · recorte individual por direção</div></div></div><script>const img=document.getElementById('sheet'),enemy=document.querySelector('.enemy'),dirsEl=document.getElementById('dirs'),label=document.getElementById('label');/* v0.1.6: crop individual apertado. y/h ignoram a faixa de título/legendas e x/w evitam pixels das poses vizinhas. */const POSES={S:{x:14,y:35,w:75,h:158},SW:{x:116,y:35,w:78,h:158},W:{x:220,y:34,w:75,h:158},NW:{x:322,y:34,w:77,h:158},N:{x:427,y:34,w:78,h:158},NE:{x:529,y:34,w:81,h:158},E:{x:632,y:34,w:78,h:158},SE:{x:735,y:34,w:82,h:158}};const SCALE=.72,VIEW_W=88,VIEW_H=126;function setDir(d){const p=POSES[d];img.style.width=1536*SCALE+'px';img.style.height=1024*SCALE+'px';const cropW=p.w*SCALE,cropH=p.h*SCALE;enemy.style.width=Math.min(VIEW_W,cropW)+'px';enemy.style.height=Math.min(VIEW_H,cropH)+'px';const viewportW=enemy.clientWidth,viewportH=enemy.clientHeight;const cx=p.x+p.w/2,bottom=p.y+p.h;img.style.left=(viewportW/2-cx*SCALE)+'px';img.style.top=(viewportH-bottom*SCALE)+'px';label.textContent='DIREÇÃO: '+d;document.querySelectorAll('.dirs button').forEach(b=>b.classList.toggle('active',b.dataset.dir===d))}['N','NE','E','SE','S','SW','W','NW'].forEach(d=>{const b=document.createElement('button');b.textContent=d;b.dataset.dir=d;b.onclick=()=>setDir(d);dirsEl.appendChild(b)});setDir('S');</script></body></html>
