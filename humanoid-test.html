<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CAOS LIVE · Sprite Inspector v0.3.1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.arena{position:absolute;inset:0;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:64px 64px}.hud{position:fixed;z-index:10;top:12px;left:12px;padding:10px 13px;border:1px solid #303861;border-radius:14px;background:#0b1020ee}.hud b{color:#a855f7}.hud small{display:block;color:#94a3b8;margin-top:3px}.ver{display:inline-block;margin-top:7px;padding:3px 7px;border:1px solid #4c1d95;border-radius:999px;background:#2e1065;color:#d8b4fe;font-size:10px;font-weight:900}.viewer{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);width:210px;height:230px;border:1px solid #334155;border-radius:14px;background:#050b14;overflow:hidden;display:flex;align-items:center;justify-content:center}.viewer canvas{max-width:196px;max-height:216px;object-fit:contain}.cross{position:absolute;inset:0;pointer-events:none;border:1px dashed #a855f755}.panel{position:fixed;z-index:10;left:12px;right:12px;bottom:18px;padding:10px;border:1px solid #303861;border-radius:14px;background:#0b1020f5}.title{text-align:center;color:#a78bfa;font-size:11px;font-weight:900;margin-bottom:7px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:6px}.nav button{appearance:none;border:1px solid #334155;border-radius:9px;background:#111827;color:#dbe3ef;padding:10px 2px;font-size:10px;font-weight:900}.note{text-align:center;color:#94a3b8;font-size:9px;margin-top:7px}.status{text-align:center;color:#c4b5fd;font-size:9px;margin-bottom:7px}</style></head><body><div class="arena"><div class="hud">CAOS <b>LIVE</b><small>SPRITES RECORTADOS PELO CORPO REAL</small><span class="ver">TESTE v0.3.1</span></div><div class="viewer" id="viewer"><canvas id="out"></canvas><div class="cross"></div></div><div class="panel"><div class="title" id="label">ANALISANDO SPRITE SHEET...</div><div class="status" id="status">Sem grade fixa · sem invadir célula vizinha</div><div class="nav"><button id="prev">◀ ANTERIOR</button><button id="next">PRÓXIMA ▶</button></div><div class="note">Agora cada recorte usa os limites reais dos pixels visíveis. Textos e partes pequenas isoladas são descartados automaticamente.</div></div></div><img id="src" src="./assets/enemies/ED210C0D-94F4-4206-8D8F-790C3514C51F.png?v=031" hidden><script>const src=document.getElementById('src'),out=document.getElementById('out'),ctx=out.getContext('2d'),label=document.getElementById('label'),status=document.getElementById('status');let sprites=[],index=0;function build(){const c=document.createElement('canvas');c.width=src.naturalWidth;c.height=src.naturalHeight;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0);const d=x.getImageData(0,0,c.width,c.height).data,w=c.width,h=c.height;const step=3,gw=Math.ceil(w/step),gh=Math.ceil(h/step),mask=new Uint8Array(gw*gh);for(let gy=0;gy<gh;gy++)for(let gx=0;gx<gw;gx++){let hit=0;for(let yy=0;yy<step&&!hit;yy++)for(let xx=0;xx<step;xx++){const px=gx*step+xx,py=gy*step+yy;if(px<w&&py<h&&d[(py*w+px)*4+3]>35){hit=1;break}}mask[gy*gw+gx]=hit}const seen=new Uint8Array(mask.length),q=new Int32Array(mask.length);let comps=[];for(let p=0;p<mask.length;p++){if(!mask[p]||seen[p])continue;let head=0,tail=0;q[tail++]=p;seen[p]=1;let minx=gw,miny=gh,maxx=0,maxy=0,n=0;while(head<tail){const a=q[head++],ay=(a/gw)|0,ax=a-ay*gw;n++;if(ax<minx)minx=ax;if(ax>maxx)maxx=ax;if(ay<miny)miny=ay;if(ay>maxy)maxy=ay;for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){if(!ox&&!oy)continue;const nx=ax+ox,ny=ay+oy;if(nx<0||ny<0||nx>=gw||ny>=gh)continue;const np=ny*gw+nx;if(mask[np]&&!seen[np]){seen[np]=1;q[tail++]=np}}}const bw=(maxx-minx+1)*step,bh=(maxy-miny+1)*step;if(n>90&&bw>24&&bh>34)comps.push({x:minx*step,y:miny*step,w:bw,h:bh,n})}comps.sort((a,b)=>a.y-b.y||a.x-b.x);sprites=comps.filter(a=>{const ratio=a.w/a.h;return a.n>140&&a.w>30&&a.h>45&&ratio>.18&&ratio<4.5});status.textContent=sprites.length+' recortes reais encontrados · sem grade 10×7';draw()}function draw(){if(!sprites.length)return;const s=sprites[index],pad=8,x=Math.max(0,s.x-pad),y=Math.max(0,s.y-pad),rw=Math.min(src.naturalWidth-x,s.w+pad*2),rh=Math.min(src.naturalHeight-y,s.h+pad*2);out.width=rw;out.height=rh;ctx.clearRect(0,0,rw,rh);ctx.drawImage(src,x,y,rw,rh,0,0,rw,rh);label.textContent='SPRITE '+(index+1)+'/'+sprites.length+' · '+s.w+'×'+s.h+' px'}document.getElementById('prev').onclick=()=>{if(!sprites.length)return;index=(index-1+sprites.length)%sprites.length;draw()};document.getElementById('next').onclick=()=>{if(!sprites.length)return;index=(index+1)%sprites.length;draw()};let sx=0;document.getElementById('viewer').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});document.getElementById('viewer').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>30){index=(index+(dx<0?1:-1)+sprites.length)%sprites.length;draw()}},{passive:true});src.onload=build;if(src.complete)build();</script></body></html>
