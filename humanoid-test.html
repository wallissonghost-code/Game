<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CAOS LIVE · Humanoide Sprite Teste</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.hud{position:fixed;z-index:5;top:12px;left:12px;padding:10px 13px;border:1px solid #303861;border-radius:14px;background:#0b1020dd}.hud b{color:#a855f7}.hud small{display:block;color:#94a3b8;margin-top:3px}.ver{display:inline-block;margin-top:7px;padding:3px 7px;border:1px solid #4c1d95;border-radius:999px;background:#2e1065;color:#d8b4fe;font-size:10px;font-weight:900;letter-spacing:.4px}.arena{position:absolute;inset:0;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:64px 64px}.player{position:absolute;left:50%;top:50%;width:38px;height:52px;transform:translate(-50%,-100%);border-radius:15px 15px 10px 10px;background:#35452b}.player:before{content:'';position:absolute;left:8px;top:-10px;width:22px;height:22px;border-radius:50%;background:#55663b}.enemy{position:absolute;width:92px;height:138px;overflow:hidden;transform:translate(-50%,-100%);transform-origin:50% 100%;pointer-events:none}.sheet{position:absolute;width:1536px;height:1024px;max-width:none;image-rendering:auto;will-change:left,top}.tag,.hp{position:absolute;transform:translate(-50%,-100%);white-space:nowrap}.tag{font-size:10px;font-weight:900;color:#fecaca;text-shadow:0 1px 3px #000}.hp{width:72px;height:5px;background:#2b0b10;border-radius:8px;overflow:hidden}.hp i{display:block;width:100%;height:100%;background:#ef4444}.note{position:fixed;left:12px;right:12px;bottom:14px;text-align:center;color:#9ca3c7;font-size:11px}</style></head><body><div class="arena"><div class="hud">CAOS <b>LIVE</b><small>HUMANOIDE · RECORTE DIRECIONAL</small><span class="ver">TESTE v0.1.1 · abc07ad</span></div><div class="player"></div><div class="enemy" id="enemy"><img class="sheet" id="sheet" src="./assets/enemies/ED210C0D-94F4-4206-8D8F-790C3514C51F.png" alt="Humanoide"></div><div class="tag" id="tag">HUMANOIDE · NOVA BASE</div><div class="hp" id="hp"><i></i></div><div class="note">1 personagem por vez · direção acompanha o movimento · TESTE v0.1.1</div></div><script>const e=document.getElementById('enemy'),img=document.getElementById('sheet'),tag=document.getElementById('tag'),hp=document.getElementById('hp');let x=innerWidth*.2,y=innerHeight*.72,vx=0,vy=0,last=performance.now();const IDLE={N:[330,122],NE:[456,124],E:[579,126],SE:[696,128],S:[810,127],SW:[929,128],W:[1046,129],NW:[1161,129]};const CROP_W=92,CROP_H=138;function setDir(dir){const p=IDLE[dir]||IDLE.S;img.style.left=(CROP_W/2-p[0])+'px';img.style.top=(CROP_H-14-p[1])+'px'}function dirFromVelocity(dx,dy){const a=Math.atan2(dy,dx)*180/Math.PI;if(a>=-22.5&&a<22.5)return'E';if(a>=22.5&&a<67.5)return'SE';if(a>=67.5&&a<112.5)return'S';if(a>=112.5&&a<157.5)return'SW';if(a>=157.5||a<-157.5)return'W';if(a>=-157.5&&a<-112.5)return'NW';if(a>=-112.5&&a<-67.5)return'N';return'NE'}setDir('S');function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;const tx=innerWidth/2,ty=innerHeight/2,dx=tx-x,dy=ty-y,d=Math.hypot(dx,dy)||1,stop=76,speed=44;if(d>stop){const ax=dx/d*speed,ay=dy/d*speed;vx+=(ax-vx)*Math.min(1,dt*4);vy+=(ay-vy)*Math.min(1,dt*4);x+=vx*dt;y+=vy*dt;setDir(dirFromVelocity(vx,vy))}else{vx*=Math.pow(.03,dt);vy*=Math.pow(.03,dt)}e.style.left=x+'px';e.style.top=y+'px';tag.style.left=x+'px';tag.style.top=(y-144)+'px';hp.style.left=x+'px';hp.style.top=(y-130)+'px';requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
