<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CAOS LIVE · 12 Frames</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.arena{position:absolute;inset:0;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:64px 64px}.hud{position:fixed;top:18px;left:18px;padding:14px 18px;border:1px solid #303861;border-radius:16px;background:#0b1020ee}.hud b,.title{color:#a78bfa}.hud small{display:block;color:#94a3b8;margin-top:5px}.viewer{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:260px;height:300px;display:flex;align-items:center;justify-content:center;overflow:visible;background:transparent}.viewer canvas{width:100%;height:100%;object-fit:contain}.panel{position:fixed;left:18px;right:18px;bottom:24px;padding:14px;border:1px solid #303861;border-radius:16px;background:#0b1020f5;text-align:center}.title{font-weight:900}.status{margin-top:7px;color:#94a3b8;font-size:13px}</style><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script></head><body><div class="arena"><div class="hud">CAOS <b>LIVE</b><small>TESTE DOS 12 PNGs · BORDA REMOVIDA</small></div><div class="viewer"><canvas id="sprite" width="260" height="300"></canvas></div><div class="panel"><div class="title" id="label">CARREGANDO ZIP...</div><div class="status" id="status">Removendo apenas a moldura/borda da célula.</div></div></div><script>(async()=>{const label=document.getElementById('label'),status=document.getElementById('status'),canvas=document.getElementById('sprite'),ctx=canvas.getContext('2d');function clean(im){const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0);const d=x.getImageData(0,0,c.width,c.height),p=d.data,w=c.width,h=c.height;for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){const i=(y*w+xx)*4,r=p[i],g=p[i+1],b=p[i+2];const edge=xx<5||xx>=w-5||y<5||y>=h-5;const gray=Math.max(r,g,b)-Math.min(r,g,b)<18;const line=edge&&gray&&r>55&&r<230;if(line)p[i+3]=0}x.putImageData(d,0,0);return c}try{const r=await fetch('./assets/enemies/personagem_12_frames_recortados.zip?v=13');if(!r.ok)throw Error('HTTP '+r.status);const zip=await JSZip.loadAsync(await r.arrayBuffer());const names=Object.keys(zip.files).filter(n=>/\.png$/i.test(n)&&!zip.files[n].dir).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));const frames=[];for(const n of names){const blob=await zip.files[n].async('blob'),url=URL.createObjectURL(blob),im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=url});frames.push(clean(im));URL.revokeObjectURL(url)}let i=0;function show(){ctx.clearRect(0,0,canvas.width,canvas.height);const f=frames[i],s=Math.min(canvas.width/f.width,canvas.height/f.height),dw=f.width*s,dh=f.height*s;ctx.drawImage(f,(canvas.width-dw)/2,(canvas.height-dh)/2,dw,dh);label.textContent='FRAME '+(i+1)+'/'+frames.length;status.textContent='Borda da célula removida · proporção original mantida';i=(i+1)%frames.length}show();setInterval(show,220)}catch(e){label.textContent='ERRO AO ABRIR ZIP';status.textContent=e.message}})();</script></body></html>
