<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CAOS LIVE · Humanoide v0.2.6</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.arena{position:absolute;inset:0;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:64px 64px}.hud{position:fixed;z-index:5;top:12px;left:12px;padding:10px 13px;border:1px solid #303861;border-radius:14px;background:#0b1020ee}.hud b{color:#a855f7}.hud small{display:block;color:#94a3b8;margin-top:3px}.ver{display:inline-block;margin-top:7px;padding:3px 7px;border:1px solid #4c1d95;border-radius:999px;background:#2e1065;color:#d8b4fe;font-size:10px;font-weight:900}.stage{position:absolute;width:100px;height:138px;will-change:left,top}.enemy{position:absolute;left:50%;bottom:0;width:82px;height:118px;overflow:hidden;transform:translateX(-50%);pointer-events:none}.sheet{position:absolute;width:1382.4px;height:921.6px;max-width:none}.tag{position:absolute;left:50%;top:-31px;transform:translateX(-50%);white-space:nowrap;font-size:10px;font-weight:900;color:#fecaca;text-shadow:0 1px 3px #000}.hp{position:absolute;left:50%;top:-15px;transform:translateX(-50%);width:62px;height:5px;background:#2b0b10;border-radius:8px;overflow:hidden}.hp i{display:block;width:100%;height:100%;background:#ef4444}.info{position:fixed;z-index:5;left:12px;right:12px;bottom:24px;padding:10px;border:1px solid #303861;border-radius:14px;background:#0b1020ee;text-align:center;color:#94a3b8;font-size:10px}.info strong{display:block;color:#a78bfa;font-size:11px;margin-bottom:4px}</style></head><body><div class="arena"><div class="hud">CAOS <b>LIVE</b><small>HUMANOIDE · MOVE TEST</small><span class="ver">TESTE v0.2.6</span></div><div class="stage" id="stage"><div class="tag">HUMANOIDE · MOVE</div><div class="hp"><i></i></div><div class="enemy"><img class="sheet" id="sheet" src="./assets/enemies/ED210C0D-94F4-4206-8D8F-790C3514C51F.png?v=026" alt="Humanoide"></div></div><div class="info"><strong id="status">MOVE · S</strong>v0.2.6 · mesmo recorte validado do IDLE · sem animação WALK</div></div><script>const stage=document.getElementById('stage'),img=document.getElementById('sheet'),status=document.getElementById('status');const SCALE=.9,VW=82,VH=118;/* centros das oito poses da PRIMEIRA FILEIRA já validada no teste IDLE */const POSE={S:{cx:115,cy:92},SW:{cx:288,cy:92},W:{cx:461,cy:92},NW:{cx:634,cy:92},N:{cx:807,cy:92},NE:{cx:980,cy:92},E:{cx:1153,cy:92},SE:{cx:1326,cy:92}};let x=innerWidth*.5,y=innerHeight*.48,vx=52,vy=36,dir='SE',last=performance.now();function direction(dx,dy){const a=Math.atan2(dy,dx)*180/Math.PI;if(a>=-22.5&&a<22.5)return'E';if(a>=22.5&&a<67.5)return'SE';if(a>=67.5&&a<112.5)return'S';if(a>=112.5&&a<157.5)return'SW';if(a>=157.5||a<-157.5)return'W';if(a>=-157.5&&a<-112.5)return'NW';if(a>=-112.5&&a<-67.5)return'N';return'NE'}function draw(){const p=POSE[dir];img.style.left=(VW/2-p.cx*SCALE)+'px';img.style.top=(VH/2-p.cy*SCALE)+'px';status.textContent='MOVE · '+dir+' · IDLE VALIDADO'}function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;x+=vx*dt;y+=vy*dt;const mx=65,top=180,bottom=innerHeight-200;if(x<mx){x=mx;vx=Math.abs(vx)}if(x>innerWidth-mx){x=innerWidth-mx;vx=-Math.abs(vx)}if(y<top){y=top;vy=Math.abs(vy)}if(y>bottom){y=bottom;vy=-Math.abs(vy)}const nd=direction(vx,vy);if(nd!==dir){dir=nd;draw()}stage.style.left=(x-50)+'px';stage.style.top=(y-69)+'px';requestAnimationFrame(loop)}addEventListener('resize',()=>{x=Math.min(Math.max(x,65),innerWidth-65);y=Math.min(Math.max(y,180),innerHeight-200)});draw();requestAnimationFrame(loop);</script></body></html>
