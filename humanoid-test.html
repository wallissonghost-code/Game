<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CAOS LIVE · Humanoide Sprite Teste</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.hud{position:fixed;z-index:5;top:12px;left:12px;padding:10px 13px;border:1px solid #303861;border-radius:14px;background:#0b1020dd}.hud b{color:#a855f7}.hud small{display:block;color:#94a3b8;margin-top:3px}.arena{position:absolute;inset:0;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:64px 64px}.player{position:absolute;left:50%;top:50%;width:38px;height:52px;transform:translate(-50%,-100%);border-radius:15px 15px 10px 10px;background:#35452b}.player:before{content:'';position:absolute;left:8px;top:-10px;width:22px;height:22px;border-radius:50%;background:#55663b}.enemy{position:absolute;width:96px;height:112px;overflow:hidden;transform:translate(-50%,-100%);transform-origin:50% 100%}.sheet{position:absolute;max-width:none;image-rendering:auto;will-change:transform}.tag,.hp{position:absolute;transform:translate(-50%,-100%);white-space:nowrap}.tag{font-size:10px;font-weight:900;color:#fecaca;text-shadow:0 1px 3px #000}.hp{width:72px;height:5px;background:#2b0b10;border-radius:8px;overflow:hidden}.hp i{display:block;width:100%;height:100%;background:#ef4444}.note{position:fixed;left:12px;right:12px;bottom:14px;text-align:center;color:#9ca3c7;font-size:11px}</style></head><body><div class="arena"><div class="hud">CAOS <b>LIVE</b><small>NOVA SPRITE SHEET · TESTE DE FRAMES</small></div><div class="player"></div><div class="enemy" id="enemy"><img class="sheet" id="sheet" src="./assets/enemies/ED210C0D-94F4-4206-8D8F-790C3514C51F.png" alt="Humanoide"></div><div class="tag" id="tag">HUMANOIDE · NOVA BASE</div><div class="hp" id="hp"><i></i></div><div class="note">Nova folha carregada do GitHub · recorte animado em teste.</div></div><script>const e=document.getElementById('enemy'),img=document.getElementById('sheet'),tag=document.getElementById('tag'),hp=document.getElementById('hp');let x=innerWidth*.2,y=innerHeight*.72,vx=0,vy=0,last=performance.now(),frame=0,acc=0;const COLS=4,ROWS=4;function layout(){if(!img.naturalWidth)return;const fw=img.naturalWidth/COLS,fh=img.naturalHeight/ROWS,scale=Math.min(96/fw,112/fh);img.style.width=(img.naturalWidth*scale)+'px';img.style.height=(img.naturalHeight*scale)+'px';img.dataset.fw=fw*scale;img.dataset.fh=fh*scale;setFrame(frame)}function setFrame(n){const fw=+img.dataset.fw||0,fh=+img.dataset.fh||0;if(!fw)return;const c=n%COLS,r=Math.floor(n/COLS)%ROWS;img.style.left=(-c*fw+(96-fw)/2)+'px';img.style.top=(-r*fh+(112-fh))+'px'}img.onload=layout;addEventListener('resize',layout);function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;const tx=innerWidth/2,ty=innerHeight/2,dx=tx-x,dy=ty-y,d=Math.hypot(dx,dy)||1,stop=80,speed=44;if(d>stop){const ax=dx/d*speed,ay=dy/d*speed;vx+=(ax-vx)*Math.min(1,dt*4);vy+=(ay-vy)*Math.min(1,dt*4);x+=vx*dt;y+=vy*dt;acc+=dt;if(acc>.14){acc=0;frame=(frame+1)%(COLS*ROWS);setFrame(frame)}}else{vx*=Math.pow(.03,dt);vy*=Math.pow(.03,dt)}e.style.left=x+'px';e.style.top=y+'px';tag.style.left=x+'px';tag.style.top=(y-118)+'px';hp.style.left=x+'px';hp.style.top=(y-103)+'px';requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
