<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CAOS LIVE · Humanoide Teste</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.hud{position:fixed;z-index:5;top:12px;left:12px;padding:10px 13px;border:1px solid #303861;border-radius:14px;background:#0b1020dd}.hud b{color:#a855f7}.hud small{display:block;color:#94a3b8;margin-top:3px}.arena{position:absolute;inset:0;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:64px 64px}.player{position:absolute;left:50%;top:50%;width:38px;height:52px;transform:translate(-50%,-100%);border-radius:15px 15px 10px 10px;background:#35452b}.player:before{content:'';position:absolute;left:8px;top:-10px;width:22px;height:22px;border-radius:50%;background:#55663b}.enemy{position:absolute;width:78px;height:116px;overflow:hidden;transform:translate(-50%,-100%);transform-origin:50% 100%}.sheet{position:absolute;width:1302px;height:auto;max-width:none;left:-228px;top:-36px}.enemy.face-left{transform:translate(-50%,-100%) scaleX(-1)}.enemy.face-left .sheet{transform:scaleX(-1)}.tag,.hp{position:absolute;transform:translate(-50%,-100%);white-space:nowrap}.tag{font-size:10px;font-weight:900;color:#fecaca;text-shadow:0 1px 3px #000}.hp{width:72px;height:5px;background:#2b0b10;border-radius:8px;overflow:hidden}.hp i{display:block;width:100%;height:100%;background:#ef4444}.note{position:fixed;left:12px;right:12px;bottom:14px;text-align:center;color:#9ca3c7;font-size:11px}</style></head><body><div class="arena"><div class="hud">CAOS <b>LIVE</b><small>TESTE · HUMANOIDE · MOVIMENTO NATURAL</small></div><div class="player"></div><div class="enemy" id="enemy"><img class="sheet" src="./assets/enemies/CAOS-LIVE-Humanoide-Base.png" alt="Humanoide"></div><div class="tag" id="tag">HUMANOIDE · TESTE</div><div class="hp" id="hp"><i></i></div><div class="note">Teste de perseguição · sem órbita, pés ancorados e orientação horizontal.</div></div><script>const e=document.getElementById('enemy'),tag=document.getElementById('tag'),hp=document.getElementById('hp');let x=innerWidth*.22,y=innerHeight*.72,vx=0,vy=0,last=performance.now();function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;const tx=innerWidth/2,ty=innerHeight/2,dx=tx-x,dy=ty-y,d=Math.hypot(dx,dy)||1,stop=88,speed=42;if(d>stop){const ax=dx/d*speed,ay=dy/d*speed;vx+=(ax-vx)*Math.min(1,dt*3.5);vy+=(ay-vy)*Math.min(1,dt*3.5);x+=vx*dt;y+=vy*dt}else{vx*=Math.pow(.03,dt);vy*=Math.pow(.03,dt)}e.classList.toggle('face-left',vx<-.5);e.style.left=x+'px';e.style.top=y+'px';tag.style.left=x+'px';tag.style.top=(y-121)+'px';hp.style.left=x+'px';hp.style.top=(y-106)+'px';requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
