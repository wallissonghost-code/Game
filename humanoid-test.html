<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CAOS LIVE · Loop de Passos</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}.arena{position:absolute;inset:0;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:48px 48px}.hud{position:fixed;z-index:10;top:12px;left:12px;padding:10px 13px;border:1px solid #303861;border-radius:14px;background:#0b1020ee;pointer-events:none}.hud b{color:#a78bfa}.hud small{display:block;color:#94a3b8;margin-top:4px}.ver{display:inline-block;margin-top:6px;padding:3px 7px;border-radius:999px;background:#2e1065;color:#d8b4fe;font-size:10px;font-weight:900}.player{position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%);border-radius:50%;background:#24344f;border:2px solid #60a5fa;box-shadow:0 0 0 5px #60a5fa18;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:3;pointer-events:none}.player:after{content:'PLAYER';position:absolute;top:51px;font-size:8px;font-weight:900;color:#93c5fd}.mob{position:absolute;width:44px;height:88px;transform:translate(-50%,-50%);z-index:4;pointer-events:none;will-change:left,top}.mob img{width:100%;height:100%;object-fit:contain;display:block}.target{position:absolute;width:28px;height:28px;border:2px solid #a78bfa;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;z-index:2;box-shadow:0 0 0 7px #a78bfa18;transition:opacity .15s}.target.show{opacity:1}.panel{position:fixed;z-index:10;left:12px;right:12px;bottom:16px;padding:10px;border:1px solid #303861;border-radius:14px;background:#0b1020ee;text-align:center;font-size:11px;color:#94a3b8;pointer-events:none}.panel b{color:#a78bfa}</style><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script></head><body><div class="arena" id="arena"><div class="hud">CAOS <b>LIVE</b><small>TOQUE NA TELA · LOOP DE PERNAS CONTÍNUO</small><span class="ver">v0.7.2 · PASSOS BASE S</span></div><div class="player">●</div><div class="target" id="target"></div><div class="mob" id="mob"><img id="sprite" alt="mob"></div><div class="panel"><b id="label">CARREGANDO...</b><br>O loop que ficou bom em S agora é repetido durante qualquer deslocamento · sem dano/colisão</div></div><script>(async()=>{const arena=document.getElementById('arena'),mob=document.getElementById('mob'),sprite=document.getElementById('sprite'),label=document.getElementById('label'),marker=document.getElementById('target');try{const r=await fetch('./assets/personagem_12_frames_corrigidos.zip?v=072');if(!r.ok)throw Error('HTTP '+r.status);const zip=await JSZip.loadAsync(await r.arrayBuffer());const names=Object.keys(zip.files).filter(n=>/\.png$/i.test(n)&&!zip.files[n].dir).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));const urls=[];for(const n of names)urls.push(URL.createObjectURL(await zip.files[n].async('blob')));const dirFrame={S:0,SW:1,W:2,NW:3,N:4,NE:5,E:6,SE:7};const dirOrder=['E','SE','S','SW','W','NW','N','NE'];const walkSeq=urls.length>=12?[8,9,10,11,10,9]:[0];let x=innerWidth*.25,y=innerHeight*.52,tx=x,ty=y,last=performance.now(),moving=false,lockedDir='S',walkIndex=0,lastFrame=0;const speed=115;mob.style.left=x+'px';mob.style.top=y+'px';sprite.src=urls[dirFrame.S]||urls[0];function directionFrom(dx,dy){let a=Math.atan2(dy,dx)*180/Math.PI;if(a<0)a+=360;return dirOrder[Math.round(a/45)%8]}function setTarget(px,py){tx=Math.max(28,Math.min(innerWidth-28,px));ty=Math.max(120,Math.min(innerHeight-120,py));const dx=tx-x,dy=ty-y;if(Math.hypot(dx,dy)<3)return;lockedDir=directionFrom(dx,dy);walkIndex=0;lastFrame=0;sprite.src=urls[walkSeq[0]]||urls[0];marker.style.left=tx+'px';marker.style.top=ty+'px';marker.classList.add('show');moving=true;label.textContent='MOVENDO '+lockedDir+' · LOOP DE PASSOS ATIVO'}arena.addEventListener('pointerdown',e=>{if(e.target.closest('.hud')||e.target.closest('.panel'))return;setTarget(e.clientX,e.clientY)});function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;const dx=tx-x,dy=ty-y,dist=Math.hypot(dx,dy);if(moving&&dist>2){const step=Math.min(dist,speed*dt);x+=dx/dist*step;y+=dy/dist*step;mob.style.left=x+'px';mob.style.top=y+'px';if(now-lastFrame>135){walkIndex=(walkIndex+1)%walkSeq.length;sprite.src=urls[walkSeq[walkIndex]]||urls[0];lastFrame=now}label.textContent='MOVENDO '+lockedDir+' · PERNAS EM LOOP'}else if(moving){x=tx;y=ty;mob.style.left=x+'px';mob.style.top=y+'px';moving=false;marker.classList.remove('show');sprite.src=urls[dirFrame[lockedDir]]||urls[0];label.textContent='PARADO · DIREÇÃO '+lockedDir}requestAnimationFrame(loop)}requestAnimationFrame(loop)}catch(e){label.textContent='ERRO: '+e.message}})();</script></body></html>
