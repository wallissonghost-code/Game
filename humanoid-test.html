r;color:#9ca3c7;font-size:11px}</style></head><body><div class="arena"><div class="hud">CAOS <b>LIVE</b><small>HUMANOIDE · CORPO INTEIRO + 8 DIREÇÕES</small><span class="ver">TESTE v0.1.2</span></div><div class="dir" id="dir">DIREÇÃO: S</div><div class="player"></div><div class="enemy" id="enemy"><img class="sheet" id="sheet" src="./assets/enemies/ED210C0D-94F4-4206-8D8F-790C3514C51F.png?v=012" alt="Humanoide"></div><div class="tag" id="tag">HUMANOIDE · NOVA BASE</div><div class="hp" id="hp"><i></i></div><div class="note">v0.1.2 · janela ampliada para preservar cabeça, tronco, pernas e pés</div></div><script>const e=document.getElementById('enemy'),img=document.getElementById('sheet'),tag=document.getElementById('tag'),hp=document.getElementById('hp'),dirEl=document.getElementById('dir');let x=innerWidth*.18,y=innerHeight*.72,vx=0,vy=0,last=performance.now(),current='S';/* Centros aproximados dos oito desenhos da primeira faixa. A janela agora e maior para nao amputar pernas/pes. */const IDLE={N:[330,145],NE:[456,145],E:[579,145],SE:[696,145],S:[810,145],SW:[929,145],W:[1046,145],NW:[1161,145]};const W=126,H=190;function setDir(d){if(d===current&&img.dataset.ready)return;current=d;const p=IDLE[d]||IDLE.S;img.style.left=(W/2-p[0])+'px';img.style.top=(H-18-p[1]-92)+'px';img.dataset.ready='1';dirEl.textContent='DIREÇÃO: '+d}function dirFromVelocity(dx,dy){const a=Math.atan2(dy,dx)*180/Math.PI;if(a>=-22.5&&a<22.5)return'E';if(a>=22.5&&a<67.5)return'SE';if(a>=67.5&&a<112.5)return'S';if(a>=112.5&&a<157.5)return'SW';if(a>=157.5||a<-157.5)return'W';if(a>=-157.5&&a<-112.5)return'NW';if(a>=-112.5&&a<-67.5)return'N';return'NE'}setDir('S');function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;/* alvo circula lentamente para obrigar o inimigo a mostrar as 8 direcoes */const t=now*.00032,tx=innerWidth/2+Math.cos(t)*Math.min(innerWidth*.27,150),ty=innerHeight/2+Math.sin(t)*Math.min(innerHeight*.16,130),dx=tx-x,dy=ty-y,d=Math.hypot(dx,dy)||1,speed=52;if(d>12){const ax=dx/d*speed,ay=dy/d*speed;vx+=(ax-vx)*Math.min(1,dt*3.5);vy+=(ay-vy)*Math.min(1,dt*3.5);x+=vx*dt;y+=vy*dt;if(Math.hypot(vx,vy)>4)setDir(dirFromVelocity(vx,vy))}e.style.left=x+'px';e.style.top=y+'px';tag.style.left=x+'px';tag.style.top=(y-H-8)+'px';hp.style.left=x+'px';hp.style.top=(y-H+7)+'px';requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
