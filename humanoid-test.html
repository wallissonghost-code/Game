<div class="stage" id="stage"><div class="tag">HUMANOIDE · WALK</div><div class="hp"><i></i></div><div class="enemy" id="enemy"><img class="sheet" id="sheet" src="./assets/enemies/ED210C0D-94F4-4206-8D8F-790C3514C51F.png?v=021" alt="Humanoide"></div></div><div class="info"><strong id="status">WALK · S</strong>Teste automático de caminhada · 1 frame isolado por vez · sem ataque/dano</div></div><script>const stage=document.getElementById('stage'),img=document.getElementById('sheet'),enemy=document.getElementById('enemy'),status=document.getElementById('status');const SCALE=.9,SHEET_W=1536,SHEET_H=1024;img.style.width=SHEET_W*SCALE+'px';img.style.height=SHEET_H*SCALE+'px';const WALK={S:{y:265,x:[51,119,188,257,326]},SW:{y:383,x:[51,119,188,257,326]},W:{y:485,x:[51,119,188,257,326]},NW:{y:578,x:[51,119,188,257,326]},N:{y:265,x:[454,523,592,661,730]},NE:{y:383,x:[454,523,592,661,730]},E:{y:485,x:[454,523,592,661,730]},SE:{y:578,x:[454,523,592,661,730]}};let x=innerWidth*.5,y=innerHeight*.48,vx=52,vy=36,dir='SE',frame=0,lastFrame=0,last=performance.now();function direction(dx,dy){const a=Math.atan2(dy,dx)*180/Math.PI;if(a>=-22.5&&a<22.5)return'E';if(a>=22.5&&a<67.5)return'SE';if(a>=67.5&&a<112.5)return'S';if(a>=112.5&&a<157.5)return'SW';if(a>=157.5||a<-157.5)return'W';if(a>=-157.5&&a<-112.5)return'NW';if(a>=-112.5&&a<-67.5)return'N';return'NE'}function draw(){const w=WALK[dir],fx=w.x[frame],fy=w.y;const viewW=enemy.clientWidth,viewH=enemy.clientHeight;img.style.left=(viewW/2-(fx+30)*SCALE)+'px';img.style.top=(viewH-(fy+106)*SCALE)+'px';status.textContent='WALK · '+dir+' · FRAME '+(frame+1)+'/5'}function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;x+=vx*dt;y+=vy*dt;const marginX=60,top=170,bottom=innerHeight-190;if(x<marginX){x=marginX;vx=Math.abs(vx)}if(x>innerWidth-marginX){x=innerWidth-marginX;vx=-Math.abs(vx)}if(y<top){y=top;vy=Math.abs(vy)}if(y>bottom){y=bottom;vy=-Math.abs(vy)}dir=direction(vx,vy);if(now-lastFrame>125){frame=(frame+1)%5;lastFrame=now;draw()}stage.style.left=(x-44)+'px';stage.style.top=(y-56)+'px';requestAnimationFrame(loop)}addEventListener('resize',()=>{x=Math.min(x,innerWidth-60);y=Math.min(y,innerHeight-190)});draw();requestAnimationFrame(loop);</script></body></html>
