<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CAOS LIVE · Humanoide Corrigido</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.arena{position:absolute;inset:0;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:64px 64px}.hud{position:fixed;top:18px;left:18px;padding:14px 18px;border:1px solid #303861;border-radius:16px;background:#0b1020ee}.hud b,.title{color:#a78bfa}.hud small{display:block;color:#94a3b8;margin-top:5px}.ver{display:inline-block;margin-top:7px;padding:3px 8px;border-radius:999px;background:#2e1065;color:#d8b4fe;font-size:10px;font-weight:900}.viewer{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:256px;height:512px;max-height:62vh;display:flex;align-items:center;justify-content:center;background:transparent}.viewer img{display:block;width:100%;height:100%;object-fit:contain;background:transparent}.panel{position:fixed;left:18px;right:18px;bottom:24px;padding:14px;border:1px solid #303861;border-radius:16px;background:#0b1020f5;text-align:center}.title{font-weight:900}.status{margin-top:7px;color:#94a3b8;font-size:13px}</style><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script></head><body><div class="arena"><div class="hud">CAOS <b>LIVE</b><small>HUMANOIDE · 12 PNGs TRANSPARENTES</small><span class="ver">TESTE v0.5.0</span></div><div class="viewer"><img id="sprite" alt="Humanoide"></div><div class="panel"><div class="title" id="label">CARREGANDO ZIP...</div><div class="status" id="status">Usando os PNGs corrigidos diretamente, sem filtro de borda.</div></div></div><script>(async()=>{const label=document.getElementById('label'),status=document.getElementById('status'),sprite=document.getElementById('sprite');try{const r=await fetch('./assets/personagem_12_frames_corrigidos.zip?v=050');if(!r.ok)throw Error('HTTP '+r.status);const zip=await JSZip.loadAsync(await r.arrayBuffer());const names=Object.keys(zip.files).filter(n=>/\.png$/i.test(n)&&!zip.files[n].dir).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));if(!names.length)throw Error('Nenhum PNG encontrado');const urls=[];for(const n of names){const blob=await zip.files[n].async('blob');urls.push(URL.createObjectURL(blob))}let i=0;function show(){sprite.src=urls[i];label.textContent='FRAME '+(i+1)+'/'+urls.length;status.textContent='256 × 512 · transparência original · frame inteiro';i=(i+1)%urls.length}show();setInterval(show,220)}catch(e){label.textContent='ERRO AO ABRIR ZIP';status.textContent=e.message}})();</script></body></html>
