<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CAOS LIVE · Sprite Inspector v0.3.0</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.arena{position:absolute;inset:0;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:64px 64px}.hud{position:fixed;z-index:10;top:12px;left:12px;padding:10px 13px;border:1px solid #303861;border-radius:14px;background:#0b1020ee}.hud b{color:#a855f7}.hud small{display:block;color:#94a3b8;margin-top:3px}.ver{display:inline-block;margin-top:7px;padding:3px 7px;border:1px solid #4c1d95;border-radius:999px;background:#2e1065;color:#d8b4fe;font-size:10px;font-weight:900}.viewer{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:154px;height:174px;border:1px solid #334155;border-radius:14px;background:#050b14;overflow:hidden}.sheet{position:absolute;width:1536px;height:1024px;max-width:none;transform-origin:0 0}.cross{position:absolute;inset:0;pointer-events:none;border:1px dashed #a855f755}.panel{position:fixed;z-index:10;left:12px;right:12px;bottom:18px;padding:10px;border:1px solid #303861;border-radius:14px;background:#0b1020f5}.title{text-align:center;color:#a78bfa;font-size:11px;font-weight:900;margin-bottom:7px}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:5px}.row button,.nav button{appearance:none;border:1px solid #334155;border-radius:9px;background:#111827;color:#dbe3ef;padding:8px 2px;font-size:10px;font-weight:900}.row button.active{border-color:#a855f7;background:#3b0764;color:#fff}.nav{display:grid;grid-template-columns:1fr 1fr;gap:6px}.note{text-align:center;color:#94a3b8;font-size:9px;margin-top:7px}</style></head><body><div class="arena"><div class="hud">CAOS <b>LIVE</b><small>INSPETOR DA SPRITE SHEET</small><span class="ver">TESTE v0.3.0</span></div><div class="viewer" id="viewer"><img class="sheet" id="sheet" src="./assets/enemies/ED210C0D-94F4-4206-8D8F-790C3514C51F.png?v=030" alt="Sprite sheet"><div class="cross"></div></div><div class="panel"><div class="title" id="label">CÉLULA 1/70 · COL 1 · LINHA 1</div><div class="row" id="quick"></div><div class="nav"><button id="prev">◀ ANTERIOR</button><button id="next">PRÓXIMA ▶</button></div><div class="note">Sem animação. Um recorte por vez. Toque para analisar cada parte da folha e me diga os números que estão certos/errados.</div></div></div><script>const img=document.getElementById('sheet'),viewer=document.getElementById('viewer'),label=document.getElementById('label'),quick=document.getElementById('quick');/* folha 1536x1024: inspetor manual, sem assumir que cada célula é uma animação correta */const COLS=10,ROWS=7,CELL_W=153.6,CELL_H=146.2857,VIEW_W=154,VIEW_H=174,SCALE=1;let index=0;function draw(){const col=index%COLS,row=Math.floor(index/COLS);img.style.width=1536*SCALE+'px';img.style.height=1024*SCALE+'px';img.style.left=(-col*CELL_W*SCALE)+'px';img.style.top=(-row*CELL_H*SCALE)+'px';label.textContent='CÉLULA '+(index+1)+'/'+(COLS*ROWS)+' · COL '+(col+1)+' · LINHA '+(row+1);[...quick.children].forEach((b,i)=>b.classList.toggle('active',i===index%10))}for(let i=0;i<10;i++){const b=document.createElement('button');b.textContent=i+1;b.onclick=()=>{index=Math.floor(index/10)*10+i;draw()};quick.appendChild(b)}document.getElementById('prev').onclick=()=>{index=(index-1+COLS*ROWS)%(COLS*ROWS);draw()};document.getElementById('next').onclick=()=>{index=(index+1)%(COLS*ROWS);draw()};let sx=0;viewer.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});viewer.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>30){index=(index+(dx<0?1:-1)+COLS*ROWS)%(COLS*ROWS);draw()}},{passive:true});draw();</script></body></html>
