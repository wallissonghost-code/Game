<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CAOS LIVE · Teste de Movimento</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.arena{position:absolute;inset:0;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:48px 48px}.hud{position:fixed;z-index:10;top:12px;left:12px;padding:10px 13px;border:1px solid #303861;border-radius:14px;background:#0b1020ee}.hud b{color:#a78bfa}.hud small{display:block;color:#94a3b8;margin-top:4px}.ver{display:inline-block;margin-top:6px;padding:3px 7px;border-radius:999px;background:#2e1065;color:#d8b4fe;font-size:10px;font-weight:900}.player{position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%);border-radius:50%;background:#24344f;border:2px solid #60a5fa;box-shadow:0 0 0 5px #60a5fa18;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:3}.player:after{content:'PLAYER';position:absolute;top:51px;font-size:8px;font-weight:900;color:#93c5fd}.mob{position:absolute;width:44px;height:88px;transform:translate(-50%,-50%);z-index:4;pointer-events:none}.mob img{width:100%;height:100%;object-fit:contain;display:block}.panel{position:fixed;z-index:10;left:12px;right:12px;bottom:16px;padding:10px;border:1px solid #303861;border-radius:14px;background:#0b1020ee;text-align:center;font-size:11px;color:#94a3b8}.panel b{color:#a78bfa}</style><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script></head><body><div class="arena"><div class="hud">CAOS <b>LIVE</b><small>TESTE DE ESCALA + MOVIMENTO</small><span class="ver">v0.6.1 · SEM DANO</span></div><div class="player">●</div><div class="mob" id="mob"><img id="sprite" alt="mob"></div><div class="panel"><b id="label">CARREGANDO...</b><br>1 personagem central · 1 mob menor circulando · colisão e dano desativados</div></div><script>(async()=>{const mob=document.getElementById('mob'),sprite=document.getElementById('sprite'),label=document.getElementById('label');try{const r=await fetch('./assets/personagem_12_frames_corrigidos.zip?v=061');if(!r.ok)throw Error('HTTP '+r.status);const zip=await JSZip.loadAsync(await r.arrayBuffer());const names=Object.keys(zip.files).filter(n=>/\.png$/i.test(n)&&!zip.files[n].dir).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));const urls=[];for(const n of names)urls.push(URL.createObjectURL(await zip.files[n].async('blob')));let fi=0,lastFrame=0,angle=0,last=performance.now();sprite.src=urls[0];function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;angle+=dt*.72;const cx=innerWidth/2,cy=innerHeight/2;const rx=Math.min(innerWidth*.31,145),ry=Math.min(innerHeight*.25,155);mob.style.left=(cx+Math.cos(angle)*rx)+'px';mob.style.top=(cy+Math.sin(angle)*ry)+'px';if(now-lastFrame>180){fi=(fi+1)%urls.length;sprite.src=urls[fi];label.textContent='MOB · FRAME '+(fi+1)+'/'+urls.length;lastFrame=now}requestAnimationFrame(loop)}requestAnimationFrame(loop)}catch(e){label.textContent='ERRO: '+e.message}})();</script></body></html>
