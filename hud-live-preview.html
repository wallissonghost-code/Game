<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050712">
<title>Caos Live · HUD Live Lab</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050712}#gameFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050712}</style>
<link rel="stylesheet" href="src/hud-live/hud-live.css?v=4">
</head>
<body>
<iframe id="gameFrame" src="hud-preview.html" title="Caos Live HUD Preview"></iframe>
<div id="hudLiveDock" class="hudLiveDock" aria-label="Comandos da Live"></div>
<div class="hudLiveModeTag">HUD LIVE LAB · ISOLADO</div>
<button class="hudLiveLabBtn" id="hudLiveLabBtn">⚙ HUD LIVE</button>

<div class="hudLiveEditorBackdrop" id="hudLiveEditorBackdrop">
  <aside class="hudLiveEditor" role="dialog" aria-modal="true" aria-label="Editor HUD Live">
    <div class="hudLiveEditorTop">
      <div>
        <h1>HUD Live</h1>
        <p>Laboratório isolado. Pesquise o presente por nome ou ID; quando ele existir no catálogo, usamos nome e imagem reais.</p>
      </div>
      <button class="hudLiveClose" id="hudLiveClose">FECHAR</button>
    </div>
    <button class="hudLiveVisibility" id="hudLiveVisibility">👁 HUD LIVE VISÍVEL · TOQUE PARA OCULTAR</button>
    <div id="hudLiveSlots"></div>
    <div class="hudLiveActions">
      <button class="hudLiveReset" id="hudLiveReset">RESTAURAR</button>
      <button class="hudLiveSave" id="hudLiveSave">SALVAR PREVIEW</button>
    </div>
    <div class="hudLiveHint">Produção futura: esta edição sai do jogo e vira uma aba própria do Painel Admin.</div>
  </aside>
</div>

<script src="src/hud-live/hud-live-store.js?v=4"></script>
<script src="src/hud-live/hud-live-lab.js?v=4"></script>
</body>
</html>
