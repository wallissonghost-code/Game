<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CAOS LIVE · Teste Oficial de Skins</title><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{min-height:100%;display:grid;grid-template-rows:auto 1fr auto}.top{padding:max(14px,env(safe-area-inset-top)) 14px 10px;background:#0b1020;border-bottom:1px solid #29324f}.top b{color:#60a5fa}.controls,.packs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:10px 14px;border:1px solid #3b82f6;border-radius:12px;background:#0c1e35;color:#dbeafe;font-weight:900;font-size:12px}.btn.active{background:#1d4ed8;color:white}.btn.secondary{border-color:#475569;background:#111827}.info{font-size:10px;color:#94a3b8}.arena{position:relative;overflow:hidden;background-color:#07101d;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:48px 48px}.actor{position:absolute;left:50%;top:55%;width:170px;height:170px;transform:translate(-50%,-50%);display:grid;place-items:center}.actor img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 12px 12px #0009)}.shadow{position:absolute;width:64px;height:14px;border-radius:50%;background:#0007;bottom:16px;filter:blur(2px)}.footer{padding:10px 14px max(12px,env(safe-area-inset-bottom));background:#0b1020;border-top:1px solid #29324f;font-size:11px;color:#94a3b8}.footer strong{color:#dbeafe}.dirs{display:flex;gap:6px;margin-top:8px}.dirs button{flex:1;padding:8px;border:1px solid #334155;border-radius:9px;background:#111827;color:#cbd5e1;font-weight:800}.dirs button.on{border-color:#3b82f6;color:#fff;background:#172554}@media(max-width:500px){.btn{flex:1}.packs .btn{min-width:46%}.actor{width:150px;height:150px}}</style></head><body><div class="wrap"><header class="top"><div>CAOS <b>LIVE</b> · TESTE DE SKINS</div><div class="packs"><button class="btn active" data-pack="assets/Oficial1.zip">OFICIAL 1</button><button class="btn" data-pack="assets/Oficial2.zip">OFICIAL 2</button><label class="btn secondary" for="zipInput">📦 ARQUIVO LOCAL</label><input id="zipInput" type="file" accept=".zip,application/zip" hidden></div><div class="dirs"><button data-dir="up">↑ COSTAS</button><button data-dir="down" class="on">↓ FRENTE</button><button data-dir="left">← ESQ.</button><button data-dir="right">DIR. →</button></div><div id="fileName" class="info">Carregando Oficial1.zip...</div></header><main class="arena"><div class="actor"><div class="shadow"></div><img id="sprite" alt="Skin"></div></main><footer class="footer"><strong id="status">CARREGANDO...</strong><br><span id="detail">16 PNGs · 4 direções · 4 frames.</span></footer></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),input=$('zipInput'),sprite=$('sprite'),status=$('status'),detail=$('detail'),fileName=$('fileName');let dirs={up:[],down:[],left:[],right:[]},dir='down',frame=0,timer=null,urls=[];const sort=(a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'});function clearUrls(){urls.forEach(URL.revokeObjectURL);urls=[]}async function parseZip(buffer,label){clearUrls();const zip=await JSZip.loadAsync(buffer),names=Object.keys(zip.files).filter(n=>/\.png$/i.test(n)&&!zip.files[n].dir).sort(sort);if(!names.length)throw Error('Nenhum PNG encontrado.');for(const n of names)urls.push(URL.createObjectURL(await zip.files[n].async('blob')));dirs={up:[],down:[],left:[],right:[]};if(urls.length>=16){dirs.up=urls.slice(0,4);dirs.down=urls.slice(4,8);dirs.right=urls.slice(8,12);dirs.left=urls.slice(12,16)}else if(urls.length>=4){dirs.down=[urls[0]];dirs.left=[urls[1]||urls[0]];dirs.right=[urls[2]||urls[0]];dirs.up=[urls[3]||urls[0]]}else dirs.up=dirs.down=dirs.left=dirs.right=[urls[0]];frame=0;show();clearInterval(timer);timer=setInterval(()=>{const a=dirs[dir]||[];if(a.length>1){frame=(frame+1)%a.length;show()}},140);status.textContent='SKIN CARREGADA · '+urls.length+' PNGs';detail.textContent=label+' · '+(urls.length>=16?'4 direções × 4 frames':'mapeamento automático')}
async function loadRemote(path){status.textContent='CARREGANDO...';fileName.textContent=path.split('/').pop();const r=await fetch(path+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Falha ao abrir '+path);await parseZip(await r.arrayBuffer(),path.split('/').pop())}async function loadLocal(file){status.textContent='CARREGANDO...';fileName.textContent=file.name;await parseZip(await file.arrayBuffer(),'Arquivo local: '+file.name)}function show(){const a=dirs[dir]||[];if(a.length)sprite.src=a[frame%a.length]}document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{dir=b.dataset.dir;frame=0;document.querySelectorAll('[data-dir]').forEach(x=>x.classList.toggle('on',x===b));show()});document.querySelectorAll('[data-pack]').forEach(b=>b.onclick=async()=>{document.querySelectorAll('[data-pack]').forEach(x=>x.classList.toggle('active',x===b));try{await loadRemote(b.dataset.pack)}catch(e){status.textContent='ERRO';detail.textContent=e.message}});input.onchange=async()=>{const f=input.files&&input.files[0];if(!f)return;document.querySelectorAll('[data-pack]').forEach(x=>x.classList.remove('active'));try{await loadLocal(f)}catch(e){status.textContent='ERRO';detail.textContent=e.message}};loadRemote('assets/Oficial1.zip').catch(e=>{status.textContent='ERRO';detail.textContent=e.message})})();</script></body></html>
