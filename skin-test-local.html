<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CAOS LIVE · Teste de Skin</title><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{min-height:100%;display:grid;grid-template-rows:auto 1fr auto}.top{padding:max(14px,env(safe-area-inset-top)) 14px 10px;background:#0b1020;border-bottom:1px solid #29324f}.top b{color:#60a5fa}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:10px 14px;border:1px solid #3b82f6;border-radius:12px;background:#0c1e35;color:#dbeafe;font-weight:900;font-size:12px}.info{font-size:10px;color:#94a3b8}.arena{position:relative;overflow:hidden;background-color:#07101d;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:48px 48px}.actor{position:absolute;left:50%;top:55%;width:150px;height:150px;transform:translate(-50%,-50%);display:grid;place-items:center}.actor img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 12px 12px #0009)}.shadow{position:absolute;width:60px;height:14px;border-radius:50%;background:#0007;bottom:17px;filter:blur(2px)}.footer{padding:10px 14px max(12px,env(safe-area-inset-bottom));background:#0b1020;border-top:1px solid #29324f;font-size:11px;color:#94a3b8}.footer strong{color:#dbeafe}.dirs{display:flex;gap:6px;margin-top:7px}.dirs button{flex:1;padding:8px;border:1px solid #334155;border-radius:9px;background:#111827;color:#cbd5e1;font-weight:800}.dirs button.on{border-color:#3b82f6;color:#fff;background:#172554}</style></head><body><div class="wrap"><header class="top"><div>CAOS <b>LIVE</b> · TESTE DE SKIN LOCAL</div><div class="controls"><label class="btn" for="zipInput">📦 SELECIONAR ZIP</label><input id="zipInput" type="file" accept=".zip,application/zip" hidden><span id="fileName" class="info">Escolha um ZIP com PNGs</span></div><div class="dirs"><button data-dir="up">↑ COSTAS</button><button data-dir="down" class="on">↓ FRENTE</button><button data-dir="left">← ESQ.</button><button data-dir="right">DIR. →</button></div></header><main class="arena"><div class="actor"><div class="shadow"></div><img id="sprite" alt="Skin"></div></main><footer class="footer"><strong id="status">Aguardando ZIP.</strong><br><span id="detail">Recomendado: 16 PNGs, 4 frames por direção.</span></footer></div><script>(()=>{'use strict';const input=document.getElementById('zipInput'),sprite=document.getElementById('sprite'),status=document.getElementById('status'),detail=document.getElementById('detail'),fileName=document.getElementById('fileName');let dirs={up:[],down:[],left:[],right:[]},dir='down',frame=0,timer=null,urls=[];function naturalSort(a,b){return a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'})}async function loadZip(file){urls.forEach(URL.revokeObjectURL);urls=[];const zip=await JSZip.loadAsync(await file.arrayBuffer());const names=Object.keys(zip.files).filter(n=>/\.png$/i.test(n)&&!zip.files[n].dir).sort(naturalSort);if(!names.length)throw Error('Nenhum PNG encontrado no ZIP.');for(const n of names){const blob=await zip.files[n].async('blob');urls.push(URL.createObjectURL(blob))}dirs={up:[],down:[],left:[],right:[]};if(urls.length>=16){dirs.up=urls.slice(0,4);dirs.down=urls.slice(4,8);dirs.right=urls.slice(8,12);dirs.left=urls.slice(12,16)}else if(urls.length>=4){dirs.down=[urls[0]];dirs.left=[urls[1]||urls[0]];dirs.right=[urls[2]||urls[0]];dirs.up=[urls[3]||urls[0]]}else{dirs.up=dirs.down=dirs.left=dirs.right=[urls[0]]}frame=0;show();clearInterval(timer);timer=setInterval(()=>{const arr=dirs[dir]||[];if(arr.length>1){frame=(frame+1)%arr.length;show()}},140);status.textContent='SKIN CARREGADA · '+urls.length+' PNGs';detail.textContent='Arquivo local: '+file.name+' · não foi enviado ao servidor.'}function show(){const arr=dirs[dir]||[];if(arr.length)sprite.src=arr[frame%arr.length]}input.addEventListener('change',async()=>{const f=input.files&&input.files[0];if(!f)return;fileName.textContent=f.name;status.textContent='CARREGANDO...';try{await loadZip(f)}catch(e){status.textContent='ERRO NO ZIP';detail.textContent=e.message}});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>{dir=b.dataset.dir;frame=0;document.querySelectorAll('[data-dir]').forEach(x=>x.classList.toggle('on',x===b));show()}))})();</script></body></html>
