<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CAOS LIVE · Teste Oficial 1+2</title><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{height:100%;display:grid;grid-template-rows:auto 1fr auto}.top{padding:max(12px,env(safe-area-inset-top)) 12px 9px;background:#0b1020;border-bottom:1px solid #29324f}.title{font-weight:900}.title b{color:#60a5fa}.controls,.dirs{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.btn,.dirs button{min-height:38px;padding:8px 11px;border:1px solid #334155;border-radius:10px;background:#111827;color:#cbd5e1;font-weight:900;font-size:11px}.btn.on,.dirs button.on{border-color:#3b82f6;background:#172554;color:#fff}.arena{position:relative;overflow:hidden;background-color:#07101d;background-image:linear-gradient(#1e304e55 1px,transparent 1px),linear-gradient(90deg,#1e304e55 1px,transparent 1px);background-size:48px 48px}.actor{position:absolute;left:50%;top:56%;width:160px;height:160px;transform:translate(-50%,-50%);filter:drop-shadow(0 12px 12px #0009)}.shadow{position:absolute;left:50%;bottom:14px;width:62px;height:14px;transform:translateX(-50%);border-radius:50%;background:#0007;filter:blur(2px);z-index:1}.body{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:4}.weapon{position:absolute;display:none;width:46px;height:18px;object-fit:contain;z-index:6;transform-origin:20% 50%;filter:drop-shadow(0 3px 4px #0008)}.weapon.on{display:block}.weapon.fire{animation:recoil .11s ease-out}@keyframes recoil{50%{translate:-4px 0}}.muzzle{position:absolute;display:none;width:12px;height:12px;border-radius:50%;background:#fde68a;box-shadow:0 0 12px #f59e0b;z-index:8}.muzzle.on{display:block}.footer{padding:9px 12px max(10px,env(safe-area-inset-bottom));background:#0b1020;border-top:1px solid #29324f;color:#94a3b8;font-size:10px}.footer strong{color:#dbeafe}.fireBtn{position:absolute;right:18px;bottom:24px;width:76px;height:76px;border-radius:50%;border:1px solid #7f1d1d;background:#3f0b12cc;color:#fecaca;font-weight:900;z-index:20}.fireBtn:active{transform:scale(.95)}</style></head><body><div class="wrap"><header class="top"><div class="title">CAOS <b>LIVE</b> · OFICIAL 1 + OFICIAL 2</div><div class="controls"><button id="weaponBtn" class="btn">🔫 ARMA OFF</button><label class="btn" for="zipInput">📦 ZIP LOCAL</label><input id="zipInput" type="file" accept=".zip,application/zip" hidden></div><div class="dirs"><button data-dir="up">↑ COSTAS</button><button data-dir="down" class="on">↓ FRENTE</button><button data-dir="left">← ESQ.</button><button data-dir="right">DIR. →</button></div></header><main class="arena"><div class="actor"><div class="shadow"></div><img id="body" class="body" alt="Skin"><img id="weapon" class="weapon" src="./assets/weapons/assault-rifle-01.png?v=2" alt="Arma"><div id="muzzle" class="muzzle"></div></div><button id="fireBtn" class="fireBtn">ATIRAR</button></main><footer class="footer"><strong id="status">CARREGANDO OFICIAL 1 + OFICIAL 2...</strong><br><span id="detail">Os dois pacotes usam o mesmo frame e direção. Ao equipar a arma, troca para Oficial2 sem reiniciar a animação.</span></footer></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),body=$('body'),weapon=$('weapon'),muzzle=$('muzzle'),weaponBtn=$('weaponBtn'),fireBtn=$('fireBtn'),status=$('status'),detail=$('detail'),input=$('zipInput');let packs={base:null,armed:null},dir='down',frame=0,armed=false,timer=null;const order=['up','down','right','left'];const sortN=(a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'});async function loadPack(src){const r=await fetch(src,{cache:'no-store'});if(!r.ok)throw Error(src+' não carregou');const z=await JSZip.loadAsync(await r.arrayBuffer()),names=Object.keys(z.files).filter(n=>/\.png$/i.test(n)&&!z.files[n].dir).sort(sortN),out={up:[],down:[],left:[],right:[]},us=[];if(!names.length)throw Error('ZIP sem PNG');for(const n of names)us.push(URL.createObjectURL(await z.files[n].async('blob')));if(us.length>=16){out.up=us.slice(0,4);out.down=us.slice(4,8);out.right=us.slice(8,12);out.left=us.slice(12,16)}else for(const d of order)out[d]=[us[0]];return out}function current(){return armed?(packs.armed||packs.base):packs.base}function show(){const p=current();if(!p)return;const a=p[dir]||p.down||[];if(a.length)body.src=a[frame%a.length];placeWeapon()}function placeWeapon(){const c={down:{l:56,t:49,r:18,mx:81,my:52},up:{l:40,t:43,r:-18,mx:25,my:43},right:{l:58,t:48,r:0,mx:83,my:49},left:{l:17,t:48,r:180,mx:16,my:49}}[dir];weapon.style.left=c.l+'%';weapon.style.top=c.t+'%';weapon.style.transform=`rotate(${c.r}deg)`;muzzle.style.left=c.mx+'%';muzzle.style.top=c.my+'%'}function equip(v){armed=v;weapon.classList.toggle('on',armed);weaponBtn.classList.toggle('on',armed);weaponBtn.textContent=armed?'🔫 ARMA ON':'🔫 ARMA OFF';show();status.textContent=armed?'OFICIAL2 + ARMA · SINCRONIZADO':'OFICIAL1 · SEM ARMA'}function fire(){if(!armed)equip(true);weapon.classList.remove('fire');void weapon.offsetWidth;weapon.classList.add('fire');muzzle.classList.add('on');setTimeout(()=>muzzle.classList.remove('on'),80)}async function boot(){try{packs.base=await loadPack('./assets/Oficial1.zip?v=4');packs.armed=await loadPack('./assets/Oficial2.zip?v=4');show();status.textContent='OFICIAL1 + OFICIAL2 CARREGADOS';timer=setInterval(()=>{const p=current(),a=p?.[dir]||[];if(a.length>1){frame=(frame+1)%a.length;show()}},135)}catch(e){status.textContent='ERRO';detail.textContent=e.message}}weaponBtn.onclick=()=>equip(!armed);fireBtn.onclick=fire;document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{dir=b.dataset.dir;document.querySelectorAll('[data-dir]').forEach(x=>x.classList.toggle('on',x===b));show()});input.onchange=async()=>{const f=input.files?.[0];if(!f)return;try{const z=await JSZip.loadAsync(await f.arrayBuffer()),names=Object.keys(z.files).filter(n=>/\.png$/i.test(n)&&!z.files[n].dir).sort(sortN),us=[],p={up:[],down:[],left:[],right:[]};for(const n of names)us.push(URL.createObjectURL(await z.files[n].async('blob')));if(us.length>=16){p.up=us.slice(0,4);p.down=us.slice(4,8);p.right=us.slice(8,12);p.left=us.slice(12,16)}else for(const d of order)p[d]=[us[0]];packs.armed=p;equip(true);detail.textContent='ZIP local aplicado como conjunto armado.'}catch(e){detail.textContent=e.message}};boot()})();</script></body></html>
